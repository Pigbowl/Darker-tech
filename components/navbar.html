                <script>
                    // 检查用户认证状态并更新导航栏按钮
                    window.updateAuthButton = function() {
                        const authButton = document.getElementById('auth-button');
                        const username = sessionStorage.getItem('username');
                        const userType = sessionStorage.getItem('userType');
                        const authStatus = sessionStorage.getItem('authenticated');
                        const expiryTime = sessionStorage.getItem('auth_expiry');
                        const currentTime = new Date().getTime();
                        
                        const isAuthenticated = authStatus === 'true' && 
                                          expiryTime && 
                                          currentTime < parseInt(expiryTime);
                                           
                        if (isAuthenticated && username) {
                            // 用户已登录，显示用户名和对应的链接
                            authButton.textContent = username;
                            if (userType && userType.startsWith('Manager')) {
                                authButton.href = '../Pages/sitedashboard.html';
                            } else {
                                authButton.href = '../Pages/userdashboard.html';
                            }
                        } else {
                            // 用户未登录，显示登录/注册按钮
                            authButton.textContent = '登录/注册';
                            authButton.href = '../Pages/login.html';
                        }
                    }
                    
                    // 页面加载时更新按钮状态
                    document.addEventListener('DOMContentLoaded', window.updateAuthButton);
                </script>
