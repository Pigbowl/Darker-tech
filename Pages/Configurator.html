            // 添加厂商分组折叠事件
            function attachManufacturerToggleEvents() {
                document.querySelectorAll('.manufacturer-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const icon = header.querySelector('i.fa-chevron-down');
                        const products = header.nextElementSibling;
                        icon.classList.toggle('rotate-180');
                        products.classList.toggle('hidden');
                    });
                });
            }
            
            function initconfigfunction() {

                return new Promise((resolve, reject) => {
                    command = ip + '/init_config_func'
                    fetch(command, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        scriptName: "function_config_initiator.py",
                        sheetname1: "EUF",
                        sheetname2: "SUBFEATURES",
                    })
                    })
                    .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    return response.json();
                    })
                    .then(data => {
                    if (data.success) {
                        
                        resolve(JSON.parse(data.output)); // 解析Promise并传递data.output
                    } else {
                        console.log("请求失败");
                        reject(new Error("API返回失败"));
                    }
                    })
                    .catch(error => {
                        console.error("请求过程中出错:", error);
                    reject(error);
                    });
                });
                }

                        // 按厂商分组产品数据
            function groupProductsByManufacturer(productINFO) {
                manufacturerData = {};
                Object.keys(productINFO).forEach(key => {
                    product = productINFO[key]
                    const manufacturer = product.Supplier_Name.Name || '未知厂商';
                    if (!manufacturerData[manufacturer]) {
                        manufacturerData[manufacturer] = [];
                    }
                    manufacturerData[manufacturer].push(product);
                });
                return manufacturerData
            }

            // 绑定子复选框事件
            function bindSubCheckboxEvents() {
                // 移除现有的子复选框事件监听器
                document.querySelectorAll('.sub-checkbox').forEach(checkbox => {
                    checkbox.replaceWith(checkbox.cloneNode(true));
                });
                
                // 重新绑定子复选框事件，使用优化后的逻辑
                document.querySelectorAll('.sub-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        const slice_id = e.target.getAttribute('data-slice-id');
                        const mainId = e.target.getAttribute('data-main-id');
                        const mainCheckbox = document.querySelector(`.main-checkbox[data-slice-id="${slice_id}"]`);
                        const card = document.querySelector(`.card-item[data-slice-id="${slice_id}"]`);
                        const subCheckboxes = document.querySelectorAll(`.sub-checkbox[data-slice-id="${slice_id}"]`);
                        const container_obj = card.parentNode
        
                        // 当子卡片被勾选时，勾选父卡片
                        if (e.target.checked) {
                            mainCheckbox.checked = true;
                            card.classList.remove('bg-gray-903')
                            card.classList.add('bg-gray-905')
                            
                            // 先获取当前所有子卡片的数量
                            const totalSubCards = subCheckboxes.length;
                            // 获取已选中的子卡片数量（不包括当前刚勾选的）
                            const alreadyChecked = Array.from(subCheckboxes).filter(sub => sub !== e.target && sub.checked).length;
                            // 检查是否即将选中所有子卡片
                            const willBeAllChecked = (alreadyChecked + 1) === totalSubCards;
                            
                            if (willBeAllChecked) {
                                // 即将选中所有子卡片，直接切换为主卡片的"all"形式
                                // 移除所有已存在的子卡片选择
                                subCheckboxes.forEach(sub => {
                                    if (sub.checked && sub !== e.target) {
                                        removeChipFromContainer(sub.getAttribute('data-main-id'));
                                    }
                                });
                                // 不要添加当前子卡片
                                // 添加主卡片的"all"形式
                                addChipToContainer(slice_id, slice_id, container_obj, 1);
                                // 取消所有子卡片的勾选
                                subCheckboxes.forEach(sub => {
                                    sub.checked = false;
                                });
                            } else {
                                // 正常添加子卡片
                                addChipToContainer(mainId, mainId, container_obj, 2);
                                removeChipFromContainer(slice_id);
                            }
                             
                        } else {
                        // 当子卡片被取消勾选时，检查是否还有其他子卡片被勾选
                            const anySubChecked = Array.from(subCheckboxes).some(sub => sub.checked);
                            mainCheckbox.checked = anySubChecked;
                            
                            if (!anySubChecked){
                                card.classList.remove('bg-gray-905')
                                card.classList.add('bg-gray-903')
                            }
                            const slice_id = e.target.getAttribute('data-slice-id');
                            const mainId = e.target.getAttribute('data-main-id');
                            removeChipFromContainer(mainId)
                        }
                    });
                });
            }

            // 分类别收集选中的卡片
            function collectSelectedCards() {
                // 初始化结果对象
                const result = {
                    "EUF":{
                        mainCards: [],
                        subCards: {}
                    },
                    "HW":{
                        mainCards: [],
                        subCards: {}
                    },
                    "SENSOR":{
                        mainCards: [],
                        subCards: {}
                    }
                };
                
                // 收集主卡片
                document.querySelectorAll('.main-checkbox:checked').forEach(checkbox => {
                    const cardId = checkbox.getAttribute('data-slice-id');
                    const card = document.querySelector(`.card-item[data-slice-id="${cardId}"]`);
                    const container_obj = card.parentNode;
                    
                    if(container_obj["id"]=="SearchcardContainer"){
                        // 功能卡片
                        result.EUF.mainCards.push(cardId);
                        result.EUF.subCards[cardId] = [];
                    }else if(container_obj["id"]=="SearchcardContainerforhw"){
                        // 计算平台卡片
                        result.HW.mainCards.push(cardId);
                        result.HW.subCards[cardId] = [];
                    }else if(container_obj["id"]=="SearchcardContainerforsensor"){
                        // 传感器卡片
                        result.SENSOR.mainCards.push(cardId);
                        result.SENSOR.subCards[cardId] = [];
                    }
                });
                
                // 收集子卡片
                document.querySelectorAll('.sub-checkbox:checked').forEach(checkbox => {
                    const cardId = checkbox.getAttribute('data-slice-id');
                    const mainId = checkbox.getAttribute('data-main-id');
                    const card = document.querySelector(`.card-item[data-slice-id="${cardId}"]`);
                    const container_obj = card.parentNode;
                    
                    if(container_obj.closest('#SearchcardContainer')){
                        // 功能子卡片
                        if (result.EUF.mainCards.includes(cardId)) {
                            result.EUF.subCards[cardId].push(mainId);
                        }
                    }else if(container_obj.closest('#SearchcardContainerforhw')){
                        // 计算平台子卡片
                        if (result.HW.mainCards.includes(cardId)) {
                            result.HW.subCards[cardId].push(mainId);
                        }
                    }else if(container_obj.closest('#SearchcardContainerforsensor')){
                        // 传感器子卡片
                        if (result.SENSOR.mainCards.includes(cardId)) {
                            result.SENSOR.subCards[cardId].push(mainId);
                        }
                    }
                });
                
                // 整理成search_condition字典
                const search_condition = {
                    "function": {},
                    "sensors": {},
                    "calculators": {}
                };
                
                // 整理功能数据
                result.EUF.mainCards.forEach(mainCard => {
                    const subCards = result.EUF.subCards[mainCard] || [];
                    if (subCards.length === 0) {
                        // 主卡片被勾选，但没有子卡片，说明用户勾选了整个功能
                        search_condition.function[mainCard] = ["all"];
                    } else {
                        // 有子卡片被勾选，直接提取子功能数据
                        search_condition.function[mainCard] = subCards;
                    }
                });
                
                // 整理计算平台数据
                result.HW.mainCards.forEach(mainCard => {
                    const subCards = result.HW.subCards[mainCard] || [];
                    if (subCards.length === 0) {
                        // 主卡片被勾选，但没有子卡片，说明用户勾选了整个供应商的所有产品
                        search_condition.calculators[mainCard] = ["all"];
                    } else {
                        // 有子卡片被勾选，直接提取芯片型号数据
                        search_condition.calculators[mainCard] = subCards;
                    }
                });
                
                // 整理传感器数据
                result.SENSOR.mainCards.forEach(mainCard => {

                    const subCards = result.SENSOR.subCards[mainCard] || [];
                    if (subCards.length === 0) {

                        // 主卡片被勾选，但没有子卡片，说明用户勾选了整个传感器类型
                        search_condition.sensors[mainCard] = ["all"];
                    } else {

                        // 有子卡片被勾选，直接提取传感器子类型数据
                        search_condition.sensors[mainCard] = subCards;
                    }
                });
                
                // 显示结果
                launchsearching(result, search_condition);
            }

            //开始搜索
            function launchsearching(result, search_condition){
                console.log(search_condition)
                solutionContainer,innerHTML ='';
                command = ip + '/config_searching'
                fetch(command, {
                    method:'POST',
                    headers: {
                    'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        item_cate:'solution',
                        table_name:'system_solution',
                        search_condition: search_condition
                    })
                })
                .then(response =>{
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data =>{
                    if(data.success){
                        solution_data = JSON.parse(data.output);
                        num_of_solution = solution_data.length
                        solutionContainer.innerHTML=''
                        if (num_of_solution > 0){
                            createSolutionCards(solution_data)
                            initsolutionInteraction()
                            updatesearchingresult(`一共找到 ${num_of_solution} 个方案`)
                        }else{
                            updatesearchingresult(`没有找到任何匹配的方案`)
                        }
                    }
                })
                }

            function createSolutionCards(items){
                currentCards = items;
                solutionContainer.innerHTML = '';
                // console.log("currentCards:",items)
                Object.keys(items).forEach(key => {
                    const item = items[key];
                    const solution = generatesolutionthml(item);
                solutionContainer.insertAdjacentHTML('beforeend', solution);
                })
            }
              
            function updatesearchingresult(item){
                document.getElementById('searchingphrase').textContent = item;
            }
            function generatesolutionthml(item){
                console.log(item)

                    existingModal.remove();

                modal.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50';
                
                // 处理数据，删除所有包含ID的字段

                            </div>
                        </div>
                    </div>
                `;
                
                // 添加到文档
                document.body.appendChild(modal);
                
                // 生成可折叠JSON树

                jsonTreeContainer.innerHTML = createJsonTree(processedData);

                const style = document.createElement('style');
                style.textContent = `

            // 删除所有包含ID的字段（不分大小写）
            function removeIdFields(data) {
                // 如果是基本类型，直接返回
                if (data === null || typeof data !== 'object') {
                    return data;
                }
                
                // 如果是数组，遍历每个元素
                if (Array.isArray(data)) {
                    return data.map(item => removeIdFields(item));
                }
                
                // 如果是对象，遍历每个键
                const result = {};
                for (const key in data) {
                    if (Object.prototype.hasOwnProperty.call(data, key)) {
                        // 检查键名是否包含"id"（不分大小写）
                        if (!/id/i.test(key)) {
                            // 递归处理值
                            result[key] = removeIdFields(data[key]);
                        }
                    }
                }
                return result;
            }
            
            // 创建可折叠JSON树
            function createJsonTree(data, level = 0) {
                if (data === null) {
                    return '<span class="json-null">null</span>';
                }
                
                if (typeof data === 'string') {
                    return `<span class="json-string">"${data}"</span>`;
                }
                
                if (typeof data === 'number') {
                    return `<span class="json-number">${data}</span>`;
                }
                
                if (typeof data === 'boolean') {
                    return `<span class="json-boolean">${data}</span>`;
                }
                
                if (Array.isArray(data)) {
                    if (data.length === 0) {
                        return '[]';
                    }
                    
                    let html = `[\n`;
                    data.forEach((item, index) => {
                        html += `<div class="json-node">`;
                        const isLast = index === data.length - 1;
                        html += `${createJsonTree(item, level + 1)}${isLast ? '' : ','}</div>`;
                    });
                    html += `]`;
                    return html;
                }
                
                if (typeof data === 'object') {
                    const keys = Object.keys(data);
                    if (keys.length === 0) {
                        return '{}';
                    }
                    
                    // 第一层节点默认展开
                    const isFirstLevel = level === 0;
                    const toggleClass = isFirstLevel ? ' expanded' : '';
                    const childrenClass = isFirstLevel ? ' json-children expanded' : ' json-children';
                    
                    let html = `<div class="json-collapsible">`;
                    html += `<span class="json-toggle${toggleClass}"></span>{`;
                    html += `<div class="${childrenClass}">\n`;
                    keys.forEach((key, index) => {
                        html += `<div class="json-node">`;
                        html += `<span class="json-key">"${key}"</span>: `;
                        const isLast = index === keys.length - 1;
                        html += `${createJsonTree(data[key], level + 1)}${isLast ? '' : ','}</div>`;
                    });
                    html += `</div>}`;
                    html += `</div>`;
                    return html;
                }
                
                return String(data);
            }
            
            // 添加JSON树交互事件
            function addJsonTreeInteractions(container) {
                const toggles = container.querySelectorAll('.json-toggle');
                toggles.forEach(toggle => {
                    toggle.addEventListener('click', function() {
                        this.classList.toggle('expanded');
                        const children = this.nextElementSibling;
                        if (children && children.classList.contains('json-children')) {
                            children.classList.toggle('expanded');
                        }
                    });
                });
            }
            
            function addChipToContainer(cardName,cardId,container_obj,type){
                const selectioncontainer = document.getElementById('selected-chips');
                const chip = document.createElement('span');
                let isSensorCard = false;
                
                // 检查是否是传感器卡片（通过cardId前缀判断）
                const sensorTypes = ['camera', 'radar', 'lidar', 'uss'];
                const cardIdPrefix = cardId.split('-')[0];

                    isSensorCard = true;
                }
                
                if(type==1){
                    if(container_obj["id"]=="SearchcardContainer"){
                        chip.className = 'bg-blue-300 text-blue-700 text-xs font-medium px-3 py-1 rounded-full chip';
                        cardName = cardName + "-All Features"
                    }else if(container_obj["id"]=="SearchcardContainerforhw"){
                        chip.className = 'bg-green-300 text-blue-700 text-xs font-medium px-3 py-1 rounded-full chip';
                        cardName = cardName + "-All Series"
                    }else if(container_obj["id"]=="SearchcardContainerforsensor" || isSensorCard){
                        chip.className = 'bg-yellow-300 text-blue-700 text-xs font-medium px-3 py-1 rounded-full chip';
                        cardName = cardName + "-All Type"
                    }else if(container_obj["id"]=="SearchcardContainerforreg"){
                        chip.className = 'bg-red-300 text-blue-700 text-xs font-medium px-3 py-1 rounded-full chip';
                    }
                }else if(type == 2){
                    if(container_obj["id"]=="SearchcardContainer"){
                        chip.className = 'bg-blue-300 text-blue-700 text-xs font-medium px-3 py-1 rounded-full chip';
                    }else if(container_obj["id"]=="SearchcardContainerforhw"){
                        chip.className = 'bg-green-300 text-blue-700 text-xs font-medium px-3 py-1 rounded-full chip';
                    }else if(container_obj["id"]=="SearchcardContainerforsensor" || isSensorCard){
                        chip.className = 'bg-yellow-300 text-blue-700 text-xs font-medium px-3 py-1 rounded-full chip';
                        // 传感器子卡片：子类型-父类型
                        // 解析cardId，格式为"父类型-子类型"
                        const parts = cardId.split('-');
                        if (parts.length >= 2) {
                            const parentType = parts[0];
                            const childType = parts.slice(1).join('-');
                            cardName = `${childType}-${parentType}`;
                        }
                    }else if(container_obj["id"]=="SearchcardContainerforreg"){
                        chip.className = 'bg-red-300 text-blue-700 text-xs font-medium px-3 py-1 rounded-full chip';
                    }
                }
                // 创建带有删除按钮的小卡片
                chip.innerHTML = `${cardName} <button class="chip-delete-btn text-red-500 hover:text-red-700 text-xs font-bold cursor-pointer ml-1" type="button" data-chip-id="${cardId}">&times;</button>`;
                chip.setAttribute('data-chip-id', cardId);
                selectioncontainer.appendChild(chip);
                
                // 添加删除按钮点击事件
                const deleteBtn = chip.querySelector('.chip-delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // 阻止事件冒泡
                    removeChipFromContainer(cardId, true);
                });
            }

            function removeChipFromContainer(cardId, shouldUncheck = false) {
                const chips = document.querySelectorAll('#selected-chips span[data-chip-id="' + cardId + '"]');
                chips.forEach(chip => {
                    chip.remove();
                });
                
                if (shouldUncheck) {
                    // 取消对应的卡片或子卡片勾选
                    const parts = cardId.split('-');
                    const mainCardId = parts[0];
                    
                    // 检查是否是主卡片（格式：功能名）
                    if (parts.length === 1) {
                        // 是主卡片，取消主卡片勾选
                        const mainCheckbox = document.querySelector(`.main-checkbox[data-slice-id="${cardId}"]`);
                        if (mainCheckbox) {
                            mainCheckbox.checked = false;
                            // 取消主卡片样式
                            const card = document.querySelector(`.card-item[data-slice-id="${cardId}"]`);
                            if (card) {
                                card.classList.remove('bg-gray-905');
                                card.classList.add('bg-gray-903');
                            }
                            // 取消所有子卡片勾选
                            const subCheckboxes = document.querySelectorAll(`.sub-checkbox[data-slice-id="${cardId}"]`);
                            subCheckboxes.forEach(subCheckbox => {
                                subCheckbox.checked = false;
                            });
                        }
                    } else {
                        // 是子卡片，取消对应的子卡片勾选
                        const subCheckbox = document.querySelector(`.sub-checkbox[data-main-id="${cardId}"]`);
                        if (subCheckbox) {
                            subCheckbox.checked = false;
                            // 检查是否还有其他子卡片被勾选
                            const mainCardId = parts[0];
                            const subCheckboxes = document.querySelectorAll(`.sub-checkbox[data-slice-id="${mainCardId}"]`);
                            const anySubChecked = Array.from(subCheckboxes).some(sub => sub.checked);
                            // 更新主卡片勾选状态
                            const mainCheckbox = document.querySelector(`.main-checkbox[data-slice-id="${mainCardId}"]`);
                            if (mainCheckbox) {
                                mainCheckbox.checked = anySubChecked;
                                // 更新主卡片样式
                                const card = document.querySelector(`.card-item[data-slice-id="${mainCardId}"]`);
                                if (card) {
                                    if (!anySubChecked) {
                                        card.classList.remove('bg-gray-905');
                                        card.classList.add('bg-gray-903');
                                    }
                                }
                            }
                        }
                    }
                }
            }
