<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darker数据库管理工具</title>
    <script src="../js/ipcontroller.js"></script>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        /* 容器样式 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        /* 标题样式 */
        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        /* 状态信息样式 */
        .status-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 5px solid #3498db;
            transition: all 0.3s ease;
        }
        
        .status.loading {
            border-left-color: #f39c12;
        }
        
        .status.success {
            border-left-color: #27ae60;
        }
        
        .status.error {
            border-left-color: #e74c3c;
        }
        
        /* 卡片容器样式 */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        /* 卡片样式 */
        .card {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #3498db, #2980b9);
            transition: all 0.3s ease;
            z-index: 1;
        }
        
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            border-color: rgba(52, 152, 219, 0.3);
        }
        
        .card:hover::before {
            width: 8px;
        }
        
        .card:hover::after {
            opacity: 0.6;
        }
        
        /* 卡片选中状态 */
        .card.selected {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 25px rgba(33, 150, 243, 0.4);
            border-color: #2196f3;
        }
        
        .card.selected::before {
            width: 8px;
            background: linear-gradient(to bottom, #2196f3, #1976d2);
        }
        
        /* 卡片动画 */
        @keyframes cardSelect {
            0% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1.01) translateY(-3px);
                box-shadow: 0 10px 25px rgba(33, 150, 243, 0.4);
            }
        }
        
        .card.selected {
            animation: cardSelect 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .card-subtitle {
            font-size: 0.95rem;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        
        .card-id {
            font-size: 0.9rem;
            color: #95a5a6;
            font-family: 'Courier New', monospace;
        }
        
        /* 空状态样式 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        
        /* 刷新按钮样式 */
        .refresh-btn {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px auto;
            display: block;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
        }
        
        .refresh-btn:active {
            transform: translateY(0);
        }
        
        /* 状态图标样式 */
        .status-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        /* 加载动画 */
        .status-icon.loading-spinner {
            border: 3px solid rgba(52, 152, 219, 0.3);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
        }
        
        /* 成功图标 */
        .status-icon.success-icon {
            background-color: #27ae60;
            border-radius: 50%;
            position: relative;
        }
        
        .status-icon.success-icon::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 3px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        /* 错误图标 */
        .status-icon.error-icon {
            background-color: #e74c3c;
            border-radius: 50%;
            position: relative;
        }
        
        .status-icon.error-icon::after {
            content: '×';
            color: white;
            font-size: 16px;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 表格区域样式 */
        .table-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .section-header h2 {
            color: #2c3e50;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
        }
        
        /* 表格容器样式 */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            width: 100%;
        }
        
        /* 数据表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: box-shadow 0.3s ease;
            table-layout: fixed;
        }
        
        /* 确保thead和tbody宽度一致 */
        .data-table thead,
        .data-table tbody {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        
        /* 设置行容器的显示方式 */
        .data-table thead {
            width: calc(100% - 17px); /* 减去滚动条宽度 */
        }
        
        .data-table tbody {
            display: block;
            overflow-y: auto;
            max-height: 500px; /* 可根据需要调整 */
        }
        
        .table-container:hover .data-table {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        
        .data-table th,
        .data-table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s ease;
            position: relative;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%; /* 让单元格填充整个列宽 */
            display: table-cell;
        }
        
        /* 行元素设置 */
        .data-table tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        
        .data-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .data-table th::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .data-table tbody tr {
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .data-table tbody tr::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: transparent;
            transition: all 0.3s ease;
        }
        
        .data-table tbody tr:hover {
            background-color: #f8f9fa;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }
        
        .data-table tbody tr:hover::before {
            background: #3498db;
        }
        
        .data-table tbody tr.selected-row {
            background-color: #e3f2fd;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }
        
        .data-table tbody tr.selected-row::before {
            background: #2196f3;
        }
        
        /* 表格行选中动画 */
        @keyframes rowSelect {
            0% {
                background-color: white;
                transform: scale(1);
            }
            50% {
                background-color: #bbdefb;
            }
            100% {
                background-color: #e3f2fd;
                transform: scale(1);
            }
        }
        
        .data-table tbody tr.selected-row {
            animation: rowSelect 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        /* 操作按钮样式 */
        .action-buttons {
            display: flex;
            gap: 12px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .btn-add {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
        }
        
        .btn-edit {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }
        
        .btn-view {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }
        
        .btn-delete {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }
        
        .action-btn:active {
            transform: translateY(0);
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .cards-container {
                grid-template-columns: 1fr;
            }
            
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .action-buttons {
                flex-wrap: wrap;
                width: 100%;
            }
            
            .action-btn {
                flex: 1;
                min-width: 120px;
            }
            
            .data-table th,
            .data-table td {
                padding: 12px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Darker数据库管理工具</h1>
        <p class="subtitle">数据库对象浏览与管理</p>
        <a href="./sitedashboard.html" class="text-white hover:text-logobuttom transition-colors duration-300">返回站点管理页面</a>
        <!-- 状态显示区域 -->
        <div class="status-container status loading" id="statusContainer">
            <span class="status-icon loading-spinner"></span>
            <span id="statusText">正在加载数据...</span>
           
        </div>
        
        <!-- 卡片容器 -->
        <div class="cards-container" id="cardsContainer">
            <!-- 卡片将通过JavaScript动态生成 -->
        </div>
        
        <!-- 表格区域 -->
        <div class="table-section" id="tableSection" style="display: none; margin-top: 30px;">
            <div class="section-header">
                <h2 id="tableTitle">数据详情</h2>
                <div class="action-buttons" id="actionButtons">
                    <!-- 操作按钮将通过JavaScript动态生成 -->
                </div>
            </div>
            <div class="table-container">
                <table id="dataTable" class="data-table">
                    <thead>
                        <!-- 表头将通过JavaScript动态生成 -->
                    </thead>
                    <tbody>
                        <!-- 表格内容将通过JavaScript动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 刷新按钮 -->
        <button class="refresh-btn" id="refreshBtn">刷新数据</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusContainer = document.getElementById('statusContainer');
            const statusText = document.getElementById('statusText');
            const cardsContainer = document.getElementById('cardsContainer');
            const refreshBtn = document.getElementById('refreshBtn');
            
            // 修改状态显示
            function updateStatus(type, text) {
                statusContainer.className = `status-container status ${type}`;
                statusText.textContent = text;
                
                // 更新状态图标
                const iconElement = statusContainer.querySelector('.status-icon');
                if (iconElement) {
                    // 移除所有图标类
                    iconElement.className = 'status-icon';
                    
                    // 根据状态类型添加对应的图标类
                    if (type === 'loading') {
                        iconElement.classList.add('loading-spinner');
                    } else if (type === 'success') {
                        iconElement.classList.add('success-icon');
                    } else if (type === 'error') {
                        iconElement.classList.add('error-icon');
                    }
                }
            }
            
            // 创建卡片函数
            function createCard(objectData) {
                const card = document.createElement('div');
                card.className = 'card';
                
                // 从对象中提取数据
                const objectName = objectData.OBJECT || '未知对象';
                const nameField = objectData.NAME || '未知名称';
                const idField = objectData.ID || '未知ID';
                const CNField = objectData.CN || '未知CN';
                
                // 设置卡片内容
                card.innerHTML = `
                    <div class="card-title">${CNField}</div>
                    <div class="card-subtitle">table name:${objectName}</div>
                    <div class="card-id">column name: ${nameField}</div>
                `;
                
                // 添加点击事件 - 发送选中卡片数据到后端
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    // console.log('点击了卡片:', objectData);
                    
                    // 构建请求数据
                    const requestData = {
                        tablename: objectData.OBJECT || '',
                        columns: [
                            objectData.NAME || '',
                            objectData.ID || ''
                        ]
                    };
                    
                    // 显示加载状态
                    updateStatus('loading', `正在获取 ${objectData.OBJECT} 的详细信息...`);
                    command = ip + '/table_summary';
                    // 发送请求到后端
                    fetch(command, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestData)
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP错误: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // console.log('获取表详细信息成功:', data);
                        updateStatus('success', `成功获取 ${objectData.OBJECT} 的详细信息`);
                        
                        // 隐藏未选中卡片，只显示当前选中的卡片并放在首位
                        const allCards = document.querySelectorAll('.card');
                        const cardsContainer = card.parentElement;
                        
                        // 保存当前选中的卡片
                        const selectedCard = card;
                        
                        // 先移除所有卡片的选中状态
                        allCards.forEach(c => {
                            c.classList.remove('selected');
                            if (c !== selectedCard) {
                                c.style.display = 'none'; // 隐藏未选中卡片
                            }
                        });
                        
                        // 设置选中卡片样式并移到首位
                        selectedCard.classList.add('selected');
                        cardsContainer.insertBefore(selectedCard, cardsContainer.firstChild);
                        selectedCard.style.display = 'block';
                        
                        // 存储当前选中的数据
                        window.selectedTableData = {
                            objectData: objectData,
                            tableData: data
                        };
                        
                        // 创建并显示数据表格
                        renderDataTable(data);
                    })
                    .catch(error => {
                        // console.error('获取表详细信息失败:', error);
                        updateStatus('error', `获取 ${objectData.OBJECT} 信息失败: ${error.message}`);
                    });
                });
                
                return card;
            }
            
            // 主函数：初始化页面并请求数据
            function initpage() {
                // console.log('开始初始化页面...');
                updateStatus('loading', '正在加载数据...');
                cardsContainer.innerHTML = ''; // 清空现有卡片
                command = ip + '/db_summary';
                // 发送请求到后端
                fetch(command, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        action: 'db_summary'
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                        // console.log('成功获取数据:', data);
                    if (data.success && data.output) {
                        const output = data.output;
                        console.log(output);
                        // 检查output是否为数组或对象，进行相应处理
                        if (Array.isArray(output) && output.length > 0) {
                            // 处理数组格式
                            output.forEach(item => {
                                const card = createCard(item);
                                cardsContainer.appendChild(card);
                            });
                            updateStatus('success', `成功加载 ${output.length} 个对象`);
                        } else if (typeof output === 'object' && output !== null) {
                            // 处理对象格式（可能是键值对）
                            const keys = Object.keys(output);
                            if (keys.length > 0) {
                                keys.forEach(key => {
                                    const item = output[key];
                                    // 确保item是对象类型
                                    if (typeof item === 'object' && item !== null) {
                                        const card = createCard(item);
                                        cardsContainer.appendChild(card);
                                    }
                                });
                                updateStatus('success', `成功加载 ${keys.length} 个对象`);
                            } else {
                                // 空对象情况
                                updateStatus('error', '未找到任何对象数据');
                                cardsContainer.innerHTML = `
                                    <div class="empty-state">
                                        <h3>暂无数据</h3>
                                        <p>数据库中未找到任何对象</p>
                                    </div>
                                `;
                            }
                        } else {
                            // 其他情况
                            updateStatus('error', '数据格式不正确');
                            cardsContainer.innerHTML = `
                                <div class="empty-state">
                                    <h3>数据格式错误</h3>
                                    <p>请检查后端返回的数据格式</p>
                                </div>
                            `;
                        }
                    } else {
                        updateStatus('error', '获取数据失败');
                        cardsContainer.innerHTML = `
                            <div class="empty-state">
                                <h3>加载失败</h3>
                                <p>无法获取数据库对象</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                        // console.error('请求错误:', error);
                    updateStatus('error', `请求错误: ${error.message}`);
                    cardsContainer.innerHTML = `
                        <div class="empty-state">
                            <h3>连接失败</h3>
                            <p>无法连接到服务器</p>
                            <p>请检查服务器是否正在运行</p>
                        </div>
                    `;
                });
            }
            
            // 渲染数据表格函数
            function renderDataTable(data) {
                const tableSection = document.getElementById('tableSection');
                const tableTitle = document.getElementById('tableTitle');
                const table = document.getElementById('dataTable');
                const thead = table.querySelector('thead');
                const tbody = table.querySelector('tbody');
                const actionButtons = document.getElementById('actionButtons');
                
                // 清空表格内容
                thead.innerHTML = '';
                tbody.innerHTML = '';
                actionButtons.innerHTML = '';
                
                // 尝试从数据中提取表格数据
                let tableData = [];
                
                // 根据常见的数据结构进行处理
                if (data.success && data.output) {
                    tableData = data.output;
                } else if (Array.isArray(data)) {
                    tableData = data;
                } else if (typeof data === 'object' && data !== null) {
                    // 尝试检查是否有data属性包含数组
                    if (data.data && Array.isArray(data.data)) {
                        tableData = data.data;
                    } else {
                        // 如果是单个对象，将其包装成数组
                        tableData = [data];
                    }
                }
                
                // 确保tableData是数组
                if (!Array.isArray(tableData)) {
                    tableData = [];
                }
                
                // 设置表格标题
                if (window.selectedTableData && window.selectedTableData.objectData) {
                    tableTitle.textContent = `${window.selectedTableData.objectData.OBJECT || '数据'} 详情`;
                }
                
                // 只有当有数据时才生成表头和内容
                if (tableData.length > 0) {
                    // 获取第一个对象的所有键作为表头
                    const headers = Object.keys(tableData[0]);
                    
                    // 创建表头行
                    const headerRow = document.createElement('tr');
                    headers.forEach(header => {
                        const th = document.createElement('th');
                        // 格式化表头文本，将下划线替换为空格并首字母大写
                        th.textContent = header.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        headerRow.appendChild(th);
                    });
                    thead.appendChild(headerRow);
                    
                    // 创建表格内容行
                    tableData.forEach((rowData, rowIndex) => {
                        const tr = document.createElement('tr');
                        tr.dataset.rowIndex = rowIndex;
                        
                        // 添加点击事件用于行选择
                        tr.addEventListener('click', () => {
                            // 移除其他行的选中状态
                            tbody.querySelectorAll('tr').forEach(r => {
                                r.classList.remove('selected-row');
                            });
                            // 添加当前行的选中状态
                            tr.classList.add('selected-row');
                            // 存储选中的行数据
                            window.selectedRowData = rowData;
                        });
                        
                        // 创建单元格 - 按照表头顺序填充数据
                        headers.forEach(header => {
                            const td = document.createElement('td');
                            // 获取单元格数据，处理undefined或null的情况
                            const cellData = rowData[header];
                            
                            if (cellData === undefined || cellData === null) {
                                td.textContent = '-';
                            } else if (typeof cellData === 'object') {
                                // 如果是对象，尝试显示JSON字符串
                                try {
                                    td.textContent = JSON.stringify(cellData);
                                } catch (e) {
                                    td.textContent = '[对象]';
                                }
                            } else {
                                td.textContent = cellData;
                            }
                            
                            tr.appendChild(td);
                        });
                        
                        tbody.appendChild(tr);
                    });
                    
                    // 创建操作按钮
                    createActionButtons();
                } else {
                    // 如果没有数据，显示空表格状态
                    const emptyRow = document.createElement('tr');
                    const emptyCell = document.createElement('td');
                    emptyCell.colSpan = 1;
                    emptyCell.textContent = '暂无数据';
                    emptyCell.style.textAlign = 'center';
                    emptyCell.style.padding = '30px';
                    emptyRow.appendChild(emptyCell);
                    tbody.appendChild(emptyRow);
                    createActionButtons();
                }
                
                // 显示表格区域
                tableSection.style.display = 'block';

            }
            
            // 创建操作按钮函数
            function createActionButtons() {
                const actionButtons = document.getElementById('actionButtons');
                
                // 获取用户权限
                const hasAllRight = sessionStorage.getItem('access_allright') === '1';
                const hasModification = sessionStorage.getItem('access_modification') === '1';
                const hasAdding = sessionStorage.getItem('adding') === '1' || sessionStorage.getItem('access_checking') === '1';
                
                // 按钮配置
                let buttons = [
                    { id: 'btnView', class: 'btn-view', text: '展示' } // 展示按钮始终显示
                ];
                
                // 根据权限添加其他按钮
                if (hasAdding) {
                    buttons.push({ id: 'btnAdd', class: 'btn-add', text: '添加' });
                }
                
                if (hasModification) {
                    buttons.push({ id: 'btnEdit', class: 'btn-edit', text: '修改' });
                }
                
                if (hasAllRight) {
                    buttons.push({ id: 'btnDelete', class: 'btn-delete', text: '删除' });
                }
                
                // 创建按钮元素
                buttons.forEach(btnConfig => {
                    const button = document.createElement('button');
                    button.id = btnConfig.id;
                    button.className = `action-btn ${btnConfig.class}`;
                    button.textContent = btnConfig.text;
                    
                    // 添加点击事件（示例）
                    button.addEventListener('click', (e) => {
                        e.stopPropagation(); // 防止触发表格行点击
                        e.preventDefault(); // 防止按钮默认行为（如页面刷新）
                        handleActionButtonClick(btnConfig.id, btnConfig.text);
                    });
                    
                    actionButtons.appendChild(button);
                });
            }
            
            // 处理操作按钮点击
            function handleActionButtonClick(buttonId, buttonText) {
                // 根据按钮ID执行不同的操作
                switch(buttonId) {
                    case 'btnAdd':
                        // 获取当前主表格名
                        if (window.selectedTableData && window.selectedTableData.objectData) {
                            const tableName = window.selectedTableData.objectData.OBJECT;
                            // 显示加载状态
                            updateStatus('loading', `正在生成新数据...`);
                            command = ip + '/generate_new_item';
                            // 向后端发送请求
                            fetch(command, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ tablename: tableName })
                            })
                            .then(response => {
                                // console.log('收到响应:', response.status);
                                if (!response.ok) {
                                    throw new Error(`HTTP错误: ${response.status}`);
                                }
                                return response.json();
                            })
                            .then(data => {
                                console.log('生成新数据成功，返回数据:', JSON.parse(data.output));
                                // 避免重复调用updateStatus
                                updateStatus('success', `成功为 ${tableName} 生成新数据`);
                                
                                // 存储数据到localStorage并跳转到Data_UI.html
                                const parsedData = JSON.parse(data.output);
                                localStorage.setItem('externalData', JSON.stringify(parsedData));
                                console.log('数据已存储到localStorage，准备跳转到Data_UI.html');
                                // 延迟一小段时间跳转，确保用户能看到成功提示
                                setTimeout(() => {
                                    window.location.href = 'Data_UI.html';
                                }, 500);
                            })
                            .catch(error => {
                                // console.error('生成新数据失败:', error);
                                updateStatus('error', `生成新数据失败: ${error.message}`);
                            });
                        } else {
                            // 使用状态显示而不是弹窗
                            updateStatus('error', '请先选择一个表格');
                        }
                        break;
                    case 'btnEdit':
                        if (window.selectedRowData && window.selectedTableData && window.selectedTableData.objectData) {
                            // 获取当前选择的表格名
                            const tableName = window.selectedTableData.objectData.OBJECT;
                            // 获取选中的行数据（原始数组）
                            const rowData = window.selectedRowData;
                            
                            // 显示加载状态
                            updateStatus('loading', `正在发送修改请求...`);
                            
                            console.log('准备发送修改请求:');
                            console.log('表格名:', tableName);
                            console.log('行数据:', rowData);
                            
                            // 构建请求数据
                            const requestData = {
                                tablename: tableName,
                                rowdata: rowData
                            };
                            command = ip + '/modifyitems';
                            // 发送POST请求到/modifyitems路径
                            fetch(command, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(requestData)
                            })
                            .then(response => {
                                console.log('收到响应:', response.status);
                                if (!response.ok) {
                                    throw new Error(`HTTP错误: ${response.status}`);
                                }
                                return response.json();
                            })
                            .then(data => {
                                console.log('修改请求成功，返回数据:', data);
                                updateStatus('success', `成功发送 ${tableName} 的修改请求`);
                                const goodData = JSON.parse(data.output);
                                // 存储数据到localStorage并跳转到Data_UI.html
                                localStorage.setItem('externalData', JSON.stringify(goodData));
                                console.log('数据已存储到localStorage，准备跳转到Data_UI.html');
                                // 延迟一小段时间跳转，确保用户能看到成功提示
                                setTimeout(() => {
                                    window.location.href = 'Data_UI.html';
                                }, 500);
                            })
                            .catch(error => {
                                console.error('修改请求失败:', error);
                                updateStatus('error', `修改请求失败: ${error.message}`);
                            });
                        } else {
                            updateStatus('error', '请先选择表格和要修改的行');
                        }
                        break;
                    case 'btnView':
                        if (window.selectedRowData && window.selectedTableData && window.selectedTableData.objectData) {
                            // 获取当前选择的表格名
                            const tableName = window.selectedTableData.objectData.OBJECT;
                            // 获取选中的行数据
                            const rowData = window.selectedRowData;
                            
                            // 显示加载状态
                            updateStatus('loading', `正在获取数据详情...`);
                            
                            console.log('准备发送查看请求:');
                            console.log('表格名:', tableName);
                            console.log('行数据:', rowData);
                            
                            // 构建请求数据，与修改按钮保持一致的数据格式
                            const requestData = {
                                tablename: tableName,
                                rowdata: rowData
                            };
                            command = ip + '/extract_item';
                            // 发送POST请求到/extractitem路径
                            fetch(command, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(requestData)
                            })
                            .then(response => {
                                console.log('收到响应:', response.status);
                                if (!response.ok) {
                                    throw new Error(`HTTP错误: ${response.status}`);
                                }
                                return response.json();
                            })
                            .then(data => {
                                console.log('查看请求成功，返回数据:', data);
                                updateStatus('success', `成功获取 ${tableName} 的数据详情`);
                                
                                try {
                                    // 解析返回的JSON数据
                                    const jsonData = JSON.parse(data.output);
                                    // 显示JSON数据浮窗
                                    showJsonViewer(jsonData);
                                } catch (parseError) {
                                    console.error('解析JSON数据失败:', parseError);
                                    updateStatus('error', '解析返回数据失败');
                                }
                            })
                            .catch(error => {
                                console.error('查看请求失败:', error);
                                updateStatus('error', `查看请求失败: ${error.message}`);
                            });
                        } else {
                            updateStatus('error', '请先选择表格和要查看的行');
                        }
                        break;
                    case 'btnDelete':
                        if (window.selectedRowData && window.selectedTableData && window.selectedTableData.objectData) {
                            // 获取当前选择的表格名
                            const tableName = window.selectedTableData.objectData.OBJECT;
                            // 获取选中的行数据（原始数组）
                            const rowData = window.selectedRowData;
                            
                            // 弹出确认对话框
                            if (!confirm(`确定要删除表格 ${tableName} 中的选中项吗？此操作无法撤销。`)) {
                                // 用户取消删除，不执行后续操作
                                return;
                            }
                            
                            // 显示加载状态
                            updateStatus('loading', `正在发送删除请求...`);
                            
                            console.log('准备发送删除请求:');
                            console.log('表格名:', tableName);
                            console.log('行数据:', rowData);
                            
                            // 构建请求数据，与修改按钮保持一致的数据格式
                            const requestData = {
                                tablename: tableName,
                                rowdata: rowData
                            };
                            command = ip + '/deleteitem';
                            // 发送POST请求到deleteitem路径
                            fetch(command, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(requestData)
                            })
                            .then(response => {
                                console.log('收到响应:', response.status);
                                if (!response.ok) {
                                    throw new Error(`HTTP错误: ${response.status}`);
                                }
                                return response.json();
                            })
                            .then(data => {
                                console.log('删除请求成功，返回数据:', data);
                                updateStatus('success', `成功删除 ${tableName} 中的选中行`);
                                
                                // 重新加载当前表格数据
                                const objectData = window.selectedTableData.objectData;
                                const requestData = {
                                    tablename: objectData.OBJECT || '',
                                    columns: [
                                        objectData.NAME || '',
                                        objectData.ID || ''
                                    ]
                                };
                                command = ip + '/table_summary';
                                // 发送POST请求到table_summary路径
                                fetch(command, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify(requestData)
                                })
                                .then(response => {
                                    if (!response.ok) {
                                        throw new Error(`HTTP错误: ${response.status}`);
                                    }
                                    return response.json();
                                })
                                .then(newTableData => {
                                    // 更新存储的表格数据
                                    window.selectedTableData.tableData = newTableData;
                                    // 重新渲染表格
                                    renderDataTable(newTableData);
                                })
                                .catch(error => {
                                    console.error('重新加载表格数据失败:', error);
                                });
                            })
                            .catch(error => {
                                console.error('删除请求失败:', error);
                                updateStatus('error', `删除请求失败: ${error.message}`);
                            });
                        } else {
                            // 使用状态显示而不是弹窗
                            updateStatus('error', '请先选择要删除的行');
                        }
                        break;
                }
            }
            
            // 创建刷新数据函数
            function refreshData() {
                // 调用initpage重新加载数据卡片
                initpage();
                
                // 隐藏数据表格部分
                const tableSection = document.getElementById('tableSection');
                if (tableSection) {
                    tableSection.style.display = 'none';
                }
                
                // 清除选中的表格数据
                if (window.selectedTableData) {
                    delete window.selectedTableData;
                }
            }
            
            // 初始化页面
            initpage();
            
            // 添加刷新按钮点击事件
            refreshBtn.addEventListener('click', refreshData);
        });
        
        // 显示JSON数据查看浮窗
        function showJsonViewer(jsonData) {
            // 获取浮窗元素
            const modal = document.getElementById('json-viewer-modal');
            const jsonContent = document.getElementById('json-content');
            
            // 格式化JSON数据并显示
            const formattedJson = JSON.stringify(jsonData, null, 2);
            jsonContent.textContent = formattedJson;
            
            // 应用语法高亮（简单实现）
            highlightJson(jsonContent);
            
            // 显示浮窗
            modal.style.display = 'flex';
            
            // 阻止背景滚动
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭JSON数据查看浮窗
        function closeJsonViewer() {
            const modal = document.getElementById('json-viewer-modal');
            modal.style.display = 'none';
            
            // 恢复背景滚动
            document.body.style.overflow = '';
        }
        
        // 简单的JSON语法高亮
        function highlightJson(element) {
            let json = element.textContent;
            
            // 替换特殊字符进行高亮显示
            json = json
                // 字符串
                .replace(/"([^"\\]|\\.)*"/g, function(match) {
                    return '\u003cspan class="text-green-300"\u003e' + match + '\u003c/span\u003e';
                })
                // 数字
                .replace(/\\b\\d+(\\.\\d+)?\\b/g, function(match) {
                    return '\u003cspan class="text-orange-300"\u003e' + match + '\u003c/span\u003e';
                })
                // 布尔值
                .replace(/\\b(true|false)\\b/g, function(match) {
                    return '\u003cspan class="text-blue-300"\u003e' + match + '\u003c/span\u003e';
                })
                // null
                .replace(/\\bnull\\b/g, function(match) {
                    return '\u003cspan class="text-red-300"\u003e' + match + '\u003c/span\u003e';
                })
                // 键名
                .replace(/"([^"\\]|\\.)*":/g, function(match) {
                    return '\u003cspan class="text-yellow-300"\u003e' + match + '\u003c/span\u003e';
                });
            
            // 设置HTML内容
            element.innerHTML = json;
        }
        
        // 初始化事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            // 从sessionStorage读取用户验证信息和权限信息并存储为全局变量
            console.log('正在加载用户验证信息和权限信息...');
            
            // 全局认证状态变量
            window.userAuthenticated = sessionStorage.getItem('admin_authenticated') === 'true';
            window.username = sessionStorage.getItem('username') || '未登录';
            
            // 全局权限状态变量
            window.permissions = {
                allright: sessionStorage.getItem('access_allright') === '1',
                adding: sessionStorage.getItem('access_checking') === '1',
                modification: sessionStorage.getItem('access_modification') === '1'
            };
            
            console.log('用户认证状态:', window.userAuthenticated);
            console.log('用户名:', window.username);
            console.log('用户权限:', window.permissions);
            
            // 可选：如果未认证，可以重定向到登录页面或显示提示
            if (!window.userAuthenticated) {
                console.warn('未检测到用户认证信息');
                // 可以根据需求决定是否强制重定向
                // window.location.href = 'sitedashboard.html';
            }
            
            // 格式化JSON数据
            document.getElementById('format-json').addEventListener('click', function() {
                const jsonContent = document.getElementById('json-content');
                try {
                    // 尝试解析当前内容为JSON
                    const jsonData = JSON.parse(jsonContent.textContent);
                    // 格式化并显示
                    const formattedJson = JSON.stringify(jsonData, null, 2);
                    jsonContent.textContent = formattedJson;
                    // 应用语法高亮
                    highlightJson(jsonContent);
                    
                    // 显示格式化成功的通知
                    updateStatus('success', 'JSON格式化成功');
                } catch (error) {
                    updateStatus('error', 'JSON格式错误，无法格式化');
                }
            });
            
            // 复制JSON数据
            document.getElementById('copy-json').addEventListener('click', function() {
                const jsonContent = document.getElementById('json-content');
                
                // 创建临时文本域
                const textarea = document.createElement('textarea');
                textarea.value = jsonContent.textContent;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                
                // 选择并复制
                textarea.select();
                try {
                    document.execCommand('copy');
                    updateStatus('success', 'JSON数据已复制到剪贴板');
                } catch (error) {
                    updateStatus('error', '复制失败: ' + error.message);
                }
                
                // 清理
                document.body.removeChild(textarea);
            });
            
            // 关闭按钮事件监听
            document.getElementById('close-json-viewer').addEventListener('click', closeJsonViewer);
            
            // 点击浮窗背景关闭
            document.getElementById('json-viewer-modal').addEventListener('click', function(event) {
                if (event.target === this) {
                    closeJsonViewer();
                }
            });
            
            // ESC键关闭浮窗
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    const modal = document.getElementById('json-viewer-modal');
                    if (!modal.classList.contains('hidden')) {
                        closeJsonViewer();
                    }
                }
            });
        });
    </script>
    
    <!-- JSON数据查看浮窗 -->
    <div id="json-viewer-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 9999; flex-direction: column; justify-content: center; align-items: center;">
        <div style="background-color: #000000; border: 1px solid #444444; border-radius: 8px; width: 90%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);">
            <!-- 浮窗头部 -->
            <div style="background-color: #333333; color: #ffffff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444444;">
                <h3 style="font-size: 18px; font-weight: 600; margin: 0;">JSON数据查看器</h3>
                <button id="close-json-viewer" style="color: #ffffff; background: none; border: none; cursor: pointer; padding: 8px; transition: color 0.2s;">
                    <i style="font-size: 24px;">×</i>
                </button>
            </div>
            <!-- 浮窗工具栏 -->
            <div style="background-color: #222222; padding: 12px 24px; border-bottom: 1px solid #444444; display: flex; align-items: center; gap: 16px;">
                <button id="format-json" style="background-color: #2563eb; color: white; padding: 6px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; transition: background-color 0.2s;">
                    格式化
                </button>
                <button id="copy-json" style="background-color: #16a34a; color: white; padding: 6px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; transition: background-color 0.2s;">
                    复制
                </button>
            </div>
            <!-- 浮窗内容区 -->
            <div style="flex: 1; overflow: auto; padding: 0;">
                <pre id="json-content" style="width: 100%; padding: 24px; background-color: #0d1117; color: #c9d1d9; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 14px; overflow-x: auto; white-space: pre-wrap; min-height: 400px; margin: 0;"></pre>
            </div>
        </div>
    </div>
</body>
