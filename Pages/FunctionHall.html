<!DOCTYPE html>

<head>

    <link href="../css/font-awesome/css/font-awesome.min.css" rel="stylesheet">

</head>


<body class="bg-dark text-gray-100 font-inter min-h-screen flex flex-col bg-grid">
    <div id="particles-js"></div>
    <div class="content min-h-screen">

        <!-- 导航栏容器 --> 
        <div id="navbar-container"></div>

        <!--功能搜索页面-->

            <main class="flex-grow w-full px-4 py-8 flex flex-col gap-4">
                <div class="sticky top-20 z-20 bg-dark/90 backdrop-blur-md p-4 rounded-xl mb-6">
                    <!--按钮区域-->
                    <div class="bg-white rounded-xl shadow-lg p-6 transition-all duration-300 hover:shadow-xl">
                        <div class="flex flex-col md:flex-row gap-4">
                            <input 
                                type="text" 
                                id="searchInput" 
                                class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-gray-800"
                                placeholder="请输入搜索内容..."
                                >
                            <button 
                                id="functionserach" 
                                class="bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-lg transition-all flex items-center justify-center gap-2 shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
                                >
                                <i class="fa fa-search"></i>
                                <span>搜索</span>
                            </button>
                            <button 
                                id="allfunction" 
                                class="bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-lg transition-all flex items-center justify-center gap-2 shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
                                >
                                <i class="fa fa-list"></i>
                                <span>全部功能</span>
                            </button>
                        </div>     
                        <!-- 加载指示器 -->
                        <div id="loadingIndicator" class="mt-6 flex justify-center items-center hidden">
                            <div class="loading-spinner"></div>
                            <span class="ml-2 text-gray-600">正在搜索...</span>
                        </div>
                        <!-- 空状态 -->
                        <div id="emptyState" class="flex flex-col items-center justify-center py-16 hidden">
                            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-6">
                                <i class="fa fa-search text-gray-400 text-3xl"></i>
                            </div>
                            <h3 class="text-xl font-semibold text-gray-700 mb-2">未找到结果</h3>
                            <p class="text-gray-500 max-w-md text-center">请尝试使用不同的搜索词或调整搜索条件</p>
                        </div>               
                    </div>

                </div>


                <!-- 卡片容器 -->
                <div id="cardContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- 卡片将动态添加到这里 -->
                </div>

                <!-- 空的悬浮信息框模板 -->
                <div id="hoverInfoTemplate" class="fixed hidden bg-white shadow-lg p-4 rounded-lg w-64 z-100 border border-gray-200">
                    <h4 id="hoverInfoTitle" class="font-medium text-dark mb-2">详细参数</h4>
                    <div id="hoverInfoContent" class="space-y-2 text-sm text-gray-600">
                    <!-- 参数内容将动态生成 -->
                    </div>
                </div>

                <!-- PDF查看模态框 (保持不变) -->
                <div id="pdfModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
                    <div class="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden">
                        <div class="bg-dark text-white p-4 flex justify-between items-center border-b border-gray-200">
                        <h3 id="pdfModalTitle" class="font-medium">技术文档</h3>
                        <button id="closePDFBtn" class="text-gray-300 hover:text-white">
                            <i class="fa fa-times"></i>
                        </button>
                    </div>
                    <div class="p-6">
                    <div class="aspect-video bg-gray-100 rounded-lg overflow-hidden">
                        <iframe 
                        id="pdfIframe"
                        src="" 
                        class="w-full h-full" 
                        title="技术文档PDF"
                        >
                        您的浏览器不支持直接查看PDF，请下载后查看。
                        </iframe>
                        <div id="pdfError" class="absolute inset-0 bg-gray-100 flex flex-col items-center justify-center text-gray-500 hidden">
                            <i class="fa fa-exclamation-circle text-4xl mb-3"></i>
                            <p>无法读取PDF文件</p>
                        </div>
                    </div>
                    <div class="mt-4 text-center">
                        <button 
                        id="downloadPdfBtn"
                        class="inline-flex items-center text-primary hover:text-primary/80 font-medium"
                        >
                        <i class="fa fa-download mr-2"></i>
                        <span id="pdfFileName">下载PDF</span>
                        </button>
                    </div>
                    </div>
                </div>
                </div>


            </main>
        <!-- 页脚容器 -->
        <div id="footer-container"></div>   
    </div>    
    <!-- 加载组件的脚本 -->
    <script>
        // 图片加载错误处理
        function handleImageError(img) {
            img.onerror = null; // 防止无限循环
            img.src = '../PIC/Function/default.gif'; // 默认图片
        }
        
        // PDF加载成功处理
        function handlePdfLoad() {
            const pdfError = document.getElementById('pdfError');
            pdfError.classList.add('hidden');
        }
        
        // PDF加载错误处理
        function handlePdfError() {
            const pdfIframe = document.getElementById('pdfIframe');
            const pdfError = document.getElementById('pdfError');
            // 隐藏iframe内容
            pdfIframe.style.display = 'none';
            // 显示错误提示
            pdfError.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {     //ADAS 功能搜索
               
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('functionserach');
            const cardContainer = document.getElementById('cardContainer');
            const hoverInfoTemplate = document.getElementById('hoverInfoTemplate');
            const hoverInfoTitle = document.getElementById('hoverInfoTitle');
            const hoverInfoContent = document.getElementById('hoverInfoContent');
            const showbutton = document.getElementById('allfunction');
            const pdfIframe = document.getElementById('pdfIframe');
            
            // 添加PDF加载事件监听器
            pdfIframe.addEventListener('load', handlePdfLoad);
            pdfIframe.addEventListener('error', handlePdfError);

              // 当前显示的卡片数据
            let currentCards = [];
            let functionpicpath = "../PIC/Function/";
            
        
            // 绑定搜索按钮点击事件
            showbutton.addEventListener('click', () => {
                    initfunction();
            });

            // 绑定搜索按钮点击事件
            searchButton.addEventListener('click', () => {
                const searchText = searchInput.value.trim();
                if (searchText){
                    executeScript("serchbyfunction","EUF","Name");
                }
                else {
                    alert('请输入搜索内容');
                return;
                }
            });


            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                searchButton.click();
                }
            });

        // 将驼峰命名转换为中文标签
        function camelCaseToLabel(key) {
            
            const labelMap = {
            "Name": '功能简称',
            "Full_Name": '功能全程',
            "Description": '功能描述',
            "SIDE CAM": '传感器类型',
            };
            
            return labelMap[key] || key
            .replace(/([A-Z])/g, ' $1')
            .replace(/_/g, ' ')
            .trim()
            .replace(/^\w/, (c) => c.toUpperCase());
        }

        function initfunction(){
            cardContainer.innerHTML = '';
            command = ip + '/get_function_list'
            fetch(command, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                        datatype:"product",
                        item_cate:"function",
                        table_name:"euf",
                 })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                return response.json();
            })
            .then(async data => {
                // 显示执行结果
                if (data.success) {
                    data_group = JSON.parse(data.output);
                    console.log(data_group);
                    // 根据结果数量决定显示内容
                    if (data_group.length === 0) {
                        emptyState.classList.remove('hidden');
                    } else {
                        // 动态创建卡片
                        await createCards(data_group.Catalogue);
                        initCardInteractions(); // 初始化交互逻辑
                    }
                } else {
                    console.log('nonono')
                }                  
                // 启用按钮
                document.getElementById('functionserach').disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('functionserach').disabled = false;
                showNotification('连接服务器失败', 'error');
            });

        }

        // 执行脚本函数
        function executeScript(scriptName,item_type,item_attri) {
            // 禁用按钮
            searchButton.disabled = true;
            const searchText = searchInput.value.trim();
            cardContainer.innerHTML = '';

            command = ip + '/search_function'
            fetch(command, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                        datatype:"product",
                        searchtext:searchText,
                        table_name:"euf",
                 })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // 显示执行结果
                if (data.success) {
                    console.log(data.output);
                    data_group = JSON.parse(data.output);

                    // 根据结果数量决定显示内容
                    if (data_group.length === 0) {
                        emptyState.classList.remove('hidden');
                    } else {
                        // 动态创建卡片
                        createCards(data_group.Catalogue);
                        initCardInteractions(); // 初始化交互逻辑
                    }
                } else {
                    console.log('nonono')
                }                  
                // 启用按钮
                document.getElementById('functionserach').disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('functionserach').disabled = false;
                showNotification('连接服务器失败', 'error');
            });
        } 

        // 初始化卡片交互
        function initCardInteractions() {
            // 鼠标悬停处理
            cardContainer.addEventListener('mouseover', (e) => {
                if (!cardContainer.contains(e.target)) return;
                const card = e.target.closest('.group[data-card-id]');
                

                if (!card) {
                // 鼠标进入了容器但不是卡片（如间隙）
                return;
                }
                
                const cardId = card.getAttribute('data-card-id');
                const item = data_group["Catalogue"][cardId];

                if (!item){
                    return;
                } 
            
            // 更新悬浮框内容
                generateHoverInfoContent(item);
                hoverInfoTemplate.querySelector('h4').textContent = `${item["Name"]} 详情`;
            
            // 显示悬浮框
                hoverInfoTemplate.classList.remove('hidden');
            
            // 定位悬浮框
                const rect = card.getBoundingClientRect();
                const x = rect.right + 10;
                const y = rect.top;
            
                // 边界检查
                if (x + hoverInfoTemplate.offsetWidth > window.innerWidth) {
                    hoverInfoTemplate.style.left = (rect.left - hoverInfoTemplate.offsetWidth - 10) + 'px';
                } else {
                    hoverInfoTemplate.style.left = x + 'px';
                }
                
                hoverInfoTemplate.style.top = y + 'px';
                });
            
            cardContainer.addEventListener('mouseleave', () => {
                hoverInfoTemplate.classList.add('hidden');
            });
            
            // 查看PDF按钮处理
            cardContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.view-details-btn');
                if (!btn) return;
            
                const pdfPath = btn.getAttribute('data-pdf-path');
                const title = btn.getAttribute('data-title');
                const btnstat = btn.getAttribute('disabled');
                if (!btnstat==1){
                    // 更新模态框内容
                    pdfModalTitle.textContent = title;
                    pdfFileName.textContent = title.replace('技术文档', '') + '.pdf';
                    
                    // 显示模态框
                    pdfModal.classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                    
                    // 使用XMLHttpRequest先检查文件是否存在，避免直接设置src导致的404错误
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', pdfPath, true);
                    xhr.responseType = 'blob';
                    
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            // 文件存在，正常加载
                            pdfIframe.style.display = 'block';
                            document.getElementById('pdfError').classList.add('hidden');
                            pdfIframe.src = pdfPath;
                        } else {
                            // 文件不存在，显示错误提示
                            pdfIframe.style.display = 'none';
                            document.getElementById('pdfError').classList.remove('hidden');
                        }
                    };
                    
                    xhr.onerror = function() {
                        // 网络错误，显示错误提示
                        pdfIframe.style.display = 'none';
                        document.getElementById('pdfError').classList.remove('hidden');
                    };
                    
                    xhr.send();
                }});
        
            // 关闭模态框
            closePDFBtn.addEventListener('click', () => {
                pdfModal.classList.add('hidden');
                document.body.style.overflow = '';
                // 重置iframe和错误提示
                pdfIframe.src = '';
                pdfIframe.style.display = 'block';
                const pdfError = document.getElementById('pdfError');
                pdfError.classList.add('hidden');
            });
        
            // 点击模态框背景关闭
            pdfModal.addEventListener('click', (e) => {
                if (e.target === pdfModal) {
                pdfModal.classList.add('hidden');
                document.body.style.overflow = '';
                // 重置iframe和错误提示
                pdfIframe.src = '';
                pdfIframe.style.display = 'block';
                const pdfError = document.getElementById('pdfError');
                pdfError.classList.add('hidden');
                }
            });
        
            // 按ESC键关闭模态框
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !pdfModal.classList.contains('hidden')) {
                pdfModal.classList.add('hidden');
                document.body.style.overflow = '';
                // 重置iframe和错误提示
                pdfIframe.src = '';
                pdfIframe.style.display = 'block';
                const pdfError = document.getElementById('pdfError');
                pdfError.classList.add('hidden');
                }
            });
        }

        function generateHoverInfoContent(item) {
            const contentContainer = hoverInfoTemplate.querySelector('.space-y-2');
            contentContainer.innerHTML = '';
            
            // 直接显示所有属性
            Object.entries(item).forEach(([key, value]) => {
            if (value === undefined || value === null || typeof(value)=== 'object') return;
            
            const row = document.createElement('div');
            row.className = 'flex justify-between';
            
            const labelSpan = document.createElement('span');
            labelSpan.textContent = `${key}:`;
            
            const valueSpan = document.createElement('span');
            valueSpan.textContent = value;
            
            row.appendChild(labelSpan);
            row.appendChild(valueSpan);
            contentContainer.appendChild(row);
            });
            
            const hoverInfo = document.getElementById('hoverInfoTemplate');
            hoverInfo.style.width = '600px'; // 调整宽度
            hoverInfo.style.backgroundColor = '#f0f9ff'; // 蓝色背景
            hoverInfo.style.boxShadow = '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)';
        }

        function generatecardhtml(item, isFileAvailable){
            // 根据文件是否存在动态设置按钮属性
            const buttonBgClass = isFileAvailable ? "bg-blue-600" : "bg-ban";
            const buttonHoverClass = isFileAvailable ? "hover:bg-blue-700" : "hover:bg-ban/90";
            const buttonTextColor = isFileAvailable ? "text-white" : "text-black";
            const buttonIcon = isFileAvailable ? "fa-file-pdf-o" : "fa-times-circle";
            const buttonText = isFileAvailable ? "查看技术文档" : "准备中，敬请期待";
            const buttonDisabled = isFileAvailable ? "" : "disabled";
            const buttonCursor = isFileAvailable ? "cursor-pointer" : "cursor-not-allowed";
            return  `
                <div class="bg-white rounded-2xl shadow-card overflow-hidden hover-scale group flex flex-col" data-card-id="${item["Name"]}">
                    <div class="relative h-48 overflow-hidden">
                        <img src=${functionpicpath+item["Name"]+".gif"} alt="动图" class="w-full h-full object-cover" loading="lazy" onerror="handleImageError(this)">
                        <div class="absolute inset-0 bg-gradient-to-t from-dark/70 to-transparent"></div>
                        <div class="absolute bottom-4 left-4 text-white">
                            <span class="bg-primary/90 text-white text-xs font-medium px-2 py-1 rounded-full"> ${item["SAE"]}级</span>
                        </div>
                    </div> 
                    
                    <!-- 卡片内容区域 -->
                    <div class="p-6 flex flex-col flex-grow">
                        <!-- 功能简写和全称 -->
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="text-[clamp(1.2rem,3vw,1.5rem)] font-bold text-dark group-hover:text-primary transition-colors">
                                ${item["Name"]}
                                </h3>
                                <p class="text-gray-500 text-sm">${item["Full_Name"]}</p>
                            </div>
                                <span class="bg-blue-50 text-blue-700 text-xs font-medium px-2 py-1 rounded-full">
                                ${item["SAE"]}
                                </span>
                        </div>
                        
                        <!-- 功能介绍 -->
                        <p class="text-gray-600 line-clamp-3 text-xs mb-4">
                            ${item["Description"]}
                        </p>
                        
                        <!-- 按钮容器 -->
                        <div class="mt-auto">
                            <button 
                                class="view-details-btn w-full py-3 ${buttonBgClass} ${buttonHoverClass} ${buttonTextColor} ${buttonCursor} font-medium rounded-lg transition-colors duration-300 flex items-center justify-center gap-2"

                                <i class="fa ${buttonIcon}"></i>
                                <span>${buttonText}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
                                        // data-pdf-path = "${"../Doc/"+item["Name"]+".pdf"}" data-title = "${item["Name"]+"技术文档"}" ${buttonDisabled}>
        // 检查文件是否存在
        async function checkFileExists(fileName) {
            return new Promise((resolve) => {
                const xhr = new XMLHttpRequest();
                xhr.open('HEAD', `../Doc/${fileName}`, true);
                xhr.cache = 'no-cache';
                
                xhr.onload = function() {
                    resolve(xhr.status === 200);
                };
                
                xhr.onerror = function() {
                    resolve(false);
                };
                
                xhr.send();
            });
        }
        
        // 动态创建卡片的函数
        async function createCards(items) {
            // 清空容器
            currentCards = items;
            cardContainer.innerHTML = '';
            
            // 为每个结果创建卡片
            for (const itemKey of Object.keys(items)) {
                const item = items[itemKey];
                const fileName = `${item["Name"]}.pdf`;
                const isFileAvailable = await checkFileExists(fileName);
                const card = generatecardhtml(item, isFileAvailable);
                // 将卡片添加到容器
                cardContainer.insertAdjacentHTML('beforeend', card);
            }
        }

        // 显示通知
        function showNotification(message, type = 'success') {
            // 创建通知元素
            const notification = document.createElement('div');
            notification.className = `fixed top-20 right-4 px-4 py-3 rounded-lg shadow-lg z-50 transform transition-all duration-300 opacity-0 translate-x-full ${
                type === 'success' ? 'bg-secondary/90 text-white' : 'bg-red-500/90 text-white'
            }`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fa fa-${type === 'success' ? 'check' : 'exclamation-circle'} mr-2"></i>
                    <span>${message}</span>
                </div>
            `;
            
            // 添加到页面
            document.body.appendChild(notification);
            
            // 显示通知
            setTimeout(() => {
                notification.classList.remove('opacity-0', 'translate-x-full');
            }, 10);
            
            // 自动关闭
            setTimeout(() => {
                notification.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }
        initfunction();
    });

    </script>
    <script src="../js/load-components.js"></script>
    <script src="../js/function-link-manager.js"></script>
    <script src="../js/Visit_Monitor.js"></script>
</body>
