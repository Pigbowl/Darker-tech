                        // 递归展开对象的函数
                        function expandObject(obj, prefix, container) {
                            if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) {
                                return;
                            }
                            
                            for (const [key, value] of Object.entries(obj)) {
                                const fullKey = prefix ? `${prefix}.${key}` : key;
                                
                                if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                                    // 如果是空对象，直接显示
                                    if (Object.keys(value).length === 0) {
                                        const propertyItem = document.createElement('div');
                                        propertyItem.className = 'flex justify-between';
                                        
                                        const propertyKey = document.createElement('span');
                                        propertyKey.className = 'font-medium';
                                        propertyKey.textContent = fullKey + ':';
                                        
                                        const propertyValue = document.createElement('span');
                                        propertyValue.textContent = '{}';
                                        
                                        propertyItem.appendChild(propertyKey);
                                        propertyItem.appendChild(propertyValue);
                                        container.appendChild(propertyItem);
                                    } else {
                                        // 递归展开嵌套对象
                                        expandObject(value, fullKey, container);
                                    }
                                } else {
                                    // 显示叶子节点
                                    const propertyItem = document.createElement('div');
                                    propertyItem.className = 'flex justify-between';
                                    
                                    const propertyKey = document.createElement('span');
                                    propertyKey.className = 'font-medium';
                                    propertyKey.textContent = fullKey + ':';
                                    
                                    const propertyValue = document.createElement('span');
                                    if (Array.isArray(value)) {
                                        propertyValue.textContent = JSON.stringify(value);
                                    } else if (value === null) {
                                        propertyValue.textContent = 'null';
                                    } else {
                                        propertyValue.textContent = value;
                                    }
                                    
                                    propertyItem.appendChild(propertyKey);
                                    propertyItem.appendChild(propertyValue);
                                    container.appendChild(propertyItem);
                                }
                            }
                        }
                        }

                        function compareInterfaces(sourceElementData, targetElementData) {
                            // 空值检查
                            if (!sourceElementData || !targetElementData) {
                                console.error('接口数据为空，无法比较');
                                return Promise.resolve(null);
                            }
                            
                            const componentA = sourceElementData.properties.interface_list || [];
                            const componentB = targetElementData.properties.interface_list || [];
                            
                            // 找出两个组件都具备且有可用接口的子类型
                            const availableSubTypes = new Set();
                            
                            // 检查每个子类型
                            const allSubTypes = new Set();
                            componentA.forEach(item => { if (item.enabled) allSubTypes.add(item.subType); });
                            componentB.forEach(item => { if (item.enabled) allSubTypes.add(item.subType); });
                            
                            allSubTypes.forEach(subType => {
                                // 检查A是否有该子类型的可用接口
                                const hasFreeA = componentA.some(item => 
                                    item.enabled && item.subType === subType && !item.connection
                                );
                                
                                // 检查B是否有该子类型的可用接口
                                const hasFreeB = componentB.some(item => 
                                    item.enabled && item.subType === subType && !item.connection
                                );
                                
                                if (hasFreeA && hasFreeB) {
                                    availableSubTypes.add(subType);
                                }
                            });
                            
                            const availableSubTypesArray = Array.from(availableSubTypes);
                            
                            // 如果没有共同且可用的接口，返回 Promise 解析为 null

                        // 创建元素间连接线的函数
                        function createConnectionBetweenElements(sourceId, targetId, subType, sourceInterfaceIndex, targetInterfaceIndex) {
                            console.log('创建连接线:', sourceId, '->', targetId, '接口:', subType);
                             
                            // 获取源元素和目标元素的DOM引用
                            const sourceElement = document.querySelector(`[data-element-id="${sourceId}"]`);
                            const targetElement = document.querySelector(`[data-element-id="${targetId}"]`);
                            
                            // 获取源元素和目标元素的数据
                            const sourceData = elementData.find(d => d.id === sourceId);
                            const targetData = elementData.find(d => d.id === targetId);
                            
                            // 获取源接口和目标接口元素
                            const sourceInterfaceElements = sourceElement ? sourceElement.querySelectorAll('.interface-element') : [];
                            const targetInterfaceElements = targetElement ? targetElement.querySelectorAll('.interface-element') : [];
                            
                            // 通过接口name查找对应的DOM元素
                            const sourceInterfaceElement = Array.from(sourceInterfaceElements).find(el => 
                                el.querySelector('.interface-label').textContent === sourceData.properties.interface_list[sourceInterfaceIndex].name
                            );
                            const targetInterfaceElement = Array.from(targetInterfaceElements).find(el => 
                                el.querySelector('.interface-label').textContent === targetData.properties.interface_list[targetInterfaceIndex].name
                            );
                            
                            console.log('源接口name:', sourceData.properties.interface_list[sourceInterfaceIndex]?.name);
                            console.log('目标接口name:', targetData.properties.interface_list[targetInterfaceIndex]?.name);
                            
                            // 更新接口连接信息
                            if (sourceData && sourceData.properties && sourceData.properties.interface_list && sourceData.properties.interface_list[sourceInterfaceIndex]) {
                                const connectionInfo = `${targetData.name || '未知'} - ${targetData.properties.interface_list[targetInterfaceIndex].name}`;
                                sourceData.properties.interface_list[sourceInterfaceIndex].connection = connectionInfo;
                            }
                            
                            if (targetData && targetData.properties && targetData.properties.interface_list && targetData.properties.interface_list[targetInterfaceIndex]) {
                                const connectionInfo = `${sourceData.name || '未知'} - ${sourceData.properties.interface_list[sourceInterfaceIndex].name}`;
                                targetData.properties.interface_list[targetInterfaceIndex].connection = connectionInfo;
                            }

                            
                            // 创建连接线元素
                            const connectionLine = document.createElement('div');
                            connectionLine.className = 'connection-line';
                            connectionLine.dataset.connectionId = Date.now(); // 设置连接ID
                            connectionLine.dataset.sourceInterfaceIndex = sourceInterfaceIndex;
                            connectionLine.dataset.targetInterfaceIndex = targetInterfaceIndex;
                            connectionLine.style.position = 'absolute';
                            connectionLine.style.zIndex = zIndexCounter++; // 与其他元素使用相同的z-index管理
                            connectionLine.style.pointerEvents = 'auto'; // 允许点击选中
                            connectionLine.style.backgroundColor = '#6366f1'; // 连接线颜色
                            connectionLine.style.opacity = '1'; // 确保完全不透明
                            connectionLine.style.borderRadius = '1.5px'; // 添加圆角使线条更平滑
                            connectionLine.style.height = '2px'; // 设置默认高度
                            
                            // 添加点击事件监听器以支持选中功能
                            connectionLine.addEventListener('click', function(e) {
                                e.stopPropagation(); // 阻止事件冒泡，避免触发画布点击
                                e.preventDefault(); // 阻止默认行为
                                
                                const clickedLine = this;
                                const connectionData = clickedLine.connectionData;
                                console.log('连接线点击:', e.ctrlKey, connectionData ? connectionData.lineType : 'no data');
                                
                                // Ctrl+点击添加航点
                                if (e.ctrlKey && connectionData) {
                                    if (connectionData.lineType === 'custom') {
                                        // 获取点击位置相对于画布的坐标
                                        const rect = archidemo.getBoundingClientRect();
                                        const clickX = (e.clientX - rect.left - offsetX) / scale;
                                        const clickY = (e.clientY - rect.top - offsetY) / scale;
                                        
                                        console.log('Ctrl+点击添加航点:', clickX, clickY);
                                        
                                        // 添加航点
                                        if (!connectionData.waypoints) {
                                            connectionData.waypoints = [];
                                        }
                                        connectionData.waypoints.push({ x: clickX, y: clickY });
                                        
                                        console.log('航点列表:', connectionData.waypoints);
                                        
                                        // 重新绘制
                                        const sourceElement = document.querySelector(`[data-element-id="${connectionData.sourceId}"]`);
                                        const targetElement = document.querySelector(`[data-element-id="${connectionData.targetId}"]`);
                                        if (sourceElement && targetElement) {
                                            redrawConnectionLine(clickedLine, connectionData, sourceElement, null, targetElement, null);
                                        }
                                        return;
                                    } else {
                                        console.log('当前线类型不是custom:', connectionData.lineType);
                                    }
                                }
                                
                                selectConnectionLine(clickedLine);
                            });
                             
                            // 将连接线添加到与其他元素相同的容器中
                            canvasContainer.appendChild(connectionLine);
                             
                            // 计算并更新连接线的位置和样式（连接到接口图形）
                            updateInterfaceConnectionLine(connectionLine, sourceElement, sourceInterfaceElement, targetElement, targetInterfaceElement);
                             
                            // 添加完整的连接线数据
                            const connectionData = {
                                id: parseInt(connectionLine.dataset.connectionId),
                                sourceId: sourceId,
                                targetId: targetId,
                                direction: '单向', // 默认单向
                                color: '#6366f1', // 默认紫色
                                type: subType, // 接口子类型
                                sourceInterfaceIndex: sourceInterfaceIndex,
                                targetInterfaceIndex: targetInterfaceIndex,
                                sourceInterfaceName: sourceData.properties.interface_list[sourceInterfaceIndex]?.name,
                                targetInterfaceName: targetData.properties.interface_list[targetInterfaceIndex]?.name,
                                lineType: 'auto-straight', // 线形状：auto-straight（自动直线）, auto-折线（自动折线）, custom（自定义）
                                waypoints: [], // 自定义航点列表
                                waypointCount: 0 // 航点数量
                            };
                             
                            // 存储连接数据
                            if (!window.connectionData) {
                                window.connectionData = [];
                            }
                            window.connectionData.push(connectionData);
                            elements.push(connectionLine);
                            elementData.push(connectionData);
                            
                            // 存储DOM引用以便快速访问
                            connectionLine.connectionData = connectionData;
                             
                            // console.log('连接线创建成功:', connectionData);
                            
                            // 更新属性面板显示最新的连接信息
                            updatePropertyPanel();
                            
                            exitConnectionMode();
                        }
                        
                        // 选中连接线的函数
                        function selectConnectionLine(lineElement) {
                            // 重置之前选中的元素
                            if (activeElement) {
                                // 移除元素选中样式（黄色光晕或接口高亮）
                                if (activeElement.classList.contains('canvas-element')) {
                                    activeElement.style.boxShadow = '';
                                } else if (activeElement.classList.contains('connection-line')) {
                                    activeElement.style.boxShadow = '';
                                } else if (activeElement.classList.contains('interface-element')) {
                                    activeElement.style.border = '1px solid #ccc';
                                    activeElement.style.boxShadow = '';
                                }
                            }
                            
                            // 设置当前选中的连接线
                            activeElement = lineElement;
                            activeElementData = lineElement.connectionData;
                            
                            // 添加选中样式
                            lineElement.style.boxShadow = '0 0 5px 2px rgba(99, 102, 241, 0.8)';
                            
                            // 更新属性面板
                            updatePropertyPanel();
                        }
                        
                        // 计算矩形边缘上距离另一个矩形最近的点
                        function getNearestPointOnRect(rect1, rect2, canvasRect) {
                            // 计算两个矩形的中心点
                            const center1X = rect1.left + rect1.width / 2;
                            const center1Y = rect1.top + rect1.height / 2;
                            const center2X = rect2.left + rect2.width / 2;
                            const center2Y = rect2.top + rect2.height / 2;
                            
                            // 计算从rect1中心指向rect2中心的向量
                            const dx = center2X - center1X;
                            const dy = center2Y - center1Y;
                            
                            // 计算这个向量与rect1边缘的交点
                            // 首先计算向量在矩形边界上的比例因子
                            let tX = Math.abs(rect1.width / 2 / dx) || Infinity;
                            let tY = Math.abs(rect1.height / 2 / dy) || Infinity;
                            
                            // 选择较小的t值，确保交点在矩形的最近边缘上
                            let t = Math.min(tX, tY);
                            
                            // 计算交点坐标
                            let intersectionX = center1X + t * dx;
                            let intersectionY = center1Y + t * dy;
                            
                            // 转换为相对于canvasContainer的坐标
                            return {
                                x: intersectionX - canvasRect.left,
                                y: intersectionY - canvasRect.top
                            };
                        }
                        
                        // 更新连接线位置和样式的函数
                        function updateConnectionLine(line, source, target) {
                            // 获取元素数据
                            const sourceId = parseInt(source.dataset.elementId);
                            const targetId = parseInt(target.dataset.elementId);
                            const sourceData = elementData.find(data => data.id === sourceId);
                            const targetData = elementData.find(data => data.id === targetId);
                            
                            // 获取元素的样式位置（直接使用元素的style属性，不使用getBoundingClientRect）
                            const sourceLeft = parseFloat(source.style.left || 0);
                            const sourceTop = parseFloat(source.style.top || 0);
                            const targetLeft = parseFloat(target.style.left || 0);
                            const targetTop = parseFloat(target.style.top || 0);
                            
                            // 计算元素中心点（考虑元素类型）
                            let sourceCenterX, sourceCenterY, targetCenterX, targetCenterY;
                            
                            if (sourceData.type === 'circle') {
                                sourceCenterX = sourceLeft + sourceData.radius;
                                sourceCenterY = sourceTop + sourceData.radius;
                            } else if (sourceData.type === 'rectangle') {
                                sourceCenterX = sourceLeft + sourceData.width / 2;
                                sourceCenterY = sourceTop + sourceData.height / 2;
                            } else if (sourceData.type === 'square') {
                                sourceCenterX = sourceLeft + sourceData.size / 2;
                                sourceCenterY = sourceTop + sourceData.size / 2;
                            } else {
                                // 默认处理
                                sourceCenterX = sourceLeft + 50; // 默认宽度的一半
                                sourceCenterY = sourceTop + 30; // 默认高度的一半
                            }
                            
                            if (targetData.type === 'circle') {
                                targetCenterX = targetLeft + targetData.radius;
                                targetCenterY = targetTop + targetData.radius;
                            } else if (targetData.type === 'rectangle') {
                                targetCenterX = targetLeft + targetData.width / 2;
                                targetCenterY = targetTop + targetData.height / 2;
                            } else if (targetData.type === 'square') {
                                targetCenterX = targetLeft + targetData.size / 2;
                                targetCenterY = targetTop + targetData.size / 2;
                            } else {
                                // 默认处理
                                targetCenterX = targetLeft + 50; // 默认宽度的一半
                                targetCenterY = targetTop + 30; // 默认高度的一半
                            }
                            
                            // 计算从源元素到目标元素的向量
                            const dx = targetCenterX - sourceCenterX;
                            const dy = targetCenterY - sourceCenterY;
                            
                            // 计算源元素边缘上的点
                            let sourcePoint, targetPoint;
                            
                            if (sourceData.type === 'circle') {
                                // 对于圆形，直接计算边缘点
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                if (distance > 0) {
                                    sourcePoint = {
                                        x: sourceCenterX + (dx / distance) * sourceData.radius,
                                        y: sourceCenterY + (dy / distance) * sourceData.radius
                                    };
                                } else {
                                    sourcePoint = {x: sourceCenterX, y: sourceCenterY};
                                }
                            } else {
                                // 对于矩形/方形，计算边缘上最近的点
                                // 计算向量在矩形边界上的比例因子
                                let tX = Math.abs(dx) > 0 ? ((sourceData.width || sourceData.size || 100) / 2) / Math.abs(dx) : Infinity;
                                let tY = Math.abs(dy) > 0 ? ((sourceData.height || sourceData.size || 60) / 2) / Math.abs(dy) : Infinity;
                                // 选择较小的t值，确保交点在矩形的最近边缘上
                                let t = Math.min(tX, tY);
                                sourcePoint = {
                                    x: sourceCenterX + t * dx,
                                    y: sourceCenterY + t * dy
                                };
                            }
                            
                            // 计算目标元素边缘上的点
                            const targetDx = sourceCenterX - targetCenterX;
                            const targetDy = sourceCenterY - targetCenterY;
                            
                            if (targetData.type === 'circle') {
                                // 对于圆形，直接计算边缘点
                                const distance = Math.sqrt(targetDx * targetDx + targetDy * targetDy);
                                if (distance > 0) {
                                    targetPoint = {
                                        x: targetCenterX + (targetDx / distance) * targetData.radius,
                                        y: targetCenterY + (targetDy / distance) * targetData.radius
                                    };
                                } else {
                                    targetPoint = {x: targetCenterX, y: targetCenterY};
                                }
                            } else {
                                // 对于矩形/方形，计算边缘上最近的点
                                // 计算向量在矩形边界上的比例因子
                                let tX = Math.abs(targetDx) > 0 ? ((targetData.width || targetData.size || 100) / 2) / Math.abs(targetDx) : Infinity;
                                let tY = Math.abs(targetDy) > 0 ? ((targetData.height || targetData.size || 60) / 2) / Math.abs(targetDy) : Infinity;
                                // 选择较小的t值，确保交点在矩形的最近边缘上
                                let t = Math.min(tX, tY);
                                targetPoint = {
                                    x: targetCenterX + t * targetDx,
                                    y: targetCenterY + t * targetDy
                                };
                            }
                            
                            // 计算两点之间的距离和角度
                            const lineDx = targetPoint.x - sourcePoint.x;
                            const lineDy = targetPoint.y - sourcePoint.y;
                            const distance = Math.sqrt(lineDx * lineDx + lineDy * lineDy);
                            const angle = Math.atan2(lineDy, lineDx) * 180 / Math.PI;
                               
                            // 获取连接数据以应用自定义颜色
                            const connectionData = line.connectionData || 
                                (window.connectionData ? window.connectionData.find(conn => conn.id === parseInt(line.dataset.connectionId)) : null);
                            const lineColor = connectionData ? connectionData.color : '#6366f1';
                               
                            // 设置连接线的样式，增强可见性
                            line.style.width = distance + 'px';
                            line.style.height = '3px'; // 略微加粗
                            line.style.left = sourcePoint.x + 'px';
                            line.style.top = sourcePoint.y + 'px';
                            line.style.transformOrigin = '0 50%';
                            line.style.transform = `rotate(${angle}deg)`;
                            line.style.backgroundColor = lineColor; // 使用连接数据中的颜色
                            line.style.opacity = '1'; // 确保完全不透明
                            line.style.borderRadius = '1.5px'; // 添加圆角使线条更平滑
                            
                            // 更新连接数据中的位置信息
                            if (connectionData) {
                                connectionData.sourcePosition = {
                                    x: sourceLeft,
                                    y: sourceTop
                                };
                                connectionData.targetPosition = {
                                    x: targetLeft,
                                    y: targetTop
                                };
                            }
                        }
                        

                        
                        // 根据接口位置判断贴在哪一边
                        function getInterfaceSnapSide(left, top, width, height, parentWidth, parentHeight) {
                            // 计算到各边的距离
                            const distances = {
                                left: left,
                                right: parentWidth - left - width,
                                top: top,
                                bottom: parentHeight - top - height
                            };
                            
                            // 找到最近的边
                            const minDistance = Math.min(distances.left, distances.right, distances.top, distances.bottom);
                            
                            if (distances.left === minDistance) return 'left';
                            if (distances.right === minDistance) return 'right';
                            if (distances.top === minDistance) return 'top';
                            return 'bottom';
                        }
                        
                        // 获取接口的连接点坐标
                        function getConnectionPoint(parentLeft, parentTop, interfaceLeft, interfaceTop, interfaceWidth, interfaceHeight, snapSide) {
                            const x = parentLeft + interfaceLeft;
                            const y = parentTop + interfaceTop;
                            
                            switch(snapSide) {
                                case 'left':
                                    return { x: x, y: y + interfaceHeight / 2 };
                                case 'right':
                                    return { x: x + interfaceWidth, y: y + interfaceHeight / 2 };
                                case 'top':
                                    return { x: x + interfaceWidth / 2, y: y };
                                case 'bottom':
                                    return { x: x + interfaceWidth / 2, y: y + interfaceHeight };
                                default:
                                    return { x: x + interfaceWidth / 2, y: y + interfaceHeight / 2 };
                            }
                        }
                        
                        // 修改主绘制函数支持多种线形状
                        function updateInterfaceConnectionLine(line, sourceElement, sourceInterfaceElement, targetElement, targetInterfaceElement) {
                            const connectionData = line.connectionData;
                            const lineType = connectionData ? connectionData.lineType : 'auto-straight';
                            
                            const interfaceWidth = 50;
                            const interfaceHeight = 20;
                            
                            // 获取接口位置，如果元素不存在则使用默认值0
                            const sourceInterfaceLeft = sourceInterfaceElement ? (parseFloat(sourceInterfaceElement.style.left) || 0) : 0;
                            const sourceInterfaceTop = sourceInterfaceElement ? (parseFloat(sourceInterfaceElement.style.top) || 0) : 0;
                            const targetInterfaceLeft = targetInterfaceElement ? (parseFloat(targetInterfaceElement.style.left) || 0) : 0;
                            const targetInterfaceTop = targetInterfaceElement ? (parseFloat(targetInterfaceElement.style.top) || 0) : 0;
                            
                            const sourceParentWidth = sourceElement ? (sourceElement.offsetWidth || 150) : 150;
                            const sourceParentHeight = sourceElement ? (sourceElement.offsetHeight || 80) : 80;
                            const targetParentWidth = targetElement ? (targetElement.offsetWidth || 150) : 150;
                            const targetParentHeight = targetElement ? (targetElement.offsetHeight || 80) : 80;
                            
                            const sourceElementLeft = sourceElement ? (sourceElement.offsetLeft || 0) : 0;
                            const sourceElementTop = sourceElement ? (sourceElement.offsetTop || 0) : 0;
                            const targetElementLeft = targetElement ? (targetElement.offsetLeft || 0) : 0;
                            const targetElementTop = targetElement ? (targetElement.offsetTop || 0) : 0;
                            
                            const sourceSnapSide = getInterfaceSnapSide(sourceInterfaceLeft, sourceInterfaceTop, interfaceWidth, interfaceHeight, sourceParentWidth, sourceParentHeight);
                            const sourceConnectionPoint = getConnectionPoint(sourceElementLeft, sourceElementTop, sourceInterfaceLeft, sourceInterfaceTop, interfaceWidth, interfaceHeight, sourceSnapSide);
                            
                            const targetSnapSide = getInterfaceSnapSide(targetInterfaceLeft, targetInterfaceTop, interfaceWidth, interfaceHeight, targetParentWidth, targetParentHeight);
                            const targetConnectionPoint = getConnectionPoint(targetElementLeft, targetElementTop, targetInterfaceLeft, targetInterfaceTop, interfaceWidth, interfaceHeight, targetSnapSide);
                            
                            if (lineType === 'auto-straight') {
                                drawStraightLine(line, sourceConnectionPoint, targetConnectionPoint, connectionData);
                            } else if (lineType === 'auto-polyline') {
                                drawPolyline(line, sourceConnectionPoint, targetConnectionPoint, sourceSnapSide, targetSnapSide, connectionData);
                            } else if (lineType === 'custom') {
                                drawCustomLine(line, sourceConnectionPoint, targetConnectionPoint, connectionData);
                            }
                        }
                        
                        // 绘制直线
                        function drawStraightLine(line, startPoint, endPoint, connectionData) {
                            const lineDx = endPoint.x - startPoint.x;
                            const lineDy = endPoint.y - startPoint.y;
                            const distance = Math.sqrt(lineDx * lineDx + lineDy * lineDy);
                            const angle = Math.atan2(lineDy, lineDx) * 180 / Math.PI;
                            
                            const lineColor = connectionData ? connectionData.color : '#6366f1';
                            
                            line.style.width = distance + 'px';
                            line.style.height = '3px';
                            line.style.left = startPoint.x + 'px';
                            line.style.top = startPoint.y + 'px';
                            line.style.transformOrigin = '0 50%';
                            line.style.transform = `rotate(${angle}deg)`;
                            line.style.backgroundColor = lineColor;
                            line.style.opacity = '1';
                            line.style.borderRadius = '1.5px';
                            line.style.zIndex = '1000';
                            line.style.boxShadow = '';
                            
                            clearWaypoints(line);
                        }
                        
                        // 绘制折线
                        function drawPolyline(line, startPoint, endPoint, startSide, endSide, connectionData) {
                            console.log('drawPolyline - startPoint:', startPoint, 'endPoint:', endPoint, 'startSide:', startSide, 'endSide:', endSide);
                            const waypoints = calculatePolylineWaypoints(startPoint, endPoint, startSide, endSide);
                            console.log('drawPolyline - waypoints:', waypoints);
                            
                            if (connectionData) {
                                connectionData.waypointCount = waypoints.length;
                                const el = document.getElementById('connection-waypoint-count');
                                if (el) el.textContent = waypoints.length;
                            }
                            
                            clearWaypoints(line);
                            
                            let prevPoint = startPoint;
                            const lineColor = connectionData ? connectionData.color : '#6366f1';
                            
                            waypoints.forEach(wp => {
                                const segment = document.createElement('div');
                                segment.className = 'connection-segment';
                                segment.style.position = 'absolute';
                                segment.style.backgroundColor = lineColor;
                                segment.style.zIndex = '1000';
                                
                                const dx = wp.x - prevPoint.x;
                                const dy = wp.y - prevPoint.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                                
                                segment.style.width = distance + 'px';
                                segment.style.height = '3px';
                                segment.style.left = prevPoint.x + 'px';
                                segment.style.top = prevPoint.y + 'px';
                                segment.style.transformOrigin = '0 50%';
                                segment.style.transform = `rotate(${angle}deg)`;
                                segment.style.borderRadius = '1.5px';
                                
                                // 为线段添加点击事件
                                segment.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    line.dispatchEvent(new MouseEvent('click', {
                                        ctrlKey: e.ctrlKey,
                                        clientX: e.clientX,
                                        clientY: e.clientY
                                    }));
                                });
                                
                                // 将子线段直接添加到canvasContainer中，而不是line元素中
                                canvasContainer.appendChild(segment);
                                // 保存引用以便后续清理
                                if (!line.segments) line.segments = [];
                                line.segments.push(segment);
                                prevPoint = wp;
                            });
                            
                            const lastSegment = document.createElement('div');
                            lastSegment.className = 'connection-segment';
                            lastSegment.style.position = 'absolute';
                            lastSegment.style.backgroundColor = lineColor;
                            lastSegment.style.zIndex = '1000';
                            
                            const finalDx = endPoint.x - prevPoint.x;
                            const finalDy = endPoint.y - prevPoint.y;
                            const finalDistance = Math.sqrt(finalDx * finalDx + finalDy * finalDy);
                            const finalAngle = Math.atan2(finalDy, finalDx) * 180 / Math.PI;
                            
                            lastSegment.style.width = finalDistance + 'px';
                            lastSegment.style.height = '3px';
                            lastSegment.style.left = prevPoint.x + 'px';
                            lastSegment.style.top = prevPoint.y + 'px';
                            lastSegment.style.transformOrigin = '0 50%';
                            lastSegment.style.transform = `rotate(${finalAngle}deg)`;
                            lastSegment.style.borderRadius = '1.5px';
                            
                            // 为最后一个线段添加点击事件
                            lastSegment.addEventListener('click', function(e) {
                                e.stopPropagation();
                                line.dispatchEvent(new MouseEvent('click', {
                                    ctrlKey: e.ctrlKey,
                                    clientX: e.clientX,
                                    clientY: e.clientY
                                }));
                            });
                            
                            // 将最后一个线段直接添加到canvasContainer中
                            canvasContainer.appendChild(lastSegment);
                            if (!line.segments) line.segments = [];
                            line.segments.push(lastSegment);
                            
                            // 主连接线元素不响应点击，只让子线段响应
                            line.style.pointerEvents = 'none';
                            // 保持位置在原点，子元素相对于canvasContainer定位
                            line.style.left = '0';
                            line.style.top = '0';
                            line.style.width = '0';
                            line.style.height = '0';
                            line.style.backgroundColor = 'transparent';
                        }
                        
                        // 计算正交折线航点（新算法：根据方向约束计算航点）
                        function calculatePolylineWaypoints(startPoint, endPoint, startSide, endSide) {
                            const waypoints = [];
                            
                            // 定义每个边的出方向向量
                            const sideDirections = {
                                'left': { dx: -1, dy: 0 },   // 向左水平
                                'right': { dx: 1, dy: 0 },    // 向右水平
                                'top': { dx: 0, dy: -1 },     // 向上垂直
                                'bottom': { dx: 0, dy: 1 }     // 向下垂直
                            };
                            
                            const startDir = sideDirections[startSide];
                            const endDir = sideDirections[endSide];
                            
                            // 计算延伸距离（使用起点和终点之间的距离作为参考）
                            const dx = endPoint.x - startPoint.x;
                            const dy = endPoint.y - startPoint.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            const extendDistance = Math.max(50, distance * 0.3);  // 至少延伸50像素
                            
                            let firstWaypoint, lastWaypoint;
                            
                            // 计算第一个航点：沿着起点方向延伸
                            if (startDir.dx !== 0) {
                                // 起点是水平方向
                                firstWaypoint = { 
                                    x: startPoint.x + startDir.dx * extendDistance, 
                                    y: startPoint.y 
                                };
                            } else {
                                // 起点是垂直方向
                                firstWaypoint = { 
                                    x: startPoint.x, 
                                    y: startPoint.y + startDir.dy * extendDistance 
                                };
                            }
                            
                            // 计算最后一个航点：沿着终点方向延伸
                            if (endDir.dx !== 0) {
                                // 终点是水平方向，沿着方向延伸
                                lastWaypoint = { 
                                    x: endPoint.x + endDir.dx * extendDistance, 
                                    y: endPoint.y 
                                };
                            } else {
                                // 终点是垂直方向，沿着方向延伸
                                lastWaypoint = { 
                                    x: endPoint.x, 
                                    y: endPoint.y + endDir.dy * extendDistance 
                                };
                            }
                            
                            // 在第一个航点和最后一个航点之间生成正交路径
                            if (startDir.dx !== 0 && endDir.dx !== 0) {
                                // 起点和终点都是水平方向
                                // 需要三个航点：第一个航点、中间航点、最后一个航点
                                // 路径：起点 → firstWaypoint(水平) → 中间点(垂直) → lastWaypoint(水平) → 终点(水平反方向)
                                waypoints.push(firstWaypoint);
                                waypoints.push({ x: firstWaypoint.x, y: lastWaypoint.y });
                                waypoints.push(lastWaypoint);
                            } else if (startDir.dy !== 0 && endDir.dy !== 0) {
                                // 起点和终点都是垂直方向
                                // 需要三个航点：第一个航点、中间航点、最后一个航点
                                // 路径：起点 → firstWaypoint(垂直) → 中间点(水平) → lastWaypoint(垂直) → 终点(垂直反方向)
                                waypoints.push(firstWaypoint);
                                waypoints.push({ x: lastWaypoint.x, y: firstWaypoint.y });
                                waypoints.push(lastWaypoint);
                            } else {
                                // 一个水平一个垂直
                                // 只需要一个航点
                                if (startDir.dx !== 0) {
                                    // 起点水平，终点垂直
                                    waypoints.push({ x: firstWaypoint.x, y: endPoint.y });
                                } else {
                                    // 起点垂直，终点水平
                                    waypoints.push({ x: endPoint.x, y: firstWaypoint.y });
                                }
                            }
                            
                            return waypoints;
                        }
                        
                        // 绘制自定义线段
                        function drawCustomLine(line, startPoint, endPoint, connectionData) {
                            const waypoints = connectionData && connectionData.waypoints ? connectionData.waypoints : [];
                            
                            if (connectionData) {
                                connectionData.waypointCount = waypoints.length;
                                const el = document.getElementById('connection-waypoint-count');
                                if (el) el.textContent = waypoints.length;
                            }
                            
                            clearWaypoints(line);
                            
                            const lineColor = connectionData ? connectionData.color : '#6366f1';
                            let prevPoint = startPoint;
                            
                            waypoints.forEach(wp => {
                                const segment = document.createElement('div');
                                segment.className = 'connection-segment custom-segment';
                                segment.style.position = 'absolute';
                                segment.style.backgroundColor = lineColor;
                                segment.style.zIndex = '999';
                                
                                const dx = wp.x - prevPoint.x;
                                const dy = wp.y - prevPoint.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                                
                                segment.style.width = distance + 'px';
                                segment.style.height = '3px';
                                segment.style.left = prevPoint.x + 'px';
                                segment.style.top = prevPoint.y + 'px';
                                segment.style.transformOrigin = '0 50%';
                                segment.style.transform = `rotate(${angle}deg)`;
                                segment.style.borderRadius = '1.5px';
                                
                                // 为线段添加点击事件
                                segment.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    line.dispatchEvent(new MouseEvent('click', {
                                        ctrlKey: e.ctrlKey,
                                        clientX: e.clientX,
                                        clientY: e.clientY
                                    }));
                                });
                                
                                line.appendChild(segment);
                                prevPoint = { x: wp.x, y: wp.y };
                            });
                            
                            const lastSegment = document.createElement('div');
                            lastSegment.className = 'connection-segment custom-segment';
                            lastSegment.style.position = 'absolute';
                            lastSegment.style.backgroundColor = lineColor;
                            lastSegment.style.zIndex = '999';
                            
                            const finalDx = endPoint.x - prevPoint.x;
                            const finalDy = endPoint.y - prevPoint.y;
                            const finalDistance = Math.sqrt(finalDx * finalDx + finalDy * finalDy);
                            const finalAngle = Math.atan2(finalDy, finalDx) * 180 / Math.PI;
                            
                            lastSegment.style.width = finalDistance + 'px';
                            lastSegment.style.height = '3px';
                            lastSegment.style.left = prevPoint.x + 'px';
                            lastSegment.style.top = prevPoint.y + 'px';
                            lastSegment.style.transformOrigin = '0 50%';
                            lastSegment.style.transform = `rotate(${finalAngle}deg)`;
                            lastSegment.style.borderRadius = '1.5px';
                            
                            // 为最后一个线段添加点击事件
                            lastSegment.addEventListener('click', function(e) {
                                e.stopPropagation();
                                line.dispatchEvent(new MouseEvent('click', {
                                    ctrlKey: e.ctrlKey,
                                    clientX: e.clientX,
                                    clientY: e.clientY
                                }));
                            });
                            
                            line.appendChild(lastSegment);
                            
                            // 主连接线元素不响应点击，只让子线段响应
                            line.style.pointerEvents = 'none';
                            // 保持位置在原点，子元素相对于canvasContainer定位
                            line.style.left = '0';
                            line.style.top = '0';
                            line.style.width = '0';
                            line.style.height = '0';
                            line.style.backgroundColor = 'transparent';
                            
                            renderWaypointHandles(line, waypoints, connectionData);
                        }
                        
                        // 渲染航点手柄
                        function renderWaypointHandles(line, waypoints, connectionData) {
                            const existingHandles = line.querySelectorAll('.waypoint-handle');
                            existingHandles.forEach(h => h.remove());
                            
                            waypoints.forEach((wp, index) => {
                                const handle = document.createElement('div');
                                handle.className = 'waypoint-handle';
                                handle.style.position = 'absolute';
                                handle.style.width = '10px';
                                handle.style.height = '10px';
                                handle.style.backgroundColor = '#ffc107';
                                handle.style.border = '2px solid #fff';
                                handle.style.borderRadius = '50%';
                                handle.style.zIndex = '1001';
                                handle.style.cursor = 'move';
                                handle.style.left = (wp.x - 5) + 'px';
                                handle.style.top = (wp.y - 5) + 'px';
                                handle.style.boxShadow = '0 0 3px rgba(0,0,0,0.3)';
                                handle.dataset.waypointIndex = index;
                                
                                setupWaypointDrag(handle, line, index, connectionData);
                                
                                line.appendChild(handle);
                            });
                        }
                        
                        // 设置航点拖拽
                        function setupWaypointDrag(handle, line, index, connectionData) {
                            let isDragging = false;
                            let startX, startY;
                            
                            handle.addEventListener('mousedown', function(e) {
                                e.stopPropagation();
                                isDragging = true;
                                startX = e.clientX;
                                startY = e.clientY;
                                e.preventDefault();
                            });
                            
                            document.addEventListener('mousemove', function(e) {
                                if (!isDragging || !connectionData) return;
                                
                                const deltaX = (e.clientX - startX) / scale;
                                const deltaY = (e.clientY - startY) / scale;
                                
                                if (connectionData.waypoints[index]) {
                                    const newX = connectionData.waypoints[index].x + deltaX;
                                    const newY = connectionData.waypoints[index].y + deltaY;
                                    
                                    connectionData.waypoints[index].x = newX;
                                    connectionData.waypoints[index].y = newY;
                                    
                                    handle.style.left = (newX - 5) + 'px';
                                    handle.style.top = (newY - 5) + 'px';
                                    
                                    startX = e.clientX;
                                    startY = e.clientY;
                                    
                                    const sourceElement = document.querySelector(`[data-element-id="${connectionData.sourceId}"]`);
                                    const targetElement = document.querySelector(`[data-element-id="${connectionData.targetId}"]`);
                                    if (sourceElement && targetElement) {
                                        redrawConnectionLine(line, connectionData, sourceElement, null, targetElement, null);
                                    }
                                }
                            });
                            
                            document.addEventListener('mouseup', function() {
                                isDragging = false;
                            });
                        }
                        
                        // 重新绘制连接线
                        function redrawConnectionLine(line, connectionData, sourceElement, sourceInterfaceElement, targetElement, targetInterfaceElement) {
                            if (!connectionData) return;
                            
                            // 无论如何都尝试获取接口元素
                            let srcInterface = sourceInterfaceElement;
                            let tgtInterface = targetInterfaceElement;
                            
                            if (!srcInterface || !tgtInterface) {
                                const sourceInterfaceElements = sourceElement.querySelectorAll('.interface-element');
                                const targetInterfaceElements = targetElement.querySelectorAll('.interface-element');
                                
                                if (!srcInterface) {
                                    srcInterface = Array.from(sourceInterfaceElements).find(el => 
                                        el.querySelector('.interface-label').textContent === connectionData.sourceInterfaceName
                                    );
                                }
                                if (!tgtInterface) {
                                    tgtInterface = Array.from(targetInterfaceElements).find(el => 
                                        el.querySelector('.interface-label').textContent === connectionData.targetInterfaceName
                                    );
                                }
                            }
                            
                            // 确保line.connectionData与传入的connectionData一致
                            line.connectionData = connectionData;
                            
                            // 调用支持多种线类型的更新函数
                            updateInterfaceConnectionLine(line, sourceElement, srcInterface, targetElement, tgtInterface);
                        }
                        
                        // 清除航点元素
                        function clearWaypoints(line) {
                            // 清理存储在line.segments中的子线段
                            if (line.segments) {
                                line.segments.forEach(s => s.remove());
                                line.segments = [];
                            }
                            // 也清理直接添加到line中的子元素（兼容旧代码）
                            const segments = line.querySelectorAll('.connection-segment');
                            segments.forEach(s => s.remove());
                            const handles = line.querySelectorAll('.waypoint-handle');
                            handles.forEach(h => h.remove());
                        }
                        
                        // 更新所有受元素移动影响的连接线
                        function updateAffectedConnectionLines(elementId) {
                            if (!window.connectionData) return;
                            
                            // 查找与当前元素相关的所有连接线
                            const affectedConnections = window.connectionData.filter(conn => 
                                conn.sourceId === elementId || conn.targetId === elementId
                            );
                            
                            affectedConnections.forEach(conn => {
                                const lineElement = document.querySelector(`[data-connection-id="${conn.id}"]`);
                                if (lineElement) {
                                    const sourceElement = document.querySelector(`[data-element-id="${conn.sourceId}"]`);
                                    const targetElement = document.querySelector(`[data-element-id="${conn.targetId}"]`);
                                    if (sourceElement && targetElement) {
                                        // 获取接口元素
                                        const sourceInterfaceElements = sourceElement.querySelectorAll('.interface-element');
                                        const targetInterfaceElements = targetElement.querySelectorAll('.interface-element');
                                        
                                        // 通过接口名称查找对应的DOM元素
                                        const sourceInterfaceElement = Array.from(sourceInterfaceElements).find(el => 
                                            el.querySelector('.interface-label').textContent === conn.sourceInterfaceName
                                        );
                                        const targetInterfaceElement = Array.from(targetInterfaceElements).find(el => 
                                            el.querySelector('.interface-label').textContent === conn.targetInterfaceName
                                        );
                                        
                                        // 无论如何都调用 updateInterfaceConnectionLine
                                        updateInterfaceConnectionLine(lineElement, sourceElement, sourceInterfaceElement || null, targetElement, targetInterfaceElement || null);
                                    }
                                }
                            });
                        }
                        
                        // 添加ESC键监听以退出连接模式
                        document.addEventListener('keydown', function(event) {
                            if (event.key === 'Escape' && isConnectionMode) {
                                exitConnectionMode();
                            }
                        });
                        
                        // 添加窗口大小改变和元素移动时更新连接线的逻辑
                        function updateAllConnectionLines() {
                            if (!window.connectionData) return;
                            
                            const lines = document.querySelectorAll('.connection-line');
                            lines.forEach((line) => {
                                const connectionId = parseInt(line.dataset.connectionId);
                                const conn = window.connectionData.find(c => c.id === connectionId);
                                if (conn) {
                                    const { sourceId, targetId } = conn;
                                    const sourceElement = document.querySelector(`[data-element-id="${sourceId}"]`);
                                    const targetElement = document.querySelector(`[data-element-id="${targetId}"]`);
                                    
                                    if (sourceElement && targetElement) {
                                        const sourceInterfaceElements = sourceElement.querySelectorAll('.interface-element');
                                        const targetInterfaceElements = targetElement.querySelectorAll('.interface-element');
                                        
                                        const sourceInterfaceElement = Array.from(sourceInterfaceElements).find(el => 
                                            el.querySelector('.interface-label').textContent === conn.sourceInterfaceName
                                        );
                                        const targetInterfaceElement = Array.from(targetInterfaceElements).find(el => 
                                            el.querySelector('.interface-label').textContent === conn.targetInterfaceName
                                        );
                                        
                                        updateInterfaceConnectionLine(line, sourceElement, sourceInterfaceElement, targetElement, targetInterfaceElement);
                                    }
                                }
                            });
                        }
                        
                        // 监听窗口大小变化以更新连接线
                        window.addEventListener('resize', updateAllConnectionLines);
                        
                        // 在元素移动结束后更新连接线
                        // 将此函数添加到元素拖拽结束事件中
                        document.addEventListener('mouseup', function() {
                            if (isElementDragging) {
                                updateAllConnectionLines();
                            }
                        });
                        
                        // 修改元素的mousedown事件处理，在连接模式下阻止默认行为
                        
                        
                        // 使用Promise等待数据加载完成后初始化
                        getcomponent()
                            .then(() => {
                                // console.log('elementTypes数据加载完成');
                                generateElementTypesMenu(); // 生成元素类型菜单
                                initializeCtrlClickMenu(); // 初始化Ctrl+单击菜单
                                initializeCanvas();
                                updatePropertyPanel(); // 更新属性面板显示
                                setButtonReady(); // 恢复按钮为正常状态
                            })
                            .catch(error => {
                                console.error('加载elementTypes数据失败:', error);
                                addButton.innerHTML = '<i class="fa fa-exclamation-triangle"></i><span>加载失败</span>';
                            });

                    });
            </script>
        </div>

    </div>
    
    <!-- 页脚容器 -->
    <div id="footer-container"></div>
    
    <script src="../js/load-components.js"></script>
    <script src="../js/function-link-manager.js"></script>
    <script src="../js/Visit_Monitor.js"></script>
</body>
