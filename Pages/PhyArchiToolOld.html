<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理架构大厅-达客智驾领航员</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <!-- <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet"> -->
    <link href="../css/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="../css/fonts/local-fonts.css" rel="stylesheet">
    <script src="../js/ipcontroller.js"></script>  
    <script src="../js/load-duck-assistant.js"></script>
    <script src="../js/HwElementType.js"></script>
    <style>
        /* 内容区域样式调整 */
        .main-content {
            padding-top: 64px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        .content-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* 强制左右div使用正确的宽度 */
        #architeah {
            width: 25% !important;
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-all;
        }
        
        #archidemo {
            width: 75% !important;
            min-width: 0;
        }
    </style>
</head>
<body class="bg-dark bg-grid text-gray-100 font-inter min-h-screen flex flex-col bg-grid w-full h-full p-0 m-0">
    <!-- 导航栏容器 --> 
    <div id="navbar-container" style="position: fixed; top: 0; left: 0; right: 0; z-index: 50;"></div>
    
    <!-- 主内容区域 -->
    <div class="main-content w-full flex-1">
        <!-- 内容容器 -->
        <div class="content-container rounded-lg overflow-hidden border border-primary/30 cyber-border flex-1">
            <div class="flex h-full flex-nowrap w-full">
                <div id="architeah" class="h-full bg-dark-light border border-primary/30 p-2 overflow-y-auto">
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="text-sm font-bold text-white">元素属性</h4>
                        <button id="apply-properties" class="bg-primary text-white px-2 py-1 rounded hover:bg-primary/80 transition-colors text-xs">应用</button>
                    </div>
                    <div id="no-selection" class="text-center text-gray-400 py-2">
                        <p class="text-xs">请选择元素</p>
                    </div>
                    <div id="element-properties" class="hidden">
                        <div class="mb-1 flex items-center">
                            <label class="text-xs font-medium text-gray-300 w-10">ID:</label>
                            <span id="element-id" class="flex-1 bg-dark-light rounded p-1 text-xs text-gray-100"></span>
                        </div>
                        <div class="mb-1 flex items-center">
                            <label class="text-xs font-medium text-gray-300 w-10">类型:</label>
                            <span id="element-type" class="flex-1 bg-dark-light border rounded p-1 text-xs text-gray-100"></span>
                        </div>
                        <div class="mb-1 flex items-center">
                            <label for="element-name" class="text-xs font-medium text-gray-300 w-10">名称:</label>
                            <input id="element-name" type="text" class="flex-1 bg-dark border border-primary/30 rounded p-1 text-xs text-gray-100">
                        </div>
                        <div class="mb-2 flex items-center">
                            <label for="element-color" class="text-xs font-medium text-gray-300 w-10">颜色:</label>
                            <input id="element-color" type="color" class="w-10 h-6 bg-dark border border-primary/30 rounded p-0">
                        </div>
                        <!-- 接口信息显示区域 -->
                        <div id="interface-group-container" class="mt-2 pt-2 border-t border-gray-600 hidden">
                            <h5 class="text-xs font-bold text-white mb-2">
                                接口配置
                            </h5>
                            <div id="interface-list" class="text-xs text-gray-300 space-y-2"></div>
                        </div>
                    </div>
                    
                    <!-- 连接线属性面板 -->
                    <div id="connection-properties" class="hidden">
                        <div class="mb-1 flex items-center">
                            <label class="text-xs font-medium text-gray-300 w-10">ID:</label>
                            <span id="connection-id" class="flex-1 bg-dark-light rounded p-1 text-xs text-gray-100"></span>
                        </div>
                        <div class="mb-1 flex items-center">
                            <label class="text-xs font-medium text-gray-300 w-10">源:</label>
                            <span id="connection-source" class="flex-1 bg-dark-light rounded p-1 text-xs text-gray-100"></span>
                        </div>
                        <div class="mb-1 flex items-center">
                            <label class="text-xs font-medium text-gray-300 w-10">目标:</label>
                            <span id="connection-target" class="flex-1 bg-dark-light rounded p-1 text-xs text-gray-100"></span>
                        </div>
                        <div class="mb-1 flex items-center">
                            <label for="connection-direction" class="text-xs font-medium text-gray-300 w-10">方向:</label>
                            <select id="connection-direction" class="flex-1 bg-dark border border-primary/30 rounded p-1 text-xs text-gray-100">
                                <option value="单向">单向</option>
                                <option value="双向">双向</option>
                            </select>
                        </div>
                        <div class="mb-1 flex items-center">
                            <label for="connection-line-type" class="text-xs font-medium text-gray-300 w-10">线形状:</label>
                            <select id="connection-line-type" class="flex-1 bg-dark border border-primary/30 rounded p-1 text-xs text-gray-100">
                                <option value="auto-straight">自动直线</option>
                                <option value="auto-polyline">自动折线</option>
                                <option value="custom">自定义线段</option>
                            </select>
                        </div>
                        <div class="mb-1 flex items-center">
                            <label class="text-xs font-medium text-gray-300 w-10">航点数:</label>
                            <span id="connection-waypoint-count" class="flex-1 bg-dark-light rounded p-1 text-xs text-gray-100">0</span>
                        </div>
                        <div class="mb-1 flex items-center">
                            <label for="connection-color" class="text-xs font-medium text-gray-300 w-10">颜色:</label>
                            <input id="connection-color" type="color" class="w-10 h-6 bg-dark border border-primary/30 rounded p-0" value="#6366f1">
                        </div>
                        <div class="mb-2 flex items-center">
                            <label for="connection-type" class="text-xs font-medium text-gray-300 w-10">类型:</label>
                            <input id="connection-type" type="text" class="flex-1 bg-dark border border-primary/30 rounded p-1 text-xs text-gray-100" value="GPIO">
                        </div>
                    </div>
                </div>

                <div id="archidemo" class="h-full bg-transparent border border-primary/30 relative overflow-hidden">
                    <!-- 虚拟画布容器 -->
                    <div id="canvas-container" class="absolute top-0 left-0 w-[10000px] h-[10000px] bg-white">
                        <!-- 网格背景将通过CSS实现 -->
                    </div>
                    
                    <!-- 添加按钮 -->
                <div id="add-button-container" class="absolute top-4 left-4 z-10">
                    <div class="relative">
                        <button id="add-button" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/80 transition-colors flex items-center gap-2">
                            <i class="fa fa-plus"></i>
                            <span>添加</span>
                        </button>
                        <div id="shape-menu" class="absolute top-full left-0 mt-1 bg-white text-gray-800 rounded-md shadow-lg hidden z-20">
                            <!-- 元素类型选项将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
                </div>
            </div>
            <style>
                /* 网格背景 */
                #canvas-container {
                    background-image: linear-gradient(#e0e0e0 1px, transparent 1px),
                                    linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
                    background-size: 20px 20px;
                    transform-origin: 0 0;
                }
                
                /* 画布视图 */
                #archidemo {
                    position: relative;
                    width: 100%;
                    height: 100%;
                }
                
                /* 元素样式 */
                .canvas-element {                        
                    position: absolute;                        
                    cursor: move;                        
                    user-select: none;                        
                    display: flex;                        
                    align-items: center;                        
                    justify-content: center;                        
                    color: white;                        
                    font-size: 10px;                        
                    font-weight: bold;                    
                }                    
                
                /* 元素ID标签 */
                .element-id {
                    position: absolute;
                    top: 0px;
                    left: 50%;
                    transform: translateX(-50%);
                    white-space: nowrap;
                    pointer-events: none;
                }
                
                /* 顶点控制点样式 */
                .vertex-control {
                    position: absolute;
                    width: 10px;
                    height: 10px;
                    background-color: white;
                    border: 1px solid #000;
                    border-radius: 50%;
                    transform: translate(-50%, -50%);
                    cursor: pointer;
                    z-index: 10;
                }
                
                .vertex-control:hover {
                    background-color: #ffaa00;
                }
            </style>
                
            <script>
                // 页面加载是顺序执行
                document.addEventListener('DOMContentLoaded', function() {
                    // 获取DOM元素
                    const archidemo = document.getElementById('archidemo');
                    const canvasContainer = document.getElementById('canvas-container');
                    const addButton = document.getElementById('add-button');
                    const shapeMenu = document.getElementById('shape-menu');

                    // 设置按钮为加载中状态
                    function setButtonLoading() {
                        addButton.disabled = true;
                        addButton.classList.add('opacity-50', 'cursor-not-allowed');
                        addButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i><span>加载中...</span>';
                    }

                    // 恢复按钮为正常状态
                    function setButtonReady() {
                        addButton.disabled = false;
                        addButton.classList.remove('opacity-50', 'cursor-not-allowed');
                        addButton.innerHTML = '<i class="fa fa-plus"></i><span>添加</span>';
                    }

                    // 页面加载时立即设置按钮为加载状态
                    setButtonLoading();

                    // 动态生成元素类型选项
                    function generateElementTypesMenu() {
                        // 清空菜单
                        shapeMenu.innerHTML = '';
                        // 遍历elementTypes对象生成选项
                        for (const typeName in elementTypes) {
                            if (elementTypes.hasOwnProperty(typeName)) {
                                const typeInfo = elementTypes[typeName];
                                
                                // 检查是否有子选项
                                if (typeInfo.subTypes) {
                                    // 创建带有子菜单的父项目
                                    const parentItem = document.createElement('div');
                                    parentItem.id = `add-${typeName}`;
                                    parentItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer flex justify-between items-center';
                                    
                                    const textSpan = document.createElement('span');
                                    textSpan.textContent = typeName;
                                    parentItem.appendChild(textSpan);
                                    
                                    const arrowSpan = document.createElement('span');
                                    arrowSpan.className = 'fa fa-chevron-right text-xs';
                                    parentItem.appendChild(arrowSpan);
                                    // 创建子菜单容器（二级菜单）
                                    const subMenu = document.createElement('div');
                                    subMenu.className = 'absolute left-full top-0 w-48 bg-white text-gray-800 rounded-md shadow-lg hidden z-30';
                                    // 检查子选项是对象（三层菜单）还是数组（二层菜单）
                                    if (typeof typeInfo.subTypes === 'object') {
                                        // 三层菜单结构：处理对象格式的子选项
                                        for (const secondLevelName in typeInfo.subTypes) {
                                            if (typeInfo.subTypes.hasOwnProperty(secondLevelName)) {
                                                const thirdLevelItems = typeInfo.subTypes[secondLevelName];
                                                
                                                // 创建二级菜单项
                                                const secondLevelItem = document.createElement('div');
                                                secondLevelItem.id = `add-${typeName}-${secondLevelName}`;
                                                secondLevelItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer flex justify-between items-center relative';
                                                secondLevelItem.textContent = secondLevelName;
                                                
                                                // 添加向右箭头
                                                const secondArrow = document.createElement('span');
                                                secondArrow.className = 'fa fa-chevron-right text-xs';
                                                secondLevelItem.appendChild(secondArrow);
                                                
                                                // 创建三级菜单容器
                                                const thirdLevelMenu = document.createElement('div');
                                                thirdLevelMenu.className = 'absolute left-full top-0 w-48 bg-white text-gray-800 rounded-md shadow-lg hidden z-40';
                                                // 为每个三级选项创建条目
                                                thirdLevelItems.forEach((thirdLevelItem, index) => {
                                                    const thirdItem = document.createElement('div');
                                                    const thirdLevelValue = thirdLevelItem.Name || `型号${index + 1}`; // 获取P属性值或使用默认值
                                                    thirdItem.id = `add-${typeName}-${secondLevelName}-${thirdLevelValue}`;
                                                    thirdItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                                                    thirdItem.textContent = thirdLevelValue;
                                                    
                                                    // 为三级选项添加点击事件处理
                                                    thirdItem.addEventListener('click', function() {
                                                        // 创建子类型的临时信息对象，继承父类型的所有属性
                                                        const subTypeInfo = {...typeInfo};
                                                        const elementcontent = typeInfo.subTypes[secondLevelName];
                                                        elementcontent.forEach(element => {
                                                            if (element.Name === thirdLevelValue) {
                                                                subTypeInfo.properties = element;
                                                                // 打印SoC的properties属性
                                                                

                                                                

                                                                // subTypeinfo.delete(subTypes);
                                                            }
                                                        });
                                                        // 根据形状生成元素
                                                        const itemShape = typeInfo.shape;
                                                        if (itemShape === 'circle') {
                                                            generateCircle(subTypeInfo,3);
                                                        } else if (itemShape === 'square') {
                                                            generateSquare(subTypeInfo,3);
                                                        } else if (itemShape === 'rectangle') {
                                                            generateRectangle(subTypeInfo,3);
                                                        }
                                                        
                                                        
                                                        // 关闭所有菜单
                                                        shapeMenu.classList.add('hidden');
                                                        // 确保所有子菜单都关闭
                                                        document.querySelectorAll('#shape-menu .hidden').forEach(menu => {
                                                            menu.classList.add('hidden');
                                                        });
                                                    });
                                                    
                                                    thirdLevelMenu.appendChild(thirdItem);
                                                });
                                                
                                                // 为二级菜单项添加点击事件以切换三级菜单显示
                                                secondLevelItem.addEventListener('click', function(e) {
                                                    e.stopPropagation();
                                                    // 关闭其他所有三级菜单
                                                    document.querySelectorAll('#shape-menu .z-40').forEach(menu => {
                                                        if (menu !== thirdLevelMenu) {
                                                            menu.classList.add('hidden');
                                                        }
                                                    });
                                                    // 切换当前三级菜单显示状态
                                                    thirdLevelMenu.classList.toggle('hidden');
                                                });
                                                
                                                // 将三级菜单添加到二级菜单项中
                                                secondLevelItem.appendChild(thirdLevelMenu);
                                                subMenu.appendChild(secondLevelItem);
                                            }
                                        }
                                    } else if (Array.isArray(typeInfo.subTypes)) {
                                        // 二层菜单结构：处理数组格式的子选项
                                        typeInfo.subTypes.forEach(subTypeName => {
                                            const subItem = document.createElement('div');
                                            subItem.id = `add-${typeName}-${subTypeName}`;
                                            subItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                                            subItem.textContent = subTypeName;
                                            
                                            // 为子选项添加点击事件处理
                                            subItem.addEventListener('click', function() {
                                                // 创建子类型的临时信息对象，继承父类型的所有属性
                                                const subTypeInfo = {...typeInfo};
                                                
                                                // 根据形状生成元素
                                                const itemShape = typeInfo.shape;
                                                if (itemShape === 'circle') {
                                                    generateCircle(subTypeInfo,2);
                                                } else if (itemShape === 'square') {
                                                    
                                                    generateSquare(subTypeInfo,2);
                                                } else if (itemShape === 'rectangle') {
                                                    generateRectangle(subTypeInfo,2);
                                                }
                                                                                                
                                                // 关闭所有菜单
                                                shapeMenu.classList.add('hidden');
                                            });
                                            
                                            subMenu.appendChild(subItem);
                                        });
                                    }
                                    
                                    // 为父项添加点击事件以切换子菜单显示
                                    parentItem.addEventListener('click', function(e) {
                                        e.stopPropagation();
                                        // 关闭其他所有二级菜单
                                        document.querySelectorAll('#shape-menu .z-30').forEach(menu => {
                                            if (menu !== subMenu) {
                                                menu.classList.add('hidden');
                                            }
                                        });
                                        // 关闭所有三级菜单
                                        document.querySelectorAll('#shape-menu .z-40').forEach(menu => {
                                            menu.classList.add('hidden');
                                        });
                                        // 切换当前子菜单显示状态
                                        subMenu.classList.toggle('hidden');
                                    });
                                    
                                    // 将子菜单添加到父项中
                                    parentItem.appendChild(subMenu);
                                    shapeMenu.appendChild(parentItem);
                                } else {
                                    // 没有子选项的普通项目
                                    const typeItem = document.createElement('div');
                                    typeItem.id = `add-${typeName}`;
                                    typeItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                                    typeItem.textContent = typeName;
                                    
                                    // 添加点击事件处理
                                    typeItem.addEventListener('click', function() {
                                        const iteminfo = elementTypes[typeName];
                                        const itemShape = elementTypes[typeName].shape;
                                        if (itemShape === 'circle') {
                                            generateCircle(iteminfo,1);
                                        } else if (itemShape === 'square') {
                                            generateSquare(iteminfo,1);
                                        } else if (itemShape === 'rectangle') {
                                            generateRectangle(iteminfo,1);
                                        }
                                        shapeMenu.classList.add('hidden');
                                    });
                                    
                                    shapeMenu.appendChild(typeItem);
                                }
                            }
                        }
                    }
                    
                    // 设置初始画布位置和缩放
                    let scale = 1;
                    let offsetX = 0;
                    let offsetY = 0;
                    let isDragging = false; // 画布拖拽标志
                    let isElementDragging = false; // 元素拖拽标志
                    let dragStartX = 0;
                    let dragStartY = 0;
                    let elements = []; // 存储DOM元素
                    let elementData = []; // 存储元素数据
                    let activeElement = null;
                    let activeElementData = null;
                    let isApplyingProperties = false; // 标志位：是否正在应用属性
                    let elementDragStartX = 0;
                    let elementDragStartY = 0;
                    let elementIdCounter = 1; // ID计数器
                    let zIndexCounter = 100; // 全局z-index计数器，确保新元素总是在最上方
                    
                    // 更新画布变换
                    function updateCanvasTransform() {
                        canvasContainer.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
                    }
                    
                    // 初始化画布位置（居中显示一部分）
                    function initializeCanvas() {
                        const containerWidth = 500;
                        const containerHeight = 500;
                        offsetX = -4750 * scale + containerWidth / 2;
                        offsetY = -4750 * scale + containerHeight / 2;
                        updateCanvasTransform();
                    }
                    
                    // 添加长方形元素
                    function createRectangle(iteminfo,layer) {
                        const interface_gap = 50;
                        const interface_height = 20;
                        const margin = 50;
                        const rectangle = document.createElement('div');
                        rectangle.className = 'canvas-element rectangle';
                        const left = 5000 + 50; // 画布中央+横向偏移50,50
                        const top = 5000 + 50;
                        width = iteminfo.width; // 默认宽度
                        height = iteminfo.height; // 默认高度

                        // 创建元素数据
                        const id = elementIdCounter++;

                        if(layer === 1) {
                            name = 'element'+id; // 默认名称为"element"加ID
                            properties = {};
                        } else if (layer === 2) {
                            name = 'element'+id; // 默认名称为"element"加ID
                            properties = {};
                        }else if (layer === 3) {
                            const baseName = iteminfo.properties.Name;
                            // 检查是否已有同名元素，计算编号
                            let count = 0;
                            elementData.forEach(item => {
                                if (item.name === baseName || item.name.startsWith(baseName + '-')) {
                                    count++;
                                }
                            });
                            // 如果有重复，添加编号
                            name = count === 0 ? baseName : `${baseName}-${count}`;
                            properties = JSON.parse(JSON.stringify(iteminfo.properties));
                            // 保存原始默认高度
                            properties.defaultHeight = iteminfo.height;
                            
                            // 生成 interface_list
                            properties.interface_list = [];
                            if (properties.interface_group) {
                                const subTypeCounts = {}; // 用于统计每个子类型的数量
                                for (const key in properties.interface_group) {
                                    if (Array.isArray(properties.interface_group[key])) {
                                        properties.interface_group[key].forEach(item => {
                                            const maxNum = item.Interface_Number || 1;
                                            
                                            for (let i = 0; i < maxNum; i++) {
                                                const subType = item.SubType || key;
                                                if (!subTypeCounts[subType]) {
                                                    subTypeCounts[subType] = 0;
                                                }
                                                subTypeCounts[subType]++;
                                                
                                                const interfaceName = `${subType} - ${subTypeCounts[subType]}`;
                                                properties.interface_list.push({
                                                    name: interfaceName,
                                                    type: key,
                                                    subType: subType,
                                                    enabled: false,
                                                    connection: null
                                                });
                                            }
                                        });
                                    }
                                }
                            }
                            
                            // 初始高度使用默认高度，不根据接口计算
                            height = iteminfo.height;
                        }

                        rectangle.style.left = left + 'px';
                        rectangle.style.top = top + 'px';
                        rectangle.style.width = width + 'px';
                        rectangle.style.height = height + 'px';
                        rectangle.style.zIndex = zIndexCounter++; // 确保新元素在最上方
                        const data = {
                            id: id, // 顺序生成ID
                            type: 'rectangle',
                            ItemType: iteminfo.type,
                            name: name,
                            position: {
                                x: left,
                                y: top
                            },
                            properties: properties,
                            relativePosition: null, // 相对父元素的位置，null表示无相对位置
                            width: width,
                            height: height,
                            color: iteminfo.color, // 绿色
                            children: [], // 子元素ID数组
                            parent: '/' // 父元素ID，无父元素时为"/"
                        };
                        // 将数据与元素关联
                                                // 将数据与元素关联
                        rectangle.dataset.elementId = data.id;
                        // 创建名称标签
                        const idLabel = document.createElement('div');
                        idLabel.className = 'element-id';
                        idLabel.textContent = data.ItemType+":"+data.name;
                        rectangle.appendChild(idLabel);
                        canvasContainer.appendChild(rectangle);
                        elements.push(rectangle);
                        elementData.push(data);
                         
                        // 设置元素拖拽
                        setupElementDrag(rectangle, data);
                        // 设置顶点控制
                        setupVertexControls(rectangle, data);
                        // 当layer为3时，不自动生成接口子元素（初始数量为0，由用户在属性面板配置）
                        
                        // 新创建的元素自动选中
                        activeElement = rectangle;
                        activeElementData = data;
                          
                        return rectangle; // 返回创建的元素
                    }
                    
                    // 添加圆形元素
                    function createCircle(iteminfo,layer) {
                        const circle = document.createElement('div');
                        circle.className = 'canvas-element circle';
                        const left = 5000 + 50; // 画布中央+横向偏移50,50
                        const top = 5000 + 50;
                        const radius = iteminfo.radius; // 默认半径
                         
                        circle.style.left = left + 'px';

                        };
                         
                        // 将数据与元素关联
                        circle.dataset.elementId = data.id;

                    // 检查一个元素是否完全包含另一个元素
                    function isElementFullyContained(childElement, childData, parentElement, parentData) {
                        // 获取子元素的边界
                        const childLeft = parseFloat(childElement.style.left || 0);
                        const childTop = parseFloat(childElement.style.top || 0);
                        let childRight, childBottom;
                        
                        // 根据子元素类型计算右下角坐标
                        if (childData.type === 'circle') {
                            childRight = childLeft + childData.radius * 2;
                            childBottom = childTop + childData.radius * 2;
                        } else if (childData.type === 'rectangle') {
                            childRight = childLeft + childData.width;
                            childBottom = childTop + childData.height;
                        } else { // square
                            childRight = childLeft + childData.size;
                            childBottom = childTop + childData.size;
                        }
                        
                        // 获取父元素的边界
                        const parentLeft = parseFloat(parentElement.style.left || 0);
                        const parentTop = parseFloat(parentElement.style.top || 0);
                        let parentRight, parentBottom;
                        
                        // 根据父元素类型计算右下角坐标
                        if (parentData.type === 'circle') {
                            parentRight = parentLeft + parentData.radius * 2;
                            parentBottom = parentTop + parentData.radius * 2;
                        } else if (parentData.type === 'rectangle') {
                            parentRight = parentLeft + parentData.width;
                            parentBottom = parentTop + parentData.height;
                        } else { // square
                            parentRight = parentLeft + parentData.size;
                            parentBottom = parentTop + parentData.size;
                        }
                        
                        // 检查子元素是否完全在父元素内部
                        return childLeft >= parentLeft && 
                                childTop >= parentTop && 
                                childRight <= parentRight && 
                                childBottom <= parentBottom;
                    }
                    
                    // 清除所有元素的紫色高亮
                    function clearPurpleHighlights() {
                        elements.forEach(el => {
                            if (el.dataset.originalBorder) {
                                el.style.border = el.dataset.originalBorder;
                                delete el.dataset.originalBorder;
                            }
                        });
                    }
                    
                    // 更新子元素位置函数（递归更新所有层级）
                    function updateChildrenPositions(parentId) {
                        const parentData = elementData.find(data => data.id === parentId);
                        if (!parentData || !parentData.children || parentData.children.length === 0) {
                            return;
                        }
                        
                        // 计算父元素的中心点
                        const parentElement = elements.find(el => parseInt(el.dataset.elementId) === parentId);
                        if (!parentElement) return;
                        
                        const parentLeft = parseFloat(parentElement.style.left || 0);
                        const parentTop = parseFloat(parentElement.style.top || 0);
                        let parentCenterX, parentCenterY;
                        
                        if (parentData.type === 'circle') {
                            parentCenterX = parentLeft + parentData.radius;
                            parentCenterY = parentTop + parentData.radius;
                        } else if (parentData.type === 'rectangle') {
                            parentCenterX = parentLeft + parentData.width / 2;
                            parentCenterY = parentTop + parentData.height / 2;
                        } else { // square
                            parentCenterX = parentLeft + parentData.size / 2;
                            parentCenterY = parentTop + parentData.size / 2;
                        }
                        
                        // 递归更新所有子元素的位置
                        parentData.children.forEach(childId => {
                            const childData = elementData.find(data => data.id === childId);
                            const childElement = elements.find(el => parseInt(el.dataset.elementId) === childId);
                            
                            if (childData && childElement && childData.relativePosition) {
                                // 根据相对位置计算新的子元素中心位置
                                const newChildCenterX = parentCenterX + childData.relativePosition.x;
                                const newChildCenterY = parentCenterY + childData.relativePosition.y;
                                
                                // 计算子元素的左上角位置
                                let newChildLeft, newChildTop;
                                if (childData.type === 'circle') {
                                    newChildLeft = newChildCenterX - childData.radius;
                                    newChildTop = newChildCenterY - childData.radius;
                                } else if (childData.type === 'rectangle') {
                                    newChildLeft = newChildCenterX - childData.width / 2;
                                    newChildTop = newChildCenterY - childData.height / 2;
                                } else { // square
                                    newChildLeft = newChildCenterX - childData.size / 2;
                                    newChildTop = newChildCenterY - childData.size / 2;
                                }
                                
                                // 更新子元素位置
                                childElement.style.left = newChildLeft + 'px';
                                childElement.style.top = newChildTop + 'px';
                                
                                // 更新子元素数据
                                childData.position.x = newChildLeft;
                                childData.position.y = newChildTop;
                            }
                            
                            // 递归更新子元素的子元素（直到最底层）
                            updateChildrenPositions(childId);
                        });
                    }
                    
                    // 设置元素拖拽
                        function setupElementDrag(element, data) {
                            // 确保初始边框不是紫色
                            if (!element.style.border) {
                                element.style.border = '1px solid #000'; // 设置默认黑色边框
                            }
                            
                            // 鼠标悬停时显示控制点
                            element.addEventListener('mouseenter', function() {
                                const controls = element.querySelectorAll('.vertex-control');
                                controls.forEach(control => {
                                    control.style.display = 'block';
                                });
                            });
                            
                        // 鼠标离开时隐藏控制点
                        element.addEventListener('mouseleave', function() {
                            // 如果没有正在拖拽控制点，则隐藏
                            if (!element.classList.contains('dragging-control')) {
                                const controls = element.querySelectorAll('.vertex-control');
                                controls.forEach(control => {
                                    control.style.display = 'none';
                                });
                            }
                        });
                            
                        element.addEventListener('mousedown', function(e) {
                        // 如果点击的是顶点控制点，不执行元素拖拽
                        if (e.target.classList.contains('vertex-control')) {
                            return;
                        }
                            
                        // 连接模式相关变量 - 提升到更外层作用域
                        let isConnectionMode = false;
                        let connectionSourceId = null;
                        let connectionPrompt = null;
                        if (isConnectionMode) {
                            e.preventDefault();
                            e.stopPropagation();
                            return;
                        }
                            
                            
                        // 检查是否是Ctrl+单击触发菜单
                        if (e.ctrlKey) {
                            // 先移除之前选中元素的光晕效果
                            if (activeElement && activeElement !== element) {
                                activeElement.style.boxShadow = '';
                            }
                            
                            // 选中当前元素
                            activeElement = element;
                            const latestData = elementData.find(d => d.id === data.id);
                            activeElementData = latestData || data;
                            updatePropertyPanel();
                            
                            // 添加黄色光晕选中效果
                            element.style.boxShadow = '0 0 15px 5px rgba(255, 200, 0, 0.6)';
                            
                            // 显示菜单
                            const contextMenu = document.getElementById('element-context-menu');
                            if (contextMenu) {
                                contextMenu.style.left = e.clientX + 'px';
                                contextMenu.style.top = e.clientY + 'px';
                                contextMenu.classList.remove('hidden');
                            } else {
                                console.error('未找到菜单元素！');
                            }
                            
                            // 阻止默认行为和事件冒泡
                            e.preventDefault();
                            e.stopPropagation();
                            return; // 不执行后续的拖拽逻辑
                        }
                            
                        e.stopPropagation(); // 阻止事件冒泡到画布
                        
                        // 先移除之前选中元素的光晕效果
                        if (activeElement && activeElement !== element) {
                            activeElement.style.boxShadow = '';
                        }
                        
                        activeElement = element;
                        // 从 elementData 数组中获取最新的数据，确保接口配置不丢失
                        const latestData = elementData.find(d => d.id === data.id);
                        activeElementData = latestData || data;
                        updatePropertyPanel();
                        isElementDragging = true; // 设置元素拖拽标志
                        
                        // 添加黄色光晕选中效果
                        element.style.boxShadow = '0 0 15px 5px rgba(255, 200, 0, 0.6)';
                            
                        // 获取元素当前位置（已考虑画布缩放和偏移）
                        const currentLeft = parseFloat(element.style.left || 0);
                        const currentTop = parseFloat(element.style.top || 0);
                            
                        // 计算鼠标相对于画布容器的位置（考虑缩放）
                        const rect = archidemo.getBoundingClientRect();
                        const mouseX = (e.clientX - rect.left - offsetX) / scale;
                        const mouseY = (e.clientY - rect.top - offsetY) / scale;
                            
                        // 计算鼠标相对于元素左上角的偏移
                        elementDragStartX = currentLeft - mouseX;
                        elementDragStartY = currentTop - mouseY;
                            
                        // 添加选中样式
                        element.style.opacity = '0.7';
                        
                    });
                    }
                    
                    // 设置顶点控制
                    function setupVertexControls(element, data) {
                        // 先清除可能已存在的控制点
                        const existingControls = element.querySelectorAll('.vertex-control');
                        existingControls.forEach(control => control.remove());
                            
                        // 为圆形添加两个控制点（右侧和顶侧）
                        if (data.type === 'circle') {
                            const radius = data.radius || 20;
                                
                            // 右侧控制点
                            const rightControl = document.createElement('div');
                            rightControl.className = 'vertex-control';
                            rightControl.dataset.handle = 'radius-x';
                            rightControl.style.position = 'absolute';
                            rightControl.style.width = '10px';
                            rightControl.style.height = '10px';
                            rightControl.style.backgroundColor = 'white';
                            rightControl.style.border = '1px solid #000';
                            rightControl.style.borderRadius = '50%';
                            rightControl.style.left = '100%';
                            rightControl.style.top = '50%';
                            rightControl.style.transform = 'translate(-5px, -5px)'; // 修复右侧控制点位置，使其不超出圆形边界
                            rightControl.style.cursor = 'ew-resize';
                            rightControl.style.display = 'none'; // 初始隐藏
                            rightControl.style.zIndex = '10';
                                
                            // 顶侧控制点
                            const topControl = document.createElement('div');
                            topControl.className = 'vertex-control';
                            topControl.dataset.handle = 'radius-y';
                            topControl.style.position = 'absolute';
                            topControl.style.width = '10px';
                            topControl.style.height = '10px';
                            topControl.style.backgroundColor = 'white';
                            topControl.style.border = '1px solid #000';
                            topControl.style.borderRadius = '50%';
                            topControl.style.left = '50%';
                            topControl.style.top = '0';
                            topControl.style.transform = 'translate(-5px, -5px)'; // 调整为正确的中心点位置
                            topControl.style.cursor = 'ns-resize';
                            topControl.style.display = 'none'; // 初始隐藏
                            topControl.style.zIndex = '10';
                                
                            // 设置控制点拖拽
                            setupVertexDrag(rightControl, element, data);
                            setupVertexDrag(topControl, element, data);
                                
                            element.appendChild(rightControl);
                            element.appendChild(topControl);
                        }
                        // 为方形和长方形添加四个角的控制点
                        else if (data.type === 'square' || data.type === 'rectangle') {
                            const handles = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];
                            
                            handles.forEach(handle => {
                                const control = document.createElement('div');
                                control.className = 'vertex-control';
                                control.dataset.handle = handle;
                                control.style.position = 'absolute';
                                control.style.width = '10px';
                                control.style.height = '10px';
                                control.style.backgroundColor = 'white';
                                control.style.border = '1px solid #000';
                                control.style.borderRadius = '50%';
                                control.style.display = 'none'; // 初始隐藏
                                control.style.zIndex = '10';
                                
                                // 设置控制点位置
                                switch (handle) {
                                    case 'top-left':
                                        control.style.left = '0';
                                        control.style.top = '0';
                                        control.style.transform = 'translate(-5px, -5px)'; // 确保中心点在顶点
                                        control.style.cursor = 'nwse-resize';
                                        break;
                                    case 'top-right':
                                        control.style.right = '0';
                                        control.style.top = '0';
                                        control.style.transform = 'translate(5px, -5px)'; // 确保中心点在顶点
                                        control.style.cursor = 'nesw-resize';
                                        break;
                                    case 'bottom-left':
                                        control.style.left = '0';
                                        control.style.bottom = '0';
                                        control.style.transform = 'translate(-5px, 5px)'; // 确保中心点在顶点
                                        control.style.cursor = 'nesw-resize';
                                        break;
                                    case 'bottom-right':
                                        control.style.right = '0';
                                        control.style.bottom = '0';
                                        control.style.transform = 'translate(5px, 5px)'; // 确保中心点在顶点
                                        control.style.cursor = 'nwse-resize';
                                        break;
                                }
                                    
                                // 设置控制点拖拽
                                setupVertexDrag(control, element, data);
                                element.appendChild(control);
                            });
                        }
                    }
                    
                    // 设置顶点拖拽
                    function setupVertexDrag(control, element, data) {
                        control.addEventListener('mousedown', function(e) {
                            e.stopPropagation(); // 阻止事件冒泡到元素和画布
                                
                            activeElement = element;
                            const latestData = elementData.find(d => d.id === data.id);
                            activeElementData = latestData || data;
                            const handle = control.dataset.handle;
                                
                            // 标记正在拖拽控制点
                            element.classList.add('dragging-control');
                                
                            // 记录初始尺寸和中心点
                            let centerX, centerY;
                                
                            if (data.type === 'circle') {
                                // 计算圆心坐标（考虑元素位置和半径）
                                centerX = parseFloat(element.style.left || 0) + data.radius;
                                centerY = parseFloat(element.style.top || 0) + data.radius;
                            } else if (data.type === 'rectangle') {
                                // 计算长方形中心点
                                centerX = parseFloat(element.style.left || 0) + data.width / 2;
                                centerY = parseFloat(element.style.top || 0) + data.height / 2;
                            } else {
                                // 计算方形中心点
                                centerX = parseFloat(element.style.left || 0) + data.size / 2;
                                centerY = parseFloat(element.style.top || 0) + data.size / 2;
                            }
                                
                            // 获取鼠标在画布上的位置（考虑缩放和偏移）
                            const rect = archidemo.getBoundingClientRect();
                            const startX = e.clientX;
                            const startY = e.clientY;
                                
                            function onMouseMove(e) {
                                e.preventDefault();
                                    
                                // 计算鼠标在画布上的位置（考虑缩放和偏移）
                                const currentMouseX = (e.clientX - rect.left - offsetX) / scale;
                                const currentMouseY = (e.clientY - rect.top - offsetY) / scale;
                                    
                                if (data.type === 'circle') {
                                    // 根据不同的控制点调整尺寸
                                    if (handle === 'radius-x') {
                                        // 右侧控制点 - 水平方向调整
                                        const newRadius = Math.max(5, Math.abs(currentMouseX - centerX));
                                        data.radius = newRadius;
                                    } else if (handle === 'radius-y') {
                                        // 顶侧控制点 - 垂直方向调整
                                        const newRadius = Math.max(5, Math.abs(centerY - currentMouseY));
                                        data.radius = newRadius;
                                    }
                                        
                                    // 保持中心点不变
                                    const newLeft = centerX - data.radius;
                                    const newTop = centerY - data.radius;
                                        
                                    // 更新元素样式
                            element.style.width = (data.radius * 2) + 'px';
                            element.style.height = (data.radius * 2) + 'px';
                            element.style.left = newLeft + 'px';
                            element.style.top = newTop + 'px';
                            
                            // 更新元素数据
                            data.position.x = newLeft;
                            data.position.y = newTop;
                            
                            // 如果当前修改的是父元素，更新所有子元素的位置
                            if (data.children.length > 0) {
                                updateChildrenPositions(data.id);
                            }
                                        
                                    // 更新元素数据位置
                                    data.position.x = newLeft;
                                    data.position.y = newTop;
                                }
                                else {
                                    // 对于方形和长方形
                                    let newWidth, newHeight;
                                        
                                    if (data.type === 'rectangle') {
                                        // 根据不同的控制点调整尺寸
                                        switch (handle) {
                                            case 'top-left':
                                                newWidth = Math.max(5, (centerX + data.width / 2)- currentMouseX);
                                                newHeight = Math.max(5, (centerY + data.height / 2) - currentMouseY);
                                                break;
                                            case 'top-right':
                                                newWidth = Math.max(5, currentMouseX - (centerX - data.width / 2));
                                                newHeight = Math.max(5, (centerY + data.height / 2) - currentMouseY);
                                                break;

                                            case 'bottom-left':
                                                newWidth = Math.max(5, (centerX + data.width / 2)- currentMouseX);
                                                newHeight = Math.max(5, currentMouseY - (centerY - data.height / 2));
                                
                                                break;
                                            case 'bottom-right':
                                                newWidth = Math.max(5, currentMouseX - (centerX - data.width / 2));
                                                newHeight = Math.max(5, currentMouseY - (centerY - data.height / 2));
                                        
                                                break;

                                        }

                                    } else {
                                        // 方形处理逻辑
                                        let newSize;
                                        
                                        switch (handle) {
                                            case 'top-left':
                                                newSize = Math.max(5, 2 * Math.sqrt(
                                                    Math.pow(centerX - currentMouseX, 2) + 
                                                    Math.pow(centerY - currentMouseY, 2)
                                                ) / Math.sqrt(2)); // 除以sqrt(2)以补偿对角线长度

                                                break;
                                            case 'top-right':
                                                newSize = Math.max(5, 2 * Math.sqrt(
                                                    Math.pow(currentMouseX - centerX, 2) + 
                                                    Math.pow(centerY - currentMouseY, 2)
                                                ) / Math.sqrt(2));
                                                break;
                                            case 'bottom-left':
                                                newSize = Math.max(5, 2 * Math.sqrt(
                                                    Math.pow(centerX - currentMouseX, 2) + 
                                                    Math.pow(currentMouseY - centerY, 2)
                                                ) / Math.sqrt(2));
                                                break;
                                            case 'bottom-right':
                                                newSize = Math.max(5, 2 * Math.sqrt(
                                                    Math.pow(currentMouseX - centerX, 2) + 
                                                    Math.pow(currentMouseY - centerY, 2)
                                                ) / Math.sqrt(2));
                                                break;
                                        }
                                        
                                        // 保持中心点不变，计算新的位置
                                        const newLeft = centerX - newSize / 2;
                                        const newTop = centerY - newSize / 2;
                                        
                                        // 更新元素数据
                            data.size = newSize;
                            data.position.x = newLeft;
                            data.position.y = newTop;
                                
                            // 更新元素样式
                            element.style.width = newSize + 'px';
                            element.style.height = newSize + 'px';
                            element.style.left = newLeft + 'px';
                            element.style.top = newTop + 'px';
                            
                            // 如果当前修改的是父元素，更新所有子元素的位置
                            if (data.children.length > 0) {
                                updateChildrenPositions(data.id);
                            }
                                    }
                                    
                                    if (data.type === 'rectangle') {
                                        // 计算新的位置，保持中心点不变
                                        const newLeft = centerX - newWidth / 2;
                                        const newTop = centerY - newHeight / 2;
                                        
                                        // 更新元素数据
                            data.width = newWidth;
                            data.height = newHeight;
                            data.position.x = newLeft;
                            data.position.y = newTop;
                                
                            // 更新元素样式

                    // 刷新元素接口显示函数

                        if (!properties || !properties.interface_list) {
                            return;
                        }

                        const interface_height = 20;
                        const margin = 50;

                        activeElementData.height = newHeight;

                            interface_element.dataset.parentId = activeElementData.id;

                            activeElement.appendChild(interface_element);
                            
                            current_y += interface_height + interface_gap;
                        });

                    // 设置接口图形拖拽功能
                    function setupInterfaceDrag(interfaceElement, item, index, parentElement, parentData) {
                        let isDragging = false;
                        let startX, startY, startLeft, startTop;
                        const interface_width = 50;
                        const interface_height = 20;
                        
                        interfaceElement.addEventListener('mousedown', function(e) {
                            e.stopPropagation();
                            isDragging = true;
                            
                            // 清除之前选中元素的高亮效果（硬件或连接线）
                            if (activeElement) {
                                if (activeElement.classList.contains('canvas-element')) {
                                    activeElement.style.boxShadow = '';
                                } else if (activeElement.classList.contains('connection-line')) {
                                    activeElement.style.boxShadow = '';
                                }
                            }
                            
                            // 选中接口图形，添加高亮
                            document.querySelectorAll('.interface-element').forEach(el => {
                                el.style.border = '1px solid #ccc';
                                el.style.boxShadow = '';
                            });
                            interfaceElement.style.border = '2px solid #ffc107';
                            interfaceElement.style.boxShadow = '0 0 8px rgba(255, 193, 7, 0.6)';
                            
                            // 设置为当前选中元素
                            activeElement = interfaceElement;
                            activeElementData = {
                                type: 'interface',
                                parentId: parentData.id,
                                parentName: parentData.name,
                                interfaceIndex: index,
                                interfaceName: item.name,
                                interfaceType: item.type,
                                subType: item.subType,
                                enabled: item.enabled,
                                connection: item.connection,
                                interfaceLeft: item.interfaceLeft,
                                interfaceTop: item.interfaceTop
                            };
                            
                            // 更新控制面板显示接口信息
                            updatePropertyPanel();
                            
                            // 记录起始位置
                            startX = e.clientX;
                            startY = e.clientY;
                            startLeft = parseFloat(interfaceElement.style.left) || 0;
                            startTop = parseFloat(interfaceElement.style.top) || 0;
                            
                            // 阻止默认行为
                            e.preventDefault();
                        });
                        
                        document.addEventListener('mousemove', function(e) {
                            if (!isDragging) return;
                            
                            const rect = archidemo.getBoundingClientRect();
                            const deltaX = (e.clientX - startX) / scale;
                            const deltaY = (e.clientY - startY) / scale;
                            
                            let newLeft = startLeft + deltaX;
                            let newTop = startTop + deltaY;
                            
                            // 限制在父元素范围内
                            const parentWidth = parentElement.offsetWidth || parentData.width;
                            const parentHeight = parentElement.offsetHeight || parentData.height;
                            
                            newLeft = Math.max(0, Math.min(newLeft, parentWidth - interface_width));
                            newTop = Math.max(0, Math.min(newTop, parentHeight - interface_height));
                            
                            interfaceElement.style.left = newLeft + 'px';
                            interfaceElement.style.top = newTop + 'px';
                        });
                        
                        document.addEventListener('mouseup', function(e) {
                            if (!isDragging) return;
                            isDragging = false;
                            
                            // 智能吸附功能 - 始终吸附到最近的边
                            const currentLeft = parseFloat(interfaceElement.style.left) || 0;
                            const currentTop = parseFloat(interfaceElement.style.top) || 0;
                            const parentWidth = parentElement.offsetWidth || parentData.width;
                            const parentHeight = parentElement.offsetHeight || parentData.height;
                            const interfaceWidth = 50;
                            const interfaceHeight = 20;
                            
                            // 计算到各边的距离
                            const distances = {
                                left: currentLeft,
                                right: parentWidth - currentLeft - interfaceWidth,
                                top: currentTop,
                                bottom: parentHeight - currentTop - interfaceHeight
                            };
                            
                            // 始终找到最近的边并吸附
                            const minDistance = Math.min(distances.left, distances.right, distances.top, distances.bottom);
                            
                            let finalLeft = currentLeft;
                            let finalTop = currentTop;
                            
                            // 始终吸附到最近的边
                            if (distances.left === minDistance) {
                                finalLeft = 0;
                            } else if (distances.right === minDistance) {
                                finalLeft = parentWidth - interfaceWidth;
                            } else if (distances.top === minDistance) {
                                finalTop = 0;
                            } else if (distances.bottom === minDistance) {
                                finalTop = parentHeight - interfaceHeight;
                            }
                            
                            // 应用吸附后的位置
                            interfaceElement.style.left = finalLeft + 'px';
                            interfaceElement.style.top = finalTop + 'px';
                            
                            // 保存位置到数据
                            const enabledList = parentData.properties.interface_list.filter(i => i.enabled);
                            const actualIndex = enabledList.findIndex(i => i.name === item.name);
                            if (actualIndex !== -1 && parentData.properties.interface_list[actualIndex]) {
                                parentData.properties.interface_list[actualIndex].interfaceLeft = finalLeft;
                                parentData.properties.interface_list[actualIndex].interfaceTop = finalTop;
                            }
                            
                            // 同步到全局 elementData
                            const elementDataIndex = elementData.findIndex(d => d.id === parentData.id);
                            if (elementDataIndex !== -1) {
                                elementData[elementDataIndex] = parentData;
                            }
                            
                            // 更新与该接口相关的连接线
                            if (window.connectionData) {
                                const relatedConnections = window.connectionData.filter(conn => 
                                    (conn.sourceId === parentData.id && conn.sourceInterfaceIndex === index) ||
                                    (conn.targetId === parentData.id && conn.targetInterfaceIndex === index)
                                );
                                
                                relatedConnections.forEach(conn => {
                                    const lineElement = document.querySelector(`[data-connection-id="${conn.id}"]`);
                                    if (lineElement) {
                                        const sourceElement = document.querySelector(`[data-element-id="${conn.sourceId}"]`);
                                        const targetElement = document.querySelector(`[data-element-id="${conn.targetId}"]`);
                                        if (sourceElement && targetElement) {
                                            const sourceInterfaceElements = sourceElement.querySelectorAll('.interface-element');
                                            const targetInterfaceElements = targetElement.querySelectorAll('.interface-element');
                                            
                                            // 通过接口名称查找对应的DOM元素
                                            const sourceInterfaceElement = Array.from(sourceInterfaceElements).find(el => 
                                                el.querySelector('.interface-label').textContent === conn.sourceInterfaceName
                                            );
                                            const targetInterfaceElement = Array.from(targetInterfaceElements).find(el => 
                                                el.querySelector('.interface-label').textContent === conn.targetInterfaceName
                                            );
                                            
                                            if (sourceInterfaceElement && targetInterfaceElement) {
                                                updateInterfaceConnectionLine(lineElement, sourceElement, sourceInterfaceElement, targetElement, targetInterfaceElement);
                                            }
                                        }
                                    }
                                });
                            }
                        });
                    }
                    
                    // 监听颜色选择变化，实时更新颜色值
                    document.getElementById('element-color').addEventListener('input', function(e) {
                        if (!activeElement || !activeElementData) return;

                        // 计算缩放中心点
                        const rect = archidemo.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left;
                        const mouseY = e.clientY - rect.top;
                        
                        // 缩放前的鼠标位置在画布中的坐标
                        const beforeZoomCanvasX = (mouseX - offsetX) / scale;
                        const beforeZoomCanvasY = (mouseY - offsetY) / scale;
                        
                        // 应用缩放
                        if (e.deltaY < 0) {
                            scale = Math.min(scale * 1.1, 5); // 放大，最大5倍
                        } else {
                            scale = Math.max(scale / 1.1, 0.1); // 缩小，最小0.1倍
                        }
                        
                        // 调整偏移量，使缩放中心点保持不变
                        offsetX = mouseX - beforeZoomCanvasX * scale;
                        offsetY = mouseY - beforeZoomCanvasY * scale;
                        
                        updateCanvasTransform();
                    });

                    // 删除选中元素的函数
                    function deleteSelectedElement() {
                        if (!activeElement) return;
                        if (activeElement.classList.contains('connection-line')){
                            // 处理连接线的删除
                            const connectionId = parseInt(activeElement.dataset.connectionId);
                            const connectionDataIndex = connectionData.findIndex(data => data.id === connectionId);
                            if (connectionDataIndex !== -1) {
                                connectionData.splice(connectionDataIndex, 1);
                                activeElement.remove();
                                // 从elements数组中也移除
                                const connectionLineIndex = elements.findIndex(el => el.classList.contains('connection-line') && parseInt(el.dataset.connectionId) === connectionId);
                                if (connectionLineIndex !== -1) {
                                    elements.splice(connectionLineIndex, 1);
                                }
                            }
                            return;
                        }
                        const elementId = parseInt(activeElement.dataset.elementId);
                        const elementDataIndex = elementData.findIndex(data => data.id === elementId);
                        console.log(elementId,elementDataIndex)
                        if (elementDataIndex !== -1) {
                            const elementToDelete = elementData[elementDataIndex];

                            // 处理子元素：如果被删除的元素是父元素，将其子元素的parent重置为'/'
                            if (elementToDelete.children && elementToDelete.children.length > 0) {
                                elementToDelete.children.forEach(childId => {
                                    const childData = elementData.find(data => data.id === childId);
                                    if (childData) {
                                        childData.parent = '/';
                                        childData.relativePosition = null;
                                        
                                        // 找到对应的DOM元素并重置z-index
                                        const childElement = elements.find(el => parseInt(el.dataset.elementId) === childId);
                                        if (childElement) {
                                            childElement.style.zIndex = '15';
                                        }
                                    }
                                });
                            }
                            
                            // 从父元素的children数组中移除
                            if (elementToDelete.parent !== '/') {
                                const parentData = elementData.find(data => data.id === elementToDelete.parent);
                                if (parentData && parentData.children) {
                                    parentData.children = parentData.children.filter(id => id !== elementId);
                                }
                            }
                            
                            // 移除DOM元素
                            activeElement.remove();
                            
                            // 从数组中移除
                            elements = elements.filter(el => el !== activeElement);
                            elementData.splice(elementDataIndex, 1);
                            
                            // 重置activeElement
                            activeElement = null;
                            activeElementData = null;
                        }
                    }
