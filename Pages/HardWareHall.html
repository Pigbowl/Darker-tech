                <!-- 主内容区域 -->

                    <!-- 产品列表区域 -->

                    <!-- 产品详情区域 - PC端显示 -->
                    <div id="product-detail-panel" class="hidden lg:flex w-full lg:w-1/3 bg-tech-medium/40 rounded-xl border border-gray-700/50 p-4 flex-col">

                        <div id="product-detail-empty" class="flex-grow flex flex-col items-center justify-center text-center p-6">

                            <div class="space-y-4 text-sm">

                                    <button onclick="showSpecs('spec-view-interface')" id = "spec-view-interface-btn" class="spec-view-btn font-medium text-white flex items-center hover:text-tech-accent/80 transition-colors">

                                    <button onclick="showSpecs('spec-view-processor')" id = "spec-view-processor-btn" class="spec-view-btn font-medium text-white flex items-center hover:text-tech-accent/80 transition-colors">

                                    </div>

                    </div>
                </div>

            </main>

            <!-- 手机端产品详情浮窗 -->
            <div id="mobile-product-modal" class="fixed inset-0 z-50 hidden">
                <div class="absolute inset-0 bg-black/70" onclick="closeMobileProductModal()"></div>
                <div class="absolute inset-x-2 top-16 bottom-4 sm:inset-x-4 sm:top-20 sm:bottom-8 bg-tech-medium rounded-xl border border-gray-700/50 overflow-hidden flex flex-col transition-transform duration-300 ease-out" id="mobile-modal-content">
                    <div class="flex justify-between items-center p-3 sm:p-4 border-b border-gray-700/50">
                        <h2 class="text-base sm:text-xl font-bold flex items-center">
                            <i class="fa fa-info-circle text-tech-accent mr-2"></i>产品详情

                    <div class="flex-grow overflow-y-auto p-3 sm:p-4">
                        <div id="mobile-product-detail-content">
                            <div class="mb-4">
                                <div class="bg-tech-dark rounded-lg overflow-hidden mb-4">
                                    <img id="mobile-product-image" src="" alt="产品图片" class="w-full h-40 sm:h-48 object-cover">

                                <div id="mobile-product-tags" class="flex flex-wrap gap-2 mb-4"></div>
                            </div>

                            <div class="space-y-4 text-sm">
                                <div class="bg-tech-dark/50 rounded-lg p-3">

                                        <button onclick="showSpecsMobile('spec-view-interface-mobile')" id="spec-view-interface-btn-mobile" class="spec-view-btn font-medium text-white flex items-center hover:text-tech-accent/80 transition-colors text-xs sm:text-sm">

                                        <button onclick="showSpecsMobile('spec-view-processor-mobile')" id="spec-view-processor-btn-mobile" class="spec-view-btn font-medium text-white flex items-center hover:text-tech-accent/80 transition-colors text-xs sm:text-sm">

                                <div class="bg-tech-dark/50 rounded-lg p-3">
                                    <h4 class="font-medium text-tech-accent mb-2 flex items-center text-xs sm:text-sm"><i class="fa fa-line-chart mr-2"></i>性能参数</h4>
                                    <div class="grid grid-cols-2 gap-2 text-xs sm:text-sm" id="mobile-product-performance">

    <!-- 加载组件的脚本 -->
    <script>        
        let productData = {};
        let manufacturerData = {};
        let manufacturerData_init = {};
        let sensorData = {};
        let sensorbttypeData = {};
        let sensorbttypeData_init = {};
        let supplierpicpath = "../PIC/Company/";
        let componentpicpath = "../PIC/Component/";
        let chipsetkeyattribute = ["Domain","Fusa_Level","Temparature_Range","Type","AI_RESOURCE","CPU_RESOURCE"]
        
        document.addEventListener('DOMContentLoaded', () => {     // 配置搜索功能函数
            const productDetailEmpty = document.getElementById('product-detail-empty');
            const productDetailContent = document.getElementById('product-detail-content');
            const productImage = document.getElementById('product-image');
            const productTitle = document.getElementById('product-title');
            const productManufacturer = document.getElementById('product-manufacturer');
            const productTags = document.getElementById('product-tags');
            const productSpecs = document.getElementById('product-specs');
            const productDescription = document.getElementById('product-description');
            const productPerformance = document.getElementById('product-performance');
            const componentsearchInput = document.getElementById('hwsearch-input');
            const resetBtnCom = document.getElementById('reset-btn-component');
            const dropdownButtons = [
                {btn: 'manufacturer-filter-btn', dropdown: 'manufacturer-dropdown'},
                {btn: 'type-filter-btn', dropdown: 'type-dropdown'},
                {btn: 'application-filter-btn', dropdown: 'application-dropdown'},
            ];

            let currentCards = [];
            
            function filterProducts() {
                let visibleCount = Object.keys(productData.Catalogue).length;
                const chipCards = document.querySelectorAll('.chip-card');
                // 获取所有选中的筛选条件

                const selectedManufacturers = Array.from(document.querySelectorAll('#manufacturer-options input:checked'))
                    .map(input => input.value);
                const selectedTypes = Array.from(document.querySelectorAll('#type-options input:checked'))
                    .map(input => input.value);
                const selectedApplications = Array.from(document.querySelectorAll('#application-options input:checked'))
                    .map(input => input.value);
                
                const searchTerm = document.getElementById('hwsearch-input').value.toLowerCase();
                

                const productsArray = Object.values(productData.Catalogue);
                const filteredProducts = productsArray.filter(product => {
                    const matchesManufacturer = selectedManufacturers.includes(product.Supplier_Name.Name);
                    const matchesType = selectedTypes.includes(product.Type);
                    // const matchesApplication = selectedApplications.includes(product.application);
                    const matchesSearch = product.Name.toLowerCase().includes(searchTerm) || 
                                        // JSON.stringify(product.PROCESSOR).toLowerCase().includes(searchTerm) ||
                                        product.Supplier_Name.Name.toLowerCase().includes(searchTerm);
                                        JSON.stringify(product.Domain).toLowerCase().includes(searchTerm);
                    const result = matchesManufacturer && matchesType && matchesSearch

                    if (result == false){
                        card = Array.from(chipCards).find(node => node.getAttribute('data-id')===product.Name);
                        card.classList.add('hidden');
                        visibleCount--;
                    }else{
                        card = Array.from(chipCards).find(node => node.getAttribute('data-id')===product.Name);
                        card.classList.remove('hidden');
                        visibleCount++;
                    }
                    return matchesManufacturer && matchesType && matchesSearch;
                });

                const manufacturerGroups = document.querySelectorAll('.manufacturer-group');
                manufacturerGroups.forEach(Group => {
                    const manufacturercounter = Group.querySelector('.supplier-count')
                    const manufacturerproductgroups = Group.querySelectorAll('.manufacturer-products')
                    const manufacturerproductgroup =manufacturerproductgroups[0]

                    const remains = manufacturerproductgroup.querySelectorAll('.chip-card').length-manufacturerproductgroup.querySelectorAll('.hidden').length
                    manufacturercounter.textContent = ` ${remains}个产品`;
                    if (remains ==0){
                        Group.classList.add('hidden')
                    }else{
                        Group.classList.remove('hidden')
                    }

                })

                // // 更新结果计数
                document.getElementById('result-count').textContent = `显示 ${visibleCount} 个产品`;
            }
            
            // 渲染产品列表
            function renderProductList(producttoshow) {
                const container = document.getElementById('product-list-container');
                container.innerHTML = '';
                // 遍历每个厂商
                Object.entries(producttoshow).forEach(([manufacturer, products]) => {
                    // 创建厂商分组
                    const manufacturerGroup = document.createElement('div');
                    manufacturerGroup.className = 'manufacturer-group mb-8';
                    
                    // 厂商头部
                    manufacturerGroup.innerHTML = `
                        <div class="manufacturer-header flex items-center justify-between mb-2 sm:mb-4 cursor-pointer">
                            <h3 class="text-sm sm:text-lg font-semibold flex items-center">
                                <i class="fa fa-chevron-down text-tech-accent mr-2 transition-transform duration-300"></i>
                                <img src=${supplierpicpath+manufacturer+".png"} alt="${manufacturer} Logo" class="w-12 h-5 sm:w-16 sm:h-6 mr-2">
                                ${manufacturer}
                            </h3>
                            <span class="supplier-count text-xs sm:text-sm bg-tech-light/50 px-2 py-1 rounded-full">${products.length} 个产品</span>
                        </div>
                        <div class="manufacturer-products grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-3"></div>
                    `;
                    
                    // 获取产品容器
                    const productsContainer = manufacturerGroup.querySelector('.manufacturer-products');
                    
                    // 添加产品卡片
                    products.forEach(product => {
                        const card = createProductCard(product);
                        productsContainer.appendChild(card);
                    });
                    
                    // 添加到页面
                    container.appendChild(manufacturerGroup);
                });
                
                // 添加厂商分组折叠功能
                attachManufacturerToggleEvents();
            }
            
            // 创建产品卡片
            function createProductCard(product) {
                const card = document.createElement('div');
                const productId = product.Name;
                
                card.className = 'chip-card bg-tech-dark border border-gray-700 rounded-lg p-2 sm:p-3 cursor-pointer hover:border-tech-accent transition-all';
                card.dataset.id = productId;
                card.dataset.manufacturer = product.Supplier_Name.Name.toLowerCase();
                card.dataset.type = product.Type || 'unknown';
                
                productdomain = ""
        
                FUSAinfo = product.Fusa_Level||'标准级'
                const tags = [product.Fusa_Level]

                if (typeof product.Domain == 'string'){
                    tags.push(product.Domain)
                }else{
                    Object.keys(product.Domain).forEach(key=>{
                        tags.push(key)
                    })
                }

                    
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1 sm:mb-2">
                        <h4 class="font-semibold text-white text-xs sm:text-sm truncate max-w-[60%]">${product.Name}</h4>
                        <span class="text-[10px] sm:text-xs bg-tech-accent/20 text-tech-accent px-1.5 sm:px-2 py-0.5 rounded-full whitespace-nowrap">${product.Type || '标准级'}</span>
                    </div>
                    <p class="text-[10px] sm:text-sm text-gray-400 mb-1 sm:mb-2 truncate">${product.AI_RESOURCE || '未知算力'} | ${product.CPU_RESOURCE || '未知核心数'}</p>
                    <div class="flex flex-wrap gap-0.5 sm:gap-1 mt-1 sm:mt-2">
                        ${tags ? tags.map(tag => `<span class="text-[9px] sm:text-xs bg-tech-light/30 px-1 sm:px-2 py-0.5 rounded">${tag}</span>`).join('') : ''}
                    </div>
                `;
                
                return card;
            }

            // 添加厂商分组折叠事件
            function attachManufacturerToggleEvents() {
                document.querySelectorAll('.manufacturer-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const icon = header.querySelector('i.fa-chevron-down');
                        console.log(icon)
                        const products = header.nextElementSibling;
                        icon.classList.toggle('rotate-180');
                        products.classList.toggle('hidden');
                    });
                });
            }
            
            // 按厂商分组产品数据
            function groupProductsByManufacturer(productINFO) {
                manufacturerData = {};
                Object.keys(productINFO).forEach(key => {
                    product = productINFO[key]
                    const manufacturer = product.Supplier_Name.Name || '未知厂商';
                    if (!manufacturerData[manufacturer]) {
                        manufacturerData[manufacturer] = [];
                    }
                    manufacturerData[manufacturer].push(product);
                });
                return manufacturerData
            }

            function initFilters(productINFO){
                const supplier = productINFO.Supplier;
                const application = productINFO.Domain;
                const type = productINFO.Type;
                // 生成厂商筛选选项
                renderFilterOptions('manufacturer-options', supplier);
                // 生成产品类型筛选选项
                renderFilterOptions('type-options', type);
                // 生成应用领域筛选选项
                renderFilterOptions('application-options', application);
            }

            // 渲染筛选器选项的通用函数
            function renderFilterOptions(containerId, options) {
                const container = document.getElementById(containerId);
                container.innerHTML = '';

                Object.keys(options).forEach(option => {
                    const label = document.createElement('label');
                    label.className = 'flex items-center gap-2 py-1.5 px-2 hover:bg-tech-light/50 rounded cursor-pointer';
                    label.innerHTML = `
                        <input type="checkbox" class="rounded text-tech-accent focus:ring-tech-accent" 
                            value="${option}" checked>
                        <span>${option}</span>
                    `;
                    container.appendChild(label);

                    // 添加筛选事件监听
                    label.querySelector('input').addEventListener('change', filterProducts);
                    
                });
                componentsearchInput.addEventListener('input',filterProducts);
            }

            // 检测是否为手机端
            function isMobile() {
                return window.innerWidth < 1024;
            }

            // 显示产品详情
            function showProductDetail(productId) {
                const product = productData.Catalogue[productId];
                if (!product) return;

                if (isMobile()) {
                    showMobileProductDetail(product);
                } else {
                    showDesktopProductDetail(product);
                }
            }

            // PC端显示产品详情
            function showDesktopProductDetail(product) {
                productDetailEmpty.classList.add('hidden');
                productDetailContent.classList.remove('hidden');

                productImage.src = componentpicpath+product.Name+".png";
                productTitle.textContent = product.Name;

            // 渲染规格
                productSpecs.innerHTML = `
                    <div id="spec-view-keyspec" class="spec-view hidden"></div>
                    <div id="spec-view-interface" class="spec-view hidden"></div>
                    <div id="spec-view-processor" class="spec-view hidden"></div>
                `;
                
                document.querySelectorAll('.spec-view').forEach(v => v.classList.add('hidden'));
                const processorView = document.getElementById(`spec-view-processor`);
                Object.keys(product.processor_group).forEach(processorType => {
                    if (!processorView) return;
                    product.processor_group[processorType].forEach(element => {
                        const elementDiv = document.createElement('div');
                        elementDiv.className = 'element-info-container bg-tech-dark/30 border border-gray-600 rounded-lg p-3 mb-2';

    <!-- Circuit Background -->
    <script>
        const c = document.getElementById('circuitCanvas');
        const ctx = c.getContext('2d');
        
        function resizeCanvas() {
            c.width = window.innerWidth;
            c.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const traces = [];
        
        function createTrace() {
            const x = Math.random() * c.width, y = Math.random() * c.height;
            const segments = [{ x, y }];
            let cx = x, cy = y;
            const segCount = Math.floor(Math.random() * 6) + 3;
            for (let i = 0; i < segCount; i++) {
                const len = Math.random() * 80 + 30;
                if (i % 2 === 0) cx += (Math.random() > 0.5 ? 1 : -1) * len;
                else cy += (Math.random() > 0.5 ? 1 : -1) * len;
                segments.push({ x: cx, y: cy });
            }
            return {
                segments,
                pulsePos: Math.random(),
                pulseSpeed: Math.random() * 0.005 + 0.002,
                alpha: Math.random() * 0.3 + 0.1
            };
        }
        
        for (let i = 0; i < 30; i++) traces.push(createTrace());
        
        function draw() {
            ctx.fillStyle = 'rgba(8, 10, 15, 0.08)';
            ctx.fillRect(0, 0, c.width, c.height);
            
            traces.forEach(t => {
                ctx.beginPath();
                ctx.moveTo(t.segments[0].x, t.segments[0].y);
                for (let i = 1; i < t.segments.length; i++) ctx.lineTo(t.segments[i].x, t.segments[i].y);
                ctx.strokeStyle = '#00f0ff';
                ctx.globalAlpha = t.alpha;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.globalAlpha = 1;
                
                t.segments.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#00f0ff';
                    ctx.globalAlpha = t.alpha * 1.5;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
                
                t.pulsePos += t.pulseSpeed;
                if (t.pulsePos > 1) t.pulsePos = 0;
                const total = t.segments.length - 1;
                const sf = t.pulsePos * total;
                const si = Math.floor(sf), st = sf - si;
                if (si < total) {
                    const a = t.segments[si], b = t.segments[si + 1];
                    ctx.beginPath();
                    ctx.arc(a.x + (b.x - a.x) * st, a.y + (b.y - a.y) * st, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            requestAnimationFrame(draw);
        }
        
        draw();
    </script>
