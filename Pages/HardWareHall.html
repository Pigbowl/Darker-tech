<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硬件领域-达客智驾领航员</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="../css/tailwind.css"></script>
    <script src="../js/xlsx/xlsx.full.min.js"></script>
    <script src="../js/particles/particles.min.js"></script>    
    <script src="../js/chartjs/chart.umd.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <!-- <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet"> -->
    <link href="../css/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="../css/fonts/local-fonts.css" rel="stylesheet">

    <script src="../js/load-duck-assistant.js"></script>

</head>


<body class="bg-dark text-gray-100 font-inter min-h-screen flex flex-col bg-grid">
    <div id="particles-js"></div>
    <div class="content min-h-screen">

        <!-- 导航栏容器 --> 
        <div id="navbar-container"></div>

            <!--硬件智库页面-->
            <main class="sticky mt-16 top-20 z-20 container mx-auto px-4 py-8 flex flex-col gap-4">
                <!-- 状态指示器 -->
                <div class="flex items-center gap-3">
                    <i class="fa fa-microchip text-tech-accent text-3xl"></i>
                    <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-white">
                        <span class="text-tech-accent text-shadow-glow">芯片</span>产品目录
                    </h1>
                </div>
                
                <!-- 搜索和筛选区域 -->
                <div class="container mx-auto px-6 py-5">
                    <div class="bg-white rounded-xl p-4 border border-gray-700/50">
                        <div class="flex flex-col md:flex-row gap-4">
                            <!-- 搜索框 -->
                            <div class="relative flex-grow">
                                <input
                                    type="text" id="hwsearch-input"
                                    placeholder="搜索芯片型号、系列或厂商..."
                                    class="w-full bg-tech-dark border border-gray-600 rounded-lg py-2.5 px-4 pl-10 focus:outline-none focus:border-tech-accent transition-all"
                                >
                                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            </div>

                            <!-- 筛选下拉菜单 -->
                            <div class="flex flex-wrap gap-3">
                                <div class="relative w-full md:w-auto flex-grow md:flex-grow-0">
                                    <button id="manufacturer-filter-btn" class="w-full bg-tech-dark border border-gray-600 rounded-lg py-2.5 px-4 flex items-center justify-between hover:border-tech-accent transition-all">
                                        <span>厂商</span>
                                        <i class="fa fa-chevron-down ml-2 text-xs"></i>
                                    </button>
                                    <div id="manufacturer-dropdown" class="absolute left-0 mt-2 w-64 bg-tech-medium border border-gray-600 rounded-lg shadow-xl z-20 hidden">
                                        <div class="p-3 max-h-60 overflow-y-auto scrollbar-thin" id="manufacturer-options">
                                            <!-- 动态生成的厂商选项将在这里插入 -->
                                        </div>
                                    </div>
                                </div>
                                <!-- 产品类型筛选 -->
                                <div class="relative w-full md:w-auto flex-grow md:flex-grow-0">
                                    <button id="type-filter-btn" class="w-full bg-tech-dark border border-gray-600 rounded-lg py-2.5 px-4 flex items-center justify-between hover:border-tech-accent transition-all">
                                        <span>产品类型</span>
                                        <i class="fa fa-chevron-down ml-2 text-xs"></i>
                                    </button>
                                    <div id="type-dropdown" class="absolute left-0 mt-2 w-64 bg-tech-medium border border-gray-600 rounded-lg shadow-xl z-20 hidden">
                                        <div class="p-3" id="type-options">
                                            <!-- 动态生成的产品类型选项将在这里插入 -->
                                        </div>
                                    </div>
                                </div>

                                <!-- 应用领域筛选 -->
                                <div class="relative w-full md:w-auto flex-grow md:flex-grow-0">
                                    <button id="application-filter-btn" class="w-full bg-tech-dark border border-gray-600 rounded-lg py-2.5 px-4 flex items-center justify-between hover:border-tech-accent transition-all">
                                        <span>应用领域</span>
                                        <i class="fa fa-chevron-down ml-2 text-xs"></i>
                                    </button>
                                    <div id="application-dropdown" class="absolute left-0 mt-2 w-64 bg-tech-medium border border-gray-600 rounded-lg shadow-xl z-20 hidden">
                                        <div class="p-3" id="application-options">
                                            <!-- 动态生成的应用领域选项将在这里插入 -->
                                        </div>
                                    </div>
                                </div>

                                <!-- 重置按钮 -->
                                <button id="reset-btn-component" class="w-full md:w-auto bg-tech-dark border border-gray-600 rounded-lg py-2.5 px-4 hover:border-tech-accent transition-all">
                                    <i class="fa fa-refresh mr-1"></i> 重置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 主内容区域 -->
                <div class="container mx-auto px-6 py-2 flex-grow flex flex-col lg:flex-row gap-6">
                    <!-- 产品列表区域 -->
                    <div class="w-full lg:w-2/3 bg-tech-medium/40 rounded-xl border border-gray-700/50 p-4 overflow-hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-bold flex items-center">
                                <i class="fa fa-th-large text-tech-accent mr-2"></i>产品列表
                            </h2>
                            <div id="result-count" class="text-sm text-gray-400">显示 0 个产品</div>
                        </div>

                        <!-- 修改后 -->
                        <div id="product-list-container" class="max-h-[calc(100vh-300px)] overflow-y-auto scrollbar-thin pr-2">
                            <!-- 动态内容将在这里生成 -->
                            <div class="loading-indicator text-center py-10">
                                <i class="fa fa-spinner fa-spin text-tech-accent text-2xl mb-2"></i>
                                <p>加载产品数据中...</p>
                            </div>
                        </div>
                    </div>

                    <!-- 产品详情区域 -->
                    <div class="w-full lg:w-1/3 bg-tech-medium/40 rounded-xl border border-gray-700/50 p-4 flex flex-col">
                        <h2 class="text-xl font-bold flex items-center mb-4">
                            <i class="fa fa-info-circle text-tech-accent mr-2"></i>产品详情
                        </h2>

                        <div id="product-detail-empty" class="flex-grow flex flex-col items-center justify-center text-center p-6">
                            <div class="w-24 h-24 bg-tech-dark rounded-full flex items-center justify-center mb-4 border border-gray-700">
                                <i class="fa fa-microchip text-4xl text-gray-500"></i>
                            </div>
                            <h3 class="text-lg font-medium mb-2">未选择产品</h3>
                            <p class="text-gray-400 text-sm max-w-xs">请从左侧列表中选择一个芯片产品以查看详细信息</p>
                        </div>

                        <div id="product-detail-content" class="flex-grow hidden">
                            <div class="mb-4">
                                <div class="bg-tech-dark rounded-lg overflow-hidden mb-4">
                                    <img id="product-image" src="" alt="产品图片" class="w-full h-48 object-cover">
                                </div>
                                <h3 id="product-title" class="text-xl font-bold text-white mb-1"></h3>
                                <!-- <p id="product-manufacturer" class="text-tech-accent mb-3"></p> -->
                                <div id="product-tags" class="flex flex-wrap gap-2 mb-4"></div>
                            </div>

                            <div class="space-y-4 text-sm">
                                <div class="bg-tech-dark/50 rounded-lg p-3">
                                <div class="flex gap-2 mb-2">
                                    <button onclick="showSpecs('spec-view-keyspec')" id = "spec-view-keyspec-btn" class="spec-view-btn font-medium text-white flex items-center hover:text-tech-accent/80 transition-colors">
                                        <i class="fa fa-cogs mr-2"></i>技术规格
                                    </button>
                                    <span class="text-gray-500">|</span>
                                    <button onclick="showSpecs('spec-view-interface')" id = "spec-view-interface-btn" class="spec-view-btn font-medium text-white flex items-center hover:text-tech-accent/80 transition-colors">
                                        <i class="fa fa-plug mr-2"></i>接口信息
                                    </button>
                                    <span class="text-gray-500">|</span>
                                    <button onclick="showSpecs('spec-view-processor')" id = "spec-view-processor-btn" class="spec-view-btn font-medium text-white flex items-center hover:text-tech-accent/80 transition-colors">
                                        <i class="fa fa-microchip mr-2"></i>处理器信息
                                    </button>
                                </div>
                                    <ul class="space-y-2 text-sm" id="product-specs">
                                        <!-- 动态填充规格 -->
                                    </ul>
                                </div>

                                <div class="bg-tech-dark/50 rounded-lg p-3">
                                    <h4 class="font-medium text-tech-accent mb-2 flex items-center"><i class="fa fa-line-chart mr-2"></i>性能参数</h4>
                                    <div class="grid grid-cols-2 gap-2 text-sm" id="product-performance">
                                        <!-- 动态填充性能参数 -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        <!-- 页脚容器 -->
        <div id="footer-container"></div>   
    </div>
    
    <!-- 加载组件的脚本 -->
    <script>        
        let productData = {};
        let manufacturerData = {};
        let manufacturerData_init = {};
        let sensorData = {};
        let sensorbttypeData = {};
        let sensorbttypeData_init = {};
        let supplierpicpath = "../PIC/Company/";
        let componentpicpath = "../PIC/Component/";
        let chipsetkeyattribute = ["Domain","Fusa_Level","Temparature_Range","Type","AI_RESOURCE","CPU_RESOURCE"]
        
        document.addEventListener('DOMContentLoaded', () => {     // 配置搜索功能函数
            const productDetailEmpty = document.getElementById('product-detail-empty');
            const productDetailContent = document.getElementById('product-detail-content');
            const productImage = document.getElementById('product-image');
            const productTitle = document.getElementById('product-title');
            const productManufacturer = document.getElementById('product-manufacturer');
            const productTags = document.getElementById('product-tags');
            const productSpecs = document.getElementById('product-specs');
            const productDescription = document.getElementById('product-description');
            const productPerformance = document.getElementById('product-performance');
            const componentsearchInput = document.getElementById('hwsearch-input');
            const resetBtnCom = document.getElementById('reset-btn-component');
            const dropdownButtons = [
                {btn: 'manufacturer-filter-btn', dropdown: 'manufacturer-dropdown'},
                {btn: 'type-filter-btn', dropdown: 'type-dropdown'},
                {btn: 'application-filter-btn', dropdown: 'application-dropdown'},
            ];

            let currentCards = [];
            
            function filterProducts() {
                let visibleCount = Object.keys(productData.Catalogue).length;
                const chipCards = document.querySelectorAll('.chip-card');
                // 获取所有选中的筛选条件

                const selectedManufacturers = Array.from(document.querySelectorAll('#manufacturer-options input:checked'))
                    .map(input => input.value);
                const selectedTypes = Array.from(document.querySelectorAll('#type-options input:checked'))
                    .map(input => input.value);
                const selectedApplications = Array.from(document.querySelectorAll('#application-options input:checked'))
                    .map(input => input.value);
                
                const searchTerm = document.getElementById('hwsearch-input').value.toLowerCase();
                

                const productsArray = Object.values(productData.Catalogue);
                const filteredProducts = productsArray.filter(product => {
                    const matchesManufacturer = selectedManufacturers.includes(product.Supplier_Name.Name);
                    const matchesType = selectedTypes.includes(product.Type);
                    // const matchesApplication = selectedApplications.includes(product.application);
                    const matchesSearch = product.Name.toLowerCase().includes(searchTerm) || 
                                        // JSON.stringify(product.PROCESSOR).toLowerCase().includes(searchTerm) ||
                                        product.Supplier_Name.Name.toLowerCase().includes(searchTerm);
                                        JSON.stringify(product.Domain).toLowerCase().includes(searchTerm);
                    const result = matchesManufacturer && matchesType && matchesSearch

                    if (result == false){
                        card = Array.from(chipCards).find(node => node.getAttribute('data-id')===product.Name);
                        card.classList.add('hidden');
                        visibleCount--;
                    }else{
                        card = Array.from(chipCards).find(node => node.getAttribute('data-id')===product.Name);
                        card.classList.remove('hidden');
                        visibleCount++;
                    }
                    return matchesManufacturer && matchesType && matchesSearch;
                });

                const manufacturerGroups = document.querySelectorAll('.manufacturer-group');
                manufacturerGroups.forEach(Group => {
                    const manufacturercounter = Group.querySelector('.supplier-count')
                    const manufacturerproductgroups = Group.querySelectorAll('.manufacturer-products')
                    const manufacturerproductgroup =manufacturerproductgroups[0]

                    const remains = manufacturerproductgroup.querySelectorAll('.chip-card').length-manufacturerproductgroup.querySelectorAll('.hidden').length
                    manufacturercounter.textContent = ` ${remains}个产品`;
                    if (remains ==0){
                        Group.classList.add('hidden')
                    }else{
                        Group.classList.remove('hidden')
                    }

                })

                // // 更新结果计数
                document.getElementById('result-count').textContent = `显示 ${visibleCount} 个产品`;
            }
            
            // 渲染产品列表
            function renderProductList(producttoshow) {
                const container = document.getElementById('product-list-container');
                container.innerHTML = '';
                // 遍历每个厂商
                Object.entries(producttoshow).forEach(([manufacturer, products]) => {
                    // 创建厂商分组
                    const manufacturerGroup = document.createElement('div');
                    manufacturerGroup.className = 'manufacturer-group mb-8';
                    
                    // 厂商头部
                    manufacturerGroup.innerHTML = `
                        <div class="manufacturer-header flex items-center justify-between mb-4 cursor-pointer">
                            <h3 class="text-lg font-semibold flex items-center">
                                <i class="fa fa-chevron-down text-tech-accent mr-2 transition-transform duration-300"></i>
                                <img src=${supplierpicpath+manufacturer+".png"} alt="${manufacturer} Logo" class="w-16 h-6 mr-2">
                                ${manufacturer}
                            </h3>
                            <span class="supplier-count text-sm bg-tech-light/50 px-2 py-1 rounded-full">${products.length} 个产品</span>
                        </div>
                        <div class="manufacturer-products grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
                    `;
                    
                    // 获取产品容器
                    const productsContainer = manufacturerGroup.querySelector('.manufacturer-products');
                    
                    // 添加产品卡片
                    products.forEach(product => {
                        const card = createProductCard(product);
                        productsContainer.appendChild(card);
                    });
                    
                    // 添加到页面
                    container.appendChild(manufacturerGroup);
                });
                
                // 添加厂商分组折叠功能
                attachManufacturerToggleEvents();
            }
            
            // 创建产品卡片
            function createProductCard(product) {
                const card = document.createElement('div');
                const productId = product.Name;
                
                card.className = 'chip-card bg-tech-dark border border-gray-700 rounded-lg p-3';
                card.dataset.id = productId;
                card.dataset.manufacturer = product.Supplier_Name.Name.toLowerCase();
                card.dataset.type = product.Type || 'unknown';
                
                productdomain = ""
        
                FUSAinfo = product.Fusa_Level||'标准级'
                const tags = [product.Fusa_Level]

                if (typeof product.Domain == 'string'){
                    tags.push(product.Domain)
                }else{
                    Object.keys(product.Domain).forEach(key=>{
                        tags.push(key)
                    })
                }

                    
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-semibold text-white">${product.Name}</h4>
                        <span class="text-xs bg-tech-accent/20 text-tech-accent px-2 py-0.5 rounded-full">${product.Type || '标准级'}</span>
                    </div>
                    <p class="text-sm text-gray-400 mb-2">${product.AI_RESOURCE || '未知算力'} | ${product.CPU_RESOURCE || '未知核心数'} | ${product.Fusa_Level|| '未知核心数'}</p>
                    <div class="flex flex-wrap gap-1 mt-3">
                        ${tags ? tags.map(tag => `<span class="text-xs bg-tech-light/30 px-2 py-0.5 rounded">${tag}</span>`).join('') : ''}
                    </div>
                `;
                
                return card;
            }

            // 添加厂商分组折叠事件
            function attachManufacturerToggleEvents() {
                document.querySelectorAll('.manufacturer-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const icon = header.querySelector('i.fa-chevron-down');
                        console.log(icon)
                        const products = header.nextElementSibling;
                        icon.classList.toggle('rotate-180');
                        products.classList.toggle('hidden');
                    });
                });
            }
            
            // 按厂商分组产品数据
            function groupProductsByManufacturer(productINFO) {
                manufacturerData = {};
                Object.keys(productINFO).forEach(key => {
                    product = productINFO[key]
                    const manufacturer = product.Supplier_Name.Name || '未知厂商';
                    if (!manufacturerData[manufacturer]) {
                        manufacturerData[manufacturer] = [];
                    }
                    manufacturerData[manufacturer].push(product);
                });
                return manufacturerData
            }

            function initFilters(productINFO){
                const supplier = productINFO.Supplier;
                const application = productINFO.Domain;
                const type = productINFO.Type;
                // 生成厂商筛选选项
                renderFilterOptions('manufacturer-options', supplier);
                // 生成产品类型筛选选项
                renderFilterOptions('type-options', type);
                // 生成应用领域筛选选项
                renderFilterOptions('application-options', application);
            }

            // 渲染筛选器选项的通用函数
            function renderFilterOptions(containerId, options) {
                const container = document.getElementById(containerId);
                container.innerHTML = '';

                Object.keys(options).forEach(option => {
                    const label = document.createElement('label');
                    label.className = 'flex items-center gap-2 py-1.5 px-2 hover:bg-tech-light/50 rounded cursor-pointer';
                    label.innerHTML = `
                        <input type="checkbox" class="rounded text-tech-accent focus:ring-tech-accent" 
                            value="${option}" checked>
                        <span>${option}</span>
                    `;
                    container.appendChild(label);

                    // 添加筛选事件监听
                    label.querySelector('input').addEventListener('change', filterProducts);
                    
                });
                componentsearchInput.addEventListener('input',filterProducts);
            }

            // 显示产品详情
            function showProductDetail(productId) {
                const product = productData.Catalogue[productId];
                if (!product) return;

                productDetailEmpty.classList.add('hidden');
                productDetailContent.classList.remove('hidden');

                productImage.src = componentpicpath+product.Name+".png";
                productTitle.textContent = product.Name;

            // 渲染规格
                // 清空旧内容并准备 3 个同级容器
                productSpecs.innerHTML = `
                    <div id="spec-view-keyspec" class="spec-view hidden"></div>
                    <div id="spec-view-interface" class="spec-view hidden"></div>
                    <div id="spec-view-processor" class="spec-view hidden"></div>
                `;
                
                document.querySelectorAll('.spec-view').forEach(v => v.classList.add('hidden'));
                // 根据 processor 类型填充对应容器
                const processorView = document.getElementById(`spec-view-processor`);
                // console.log(product.processor_group)
                Object.keys(product.processor_group).forEach(processorType => {
                    if (!processorView) return; // 防止意外类型 
                    product.processor_group[processorType].forEach(element => {
                        const elementDiv = document.createElement('div');
                        elementDiv.className = 'element-info-container bg-tech-dark/30 border border-gray-600 rounded-lg p-3 mb-2';

                        // 添加 Type 标题
                        const typeTitle = document.createElement('h5');
                        typeTitle.className = 'text-tech-accent font-semibold mb-2';
                        typeTitle.textContent = element.Type || '未知类型';
                        elementDiv.appendChild(typeTitle);

                        // 仅渲染 Power、Name
                        ['Power', 'Name'].forEach(key => {
                            if (element.hasOwnProperty(key)) {
                                if (key === 'Name') {
                                    const infoItem = document.createElement('div');
                                    infoItem.className = 'flex justify-between text-sm';
                                    infoItem.innerHTML = `<span class="text-white font-medium">${element[key]} * ${element.Number}</span>`;
                                    elementDiv.appendChild(infoItem);
                                } else if (key === 'Power') {
                                    const infoItem = document.createElement('div');
                                    infoItem.className = 'flex justify-between text-sm';
                                    infoItem.innerHTML = `<span class="text-white font-medium">${element[key]} ${element.Unit}</span>`;
                                    elementDiv.appendChild(infoItem);
                                }
                            }
                        });

                        processorView.appendChild(elementDiv);
                    });
                });

                            // 根据 interface 类型填充对应容器
                const interfaceView = document.getElementById(`spec-view-interface`);
                Object.keys(product.interface_group).forEach(interfaceType => {
                    if (!interfaceView) return; // 防止意外类型
                    const elementDiv = document.createElement('div');
                    elementDiv.className = 'element-info-container bg-tech-dark/30 border border-gray-600 rounded-lg p-3 mb-2';
                    // 添加 Type 标题
                    const typeTitle = document.createElement('h5');
                    typeTitle.className = 'text-tech-accent font-semibold mb-2';
                    typeTitle.textContent = interfaceType || '未知类型';
                    elementDiv.appendChild(typeTitle);
                    product.interface_group[interfaceType].forEach(element => {
                        // 仅渲染 Power、Name
                        ['Power', 'SubType'].forEach(key => {
                            if (element.hasOwnProperty(key)) {
                                if (key === 'SubType') {
                                    const infoItem = document.createElement('div');
                                    infoItem.className = 'flex justify-between text-sm';
                                    infoItem.innerHTML = `<span class="text-white font-medium">${element[key]} * ${element.Number}</span>`;
                                    elementDiv.appendChild(infoItem);
                                } else if (key === 'Power') {
                                    const infoItem = document.createElement('div');
                                    infoItem.className = 'flex justify-between text-sm';
                                    infoItem.innerHTML = `<span class="text-white font-medium">${element[key]}</span>`;
                                    elementDiv.appendChild(infoItem);
                                }
                            }
                        });
                        interfaceView.appendChild(elementDiv);
                    });
                });
                
                const defaultView = document.querySelector('#spec-view-keyspec');
                Object.keys(product).forEach(key => {
                    if (key && typeof(product[key])!=='object' && chipsetkeyattribute.includes(key)){
                    // 为 element 创建一个 div 容器，用于放置其内部信息
                        elementDiv = document.createElement('div');
                        elementDiv.className = 'element-info-container bg-tech-dark/30 border border-gray-600 rounded-lg p-3 mb-2';
                    
                        // 添加 Type 标题
                        const typeTitle = document.createElement('h5');
                        typeTitle.className = 'text-tech-accent font-semibold mb-2';
                        typeTitle.textContent = key || '未知类型';
                        elementDiv.appendChild(typeTitle);

                        // console.log(key,product[key])
                        const infoItem = document.createElement('div');
                        infoItem.className = 'flex justify-between text-sm';
                        infoItem.innerHTML = `
                            <span class="text-white font-medium">${product[key]}</span>
                    `;
                    elementDiv.appendChild(infoItem);

                    // 将生成的 div 添加到需要显示的父容器中
                    defaultView.appendChild(elementDiv);}
                });

                defaultView.classList.remove('hidden');
                document.getElementById("spec-view-keyspec-btn").classList.remove('text-white');
                document.getElementById("spec-view-keyspec-btn").classList.add('text-tech-accent');
            }

            // 将showSpecs函数暴露到全局作用域，使HTML按钮可以访问
            window.showSpecs = function(viewId){
                const specViews = document.querySelectorAll('.spec-view');
                specViews.forEach(view => {
                    view.classList.add('hidden');
                });
                
                document.getElementById(viewId).classList.remove('hidden');
                // 更新按钮状态
                document.querySelectorAll('.spec-view-btn').forEach(btn => {
                    btn.classList.add('text-white');
                });
                document.getElementById(`${viewId}-btn`).classList.remove('text-white');
                document.getElementById(`${viewId}-btn`).classList.add('text-tech-accent');
            };
            
            getcomponent()
            
            function getcomponent(){
                command = ip + '/extract_item_group'
                fetch(command, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    item_cate:'hardware',
                    table_name:'calculator',
                })
                })
                .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                return response.json();
                })
                .then(data => {
                    if (data.success) {
                        productData = JSON.parse(data.output); 
                        console.log(productData)
                        manufacturerData = groupProductsByManufacturer(productData.Catalogue);
                        manufacturerData_init = manufacturerData;
                        initFilters(productData)
                        renderProductList(manufacturerData);
                        document.getElementById('result-count').textContent = `显示 ${Object.keys(productData.Catalogue).length} 个产品`;
                        const chipCards = document.querySelectorAll('.chip-card');
                        chipCards.forEach(card => {
                            card.addEventListener('click', () => {
                                // 移除其他卡片的选中状态
                            chipCards.forEach(c => c.classList.remove('selected'));
                                // 添加当前卡片的选中状态
                            card.classList.add('selected');
                            // 显示产品详情
                            showProductDetail(card.dataset.id);
                                });
                            });
                    } else {
                        console.log("请求失败");
                        reject(new Error("API返回失败"));
                    }
                })
                .catch(error => {
                    console.error("请求过程中出错:", error);
                reject(error);
                });
            }
            
            // 初始化下拉菜单事件
            dropdownButtons.forEach(({btn, dropdown}) => {
                const button = document.getElementById(btn);
                const dropdownEl = document.getElementById(dropdown);

                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 关闭其他下拉菜单
                    dropdownButtons.forEach(({dropdown: d}) => {
                        if (d !== dropdown) {
                            document.getElementById(d).classList.add('hidden');
                        }
                    });
                    dropdownEl.classList.toggle('hidden');
                });
            });

            // 点击页面其他地方关闭下拉菜单
            document.addEventListener('click', () => {
                dropdownButtons.forEach(({dropdown}) => {
                    document.getElementById(dropdown).classList.add('hidden');
                });
            });

                // 重置按钮
            resetBtnCom.addEventListener('click', () => {
                componentsearchInput.value = '';
                // 重置所有复选框
                document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                    checkbox.checked = true;
                });
                // 显示所有卡片
                const chipCards = document.querySelectorAll('.chip-card');
                chipCards.forEach(card => card.classList.remove('hidden'));
                const manufacturerGroups = document.querySelectorAll('.manufacturer-group');
                manufacturerGroups.forEach(Group => {
                    Group.classList.remove('hidden');
                    const manufacturercounter = Group.querySelector('.supplier-count')
                    const manufacturerproductgroups = Group.querySelectorAll('.manufacturer-products')
                    const manufacturerproductgroup =manufacturerproductgroups[0]
                    const total = manufacturerproductgroup.querySelectorAll('.chip-card').length
                    manufacturercounter.textContent = ` ${total}个产品`;
                });
                document.getElementById('result-count').textContent = `显示 ${Object.keys(productData.Catalogue).length} 个产品`;

            });
        });
    </script>
