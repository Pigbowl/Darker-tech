                    async function handleInterfaceDisable(index, interfaceItem) {
                        if (!interfaceItem.connection || interfaceItem.connection === '-' || interfaceItem.connection === null) {
                            // 未连接，直接禁用
                            interfaceItem.enabled = false;
                            drawInterfaces();
                            updatePropertyPanel();
                            return true;
                        }
                        
                        // 有连接，弹窗确认
                        const confirmed = await showCustomConfirm(`当前接口 "${interfaceItem.name}" 已经被连接，是否确认禁用？`);
                        if (confirmed) {
                            // 打印当前硬件数据
                            
                            // 打印与接口相连的硬件数据
                            if (interfaceItem.connection && interfaceItem.connection !== '-') {
                                const connectionParts = interfaceItem.connection.split(' - ');
                                if (connectionParts.length >= 2) {
                                    const connectedElementName = connectionParts[0];
                                    const connectedInterfaceName = connectionParts.slice(1).join(' - ');
                                    
                                    elementsData.forEach(element => {
                                        if (element.name === connectedElementName) {
                                        }
                                    });
                                }
                            }
                            
                            // 确认禁用
                            model.beginUpdate();
                            try {
                                // 删除硬件上对应的接口图形
                                const children = graph.getChildVertices(activeCell);
                                children.forEach(child => {
                                    if (child.getId() && child.getId().startsWith('interface_') && child.getValue() === interfaceItem.name) {
                                        graph.removeCells([child]);
                                    }
                                });
                                
                                // 删除链接在接口上的连接线
                                const edges = graph.getEdges(activeCell);
                                edges.forEach(edge => {
                                    if (edge.source && edge.source.getValue() === interfaceItem.name) {
                                        graph.removeCells([edge]);
                                    }
                                    if (edge.target && edge.target.getValue() === interfaceItem.name) {
                                        graph.removeCells([edge]);
                                    }
                                });
                                
                                // 查找与该接口相连的其他接口并更新其连接状态
                                if (interfaceItem.connection && interfaceItem.connection !== '-') {
                                    // 分割连接信息，确保正确处理接口名称中包含" - "的情况
                                    const connectionParts = interfaceItem.connection.split(' - ');
                                    if (connectionParts.length >= 2) {
                                        const connectedElementName = connectionParts[0];
                                        // 接口名称可能包含" - "，所以需要将剩余部分重新组合
                                        const connectedInterfaceName = connectionParts.slice(1).join(' - ');
                                        
                                        // 遍历所有元素，找到对应的接口并重置连接状态
                                        elementsData.forEach(element => {
                                            if (element.name === connectedElementName && element.properties && element.properties.interface_list) {
                                                element.properties.interface_list.forEach(iface => {
                                                    if (iface.name === connectedInterfaceName) {
                                                        iface.connection = '-';
                                                    }
                                                });
                                            }
                                        });
                                    }
                                }
                                
                                // 更新该接口的连接对象属性为-
                                interfaceItem.connection = '-';
                                
                                // 禁用接口
                                interfaceItem.enabled = false;
                                
                                // 重新绘制接口
                                drawInterfaces();
                                
                                // 更新属性面板
                                updatePropertyPanel();
                            } finally {
                                model.endUpdate();
                            }
                            return true;
                        }
                        return false;
                    }
                    
                    async function saveInterfaceConfig() {
                        if (!activeCell || !activeCellData) {
                            return;
                        }
                        
                        if (activeCellData.properties && activeCellData.properties.interface_list) {
                            const checkboxes = document.querySelectorAll('.interface-enabled-checkbox');
                            let needDrawInterfaces = false;
                            
                            for (const checkbox of checkboxes) {
                                const index = parseInt(checkbox.dataset.interfaceIndex);
                                const interfaceItem = activeCellData.properties.interface_list[index];
                                
                                if (interfaceItem) {
                                    if (!interfaceItem.enabled && checkbox.checked) {
                                        // 启用接口
                                        interfaceItem.enabled = true;
                                        needDrawInterfaces = true;
                                    } else if (interfaceItem.enabled && !checkbox.checked) {
                                        // 禁用接口，调用处理函数
                                        const disabled = await handleInterfaceDisable(index, interfaceItem);
                                        if (disabled) {
                                            needDrawInterfaces = true;
                                        }
                                    }
                                }
                            }
                            
                            // 只有在需要时才绘制接口
                            if (needDrawInterfaces) {
                                drawInterfaces();
                            }
                        }
                    }
                    
                    // 防止drawInterfaces递归调用的标志
                    let isDrawingInterfaces = false;
                    
                    function drawInterfaces() {
                        // 防止递归调用
                        if (isDrawingInterfaces) {
                            return;
                        }
                        
                        if (!activeCell || !activeCellData || !model || !graph || !parent) {
                            return;
                        }
                        
                        if (!activeCellData.properties || !activeCellData.properties.interface_list) {
                            return;
                        }
                        
                        // 设置标志为 true
                        isDrawingInterfaces = true;
                        
                        // 获取INTERFACE模板
                        const interfaceTemplate = window.ShapeTemplate && window.ShapeTemplate.INTERFACE ? window.ShapeTemplate.INTERFACE : {
                            align: 'center',
                            verticalAlign: 'middle',
                            fillColor: '#ffffff',
                            borderColor: '#000000',
                            rounded: 0,
                            shape: 'rectangle',
                            fontSize: 8,
                            fontColor: '#000000',
                            collapsible: 0,
                            width: 100,
                            height: 20
                        };
                        
                        model.beginUpdate();
                        try {
                            // 获取现有的接口元素
                            const existingInterfaces = [];
                            const children = graph.getChildVertices(activeCell);
                            children.forEach(child => {
                                if (child.getId() && child.getId().startsWith('interface_')) {
                                    existingInterfaces.push(child);
                                }
                            });
                            
                            // 处理被禁用的接口 - 删除对应的图形和位置信息
                            existingInterfaces.forEach(child => {
                                const childId = child.getId();
                                const idx = parseInt(childId.split('_').pop());
                                const interfaceItem = activeCellData.properties.interface_list[idx];
                                
                                if (!interfaceItem || !interfaceItem.enabled) {
                                    // 接口已被禁用，删除对应的图形
                                    graph.removeCells([child]);
                                    // 清除接口位置信息
                                    if (interfaceItem) {
                                        delete interfaceItem.interfaceLeft;
                                        delete interfaceItem.interfaceTop;
                                    }
                                }
                            });
                            
                            // 处理接口列表
                            const interfaceList = activeCellData.properties.interface_list;
                            const enabledInterfaces = interfaceList.filter(item => item.enabled);
                            
                            // 计算硬件尺寸
                            const interfaceHeight = interfaceTemplate.height;
                            const margin = 0; // 左侧贴边，不设置左边距
                            const topPadding = 100; // 顶部距离硬件图形顶部100
                            const bottomPadding = 100; // 底部距离硬件图形底部100
                            const interfaceGap = 30; // 接口间距30
                            
                            // 计算所需的硬件宽度：label宽度 + 两倍的interface模板宽度 + 20
                            // 获取硬件的label宽度，默认为100
                            const labelWidth = activeCellData.labelWidth || 100;
                            const requiredWidth = labelWidth + interfaceTemplate.width * 2 + 20;
                            
                            // 检查是否需要更新硬件宽度
                            if (activeCellData.width < requiredWidth) {
                                activeCellData.width = requiredWidth;
                                // 更新图形的几何属性
                                const cell = model.getCell(activeCellData.id);
                                if (cell) {
                                    const geo = cell.getGeometry();
                                    if (geo) {
                                        geo.width = activeCellData.width;
                                        model.setGeometry(cell, geo);
                                    }
                                }
                            }
                            
                            // 处理每个接口
                            const newlyCreatedInterfaces = [];

                            interfaceList.forEach((item, idx) => {
                                if (item.enabled) {
                                    // 检查接口是否已经存在
                                    const expectedId = 'interface_' + activeCellData.id + '_' + idx;
                                    const existingInterface = existingInterfaces.find(child => {
                                        return child.getId() === expectedId;
                                    });
                                    
                                    if (!existingInterface) {
                                        // 新启用的接口，需要创建
                                        const interfaceName = item.name;
                                        const interfaceWidth = interfaceTemplate.width;
                                        const interfaceHeight = interfaceTemplate.height;
                                        
                                        // 构建接口样式字符串，使用INTERFACE模板
                                        const style = `fillColor=${interfaceTemplate.fillColor};strokeColor=${interfaceTemplate.borderColor};fontColor=${interfaceTemplate.fontColor};fontSize=${interfaceTemplate.fontSize};rounded=${interfaceTemplate.rounded};align=${interfaceTemplate.align};verticalAlign=${interfaceTemplate.verticalAlign};collapsible=${interfaceTemplate.collapsible};resizable=0`;
                                        
                                        // 计算新接口的位置
                                        let x = margin; // 默认左侧贴边
                                        let y = topPadding;
                                        
                                        // 查找已有的左贴边接口
                                        const leftEdgeInterfaces = interfaceList.filter(i => i.enabled && i.closestSide === 'left');
                                        if (leftEdgeInterfaces.length > 0) {
                                            // 找到纵向位置最大的接口
                                            let maxY = 0;
                                            leftEdgeInterfaces.forEach(i => {
                                                if (i.interfaceTop > maxY) {
                                                    maxY = i.interfaceTop;
                                                }
                                            });
                                            // 新接口位置在最大Y下方30
                                            y = maxY + interfaceHeight + interfaceGap;
                                        }
                                        

                                        // 创建接口顶点，ID使用 interface_ 前缀以便识别
                                        const interfaceVertex = graph.insertVertex(
                                            activeCell, 
                                            'interface_' + activeCellData.id + '_' + idx, 
                                            interfaceName, 
                                            x, 
                                            y, 
                                            interfaceWidth, 
                                            interfaceHeight, 
                                            style
                                        );

                                        
                                        // 立即刷新接口图形
                                        graph.refresh(interfaceVertex);
                                        
                                        // 保存接口绘制属性
                                        item.interfaceLeft = x;
                                        item.interfaceTop = y;
                                        item.interfaceIndex = idx;
                                        item.size = interfaceWidth;
                                        item.height = interfaceHeight;
                                        item.color = interfaceTemplate.fillColor;
                                        item.strokeColor = interfaceTemplate.borderColor;
                                        item.fontColor = interfaceTemplate.fontColor;
                                        item.rounded = interfaceTemplate.rounded;
                                        // 设置默认贴边方向
                                        item.closestSide = 'left';
                                        item.rotation = 0;
                                        item.align = 'center';
                                        
                                        // 添加到新创建的接口列表
                                        newlyCreatedInterfaces.push({ cell: interfaceVertex, item: item, idx: idx });
                                        
                                        // 检查父元素的子元素数量
                                        const childCount = graph.getChildVertices(activeCell).length;
                                    }
                                }
                            });
                            
                            // 更新硬件高度
                            if (enabledInterfaces.length > 0) {
                                // 计算所有启用接口的最高和最低纵向位置
                                let minY = Infinity;
                                let maxY = -Infinity;
                                
                                enabledInterfaces.forEach(item => {
                                    if (item.interfaceTop < minY) {
                                        minY = item.interfaceTop;
                                    }
                                    if (item.interfaceTop + item.height > maxY) {
                                        maxY = item.interfaceTop + item.height;
                                    }
                                });
                                
                                // 计算所需的硬件高度
                                const requiredHeight = maxY + bottomPadding;
                                
                                // 如果当前硬件高度不够，增大硬件高度
                                if (activeCellData.height < requiredHeight) {
                                    activeCellData.height = requiredHeight;
                                    // 更新图形的几何属性
                                    const cell = model.getCell(activeCellData.id);
                                    if (cell) {
                                        const geo = cell.getGeometry();
                                        if (geo) {
                                            geo.height = activeCellData.height;
                                            model.setGeometry(cell, geo);
                                        }
                                    }
                                }
                            }
                            

                            
                            // 根据贴边属性更新所有接口位置
                            interfaceList.forEach((item, idx) => {
                                if (item.enabled) {

                                    // 查找现有接口或新创建的接口
                                    let existingInterface = existingInterfaces.find(child => {
                                        return child.getId() === 'interface_' + activeCellData.id + '_' + idx;
                                    });
                                    
                                    // 检查新创建的接口
                                    if (!existingInterface) {
                                        const newInterface = newlyCreatedInterfaces.find(i => i.idx === idx);
                                        if (newInterface) {
                                            existingInterface = newInterface.cell;
                                        }
                                    }
                                    
                                    if (existingInterface) {

                                        const interfaceWidth = interfaceTemplate.width;
                                        const interfaceHeight = interfaceTemplate.height;       
            
                                        // 检查并更新贴边位置
                                        let x = item.interfaceLeft;
                                        let y = item.interfaceTop;
                                        let rotation = item.rotation || 0;
                                        let align = item.align || 'center';
                                        let needUpdate = false;
                                        
                                        // 左侧贴边：保持x=0
                                        if (item.closestSide === 'left') {
                                            if (x !== 0) {
                                                x = 0;
                                                needUpdate = true;
                                            }
                                            rotation = 0;
                                            align = 'left';
                                        }       
                                        // 右侧贴边：更新x位置
                                        else if (item.closestSide === 'right') {
                                            const newX = activeCellData.width - interfaceWidth;
                                            if (x !== newX) {
                                                x = newX;
                                                needUpdate = true;
                                            }
                                            rotation = 0;
                                            align = 'right';
                                        }
                                        // 顶部贴边：接口顶部与父元素顶部对齐
                                        else if (item.closestSide === 'top') {
                                            if (y !== 40){
                                                y = 40;
                                                needUpdate = true;
                                            }
                                            rotation = 90;
                                            align = 'left';
                                        }
                                        // 底部贴边：接口底部与父元素底部对齐
                                        else if (item.closestSide === 'bottom') {
                                            const newY = activeCellData.height - interfaceHeight/2 -interfaceWidth/2;
                                            if (y !== newY) {
                                                y = newY;
                                                needUpdate = true;
                                            }
                                            rotation = -90;
                                            align = 'left';
                                        }
                                        
                                        // 更新接口位置和旋转
                                        if (needUpdate || existingInterface.getGeometry().rotation !== rotation) {
                                            const geo = existingInterface.getGeometry();
                                            if (geo) {
                                                geo.x = x;
                                                geo.y = y;
                                                geo.rotation = rotation;
                                                model.setGeometry(existingInterface, geo);
                                                
                                                // 更新接口样式
                                                const style = existingInterface.getStyle();
                                                let newStyle = style;
                                                
                                                // 更新align属性
                                                if (style.includes('align=')) {
                                                    newStyle = newStyle.replace(/align=([^;]+)/, `align=${align}`);
                                                } else {
                                                    newStyle += `;align=${align}`;
                                                }
                                                
                                                // 更新rotation属性
                                                if (style.includes('rotation=')) {
                                                    newStyle = newStyle.replace(/rotation=([^;]+)/, `rotation=${rotation}`);
                                                } else {
                                                    newStyle += `;rotation=${rotation}`;
                                                }
                                                
                                                existingInterface.setStyle(newStyle);
                                                
                                                // 刷新接口图形
                                                graph.refresh(existingInterface);
                                            }
                                            
                                            // 更新接口数据
                                            item.interfaceLeft = x;
                                            item.interfaceTop = y;
                                            item.rotation = rotation;
                                            item.align = align;
                                        }
                                    }
                                }
                            });
                            
                            // 刷新硬件图形
                            graph.refresh(activeCell);
                            

                        } finally {
                            model.endUpdate();
                            // 重置标志为 false
                            isDrawingInterfaces = false;
                        }
                    }
                    
                    // 设置接口拖拽功能
                    function setupInterfaceDrag() {
                        if (!graph) return;
                        
                        window.isDragging = false;
                        
                        var mxEvent = mxClient.mxEvent || window.mxEvent;
                        if (!mxEvent) return;
                        
                        const dragEndEvents = ['moveEnd', 'MOVE_END', 'cellsMoved', 'CELLS_MOVED', 'resize', 'RESIZE', 'cellsResized', 'CELLS_RESIZED'];
                        
                        for (const eventName of dragEndEvents) {
                            if (mxEvent[eventName]) {
                                graph.addListener(mxEvent[eventName], function(sender, evt) {
                                    const cell = evt.getProperty('cell') || evt.getProperty('cells') || evt.getProperty('cells')[0];
                                    const cellToProcess = Array.isArray(cell) ? cell[0] : cell;
                                    
                                    // 检查是否是硬件顶点大小变化
                                    if (cellToProcess && !cellToProcess.getId().startsWith('interface_')) {
                                        const cellId = cellToProcess.getId();
                                        const cellData = elementsData.find(item => item.id === cellId);
                                        if (cellData) {
                                            const oldWidth = cellData.width || 0;
                                            const oldHeight = cellData.height || 0;
                                            const newWidth = cellToProcess.getGeometry().width;
                                            const newHeight = cellToProcess.getGeometry().height;
                                            
                                            // 检查大小是否变化
                                            if (oldWidth !== newWidth || oldHeight !== newHeight) {
                                                // 更新硬件数据
                                                cellData.width = newWidth;
                                                cellData.height = newHeight;
                                                
                                                // 重新绘制接口以更新贴边位置
                                                drawInterfaces();
                                            }
                                        }
                                    }
                                    
                                    if (cellToProcess && cellToProcess.value !== undefined) {
                                        if (cellToProcess.value && typeof cellToProcess.value === 'string') {
                                            const parentCell = cellToProcess.getParent();
                                            if (parentCell && parentCell !== graph.getDefaultParent()) {
                                                const cellId = cellToProcess.getId();
                                                if (cellId && cellId.startsWith('interface_')) {
                                                    const x = cellToProcess.getGeometry().x;
                                                const y = cellToProcess.getGeometry().y;
                                                const width = cellToProcess.getGeometry().width;
                                                const height = cellToProcess.getGeometry().height;
                                                
                                                const parentWidth = parentCell.getGeometry().width;
                                                const parentHeight = parentCell.getGeometry().height;
                                                
                                                // 计算接口每条边的中点
                                                const leftEdgeCenterX = x;
                                                const leftEdgeCenterY = y + height / 2;
                                                const rightEdgeCenterX = x + width;
                                                const rightEdgeCenterY = y + height / 2;
                                                const topEdgeCenterX = x + width / 2;
                                                const topEdgeCenterY = y;
                                                const bottomEdgeCenterX = x + width / 2;
                                                const bottomEdgeCenterY = y + height;
                                                
                                                // 计算每条边的中点到对应硬件边的距离
                                                const distanceLeft = leftEdgeCenterX;
                                                const distanceRight = parentWidth - rightEdgeCenterX;
                                                const distanceTop = topEdgeCenterY;
                                                const distanceBottom = parentHeight - bottomEdgeCenterY;
                                                
                                                let closestSide = 'left';
                                                let minDistance = distanceLeft;
                                                
                                                if (distanceRight < minDistance) {
                                                    minDistance = distanceRight;
                                                    closestSide = 'right';
                                                }
                                                if (distanceTop < minDistance) {
                                                    minDistance = distanceTop;
                                                    closestSide = 'top';
                                                }
                                                if (distanceBottom < minDistance) {
                                                    minDistance = distanceBottom;
                                                    closestSide = 'bottom';
                                                }
                                                    
                                                    model.beginUpdate();
                                                    try {
                                                        let newX = x;
                                                        let newY = y;
                                                        let rotation = 0;
                                                        let align = 'center';
                                                        
                                                        if (closestSide === 'left') {
                                                            newX = 0;
                                                            rotation = 0;
                                                            align = 'center';
                                                        } else if (closestSide === 'right') {
                                                            newX = parentWidth - width;
                                                            rotation = 0;
                                                            align = 'right';
                                                        } else if (closestSide === 'top') {
                                                            newY = width/2 - height/2;
                                                            rotation = 90;
                                                            align = 'left';
                                                        } else if (closestSide === 'bottom') {
                                                            newY = parentHeight - height/2 - width/2;
                                                            rotation = -90;
                                                            align = 'left';
                                                        }
                                                        
                                                        cellToProcess.getGeometry().x = newX;
                                                        cellToProcess.getGeometry().y = newY;
                                                        cellToProcess.getGeometry().rotation = rotation;
                                                        
                                                        // 更新接口样式
                                                        const style = cellToProcess.getStyle();
                                                        let newStyle = style;
                                                        
                                                        // 更新align属性
                                                        if (style.includes('align=')) {
                                                            newStyle = newStyle.replace(/align=([^;]+)/, `align=${align}`);
                                                        } else {
                                                            newStyle += `;align=${align}`;
                                                        }
                                                        
                                                        // 更新rotation属性
                                                        if (style.includes('rotation=')) {
                                                            newStyle = newStyle.replace(/rotation=([^;]+)/, `rotation=${rotation}`);
                                                        } else {
                                                            newStyle += `;rotation=${rotation}`;
                                                        }
                                                        
                                                        cellToProcess.setStyle(newStyle);
                                                        
                                                        graph.refresh(cellToProcess);
                                                        
                                                        const parentId = parentCell.getId();
                                                        const parentData = elementsData.find(item => item.id === parentId);
                                                        if (parentData && parentData.properties && parentData.properties.interface_list) {
                                                            const interfaceName = cellToProcess.value;
                                                            const interfaceData = parentData.properties.interface_list.find(item => item.name === interfaceName);
                                                            if (interfaceData) {
                                                                interfaceData.interfaceLeft = newX;
                                                                interfaceData.interfaceTop = newY;
                                                                interfaceData.closestSide = closestSide;
                                                                interfaceData.rotation = rotation;
                                                                interfaceData.align = align;
                                                            }
                                                        }
                                                        
                                                        updateConnectionsForInterface(parentId);
                                                    } finally {
                                                        model.endUpdate();
                                                    }
                                                } else {
                                                    handleElementParentChange(cellToProcess, parentCell);
                                                }
                                            } else {
                                                const cellId = cellToProcess.getId();
                                                if (cellId && !cellId.startsWith('interface_')) {
                                                    updateConnectionsForElement(cellId);
                                                }
                                            }
                                        }
                                    }
                                    
                                    const dragEndCell = evt.getProperty('cell') || evt.getProperty('cells') || evt.getProperty('cells')[0];
                                    const dragEndCellToProcess = Array.isArray(dragEndCell) ? dragEndCell[0] : dragEndCell;
                                    
                                    if (dragEndCellToProcess && dragEndCellToProcess.value !== undefined) {
                                        if (dragEndCellToProcess.value && typeof dragEndCellToProcess.value === 'string') {
                                            const dragEndCellId = dragEndCellToProcess.getId();
                                            if (dragEndCellId && !dragEndCellId.startsWith('interface_')) {
                                                const dragEndCellData = elementsData.find(e => e.id === dragEndCellId);
                                                
                                                if (dragEndCellData && (dragEndCellData.ItemType === 'SoC' || dragEndCellData.ItemType === 'MCU')) {
                                                    const pcbaElements = elementsData.filter(e => e.ItemType === 'PCBA');
                                                    let enteredPcba = null;
                                                    let enteredPcbaCell = null;
                                                    
                                                    for (const pcba of pcbaElements) {
                                                        const pcbaCell = model.getCell(pcba.id);
                                                        if (pcbaCell && isElementGeometricallyInside(dragEndCellToProcess, pcbaCell)) {
                                                            enteredPcba = pcba;
                                                            enteredPcbaCell = pcbaCell;
                                                            break;
                                                        }
                                                    }
                                                    
                                                    if (enteredPcba && enteredPcbaCell) {
                                                        const childId = dragEndCellToProcess.getId();
                                                        const parentId = enteredPcbaCell.getId();
                                                        
                                                        const childData = elementsData.find(e => e.id === childId);
                                                        const parentData = elementsData.find(e => e.id === parentId);
                                                        
                                                        if (childData && parentData) {
                                                            if (childData.parent === parentId) {
                                                                return;
                                                            }
                                                        }
                                                        
                                                        model.beginUpdate();
                                                        try {
                                                            const childGeo = dragEndCellToProcess.getGeometry();
                                                            const parentGeo = enteredPcbaCell.getGeometry();
                                                            
                                                            const originalChildX = childGeo.x;
                                                            const originalChildY = childGeo.y;
                                                            const childWidth = childGeo.width;
                                                            const childHeight = childGeo.height;
                                                            
                                                            
                                                            if (childData && parentData) {
                                                                if (childData.parent && childData.parent !== '/') {
                                                                    const oldParentData = elementsData.find(e => e.id === childData.parent);
                                                                    if (oldParentData && oldParentData.children) {
                                                                        oldParentData.children = oldParentData.children.filter(id => id !== childId);
                                                                    }
                                                                }
                                                                
                                                                childData.parent = parentId;
                                                                
                                                                if (!parentData.children) {
                                                                    parentData.children = [];
                                                                }
                                                                if (!parentData.children.includes(childId)) {
                                                                    parentData.children.push(childId);
                                                                }
                                                                
                                                                if (childGeo && parentGeo) {
                                                                    childData.relativePosition = {
                                                                        x: originalChildX + childGeo.width / 2 - parentGeo.width / 2,
                                                                        y: originalChildY + childGeo.height / 2 - parentGeo.height / 2
                                                                    };
                                                                }
                                                            }
                                                            
                                                            const relativeX = originalChildX - parentGeo.x;
                                                            const relativeY = originalChildY - parentGeo.y;
                                                            
                                                            // 更新 childData.position 为相对位置
                                                            if (childData) {
                                                                childData.position = {
                                                                    x: relativeX,
                                                                    y: relativeY
                                                                };
                                                            }
                                                            
                                                            const oldParent = dragEndCellToProcess.getParent();
                                                            if (oldParent) {
                                                                model.remove(dragEndCellToProcess, false);
                                                            }
                                                            
                                                            childGeo.x = relativeX;
                                                            childGeo.y = relativeY;
                                                            childGeo.width = childWidth;
                                                            childGeo.height = childHeight;
                                                            
                                                            model.add(enteredPcbaCell, dragEndCellToProcess);
                                                            
                                                            graph.view.refresh();
                                                            
                                                            if (childData && parentData) {
                                                                showCustomModal(`成功建立父子关系！\nSOC: ${childData.name}\nPCBA: ${parentData.name}`, 'success');
                                                            }
                                                        } finally {
                                                            model.endUpdate();
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                    
                                    clearParentHighlight(true);
                                    
                                    window.currentPcbaElement = null;
                                    window.currentSocElement = null;
                                    window.currentSocCell = null;
                                });
                            }
                        }
                        
                        var mxGraphHandler = mxClient.mxGraphHandler || window.mxGraphHandler;
                        if (mxGraphHandler && mxGraphHandler.prototype) {
                            if (mxGraphHandler.prototype.start) {
                                var originalStart = mxGraphHandler.prototype.start;
                                mxGraphHandler.prototype.start = function(cell, x, y) {
                                    originalStart.apply(this, arguments);
                                    window.isDragging = true;
                                };
                            }
                            
                            if (mxGraphHandler.prototype.mouseMove) {
                                var originalMouseMove = mxGraphHandler.prototype.mouseMove;
                                mxGraphHandler.prototype.mouseMove = function(sender, me) {
                                    originalMouseMove.apply(this, arguments);
                                    
                                    if (window.isDragging && this.cell && this.cell.isVertex() && this.currentPoint && this.first) {
                                        const cell = this.cell;
                                        const cellId = cell.getId();
                                        if (cellId && !cellId.startsWith('interface_')) {
                                            const cellData = elementsData.find(e => e.id === cellId);
                                            if (cellData && (cellData.ItemType === 'SoC' || cellData.ItemType === 'MCU')) {
                                                const graph = this.graph;
                                                const scale = graph.getView().scale;
                                                
                                                const dx = (this.currentPoint.x - this.first.x) / scale;
                                                const dy = (this.currentPoint.y - this.first.y) / scale;
                                                
                                                const tempGeo = cell.getGeometry().clone();
                                                tempGeo.x += dx;
                                                tempGeo.y += dy;
                                                
                                                const tempCell = {
                                                    getId: () => cellId,
                                                    getGeometry: () => tempGeo,
                                                    isVertex: () => true
                                                };
                                                
                                                updateDragHighlight(tempCell, cellData);
                                            }
                                        }
                                    }
                                };
                            }
                            
                            if (mxGraphHandler.prototype.mouseUp) {
                                var originalMouseUp = mxGraphHandler.prototype.mouseUp;
                                mxGraphHandler.prototype.mouseUp = function(sender, me) {
                                    originalMouseUp.apply(this, arguments);
                                    window.currentPcbaElement = null;
                                    window.currentSocElement = null;
                                    window.currentSocCell = null;
                                    window.isDragging = false;
                                };
                            }
                        }
                        
                        function updateDragHighlight(cell, cellData) {
                            const pcbaElements = elementsData.filter(e => e.ItemType === 'PCBA');
                            let enteredPcba = null;
                            
                            for (const pcba of pcbaElements) {
                                const pcbaCell = model.getCell(pcba.id);
                                if (pcbaCell && isElementGeometricallyInside(cell, pcbaCell)) {
                                    enteredPcba = pcba;
                                    break;
                                }
                            }
                            
                            if (enteredPcba) {
                                window.currentPcbaElement = enteredPcba;
                                window.currentSocElement = cellData;
                                window.currentSocCell = cell;
                            } else {
                                window.currentPcbaElement = null;
                                window.currentSocElement = cellData;
                                window.currentSocCell = cell;
                            }
                        }
                        

                    }
                    
                    function handleElementParentChange(childCell, parentCell) {
                        const childId = childCell.getId();
                        const parentId = parentCell.getId();
                        

                        
                        const childData = elementsData.find(e => e.id === childId);
                        const parentData = elementsData.find(e => e.id === parentId);
                        
                        if (!childData || !parentData) {

                            return;
                        }
                        

                        
                        if (childData.parent !== parentId) {
                            if (childData.parent && childData.parent !== '/') {

                                const oldParentData = elementsData.find(e => e.id === childData.parent);
                                if (oldParentData && oldParentData.children) {
                                    oldParentData.children = oldParentData.children.filter(id => id !== childId);
                                }
                            }
                            
                            childData.parent = parentId;

                            
                            if (!parentData.children) {
                                parentData.children = [];
                            }
                            if (!parentData.children.includes(childId)) {
                                parentData.children.push(childId);

                            }
                            
                            const childGeo = childCell.getGeometry();
                            const parentGeo = parentCell.getGeometry();
                            if (childGeo && parentGeo) {
                                childData.relativePosition = {
                                    x: childGeo.x + childGeo.width / 2 - parentGeo.width / 2,
                                    y: childGeo.y + childGeo.height / 2 - parentGeo.height / 2
                                };

                            }
                        }
                        
                        updateConnectionsForElement(childId);
                    }
                    
                    function updateElementParentData(cell) {
                        const cellId = cell.getId();
                        const cellData = elementsData.find(e => e.id === cellId);
                        if (!cellData) return;
                        
                        const geo = cell.getGeometry();
                        if (geo) {
                            cellData.position.x = geo.x;
                            cellData.position.y = geo.y;
                        }
                    }
                    
                    function isElementGeometricallyInside(childCell, parentCell) {
                        if (!childCell || !parentCell) return false;
                        
                        const childGeo = childCell.getGeometry();
                        const parentGeo = parentCell.getGeometry();
                        
                        if (!childGeo || !parentGeo) return false;
                        
                        const childLeft = childGeo.x;
                        const childRight = childGeo.x + childGeo.width;
                        const childTop = childGeo.y;
                        const childBottom = childGeo.y + childGeo.height;
                        
                        const parentLeft = parentGeo.x;
                        const parentRight = parentGeo.x + parentGeo.width;
                        const parentTop = parentGeo.y;
                        const parentBottom = parentGeo.y + parentGeo.height;
                        
                        const isInside = 
                            childLeft >= parentLeft &&
                            childRight <= parentRight &&
                            childTop >= parentTop &&
                            childBottom <= parentBottom;
                        
                        
                        return isInside;
                    }
                    
                    function highlightParentElement(parentCell) {
                        if (!parentCell || !graph) return;
                        
                        const style = parentCell.getStyle() || '';
                        
                        const newStyle = style + ';strokeColor=#8b5cf6;strokeWidth=3';
                        model.setStyle(parentCell, newStyle);
                        
                        graph.view.refresh(parentCell);
                    }
                    
                    function clearParentHighlight(clearAll = false) {
                        elementsData.forEach(elementData => {
                            if (!clearAll && window.currentPcbaElement && elementData.id === window.currentPcbaElement.id) {
                                return;
                            }
                            
                            const cell = model.getCell(elementData.id);
                            if (cell && cell.isVertex()) {
                                let style = cell.getStyle();
                                if (style) {
                                    style = style.replace(/;strokeColor=#8b5cf6[^;]*/g, '');
                                    style = style.replace(/;strokeWidth=[^;]*/g, '');
                                    style = style.replace(/^strokeColor=#8b5cf6[^;]*/, '');
                                    style = style.replace(/^strokeWidth=[^;]*/, '');
                                    model.setStyle(cell, style);
                                }
                            }
                        });
                    }
                    
                    function updateConnectionsForInterface(elementId) {
                        const elementData = elementsData.find(e => e.id === elementId);
                        if (!elementData) return;
                        
                        connectionsData.forEach(connData => {
                            if (connData.sourceId === elementId || connData.targetId === elementId) {
                                updateConnectionLine(connData);
                            }
                        });
                    }
                    
                    function updateConnectionsForElement(elementId) {
                        const elementData = elementsData.find(e => e.id === elementId);
                        if (!elementData) return;
                        
                        const geo = model.getCell(elementId).getGeometry();
                        if (geo) {
                            elementData.position.x = geo.x;
                            elementData.position.y = geo.y;
                        }
                        
                        connectionsData.forEach(connData => {
                            if (connData.sourceId === elementId || connData.target === elementId) {
                                updateConnectionLine(connData);
                            }
                        });
                    }
                    
                    function updateConnectionLine(connData) {
                        const edge = model.getCell(connData.id);
                        if (!edge) return;
                        
                        const sourceData = elementsData.find(e => e.id === connData.sourceId);
                        const targetData = elementsData.find(e => e.id === connData.targetId);
                        if (!sourceData || !targetData) return;
                        
                        const sourceConnPoint = getInterfaceConnectionPoint(sourceData, connData.sourceInterfaceIndex);
                        const targetConnPoint = getInterfaceConnectionPoint(targetData, connData.targetInterfaceIndex);
                        
                        if (!sourceConnPoint || !targetConnPoint) return;
                        
                        connData.sourceConnectionPoint = sourceConnPoint;
                        connData.targetConnectionPoint = targetConnPoint;
                        
                        let styleParts = [
                            'strokeColor=' + connData.color,
                            'strokeWidth=2',
                            'endArrow=none',
                            'edgeStyle=orthogonalEdgeStyle',
                            'sourcePortConstraint=none',
                            'targetPortConstraint=none'
                        ];
                        
                        styleParts.push('exitX=' + sourceConnPoint.x);
                        styleParts.push('exitY=' + sourceConnPoint.y);
                        styleParts.push('exitDx=' + sourceConnPoint.dx);
                        styleParts.push('exitDy=' + sourceConnPoint.dy);
                        
                        styleParts.push('entryX=' + targetConnPoint.x);
                        styleParts.push('entryY=' + targetConnPoint.y);
                        styleParts.push('entryDx=' + targetConnPoint.dx);
                        styleParts.push('entryDy=' + targetConnPoint.dy);
                        
                        const newStyle = styleParts.join(';');
                        model.setStyle(edge, newStyle);
                    }
                        
                    document.getElementById('element-color').addEventListener('input', function(e) {
                        if (!activeCell || !activeCellData || !activeCell.isVertex() || !model) return;
                        
                        activeCellData.color = e.target.value;
                        
                        model.beginUpdate();
                        try {
                            const style = activeCell.getStyle();
                            const newStyle = style.replace(/fillColor=[^;]*/, 'fillColor=' + e.target.value);
                            model.setStyle(activeCell, newStyle);
                        } finally {
                            model.endUpdate();
                        }
                        });

                    // 最大化/恢复画布功能
                    function toggleCanvasMaximize() {
                        isCanvasMaximized = !isCanvasMaximized;
                        const body = document.body;
                        const maximizeBtn = document.getElementById('maximize-button');
                        const maximizeIcon = maximizeBtn.querySelector('i');
                        const maximizeText = maximizeBtn.querySelector('span');
                        const architeah = document.getElementById('architeah');
                        const panelToggleBtn = document.getElementById('panel-toggle-btn');
                        
                        if (isCanvasMaximized) {
                            // 切换到最大化状态
                            body.classList.add('canvas-maximized');
                            maximizeIcon.className = 'fa fa-compress';
                            maximizeText.textContent = '原始大小';
                            maximizeBtn.title = '恢复原始大小';
                            
                            // 默认隐藏属性面板
                            architeah.classList.remove('panel-visible');
                            panelToggleBtn.classList.remove('panel-visible');
                            
                            // 调整画布大小

                            }
                        } else {

                            maximizeIcon.className = 'fa fa-expand';
                            maximizeText.textContent = '最大化';
                            maximizeBtn.title = '最大化画布';
                            
                            // 移除面板的特殊样式
                            architeah.classList.remove('panel-visible');
                            panelToggleBtn.classList.remove('panel-visible');
                            
                            // 恢复画布大小
                            if (graph) {
                                graph.container.style.height = '100%';
                                graph.refresh();
                            }
                        }
                    }
                    
                    // 切换属性面板显示/隐藏
                    function togglePropertyPanel() {
                        if (!isCanvasMaximized) return;
                        
                        const architeah = document.getElementById('architeah');

                        architeah.classList.toggle('panel-visible');

                    // 属性面板切换按钮事件

                        togglePropertyPanel();
                    });
                    
                    // 键盘快捷键支持
