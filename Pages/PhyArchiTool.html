    <script>
        // 设置 mxGraph 图标路径为空，避免 404 错误
        var mxImageBasePath = '';
        
        // 拦截 XMLHttpRequest，阻止对图标文件的请求
        var originalXHR = XMLHttpRequest;
        XMLHttpRequest = function() {
            var xhr = new originalXHR();
            var originalOpen = xhr.open;
            xhr.open = function(method, url, async, user, password) {
                // 检查是否是图标文件请求
                if (url.includes('expanded.gif') || url.includes('collapsed.gif') || url.includes('images/')) {
                    // 模拟成功响应，避免 404 错误
                    this._isIconRequest = true;
                }
                return originalOpen.apply(this, arguments);
            };
            var originalSend = xhr.send;
            xhr.send = function(data) {
                if (this._isIconRequest) {
                    // 模拟成功响应
                    setTimeout(() => {
                        this.readyState = 4;
                        this.status = 200;
                        this.statusText = 'OK';
                        if (this.onreadystatechange) {
                            this.onreadystatechange();
                        }
                    }, 0);
                } else {
                    return originalSend.apply(this, arguments);
                }
            };
            return xhr;
        };
        XMLHttpRequest.prototype = originalXHR.prototype;
        XMLHttpRequest.constructor = XMLHttpRequest;
        
        // 拦截 fetch 请求，阻止对图标文件的请求
        if (window.fetch) {
            var originalFetch = window.fetch;
            window.fetch = function(url, options) {
                if (url.includes('expanded.gif') || url.includes('collapsed.gif') || url.includes('images/')) {
                    // 模拟成功响应，避免 404 错误
                    return Promise.resolve(new Response('', { status: 200 }));
                }
                return originalFetch(url, options);
            };
        }
    </script>

    <style>
            /* 自定义鼠标效果样式 */
            .custom-cursor {
                position: fixed;
                pointer-events: none;
                z-index: 99999;
                transform: translate(-50%, -50%);
            }

            /* 向下箭头跳动动画 */
            .arrow-cursor {
                width: 40px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 32px;
                color: #f08c00;
                animation: bounceArrow 0.6s ease-in-out infinite;
                text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            }

            @keyframes bounceArrow {
                0%, 100% {
                    transform: translate(-50%, -50%) translateY(0) scale(1);
                }
                50% {
                    transform: translate(-50%, -50%) translateY(-10px) scale(1.1);
                }
            }

            /* 插头插拔动画 */
            .plug-cursor {
                width: 60px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .plug-left, .plug-right {
                width: 20px;
                height: 28px;
                background: #4CAF50;
                border-radius: 3px;
                position: absolute;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            }

            .plug-left {
                left: 5px;
                top: 50%;
                transform: translateY(-50%);
                animation: plugLeft 0.8s ease-in-out infinite;
            }

            .plug-right {
                right: 5px;
                top: 50%;
                transform: translateY(-50%);
                animation: plugRight 0.8s ease-in-out infinite;
            }

            .plug-left::after, .plug-right::after {
                content: '';
                position: absolute;
                width: 6px;
                height: 12px;
                background: #2E7D32;
                border-radius: 2px;
                top: 50%;
                transform: translateY(-50%);
            }

            .plug-left::after {
                right: -4px;
            }

            .plug-right::after {
                left: -4px;
            }

            @keyframes plugLeft {
                0%, 100% {
                    transform: translateY(-50%) translateX(0);
                }
                50% {
                    transform: translateY(-50%) translateX(8px);
                }
            }

            @keyframes plugRight {
                0%, 100% {
                    transform: translateY(-50%) translateX(0);
                }
                50% {
                    transform: translateY(-50%) translateX(-8px);
                }
            }

            /* 连接模式下隐藏所有默认光标 */
            body.connection-mode-active,
            body.connection-mode-active *,
            body.connection-mode-active *::before,
            body.connection-mode-active *::after {
                cursor: none !important;
            }

            /* 最大化模式下属性面板样式 */
            body.canvas-maximized #architeah {
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                bottom: 0 !important;

                z-index: 10000 !important;

                transition: transform 0.3s ease-in-out;
                margin: 0 !important;

                border-right: 1px solid rgba(99, 102, 241, 0.3) !important;
            }
            
            /* 属性面板展开状态 */
            body.canvas-maximized #architeah.panel-visible {
                transform: translateX(0);
            }
            
            /* 属性面板切换按钮 */
            #panel-toggle-btn {
                position: fixed;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                z-index: 10001;
                background: #4f46e5;
                color: white;

                padding: 8px 4px;

                writing-mode: vertical-rl;
                text-orientation: mixed;
                transition: left 0.3s ease-in-out;
                display: none;
            }
            
            body.canvas-maximized #panel-toggle-btn {
                display: block;
            }

                left: 436px;
            }
            
            body.canvas-maximized #archidemo {
                width: 100% !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;

        </style>

            <script>
                let elementTypes = {};

                function groupProductsByManufacturer(productINFO) {
                    const soc_manufacturerData = {};
                    const mcu_manufacturerData = {};
                    Object.keys(productINFO).forEach(key => {
                        const product = productINFO[key];
                        const manufacturer = product.Supplier_Name.Name || '未知厂商';
                        const type = product.Type || '未知类型';
                        if (type === 'SoC') {
                            if (!soc_manufacturerData[manufacturer]) {
                                soc_manufacturerData[manufacturer] = [];
                            }
                            soc_manufacturerData[manufacturer].push(product);
                        } else if (type === 'MCU') {
                            if (!mcu_manufacturerData[manufacturer]) {
                                mcu_manufacturerData[manufacturer] = [];
                            }
                            mcu_manufacturerData[manufacturer].push(product);
                        }
                    });
                    return { soc_manufacturerData, mcu_manufacturerData };
                }

                function getcomponent() {
                    return new Promise((resolve, reject) => {
                        const command = ip + '/extract_item_group';
                        fetch(command, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                table_name: "calculator"
                            })
                        })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP错误: ${response.status}`);
                            }
                            return response.json();
                        })
                        .then(data => {
                            if (data.success) {
                                const chipset_catalogue = JSON.parse(data.output).Catalogue;
                                const { soc_manufacturerData, mcu_manufacturerData } = groupProductsByManufacturer(chipset_catalogue);
                                
                                elementTypes = {
                                    'PCBA': { shape: 'rectangle', color: '#eeeeee', type: 'PCBA', width: 500, height: 500 },
                                    'SoC': { 
                                        shape: 'rectangle', 
                                        color: '#0066ff',
                                        type: 'SoC',
                                        width: 150,
                                        height: 80,
                                        subTypes: soc_manufacturerData
                                    },
                                    'MCU': { shape: 'rectangle', color: '#10b981', type: 'MCU', width: 80, height: 40, subTypes: mcu_manufacturerData },
                                    'CAM': { shape: 'circle', color: '#8b5cf6', type: 'CAM', radius: 40 },
                                };
                                
                                // 打印获取并分类后的数据

                                
                                resolve(elementTypes);
                            } else {

                                reject(new Error("API返回失败"));
                            }
                        })
                        .catch(error => {
                            console.error("请求过程中出错:", error);
                            reject(error);
                        });
                    });
                }

                document.addEventListener('DOMContentLoaded', function() {
                    const archidemo = document.getElementById('archidemo');
                    const graphContainer = document.getElementById('graph-container');
                    const shapeMenu = document.getElementById('shape-menu');
                    const maximizeButton = document.getElementById('maximize-button');

                    // 标签切换逻辑
                    const tabBtns = document.querySelectorAll('.tab-btn');
                    const tabPanels = document.querySelectorAll('.tab-panel');
                    const architeahPanel = document.getElementById('architeah');

                    tabBtns.forEach(btn => {
                        btn.addEventListener('click', function() {
                            const targetTab = this.dataset.tab;

                            // 更新按钮样式
                            tabBtns.forEach(b => {
                                b.classList.remove('active');
                            });
                            this.classList.add('active');

                            // 切换面板显示
                            tabPanels.forEach(panel => {
                                panel.classList.add('hidden');
                            });

                    function initMxGraph() {
                        // 覆盖 mxUtils.loadImage 函数，避免加载图标文件
                        if (typeof mxUtils !== 'undefined' && typeof mxUtils.loadImage === 'function') {
                            const originalLoadImage = mxUtils.loadImage;
                            mxUtils.loadImage = function(url, loadHandler, errorHandler) {
                                // 检查是否是 expanded.gif 或其他图标文件
                                if (url.includes('expanded.gif') || url.includes('collapsed.gif') || url.includes('images/')) {
                                    // 返回一个空图像，避免 404 错误
                                    const img = new Image();
                                    if (loadHandler) {
                                        loadHandler(img);
                                    }
                                    return img;
                                }
                                // 对于其他图像，使用原始函数
                                return originalLoadImage(url, loadHandler, errorHandler);
                            };
                        }
                        
                        if (!mxClient.isBrowserSupported()) {
                            mxUtils.error('浏览器不支持mxGraph!', 200, false);
                        } else {
                            var mxEvent = mxClient.mxEvent || window.mxEvent;
                            var mxGraphHandler = mxClient.mxGraphHandler || window.mxGraphHandler;
                            var mxEdgeHandler = mxClient.mxEdgeHandler || window.mxEdgeHandler;
                            var mxRubberband = mxClient.mxRubberband || window.mxRubberband;
                            mxPoint = mxClient.mxPoint || window.mxPoint;
                            
                            graph = new mxGraph(graphContainer);
                            model = graph.getModel();
                            parent = graph.getDefaultParent();
                            
                            graph.setPanning(true);
                            graph.panningHandler.useLeftButtonForPanning = true;
                            graph.panningHandler.ignoreCell = false; // 不忽略单元格，点击元素时移动元素而不是画布
                            graph.setTooltips(true);
                            graph.setConnectable(false);
                            graph.setResizeContainer(false);
                            graph.setDropEnabled(true);
                            graph.setAllowDanglingEdges(false);
                            
                            graph.setCellsResizable(true);
                            
                            // 设置画布最小尺寸和自动扩展
                            graph.minimumGraphSize = new mxRectangle(0, 0, 800, 600);
                            graph.autoExtend = true;
                            graph.autoScroll = true;
                            
                            // 设置缩放以鼠标位置为中心
                            graph.centerZoom = true;
                            
                            // 检查 mxGraphHandler 和 mxEdgeHandler 是否存在
                            if (typeof mxGraphHandler !== 'undefined' && mxGraphHandler.prototype) {
                                mxGraphHandler.prototype.guidesEnabled = true;
                            }
                            
                            if (typeof mxEdgeHandler !== 'undefined' && mxEdgeHandler.prototype) {
                                mxEdgeHandler.prototype.snapToTerminals = true;
                                mxEdgeHandler.prototype.addEnabled = false;
                                mxEdgeHandler.prototype.removeEnabled = false;
                            }
                            
                            graph.keepSelectionVisibleOnZoom = true;
                            
                            // 禁用折叠/展开功能
                            graph.foldingEnabled = false;
                            graph.swimlaneRequired = false;
                            
                            // 设置自定义渲染函数，移除折叠图标
                            var originalGetFoldingIcon = graph.getFoldingIcon;
                            graph.getFoldingIcon = function(state) {
                                return null; // 不返回任何图标
                            };
                            
                            // 检查 mxEvent 是否存在
                            if (typeof mxEvent !== 'undefined' && mxEvent.CHANGE) {
                                graph.getSelectionModel().addListener(mxEvent.CHANGE, function(sender, evt) {

                                    // 使用 getSelectionCell() 获取当前选中的元素，而不是依赖 evt.getProperty('added')
                                    const selectedCell = graph.getSelectionCell();

                                    if (selectedCell) {
                                        selectCell(selectedCell);
                                    } else {
                                        activeCell = null;
                                        activeCellData = null;
                                        updatePropertyPanel();
                                    }
                                });
                            }
                            
                            // 检查 mxEvent 是否存在
                            if (typeof mxEvent !== 'undefined' && mxEvent.CLICK) {
                                graph.addListener(mxEvent.CLICK, function(sender, evt) {
                                const cell = evt.getProperty('cell');

                                if (isConnectionMode) {
                                    // 连接模式下，处理连接逻辑
                                    if (cell && cell.isVertex()) {
                                        const targetId = cell.getId();
                                        if (targetId !== connectionSourceId) {
                                            createConnectionBetweenElements(connectionSourceId, targetId);
                                        }
                                    }
                                    exitConnectionMode();
                                } else {
                                    // 正常模式下，通过 mxGraph API 设置选择
                                    // 这样 CHANGE 事件会正确触发，统一处理选择更新
                                    if (cell) {
                                        graph.setSelectionCell(cell);
                                    } else {
                                        graph.clearSelection();
                                    }
                                }
                            });
                            }
                            
                            // 检查 mxEvent 是否存在
                            if (typeof mxEvent !== 'undefined' && mxEvent.DOUBLE_CLICK) {
                                graph.addListener(mxEvent.DOUBLE_CLICK, function(sender, evt) {
                                    evt.consume();
                                });
                            }
                            
                            // 检查 mxRubberband 是否存在
                            if (typeof mxRubberband !== 'undefined') {
                                const rubberband = new mxRubberband(graph);
                            }
                            
                            var zoomFactor = 1.2;

                                } else {
                                    graph.zoomOut();
                                }
                            });
                            
                            graph.popupMenuHandler.factoryMethod = function(menu, cell, evt) {
                            };
                            
                            // 设置接口拖拽功能
                            setupInterfaceDrag();
                        }
                    }

                    function selectCell(cell) {


                        activeCell = cell;


                        if (cell.isEdge()) {
                            const edgeId = cell.getId();
                            activeCellData = connectionsData.find(c => c.id === edgeId);
                        } else {
                            let vertexId = cell.getId();
                            let interfaceIndex = -1;

                            // 如果点击的是接口子元素（ID格式：interface_elem_X_Y），获取父元素的ID和接口索引
                            if (vertexId && vertexId.startsWith('interface_')) {
                                const parts = vertexId.split('_');
                                if (parts.length >= 4) {
                                    // 格式：interface_elem_1_0 -> elem_1, 索引 0
                                    vertexId = parts[1] + '_' + parts[2];
                                    interfaceIndex = parseInt(parts[3]);
                                }
                            }

                            // 获取父元素数据
                            const parentData = elementsData.find(e => e.id === vertexId);

                            if (interfaceIndex >= 0 && parentData && parentData.properties && parentData.properties.interface_list) {
                                // 如果是接口元素，获取接口数据
                                activeCellData = parentData.properties.interface_list[interfaceIndex];
                                // 添加接口的父元素ID和索引信息
                                activeCellData.parentId = vertexId;
                                activeCellData.interfaceIndex = interfaceIndex;
                                activeCellData.isInterface = true;
                            } else {
                                // 如果是普通元素，获取元素数据
                                activeCellData = parentData;
                            }
                        }

                        updatePropertyPanel();
                    }

                    function showPlaceHint(iteminfo, id, name, label, width, height, style, properties) {
                        
                        // 创建悬浮提示框
                        const hintBox = document.createElement('div');
                        hintBox.id = 'place-hint';
                        hintBox.style.cssText = `
                            position: fixed;
                            background: rgba(0, 0, 0, 0.8);
                            color: white;
                            padding: 8px 12px;
                            border-radius: 4px;
                            font-size: 12px;
                            z-index: 1000;
                            pointer-events: none;
                            white-space: nowrap;
                        `;
                        hintBox.textContent = `点击放置: ${label}`;
                        document.body.appendChild(hintBox);
                        
                        // 给body添加类来激活隐藏默认光标样式
                        document.body.classList.add('connection-mode-active');
                        
                        // 创建自定义箭头光标
                        const customCursor = document.createElement('div');
                        customCursor.className = 'custom-cursor arrow-cursor';
                        customCursor.innerHTML = '⬇';
                        document.body.appendChild(customCursor);
                        
                        
                        // 鼠标移动事件，更新提示框和自定义光标位置
                        function handleMouseMove(e) {
                            hintBox.style.left = `${e.clientX + 10}px`;
                            hintBox.style.top = `${e.clientY - 30}px`;
                            customCursor.style.left = `${e.clientX}px`;
                            customCursor.style.top = `${e.clientY}px`;
                        }
                        
                        // 鼠标点击事件，放置元素
                        function handleMouseClick(e) {
                            
                            // 移除事件监听器
                            document.removeEventListener('mousemove', handleMouseMove);
                            document.removeEventListener('click', handleMouseClick);
                            
                            // 移除body上的连接模式类
                            document.body.classList.remove('connection-mode-active');
                            
                            // 移除自定义光标
                            customCursor.remove();
                            
                            // 移除提示框
                            hintBox.remove();
                            
                            // 计算画布坐标
                            const graphContainer = document.getElementById('graph-container');
                            
                            if (graphContainer) {
                                const rect = graphContainer.getBoundingClientRect();
                                
                                const x = e.clientX - rect.left;
                                const y = e.clientY - rect.top;
                                
                                // 插入元素
                                
                                model.beginUpdate();
                                try {
                                    var v1 = null;
                                    if (iteminfo.shape === 'circle') {
                                        v1 = graph.insertVertex(parent, id, label, x, y, width, height, style + ';ellipse');
                                    } else {
                                        v1 = graph.insertVertex(parent, id, label, x, y, width, height, style);
                                    }
                                    
                                    // 从样式字符串中提取绘制属性
                                    const rounded = style.includes('rounded=1') ? 1 : 0;
                                    const fontColorMatch = style.match(/fontColor=([^;]+)/);
                                    const strokeColorMatch = style.match(/strokeColor=([^;]+)/);
                                    const labelAlignMatch = style.match(/align=([^;]+)/);
                                    const labelVerticalAlignMatch = style.match(/verticalAlign=([^;]+)/);
                                    const fontSizeMatch = style.match(/fontSize=([^;]+)/);

                                    // 处理接口信息
                                    let processedProperties = properties;
                                    if (processedProperties && (iteminfo.type === 'SoC' || iteminfo.type === 'MCU')) {
                                        // 生成interface_list
                                        processedProperties.interface_list = [];
                                        if (processedProperties.interface_group) {
                                            const subTypeCounts = {};
                                            for (const key in processedProperties.interface_group) {
                                                if (Array.isArray(processedProperties.interface_group[key])) {
                                                    processedProperties.interface_group[key].forEach(item => {
                                                        const maxNum = item.Interface_Number || 1;
                                                        
                                                        for (var i = 0; i < maxNum; i++) {
                                                            const subType = item.SubType || key;
                                                            if (!subTypeCounts[subType]) {
                                                                subTypeCounts[subType] = 0;
                                                            }
                                                            subTypeCounts[subType]++;
                                                            
                                                            const interfaceName = `${subType} - ${subTypeCounts[subType]}`;
                                                            processedProperties.interface_list.push({
                                                                name: interfaceName,
                                                                type: key,
                                                                subType: subType,
                                                                enabled: false,
                                                                connection: null
                                                            });
                                                        }
                                                    });
                                                }
                                            }
                                        }
                                    }
                                    
                                    const data = {
                                        id: id,
                                        type: iteminfo.shape,
                                        name: name,
                                        ItemType: iteminfo.type,
                                        size: iteminfo.size || iteminfo.width || 100,
                                        color: iteminfo.color,
                                        position: { x: x, y: y },
                                        width: width,
                                        height: height,
                                        rounded: rounded,
                                        fontColor: fontColorMatch ? fontColorMatch[1] : '#ffffff',
                                        fontSize: fontSizeMatch ? fontSizeMatch[1] : '10', // 从样式中提取字体大小
                                        strokeColor: strokeColorMatch ? strokeColorMatch[1] : '#000000',
                                        labelAlign: labelAlignMatch ? labelAlignMatch[1] : 'center', // 从样式中提取横向位置
                                        labelVerticalAlign: labelVerticalAlignMatch ? labelVerticalAlignMatch[1] : 'middle', // 从样式中提取纵向位置
                                        properties: processedProperties,
                                        parent: '/',
                                        children: []
                                    };
                                    
                                    elementsData.push(data);

                                    // 使用 setSelectionCell 触发 CHANGE 事件，统一更新选择状态
                                    graph.setSelectionCell(v1);
                                } catch (error) {
                                } finally {
                                    model.endUpdate();
                                }
                            } else {
                            }
                        }
                        
                        // 延迟添加事件监听器，让菜单的点击事件先完成
                        setTimeout(() => {
                            document.addEventListener('mousemove', handleMouseMove);
                            document.addEventListener('click', handleMouseClick);
                        }, 100);
                    }
                    
                    function generateElement(iteminfo, layer) {
                        if (!model || !graph || !parent) return;
                        
                        var name = '';
                        var properties = {};
                        
                        const id = 'elem_' + elementIdCounter++;
                        
                        if(layer === 1) {
                            name = 'element' + id;
                            properties = {};
                        } else if (layer === 2) {
                            name = 'element' + id;
                            properties = {};
                        } else if (layer === 3) {
                            const baseName = iteminfo.properties.Name;
                            var count = 0;
                            elementsData.forEach(item => {
                                if (item.name === baseName || item.name.startsWith(baseName + '-')) {
                                    count++;
                                }
                            });
                            name = count === 0 ? baseName : `${baseName}-${count}`;
                            properties = JSON.parse(JSON.stringify(iteminfo.properties));
                            properties.defaultHeight = iteminfo.height;
                            
                            properties.interface_list = [];
                            if (properties.interface_group) {
                                const subTypeCounts = {};
                                for (const key in properties.interface_group) {
                                    if (Array.isArray(properties.interface_group[key])) {
                                        properties.interface_group[key].forEach(item => {
                                            const maxNum = item.Interface_Number || 1;
                                            
                                            for (var i = 0; i < maxNum; i++) {
                                                const subType = item.SubType || key;
                                                if (!subTypeCounts[subType]) {
                                                    subTypeCounts[subType] = 0;
                                                }
                                                subTypeCounts[subType]++;
                                                
                                                const interfaceName = `${subType} - ${subTypeCounts[subType]}`;
                                                properties.interface_list.push({
                                                    name: interfaceName,
                                                    type: key,
                                                    subType: subType,
                                                    enabled: false,
                                                    connection: null
                                                });
                                            }
                                        });
                                    }
                                }
                            }
                        }
                        
                        // 对于PCBA类型的元素，使用不同的样式
                        let fontColor, fontSize, fontStyle;
                        if (iteminfo.type === 'PCBA') {
                            fontColor = '#000000'; // 黑色
                            fontSize = '14'; // 更大的字体
                            fontStyle = '2'; // 加粗（2表示加粗，1表示斜体）
                        } else {
                            fontColor = '#ffffff'; // 白色
                            fontSize = '10'; // 标准字体
                            fontStyle = '1'; // 斜体
                        }
                        
                        const style = [
                            'fillColor=' + iteminfo.color,
                            'strokeColor=#000000',
                            'fontColor=' + fontColor,
                            'fontSize=' + fontSize,
                            'fontStyle=' + fontStyle,
                            'align=center',
                            'verticalAlign=top',
                            'collapsible=0'
                        ].join(';');
                        
                        let label = iteminfo.type + ':' + name;
                        // 计算标签宽度，PCBA使用更大的字体，每个字符大约10px，其他使用8px
                        let charWidth = iteminfo.type === 'PCBA' ? 10 : 8;
                        let labelWidth = label.length * charWidth;
                        
                        var width, height;
                        
                        if (iteminfo.shape === 'circle') {
                            width = iteminfo.radius * 2;
                            height = iteminfo.radius * 2;
                        } else if (iteminfo.shape === 'square') {
                            width = iteminfo.size;
                            height = iteminfo.size;
                        } else {
                            // 对于SOC、MCU和PCBA，根据标签宽度计算宽度，两侧各留20
                            if (iteminfo.type === 'SoC' || iteminfo.type === 'MCU' || iteminfo.type === 'PCBA') {
                                width = labelWidth + 40; // 两侧各留20
                                height = iteminfo.height;
                            } else {
                                width = iteminfo.width;
                                height = iteminfo.height;
                            }
                        }
                        
                        // 显示放置提示
                        showPlaceHint(iteminfo, id, name, label, width, height, style, properties);
                    }

                                document.getElementById('element-rounded').textContent = activeCellData.rounded;
                                document.getElementById('element-height').textContent = activeCell.getGeometry().height;
                                document.getElementById('element-width').textContent = activeCell.getGeometry().width;

                                // 位置属性
                                let absoluteX = activeCellData.position ? activeCellData.position.x : 0;
                                let absoluteY = activeCellData.position ? activeCellData.position.y : 0;
                                let relativeX = activeCellData.position ? activeCellData.position.x : 0;
                                let relativeY = activeCellData.position ? activeCellData.position.y : 0;

                                // 如果元素有父元素，计算绝对位置和相对位置
                                if (activeCellData.parent && activeCellData.parent !== '/') {
                                    const parentData = elementsData.find(e => e.id === activeCellData.parent);
                                    if (parentData && parentData.position) {
                                        // 相对位置：子元素相对于父元素的位置
                                        relativeX = activeCellData.position ? activeCellData.position.x : 0;
                                        relativeY = activeCellData.position ? activeCellData.position.y : 0;
                                        // 绝对位置：父元素位置 + 子元素相对位置
                                        absoluteX = parentData.position.x + relativeX;
                                        absoluteY = parentData.position.y + relativeY;
                                    }
                                } else {
                                    // 根元素的相对位置就是其绝对位置
                                    relativeX = activeCellData.position ? activeCellData.position.x : 0;
                                    relativeY = activeCellData.position ? activeCellData.position.y : 0;
                                }

                                document.getElementById('element-absolute-x').textContent = absoluteX;
                                document.getElementById('element-absolute-y').textContent = absoluteY;
                                document.getElementById('element-relative-x').textContent = relativeX;
                                document.getElementById('element-relative-y').textContent = relativeY;
                            }

                    // 第三个页面：架构图框架树状图
                    function updateFrameworkTree() {
                        const treeContainer = document.getElementById('framework-tree');

                        // 使用全局的 expandedNodes 变量

                        // 构建树状结构
                        let treeHtml = '<ul class="space-y-1">';

                        // 根目录 - 使用 fa-automobile
                        treeHtml += `
                            <li>
                                <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="toggleNode('root');">
                                    <i class="fa fa-chevron-right mr-2 text-gray-400 transition-transform duration-200" id="root-icon"></i>

                                <ul class="ml-4 border-l border-gray-600 pl-2 space-y-1 mt-1" id="root-children">`;

                        // 按类型分组显示元素
                        const pcbas = elementsData.filter(e => e.ItemType === 'PCBA');
                        const socs = elementsData.filter(e => e.ItemType === 'SoC');
                        const mcus = elementsData.filter(e => e.ItemType === 'MCU');
                        const others = elementsData.filter(e => !['PCBA', 'SoC', 'MCU'].includes(e.ItemType));

                        // 辅助函数：根据父元素ID查找子接口（启用的接口）
                        function getChildInterfaces(parentId) {
                            if (!graph) return [];
                            const parentCell = graph.getModel().getCell(parentId);
                            if (!parentCell) return [];

                            const model2 = graph.getModel();
                            const interfaces = [];
                            const childCount = model2.getChildCount(parentCell);

                            // 使用索引遍历所有子单元格
                            for (let i = 0; i < childCount; i++) {
                                const child = model2.getChildAt(parentCell, i);
                                const childId = child.getId();
                                // 检查是否是接口（ID格式：interface_xxx）
                                if (childId && childId.startsWith('interface_')) {
                                    // 获取对应的接口数据
                                    const interfaceInfo = findInterfaceById(parentId, childId);
                                    if (interfaceInfo && interfaceInfo.enabled) {
                                        interfaces.push({
                                            id: childId,
                                            name: child.value || interfaceInfo.name || '接口',
                                            cell: child
                                        });
                                    }
                                }
                            }
                            return interfaces;
                        }

                        // 辅助函数：查找接口信息
                        function findInterfaceById(parentId, interfaceCellId) {
                            const element = elementsData.find(e => e.id === parentId);
                            if (!element || !element.properties || !element.properties.interface_list) return null;

                            const idx = interfaceCellId.split('_').pop();
                            return element.properties.interface_list[parseInt(idx)];
                        }

                        // 显示PCBA - 使用 fa-cube
                        pcbas.forEach(pcba => {
                            const children = elementsData.filter(e => e.parent === pcba.id || e.parent === '/' + pcba.id);
                            const hasChildren = children.length > 0;
                            
                            treeHtml += `
                                <li>
                                    <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="toggleNode('${pcba.id}')">
                                        ${hasChildren ? `<i class="fa fa-chevron-right mr-2 text-gray-400 transition-transform duration-200" id="${pcba.id}-icon"></i>` : '<span class="w-4 mr-2"></span>'}
                                        <i class="fa fa-cube text-blue-400 mr-2"></i>
                                        <span class="text-gray-300">${pcba.name}</span>
                                    </div>
                                    ${hasChildren ? `<ul class="ml-4 border-l border-gray-600 pl-2 space-y-1 mt-1" id="${pcba.id}-children">` : ''}`;

                            // 查找属于该PCBA的子元素（根据parent属性）
                            const pcbaChildren = elementsData.filter(e => e.parent === pcba.id || e.parent === '/' + pcba.id);
                            pcbaChildren.forEach(child => {
                                // 根据子元素类型选择图标和颜色
                                let childIcon = 'fa-square';
                                let childColor = 'text-gray-400';
                                if (child.ItemType === 'SoC') {
                                    childIcon = 'fa-ticket';
                                    childColor = 'text-green-400';
                                } else if (child.ItemType === 'MCU') {
                                    childIcon = 'fa-microchip';
                                    childColor = 'text-purple-400';
                                } else if (child.ItemType === 'PCBA') {
                                    childIcon = 'fa-cube';
                                    childColor = 'text-blue-400';
                                }

                                // 检查是否有接口
                                const childInterfaces = getChildInterfaces(child.id);
                                const hasInterfaces = childInterfaces.length > 0;

                                treeHtml += `
                                    <li>
                                        <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="toggleNode('${child.id}');">
                                            ${hasInterfaces ? `<i class="fa fa-chevron-right mr-2 text-gray-400 transition-transform duration-200" id="${child.id}-icon"></i>` : '<span class="w-4 mr-2"></span>'}
                                            <i class="fa ${childIcon} ${childColor} mr-2 text-xs"></i>
                                            <span class="text-gray-400" onclick="event.stopPropagation(); selectElementById('${child.id}')">${child.name}</span>
                                        </div>
                                        ${hasInterfaces ? `<ul class="ml-4 border-l border-gray-600 pl-2 space-y-1 mt-1" id="${child.id}-children">` : ''}`;

                                // 添加子成员的接口（启用的）
                                childInterfaces.forEach(iface => {
                                    treeHtml += `
                                        <li>
                                            <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="event.stopPropagation(); selectElementById('${iface.id}')">
                                                <span class="w-4 mr-2"></span>
                                                <i class="fa fa-plug text-orange-400 mr-2 text-xs"></i>
                                                <span class="text-gray-500">${iface.name}</span>
                                            </div>
                                        </li>`;
                                });

                                treeHtml += hasInterfaces ? '</ul></li>' : '</li>';
                            });

                            treeHtml += hasChildren ? '</ul></li>' : '</li>';
                        });

                        // 显示独立的SoC - 使用 fa-ticket
                        socs.filter(s => !s.parent || s.parent === '/').forEach(soc => {
                            const socInterfaces = getChildInterfaces(soc.id);
                            const hasInterfaces = socInterfaces.length > 0;

                            treeHtml += `
                                <li>
                                    <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="toggleNode('${soc.id}');">
                                        ${hasInterfaces ? `<i class="fa fa-chevron-right mr-2 text-gray-400 transition-transform duration-200" id="${soc.id}-icon"></i>` : '<span class="w-4 mr-2"></span>'}
                                        <i class="fa fa-ticket text-green-400 mr-2"></i>
                                        <span class="text-gray-300" onclick="event.stopPropagation(); selectElementById('${soc.id}')">${soc.name}</span>
                                    </div>
                                    ${hasInterfaces ? `<ul class="ml-4 border-l border-gray-600 pl-2 space-y-1 mt-1" id="${soc.id}-children">` : ''}`;

                            // 添加SoC的接口（启用的）
                            socInterfaces.forEach(iface => {
                                treeHtml += `
                                    <li>
                                        <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="event.stopPropagation(); selectElementById('${iface.id}')">
                                            <span class="w-4 mr-2"></span>
                                            <i class="fa fa-plug text-orange-400 mr-2 text-xs"></i>
                                            <span class="text-gray-500">${iface.name}</span>
                                        </div>
                                    </li>`;
                            });

                            treeHtml += hasInterfaces ? '</ul></li>' : '</li>';
                        });

                        // 显示独立的MCU - 使用 fa-microchip
                        mcus.filter(m => !m.parent || m.parent === '/').forEach(mcu => {
                            const mcuInterfaces = getChildInterfaces(mcu.id);
                            const hasInterfaces = mcuInterfaces.length > 0;

                            treeHtml += `
                                <li>
                                    <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="toggleNode('${mcu.id}');">
                                        ${hasInterfaces ? `<i class="fa fa-chevron-right mr-2 text-gray-400 transition-transform duration-200" id="${mcu.id}-icon"></i>` : '<span class="w-4 mr-2"></span>'}
                                        <i class="fa fa-microchip text-purple-400 mr-2"></i>
                                        <span class="text-gray-300" onclick="event.stopPropagation(); selectElementById('${mcu.id}')">${mcu.name}</span>
                                    </div>
                                    ${hasInterfaces ? `<ul class="ml-4 border-l border-gray-600 pl-2 space-y-1 mt-1" id="${mcu.id}-children">` : ''}`;

                            // 添加MCU的接口（启用的）
                            mcuInterfaces.forEach(iface => {
                                treeHtml += `
                                    <li>
                                        <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="event.stopPropagation(); selectElementById('${iface.id}')">
                                            <span class="w-4 mr-2"></span>
                                            <i class="fa fa-plug text-orange-400 mr-2 text-xs"></i>
                                            <span class="text-gray-500">${iface.name}</span>
                                        </div>
                                    </li>`;
                            });

                            treeHtml += hasInterfaces ? '</ul></li>' : '</li>';
                        });

                        // 显示其他类型
                        others.forEach(other => {
                            treeHtml += `
                                <li>
                                    <div class="flex items-center py-1 px-2 rounded hover:bg-gray-700 cursor-pointer" onclick="selectElementById('${other.id}')">
                                        <i class="fa fa-square text-gray-400 mr-2 text-xs"></i>
                                        <span class="text-gray-300">${other.name}</span>
                                    </div>
                                </li>`;
                        });

                        treeHtml += '</ul></li></ul>';

                        // 显示连接关系
                        if (connectionsData.length > 0) {
                            treeHtml += `
                                <div class="mt-4 pt-2 border-t border-gray-600">
                                    <h6 class="text-xs font-bold text-white mb-2">连接关系</h6>
                                    <ul class="space-y-1">`;

                            connectionsData.forEach(conn => {
                                // 获取源硬件名称和接口名称
                                let sourceName = conn.sourceId;
                                let sourceInterfaceName = '';
                                const sourceElement = elementsData.find(e => e.id === conn.sourceId);
                                if (sourceElement && sourceElement.name) {
                                    sourceName = sourceElement.name;
                                    if (sourceElement.properties && sourceElement.properties.interface_list && conn.sourceInterfaceIndex !== undefined) {
                                        const sourceInterface = sourceElement.properties.interface_list[conn.sourceInterfaceIndex];
                                        if (sourceInterface && sourceInterface.name) {
                                            sourceInterfaceName = sourceInterface.name;
                                        }
                                    }
                                }
                                
                                // 获取目标硬件名称和接口名称
                                let targetName = conn.targetId;
                                let targetInterfaceName = '';
                                const targetElement = elementsData.find(e => e.id === conn.targetId);
                                if (targetElement && targetElement.name) {
                                    targetName = targetElement.name;
                                    if (targetElement.properties && targetElement.properties.interface_list && conn.targetInterfaceIndex !== undefined) {
                                        const targetInterface = targetElement.properties.interface_list[conn.targetInterfaceIndex];
                                        if (targetInterface && targetInterface.name) {
                                            targetInterfaceName = targetInterface.name;
                                        }
                                    }
                                }
                                
                                // 构建连接关系显示
                                treeHtml += `
                                    <li class="flex items-center py-1 px-2 text-xs">
                                        <span class="text-gray-400">${sourceName}(${sourceInterfaceName})</span>
                                        <span class="text-gray-500 mx-2">---${conn.type}---</span>
                                        <span class="text-gray-400">${targetName}(${targetInterfaceName})</span>
                                    </li>`;
                            });

                            treeHtml += '</ul></div>';
                        }

                        treeContainer.innerHTML = treeHtml;

                        // 初始化展开状态
                        expandedNodes = {};
                    }

                    // 展开/收起节点
                    let expandedNodes = {}; // 保存展开状态
                    
                    window.toggleNode = function(nodeId) {
                        // 获取图标和子元素容器
                        const icon = document.getElementById(nodeId + '-icon');
                        const children = document.getElementById(nodeId + '-children');

                        if (icon && children) {
                            // 切换展开状态
                            const isExpanded = expandedNodes[nodeId] !== false; // 默认为展开状态
                            expandedNodes[nodeId] = !isExpanded;

                            // 更新图标和显示状态
                            if (isExpanded) {
                                // 收起
                                icon.classList.remove('fa-chevron-right');
                                icon.classList.add('fa-chevron-left');
                                icon.style.transform = 'rotate(0deg)';
                                children.style.display = 'none';
                            } else {
                                // 展开
                                icon.classList.remove('fa-chevron-left');
                                icon.classList.add('fa-chevron-right');
                                icon.style.transform = 'rotate(0deg)';
                                children.style.display = 'block';
                            }
                        }
                    }



                    // 刷新线段 - 重新计算线段形状
                    function refreshEdge(edge, edgeData) {
                        if (!model || !graph || !edgeData) return;

                        const sourceId = edgeData.sourceId;
                        const targetId = edgeData.targetId;
                        const sourceInterfaceIndex = edgeData.sourceInterfaceIndex;
                        const targetInterfaceIndex = edgeData.targetInterfaceIndex;

                        const sourceData = elementsData.find(d => d.id === sourceId);
                        const targetData = elementsData.find(d => d.id === targetId);

                        if (!sourceData || !targetData) {
                            showCustomModal('找不到源或目标元素', 'error');
                            return;
                        }

                        const sourceCell = model.getCell(sourceId);
                        const targetCell = model.getCell(targetId);

                        if (!sourceCell || !targetCell) {
                            showCustomModal('找不到源或目标单元格', 'error');
                            return;
                        }

                        // 获取接口单元格
                        const sourceInterfaceCell = getInterfaceCell(sourceCell, sourceInterfaceIndex, sourceData);
                        const targetInterfaceCell = getInterfaceCell(targetCell, targetInterfaceIndex, targetData);

                        if (!sourceInterfaceCell || !targetInterfaceCell) {
                            showCustomModal('找不到接口单元格', 'error');
                            return;
                        }

                        // 重新计算连接点
                        const sourceConnPoint = getInterfaceConnectionPoint(sourceData, sourceInterfaceIndex);
                        const targetConnPoint = getInterfaceConnectionPoint(targetData, targetInterfaceIndex);

                        if (!sourceConnPoint || !targetConnPoint) {
                            showCustomModal('无法计算连接点', 'error');
                            return;
                        }

                        // 重新计算最优线段样式
                        const edgeStyle = getOptimalEdgeStyle(
                            sourceConnPoint,
                            targetConnPoint,
                            sourceConnPoint.direction,
                            targetConnPoint.direction
                        );

                        // 更新线段样式
                        model.beginUpdate();
                        try {
                            let styleParts = [
                                'strokeColor=' + edgeData.color,
                                'strokeWidth=2',
                                'endArrow=none',
                                'edgeStyle=' + edgeStyle,
                                'sourcePortConstraint=none',
                                'targetPortConstraint=none',
                                'avoidOrthogonalLoop=true',
                                'orthogonalLoop=1',
                                'rounded=1',
                                'exitX=' + sourceConnPoint.x,
                                'exitY=' + sourceConnPoint.y,
                                'exitDx=' + sourceConnPoint.dx,
                                'exitDy=' + sourceConnPoint.dy,
                                'entryX=' + targetConnPoint.x,
                                'entryY=' + targetConnPoint.y,
                                'entryDx=' + targetConnPoint.dx,
                                'entryDy=' + targetConnPoint.dy
                            ];

                            const style = styleParts.join(';');
                            model.setStyle(edge, style);

                            // 清除现有的路径点并强制重新计算
                            const geometry = edge.getGeometry();
                            if (geometry) {
                                geometry.points = null;
                                geometry.sourcePoint = null;
                                geometry.targetPoint = null;
                                model.setGeometry(edge, geometry);
                            }

                            // 更新连接点参数
                            edgeData.exitX = sourceConnPoint.x;
                            edgeData.exitY = sourceConnPoint.y;
                            edgeData.entryX = targetConnPoint.x;
                            edgeData.entryY = targetConnPoint.y;
                            edgeData.exitDx = sourceConnPoint.dx;
                            edgeData.exitDy = sourceConnPoint.dy;
                            edgeData.entryDx = targetConnPoint.dx;
                            edgeData.entryDy = targetConnPoint.dy;

                            // 刷新属性面板
                            updatePropertyPanel();

                            // 强制重绘
                            if (graph) {
                                graph.refresh();
                            }

                            showCustomModal('线段已刷新', 'success');
                        } finally {
                            model.endUpdate();
                        }
                    }

                    // 应用属性更改
                    async function applyProperties() {

                        }

                        await saveInterfaceConfig();

                                model.endUpdate();

                            const strokeColorInput = document.getElementById('element-stroke-color');

                            }

                            const name = currentInputValue.trim();

                            const strokeColor = strokeColorInput.value;

                            activeCellData.name = finalName;
