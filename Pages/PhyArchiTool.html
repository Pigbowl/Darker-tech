                    // 保存架构数据
                    function saveArchitecture() {
                        // 收集所有数据，确保包含完整的绘制属性
                        const architectureData = {
                            identifier: 'PhyArhi',
                            elements: elementsData.map(element => ({
                                ...element,
                                // 确保保存所有必要的绘制属性
                                type: element.type,
                                position: element.position,
                                size: element.size,
                                width: element.width || element.size,
                                height: element.height,
                                color: element.color,
                                rounded: element.rounded,
                                fontColor: element.fontColor,
                                fontSize: element.fontSize,
                                strokeColor: element.strokeColor,
                                labelAlign: element.labelAlign,
                                labelVerticalAlign: element.labelVerticalAlign,
                                properties: element.properties
                            })),
                            connections: connectionsData.map(conn => ({
                                ...conn,
                                // 确保保存所有连接属性
                                direction: conn.direction || '单向',
                                color: conn.color || '#6366f1',
                                type: conn.type || 'default',
                                // 连接点参数
                                exitX: conn.exitX || 0,
                                exitY: conn.exitY || 0,
                                entryX: conn.entryX || 0,
                                entryY: conn.entryY || 0,
                                // 偏移量
                                exitDx: conn.exitDx || 0,
                                exitDy: conn.exitDy || 0,
                                entryDx: conn.entryDx || 0,
                                entryDy: conn.entryDy || 0
                            })),
                            timestamp: new Date().toISOString()
                        };

                        // 转换为JSON字符串
                        const jsonString = JSON.stringify(architectureData, null, 2);

                        // 创建下载链接
                        const blob = new Blob([jsonString], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `architecture_${new Date().getTime()}.json`;
                        a.click();
                        URL.revokeObjectURL(url);

                        showCustomModal('架构数据已保存', 'success');
                    }

                    // 加载架构数据
                    function loadArchitecture(file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            try {
                                const jsonData = JSON.parse(e.target.result);

                                // 验证标识字段
                                if (jsonData.identifier !== 'PhyArhi') {
                                    showCustomModal('无效的文件格式，缺少正确的标识字段', 'error');
                                    return;
                                }

                                // 清空当前数据
                                clearAllData();

                                // 加载元素数据
                                if (jsonData.elements && Array.isArray(jsonData.elements)) {
                                    elementsData = jsonData.elements;
                                    // 调试打印加载的元素数据

                                    elementsData.forEach((elem, index) => {

                                    });
                                }

                                // 加载连接数据
                                if (jsonData.connections && Array.isArray(jsonData.connections)) {
                                    connectionsData = jsonData.connections;
                                }

                                // 重新绘制架构

                                redrawArchitecture();

                                showCustomModal('架构数据已加载', 'success');
                            } catch (error) {
                                showCustomModal('文件解析失败: ' + error.message, 'error');
                            }
                        };
                        reader.onerror = function() {
                            showCustomModal('文件读取失败', 'error');
                        };
                        reader.readAsText(file);
                    }

                    // 清空所有数据
                    function clearAllData() {
                        if (model) {
                            model.beginUpdate();
                            try {
                                // 移除所有单元格
                                const root = model.getRoot();
                                if (root && typeof root.getChildren === 'function') {
                                    const cells = root.getChildren();
                                    for (let i = cells.length - 1; i >= 0; i--) {
                                        model.remove(cells[i]);
                                    }
                                }
                            } catch (error) {
                                console.error('清空单元格时出错:', error);
                            } finally {
                                model.endUpdate();
                            }
                        }

                        // 清空数据数组
                        elementsData = [];
                        connectionsData = [];
                        activeCell = null;
                        activeCellData = null;

                        // 刷新属性面板
                        updatePropertyPanel();
                    }

                    // 重新绘制架构
                    function redrawArchitecture() {
                        if (!graph || !model) return;

                        model.beginUpdate();
                        try {
                            // 绘制元素
                            elementsData.forEach(element => {
                                if (element.type === 'rectangle') {
                                    const parentCell = element.parent === '/' ? graph.getDefaultParent() : model.getCell(element.parent);
                                    if (parentCell) {
                                        // 使用新的 label 位置属性
                                        const align = element.labelAlign || 'center';
                                        const verticalAlign = element.labelVerticalAlign || 'top';
                                        const fontSize = element.fontSize || '12';

                                        // 调试打印


                                        // 构建样式字符串，确保还原所有绘制属性
                                        const style = `
                                            fillColor=${element.color || '#0066ff'};strokeColor=${element.strokeColor || '#000000'};fontColor=${element.fontColor || '#ffffff'};fontSize=${fontSize};rounded=${element.rounded !== undefined ? element.rounded : 1};align=${align};verticalAlign=${verticalAlign};collapsible=0
                                        `.replace(/\s+/g, ' ').trim();

                                        // 调试打印样式


                                        const v1 = graph.insertVertex(
                                            parentCell,
                                            element.id,
                                            element.ItemType + ':' + element.name,
                                            element.position.x,
                                            element.position.y,
                                            element.width || element.size || 150,
                                            element.height || 80,
                                            style
                                        );

                                        // 绘制接口
                                        if (element.properties && element.properties.interface_list) {
                                            // 获取INTERFACE模板
                                            const interfaceTemplate = window.ShapeTemplate && window.ShapeTemplate.INTERFACE ? window.ShapeTemplate.INTERFACE : {
                                                align: 'center',
                                                verticalAlign: 'middle',
                                                fillColor: '#ffffff',
                                                borderColor: '#000000',
                                                rounded: 0,
                                                shape: 'rectangle',
                                                fontSize: 8,
                                                fontColor: '#000000',
                                                collapsible: 0,
                                                width: 100,
                                                height: 20
                                            };
                                            
                                            element.properties.interface_list.forEach((iface, index) => {
                                                if (iface.enabled) {
                                                    const connPoint = getInterfaceConnectionPoint(element, index);
                                                    if (connPoint) {
                                                        // 确保接口位置相对于父元素正确计算
                                                        const parentWidth = element.size || 150;
                                                        const parentHeight = element.height || 80;
                                                        const interfaceWidth = interfaceTemplate.width;
                                                        const interfaceHeight = interfaceTemplate.height;
                                                        const interfaceColor = interfaceTemplate.fillColor;
                                                        const interfaceStrokeColor = interfaceTemplate.borderColor;
                                                        const interfaceRounded = interfaceTemplate.rounded;
                                                        const interfaceFontSize = interfaceTemplate.fontSize;

                                                        // 使用保存的位置和旋转信息
                                                        let interfaceX, interfaceY;

                                                        if (iface.interfaceLeft !== undefined && iface.interfaceTop !== undefined) {
                                                            interfaceX = iface.interfaceLeft;
                                                            interfaceY = iface.interfaceTop;
                                                        } else if (iface.position) {
                                                            interfaceX = iface.position.x;
                                                            interfaceY = iface.position.y;
                                                        } else {
                                                            interfaceX = (connPoint.x * parentWidth) - (interfaceWidth / 2);
                                                            interfaceY = (connPoint.y * parentHeight) - (interfaceHeight / 2);
                                                        }

                                                        // 使用保存的旋转信息和对齐方式
                                                        const rotation = iface.rotation || 0;
                                                        const align = iface.align || interfaceTemplate.align;

                                                        // 构建接口样式字符串，使用INTERFACE模板和保存的旋转信息、对齐方式
                                                        const interfaceStyle = `fillColor=${interfaceColor};strokeColor=${interfaceStrokeColor};fontColor=${interfaceTemplate.fontColor};fontSize=${interfaceFontSize};rounded=${interfaceRounded};align=${align};verticalAlign=${interfaceTemplate.verticalAlign};collapsible=${interfaceTemplate.collapsible};resizable=0;rotation=${rotation}`;

                                                        const interfaceCell = graph.insertVertex(
                                                            v1,
                                                            'interface_' + element.id + '_' + index,
                                                            iface.name,
                                                            interfaceX,
                                                            interfaceY,
                                                            interfaceWidth,
                                                            interfaceHeight,
                                                            interfaceStyle
                                                        );
                                                    }
                                                }
                                            });
                                        }
                                    }
                                }
                            });

                            // 绘制连接
                            connectionsData.forEach(conn => {
                                let sourceCell = model.getCell(conn.sourceId);
                                let targetCell = model.getCell(conn.targetId);
                                
                                // 尝试找到对应的接口元素
                                if (sourceCell && conn.sourceInterfaceIndex !== undefined) {
                                    const sourceChildren = graph.getChildVertices(sourceCell);
                                    for (let child of sourceChildren) {
                                        if (child.getId() && child.getId().endsWith('_' + conn.sourceInterfaceIndex)) {
                                            sourceCell = child;
                                            break;
                                        }
                                    }
                                }
                                
                                if (targetCell && conn.targetInterfaceIndex !== undefined) {
                                    const targetChildren = graph.getChildVertices(targetCell);
                                    for (let child of targetChildren) {
                                        if (child.getId() && child.getId().endsWith('_' + conn.targetInterfaceIndex)) {
                                            targetCell = child;
                                            break;
                                        }
                                    }
                                }
                                
                                if (sourceCell && targetCell) {
                                    const edge = graph.insertEdge(
                                        graph.getDefaultParent(),
                                        conn.id,
                                        '',
                                        sourceCell,
                                        targetCell,
                                        'strokeColor=' + conn.color + ';strokeWidth=2;endArrow=none;edgeStyle=orthogonalEdgeStyle;sourcePortConstraint=none;targetPortConstraint=none;avoidOrthogonalLoop=true;orthogonalLoop=1;rounded=1;exitX=' + conn.exitX + ';exitY=' + conn.exitY + ';exitDx=' + conn.exitDx + ';exitDy=' + conn.exitDy + ';entryX=' + conn.entryX + ';entryY=' + conn.entryY + ';entryDx=' + conn.entryDx + ';entryDy=' + conn.entryDy
                                    );
                                }
                            });
                        } finally {
                            model.endUpdate();
                        }

                        // 刷新架构图
                        updateFrameworkTree();
                    }

                    function expandObject(obj, prefix, container) {
                        if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) {
                            return;
                        }
                        
                        for (const [key, value] of Object.entries(obj)) {
                            const fullKey = prefix ? `${prefix}.${key}` : key;
                            
                            if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                                if (Object.keys(value).length === 0) {
                                    const propertyItem = document.createElement('div');
                                    propertyItem.className = 'flex justify-between';
                                    
                                    const propertyKey = document.createElement('span');
                                    propertyKey.className = 'font-medium';
                                    propertyKey.textContent = fullKey + ':';
                                    
                                    const propertyValue = document.createElement('span');
                                    propertyValue.textContent = '{}';
                                    
                                    propertyItem.appendChild(propertyKey);
                                    propertyItem.appendChild(propertyValue);
                                    container.appendChild(propertyItem);
                                } else {
                                    expandObject(value, fullKey, container);
                                }
                            } else {
                                const propertyItem = document.createElement('div');
                                propertyItem.className = 'flex justify-between';
                                
                                const propertyKey = document.createElement('span');
                                propertyKey.className = 'font-medium';
                                propertyKey.textContent = fullKey + ':';
                                
                                const propertyValue = document.createElement('span');
                                if (Array.isArray(value)) {
                                    propertyValue.textContent = JSON.stringify(value);
                                } else if (value === null) {
                                    propertyValue.textContent = 'null';
                                } else {
                                    propertyValue.textContent = value;
                                }
                                
                                propertyItem.appendChild(propertyKey);
                                propertyItem.appendChild(propertyValue);
                                container.appendChild(propertyItem);
                            }
                        }
                    }

                    function enterConnectionMode(sourceId) {
                        isConnectionMode = true;
                        connectionSourceId = sourceId;
                        
                        // 给body添加类来激活连接模式样式
                        document.body.classList.add('connection-mode-active');
                        
                        // 创建自定义插头光标

                        document.body.appendChild(connectionCustomCursor);

                        connectionMouseMoveHandler = function(e) {

                        };

                    function exitConnectionMode() {
                        isConnectionMode = false;
                        connectionSourceId = null;
                        
                        // 移除body上的连接模式类
                        document.body.classList.remove('connection-mode-active');
                        
                        // 移除自定义光标

                            connectionCustomCursor = null;
                        }
                        
                        // 移除鼠标移动事件监听器
                        if (connectionMouseMoveHandler) {
                            document.removeEventListener('mousemove', connectionMouseMoveHandler);
                            connectionMouseMoveHandler = null;

                        if (event.key === 'Delete' && activeCell) {
                            deleteSelectedCell();
                        }
                    });

                    function deleteSelectedCell() {
                        if (!activeCell || !model || !graph) return;
                        
                        if (activeCell.isEdge()) {
                            const edgeId = activeCell.getId();
                            const connData = connectionsData.find(c => c.id === edgeId);
                            
                            if (connData) {
                                const sourceData = elementsData.find(e => e.id === connData.sourceId);
                                const targetData = elementsData.find(e => e.id === connData.targetId);
                                
                                const sourceName = sourceData ? sourceData.name : '未知元素';
                                const targetName = targetData ? targetData.name : '未知元素';
                                const sourceInterface = connData.sourceInterfaceName || '未知接口';
                                const targetInterface = connData.targetInterfaceName || '未知接口';
                                
                                const message = `确定要删除这条连接线吗？\n\n连接详情：\n源元素: ${sourceName} (${sourceInterface})\n目标元素: ${targetName} (${targetInterface})`;
                                
                                showConfirmModal(message).then(confirmed => {
                                    if (confirmed) {
                                        model.beginUpdate();
                                        try {
                                            if (sourceData && sourceData.properties && sourceData.properties.interface_list) {
                                                const sourceInterfaceData = sourceData.properties.interface_list.find(
                                                    item => item.name === connData.sourceInterfaceName
                                                );
                                                if (sourceInterfaceData) {
                                                    sourceInterfaceData.connection = null;
                                                }
                                            }
                                            
                                            if (targetData && targetData.properties && targetData.properties.interface_list) {
                                                const targetInterfaceData = targetData.properties.interface_list.find(
                                                    item => item.name === connData.targetInterfaceName
                                                );
                                                if (targetInterfaceData) {
                                                    targetInterfaceData.connection = null;
                                                }
                                            }
                                            
                                            const index = connectionsData.findIndex(c => c.id === edgeId);
                                            if (index !== -1) {
                                                connectionsData.splice(index, 1);
                                            }
                                            
                                            graph.removeCells([activeCell]);
                                            activeCell = null;
                                            activeCellData = null;
                                            updatePropertyPanel();
                                        } finally {
                                            model.endUpdate();
                                        }
                                    }
                                });
                            }
                        } else {
                            model.beginUpdate();
                            try {
                                const vertexId = activeCell.getId();
                                const index = elementsData.findIndex(e => e.id === vertexId);
                                if (index !== -1) {
                                    const elementData = elementsData[index];
                                    
                                    // 检查该硬件的接口是否有连接
                                    if (elementData.properties && elementData.properties.interface_list) {
                                        elementData.properties.interface_list.forEach(interfaceItem => {
                                            if (interfaceItem.connection && interfaceItem.connection !== '-' && interfaceItem.connection !== null) {
                                                // 分割连接信息，确保正确处理接口名称中包含" - "的情况
                                                const connectionParts = interfaceItem.connection.split(' - ');
                                                if (connectionParts.length >= 2) {
                                                    const connectedElementName = connectionParts[0];
                                                    const connectedInterfaceName = connectionParts.slice(1).join(' - ');
                                                    
                                                    // 查找与该接口相连的其他接口并更新其连接状态
                                                    elementsData.forEach(otherElement => {
                                                        if (otherElement.name === connectedElementName && otherElement.properties && otherElement.properties.interface_list) {
                                                            otherElement.properties.interface_list.forEach(iface => {
                                                                if (iface.name === connectedInterfaceName) {
                                                                    iface.connection = null;
                                                                }
                                                            });
                                                        }
                                                    });
                                                }
                                            }
                                        });
                                    }
                                    
                                    // 删除与该硬件相关的所有连接线
                                    const edgesToRemove = [];
                                    graph.getEdges().forEach(edge => {
                                        const source = edge.source;
                                        const target = edge.target;
                                        if (source && source.getParent() === activeCell || target && target.getParent() === activeCell) {
                                            edgesToRemove.push(edge);
                                        }
                                    });
                                    
                                    if (edgesToRemove.length > 0) {
                                        graph.removeCells(edgesToRemove);
                                    }
                                    
                                    // 从elementsData中删除该硬件
                                    elementsData.splice(index, 1);
                                }
                                
                                graph.removeCells([activeCell]);
                                activeCell = null;
                                activeCellData = null;
                                updatePropertyPanel();
                            } finally {
                                model.endUpdate();
                            }
                        }
                    }
                    
                    function showConfirmModal(message) {

                            content.appendChild(buttonContainer);

                            document.body.appendChild(modal);
                        });
                    }

                    graphContainer.addEventListener('contextmenu', function(e) {
                        e.preventDefault();

                        const rect = graphContainer.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        if (graph) {
                            const cell = graph.getCellAt(x, y);

                            if (cell && (cell.isVertex() || cell.isEdge())) {
                                // 处理接口子元素
                                if (cell.isVertex()) {
                                    const cellId = cell.getId();
                                    if (cellId && cellId.startsWith('interface_')) {
                                        return;
                                    }
                                }

                                // 使用 setSelectionCell 统一更新选择状态，触发 CHANGE 事件
                                graph.setSelectionCell(cell);

                                const contextMenu = document.getElementById('element-context-menu');
                                if (contextMenu) {
                                    // 根据元素类型动态显示菜单选项
                                    const createConnection = document.getElementById('create-connection');
                                    const refreshEdge = document.getElementById('refresh-edge');
                                    const createStar = document.getElementById('create-star');
                                    const showDetails = document.getElementById('show-details');

                                    if (cell.isEdge()) {
                                        // 线段：只显示刷新线段
                                        if (createConnection) createConnection.style.display = 'none';
                                        if (refreshEdge) refreshEdge.style.display = 'block';
                                        if (createStar) createStar.style.display = 'none';
                                        if (showDetails) showDetails.style.display = 'none';
                                    } else if (cell.isVertex()) {
                                        // 硬件元素：显示创建连接和详细信息
                                        if (createConnection) createConnection.style.display = 'block';
                                        if (refreshEdge) refreshEdge.style.display = 'none';

                    function getInterfaceConnectionPoint(elementData, interfaceIndex) {
                        if (!elementData || !elementData.properties || !elementData.properties.interface_list) {
                            return null;
                        }
                        
                        const interfaceInfo = elementData.properties.interface_list[interfaceIndex];
                        if (!interfaceInfo) {
                            return null;
                        }
                        
                        const closestSide = interfaceInfo.closestSide || 'left';
                        const rotation = interfaceInfo.rotation || 0;

                        let exitX, exitY, exitDx, exitDy, direction;
                        
                        // 基于旋转状态调整连接点
                        // 对于旋转后的接口，我们需要考虑其物理意义上的边
                        switch (closestSide) {
                            case 'left':
                                if (rotation === 0) {
                                    // 未旋转，左侧边
                                    exitX = 0;
                                    exitY = 0.5;
                                    exitDx = -1;
                                    exitDy = 0;
                                    direction = 'left';
                                } else if (rotation === 90) {
                                    // 旋转90度，左侧边变为顶部
                                    exitX = 0.5;
                                    exitY = 0;
                                    exitDx = 0;
                                    exitDy = -1;
                                    direction = 'top';
                                } else if (rotation === -90) {
                                    // 旋转-90度，左侧边变为底部
                                    exitX = 0.5;
                                    exitY = 1;
                                    exitDx = 0;
                                    exitDy = 1;
                                    direction = 'bottom';
                                }
                                break;
                            case 'right':
                                if (rotation === 0) {
                                    // 未旋转，右侧边
                                    exitX = 1;
                                    exitY = 0.5;
                                    exitDx = 1;
                                    exitDy = 0;
                                    direction = 'right';
                                } else if (rotation === 90) {
                                    // 旋转90度，右侧边变为底部
                                    exitX = 0.5;
                                    exitY = 1;
                                    exitDx = 0;
                                    exitDy = 1;
                                    direction = 'bottom';
                                } else if (rotation === -90) {
                                    // 旋转-90度，右侧边变为顶部
                                    exitX = 0.5;
                                    exitY = 0;
                                    exitDx = 0;
                                    exitDy = -1;
                                    direction = 'top';
                                }
                                break;
                            case 'top':
                                // 不区分旋转角度，直接赋值
                                exitX = 0;
                                exitY = 0.5;
                                exitDx = -1;
                                exitDy = 0;
                                direction = 'left';
                                break;
                            case 'bottom':
                                // 不区分旋转角度，直接赋值
                                exitX = 0;
                                exitY = 0.5;
                                exitDx = -1;
                                exitDy = 0;
                                direction = 'left';
                                break;
                            default:
                                exitX = 0;
                                exitY = 0.5;
                                exitDx = -1;
                                exitDy = 0;
                                direction = 'left';
                        }
                        
                        return {
                            x: exitX,
                            y: exitY,
                            dx: exitDx,
                            dy: exitDy,
                            direction: direction
                        };
                    }
                    
                    function getInterfaceCell(parentCell, interfaceIndex, elementData) {
                        if (!parentCell || !graph || !elementData) return null;
                        
                        const parentId = parentCell.getId();
                        
                        // 使用原始的interfaceIndex构建预期的ID，与drawInterfaces中的ID生成逻辑保持一致
                        const expectedId = 'interface_' + parentId + '_' + interfaceIndex;

                        
                        const interfaceCell = model.getCell(expectedId);
                        if (interfaceCell) {

                            return interfaceCell;
                        }
                        
                        const children = graph.getChildVertices(parentCell);

                        
                        for (let i = 0; i < children.length; i++) {
                            const child = children[i];
                            const childId = child.getId();

                            if (childId === expectedId) {

                                return child;
                            }
                        }
                        
                        // 如果找不到，尝试通过接口名称查找
                        if (elementData.properties && elementData.properties.interface_list && 
                            elementData.properties.interface_list[interfaceIndex]) {
                            const interfaceName = elementData.properties.interface_list[interfaceIndex].name;
                            for (let i = 0; i < children.length; i++) {
                                const child = children[i];
                                if (child.getValue() === interfaceName) {
                                    return child;
                                }
                            }
                        }

                        return null;
                    }
                    
                    function getOptimalEdgeStyle(sourcePoint, targetPoint, sourceDirection, targetDirection) {
                        const sourceDir = sourceDirection || 'left';
                        const targetDir = targetDirection || 'left';
                        
                        const horizontalDirs = ['left', 'right'];
                        const verticalDirs = ['top', 'bottom'];
                        
                        const sourceIsHorizontal = horizontalDirs.includes(sourceDir);
                        const targetIsHorizontal = horizontalDirs.includes(targetDir);
                        
                        if (sourceIsHorizontal && targetIsHorizontal) {
                            return 'orthogonalEdgeStyle';
                        }
                        
                        if (!sourceIsHorizontal && !targetIsHorizontal) {
                            return 'orthogonalEdgeStyle';
                        }
                        
                        return 'orthogonalEdgeStyle';
                    }
                    
                    function createConnectionBetweenElements(sourceId, targetId) {
                        if (!model || !graph || !parent) return;
                        
                        const sourceData = elementsData.find(d => d.id === sourceId);
                        const targetData = elementsData.find(d => d.id === targetId);
                        
                        if (!sourceData || !targetData) {
                            return;
                        }
                        
                        const sourceCell = model.getCell(sourceId);
                        const targetCell = model.getCell(targetId);
                        
                        if (!sourceCell || !targetCell) {
                            return;
                        }

                        compareInterfaces(sourceData, targetData)
                                .then(connectionResult => {                                  
                                    if (connectionResult && !connectionResult.error) {
                                        const sourceInterfaceIndex = connectionResult.sourceInterfaceIndex;
                                        const targetInterfaceIndex = connectionResult.targetInterfaceIndex;
                                    
                                        // 确保接口图形已经绘制
                                        activeCell = sourceCell;
                                        activeCellData = sourceData;
                                        drawInterfaces();
                                        
                                        activeCell = targetCell;
                                        activeCellData = targetData;
                                        drawInterfaces();
                                    
                                        const sourceInterfaceCell = getInterfaceCell(sourceCell, sourceInterfaceIndex, sourceData);
                                        const targetInterfaceCell = getInterfaceCell(targetCell, targetInterfaceIndex, targetData);
                                    

                                    
                                        if (!sourceInterfaceCell || !targetInterfaceCell) {

                                            return;
                                        }
                                    
                                        const sourceConnPoint = getInterfaceConnectionPoint(sourceData, sourceInterfaceIndex);
                                        const targetConnPoint = getInterfaceConnectionPoint(targetData, targetInterfaceIndex);
                                    

                                    
                                        const edgeStyle = getOptimalEdgeStyle(
                                            sourceConnPoint,
                                            targetConnPoint,
                                            sourceConnPoint ? sourceConnPoint.direction : 'left',
                                            targetConnPoint ? targetConnPoint.direction : 'left'
                                        );
                                    

                                    
                                        model.beginUpdate();
                                        try {
                                            const edgeId = 'edge_' + Date.now();
                                            
                                            let styleParts = [
                                            'strokeColor=#6366f1',
                                            'strokeWidth=2',
                                            'endArrow=none',
                                            'edgeStyle=' + edgeStyle,
                                            'sourcePortConstraint=none',
                                            'targetPortConstraint=none',
                                            'avoidOrthogonalLoop=true',
                                            'orthogonalLoop=1',
                                            'rounded=1'
                                        ];
                                            
                                            if (sourceConnPoint) {
                                                styleParts.push('exitX=' + sourceConnPoint.x);
                                                styleParts.push('exitY=' + sourceConnPoint.y);
                                                styleParts.push('exitDx=' + sourceConnPoint.dx);
                                                styleParts.push('exitDy=' + sourceConnPoint.dy);
                                            }
                                            
                                            if (targetConnPoint) {
                                                styleParts.push('entryX=' + targetConnPoint.x);
                                                styleParts.push('entryY=' + targetConnPoint.y);
                                                styleParts.push('entryDx=' + targetConnPoint.dx);
                                                styleParts.push('entryDy=' + targetConnPoint.dy);
                                            }
                                            
                                            const style = styleParts.join(';');

                                            
                                            const edge = graph.insertEdge(parent, edgeId, '', sourceInterfaceCell, targetInterfaceCell, style);
                                            

                                            if (edge.source) {

                                            }
                                            if (edge.target) {

                                            }
                                            
                                            const edgeGeometry = edge.getGeometry();
                                            if (edgeGeometry) {

                                                if (edgeGeometry.sourcePoint) {

                                                }
                                                if (edgeGeometry.targetPoint) {

                                                }
                                            }
                                            
                                            const connData = {
                                                id: edgeId,
                                                sourceId: sourceId,
                                                targetId: targetId,
                                                direction: '单向',
                                                color: '#6366f1',
                                                type: connectionResult.subType,
                                                sourceInterfaceIndex: sourceInterfaceIndex,
                                                // 连接点参数
                                                exitX: sourceConnPoint ? sourceConnPoint.x : 0,
                                                exitY: sourceConnPoint ? sourceConnPoint.y : 0,
                                                entryX: targetConnPoint ? targetConnPoint.x : 0,
                                                entryY: targetConnPoint ? targetConnPoint.y : 0,
                                                // 偏移量
                                                exitDx: sourceConnPoint ? sourceConnPoint.dx : 0,
                                                exitDy: sourceConnPoint ? sourceConnPoint.dy : 0,
                                                entryDx: targetConnPoint ? targetConnPoint.dx : 0,
                                                entryDy: targetConnPoint ? targetConnPoint.dy : 0,
                                                targetInterfaceIndex: targetInterfaceIndex,
                                                sourceInterfaceName: sourceData.properties.interface_list[sourceInterfaceIndex]?.name,
                                                targetInterfaceName: targetData.properties.interface_list[targetInterfaceIndex]?.name,
                                                sourceConnectionPoint: sourceConnPoint,
                                                targetConnectionPoint: targetConnPoint,
                                                lineType: 'auto-orthogonal'
                                            };
                                            
                                            if (sourceData.properties && sourceData.properties.interface_list && sourceData.properties.interface_list[sourceInterfaceIndex]) {
                                                const connectionInfo = `${targetData.name || '未知'} - ${targetData.properties.interface_list[targetInterfaceIndex].name}`;
                                                sourceData.properties.interface_list[sourceInterfaceIndex].connection = connectionInfo;
                                            }
                                            
                                            if (targetData.properties && targetData.properties.interface_list && targetData.properties.interface_list[targetInterfaceIndex]) {
                                                const connectionInfo = `${sourceData.name || '未知'} - ${sourceData.properties.interface_list[sourceInterfaceIndex].name}`;
                                                targetData.properties.interface_list[targetInterfaceIndex].connection = connectionInfo;
                                            }
                                            
                                            connectionsData.push(connData);

                                            // 使用 setSelectionCell 统一更新选择状态，触发 CHANGE 事件
                                            graph.setSelectionCell(edge);
                                        } finally {
                                            model.endUpdate();
                                        }
                                } else {
                                        if (connectionResult && connectionResult.error) {
                                            showCustomModal(`无法连接：${connectionResult.error}`, 'error');
                                        } else {
                                            showCustomModal('无法连接：没有兼容的接口或操作被取消', 'error');
                                        }
                                    }
                            })
                            .catch(error => {
                            });
                    }

                    function compareInterfaces(sourceElementData, targetElementData) {
                        if (!sourceElementData || !targetElementData) {
                            return Promise.resolve({ error: '元素数据不完整' });
                        }
                        
                        const componentA = sourceElementData.properties.interface_list || [];
                        const componentB = targetElementData.properties.interface_list || [];
                        
                        // 检查是否有启用的接口
                        const enabledA = componentA.filter(item => item.enabled);
                        const enabledB = componentB.filter(item => item.enabled);
                        
                        if (enabledA.length === 0) {
                            return Promise.resolve({ error: `${sourceElementData.name} 没有启用的接口` });
                        }
                        
                        if (enabledB.length === 0) {
                            return Promise.resolve({ error: `${targetElementData.name} 没有启用的接口` });
                        }
                        
                        // 检查是否有未连接的接口
                        const freeA = enabledA.filter(item => !item.connection || item.connection === '-' || item.connection === null);
                        const freeB = enabledB.filter(item => !item.connection || item.connection === '-' || item.connection === null);
                        
                        if (freeA.length === 0) {
                            return Promise.resolve({ error: `${sourceElementData.name} 没有未连接的接口` });
                        }
                        
                        if (freeB.length === 0) {
                            return Promise.resolve({ error: `${targetElementData.name} 没有未连接的接口` });
                        }
                        
                        const availableSubTypes = new Set();
                        
                        const allSubTypes = new Set();
                        enabledA.forEach(item => { allSubTypes.add(item.subType); });
                        enabledB.forEach(item => { allSubTypes.add(item.subType); });
                        
                        allSubTypes.forEach(subType => {
                            const hasFreeA = freeA.some(item => item.subType === subType);
                            const hasFreeB = freeB.some(item => item.subType === subType);
                            
                            if (hasFreeA && hasFreeB) {
                                availableSubTypes.add(subType);
                            }
                        });
                        
                        const availableSubTypesArray = Array.from(availableSubTypes);
                        
                        if (availableSubTypesArray.length === 0) {
                            return Promise.resolve({ error: '没有兼容的接口类型' });
                        }
                        
                        if (availableSubTypesArray.length === 1) {
                            const subType = availableSubTypesArray[0];
                            return showInterfaceSelectionModal(subType, componentA, componentB, sourceElementData, targetElementData);
                        }
                        
                        return new Promise((resolve) => {
                            const modal = document.createElement('div');
                            modal.className = 'interface-selector-modal';
                            modal.style.cssText = `

                                top: 0;

                            modalContent.appendChild(message);
                            
                            const interfaceList = document.createElement('div');
                            interfaceList.className = 'interface-options';

                    // 收集项目数据
                    function collectProjectData() {
                        return {
                            identifier: 'PhyArhi',
                            elements: elementsData.map(element => ({
                                ...element,
                                type: element.type,
                                position: element.position,
                                size: element.size,
                                width: element.width || element.size,
                                height: element.height,
                                color: element.color,
                                rounded: element.rounded,
                                fontColor: element.fontColor,
                                fontSize: element.fontSize,
                                strokeColor: element.strokeColor,
                                labelAlign: element.labelAlign,
                                labelVerticalAlign: element.labelVerticalAlign,
                                properties: element.properties,
                                rotation: element.rotation || 0
                            })),
                            connections: connectionsData.map(conn => ({
                                ...conn,
                                direction: conn.direction || '单向',
                                color: conn.color || '#6366f1',
                                type: conn.type || 'default',
                                exitX: conn.exitX || 0,
                                exitY: conn.exitY || 0,
                                entryX: conn.entryX || 0,
                                entryY: conn.entryY || 0,
                                exitDx: conn.exitDx || 0,
                                exitDy: conn.exitDy || 0,
                                entryDx: conn.entryDx || 0,
                                entryDy: conn.entryDy || 0
                            })),
                            timestamp: new Date().toISOString()
                        };
                    }

                    // 保存项目到本地
                    function saveProjectToLocal() {
                        const projectData = collectProjectData();
                        const jsonData = JSON.stringify(projectData, null, 2);

                        const fileName = prompt('请输入项目文件名:', 'phyarchi_project.json');
                        if (!fileName) return;

                        const finalFileName = fileName.endsWith('.json') ? fileName : `${fileName}.json`;

                        const blob = new Blob([jsonData], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);

                        const a = document.createElement('a');
                        a.href = url;
                        a.download = finalFileName;
                        document.body.appendChild(a);
                        a.click();

                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 0);

                        showCustomModal('项目已保存到本地', 'success');
                    }

                    // PhyArchi登录验证
                    function phyArchiLoginVerification(username, password, mode, dialogContainer) {
                        fetch(ip + '/manage_login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                datatype: 'operation',
                                login: {
                                    name: username,
                                    password: password,
                                    mode: mode
                                }
                            })
                        })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP错误: ${response.status}`);
                            }
                            return response.json();
                        })
                        .then(data => {
                            if (!data || !data.output) {
                                throw new Error('无效的响应格式');
                            }

                            const userlogin = typeof data.output === 'string' ? JSON.parse(data.output) : data.output;

                            if (userlogin.status === true) {
                                sessionStorage.setItem('authenticated', 'true');
                                sessionStorage.setItem('username', username);
                                const expiryTime = new Date().getTime() + (30 * 60 * 1000);
                                sessionStorage.setItem('auth_expiry', expiryTime.toString());
                                sessionStorage.setItem('userType', userlogin.UserInfo.UserLevel);
                                sessionStorage.setItem('userData', JSON.stringify(userlogin.UserInfo));

                                dialogContainer.remove();
                                showCustomModal('登录成功', 'success');

                                setTimeout(() => {
                                    saveProjectToPersonalSpace();
                                }, 500);
                            } else {
                                let message = '登录失败，请重试';
                                if (userlogin && userlogin.error) {
                                    if (userlogin.error === 1) {
                                        message = '用户名不存在，请重试';
                                    } else if (userlogin.error === 2) {
                                        message = '密码错误，请重试';
                                    }
                                }
                                const errorMessage = document.getElementById('phyarchi-error-message');
                                errorMessage.textContent = message;
                                errorMessage.classList.remove('hidden');
                                setTimeout(() => errorMessage.classList.add('hidden'), 3000);
                            }
                        })
                        .catch(error => {
                            console.error('登录验证失败:', error);
                            const errorMessage = document.getElementById('phyarchi-error-message');
                            errorMessage.textContent = '登录失败，请稍后重试';
                            errorMessage.classList.remove('hidden');
                            setTimeout(() => errorMessage.classList.add('hidden'), 3000);
                        });
                    }

                    // 获取PhyArchiProjectFile文件夹中的JSON文件列表
                    async function getTemplateProjectFiles() {
                        try {
                            try {
                                const configResponse = await fetch('../../PhyArchiProjectFile/template_list.json');
                                if (configResponse.ok) {
                                    const config = await configResponse.json();
                                    if (config.templates && Array.isArray(config.templates)) {
                                        return config.templates;
                                    }
                                }
                            } catch (configError) {
                                console.log('配置文件读取失败，尝试目录列表:', configError);
                            }

                            const response = await fetch('../../PhyArchiProjectFile/');

                            if (!response.ok) {
                                throw new Error('无法访问文件夹内容');
                            }

                            const html = await response.text();
                            const templateFiles = [];

                            const jsonFileRegex = /href="([^"]+\.json)"/g;
                            let match;
                            while ((match = jsonFileRegex.exec(html)) !== null) {
                                let fileName = match[1];
                                if (fileName.includes('/PhyArchiProjectFile/')) {
                                    fileName = fileName.split('/PhyArchiProjectFile/')[1];
                                }
                                fileName = fileName.split('/').pop();

                                if (fileName.endsWith('.json')) {
                                    templateFiles.push(fileName);
                                }
                            }

                            return templateFiles;
                        } catch (error) {
                            console.error('获取模板文件列表出错:', error);
                            throw error;
                        }
                    }

                                                </label>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                                <div class="px-6 py-4 border-t border-gray-600 bg-gray-700 flex justify-end space-x-3">
                                    <button id="cancel-template-project" class="px-4 py-2 border border-gray-500 rounded-md shadow-sm text-sm font-medium text-gray-300 bg-gray-600 hover:bg-gray-500 transition-colors">
                                        取消
                                    </button>
                                    <button id="confirm-template-project" class="px-4 py-2 rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 transition-colors">
                                        确定
                                    </button>
                                </div>
                            </div>
                        `;

                        document.body.appendChild(dialogContainer);

                        document.getElementById('cancel-template-project').addEventListener('click', () => {
                            dialogContainer.remove();
                        });

                        document.getElementById('confirm-template-project').addEventListener('click', () => {
                            const selectedTemplate = document.querySelector('input[name="templateProject"]:checked').value;
                            loadSelectedTemplateProject(selectedTemplate);
                            dialogContainer.remove();
                        });
                    }

                    // 加载选中的模板项目
                    function loadSelectedTemplateProject(templateFileName) {
                        const templatePath = `../../PhyArchiProjectFile/${templateFileName}`;
                        console.log('加载模板项目:', templatePath);

                        fetch(templatePath)
                            .then(response => response.json())
                            .then(projectData => {
                                if (!projectData.elements || !Array.isArray(projectData.elements)) {
                                    throw new Error('项目文件格式无效');
                                }

                                applyProjectData(projectData);
                                showCustomModal('模板项目加载成功', 'success');
                            })
                            .catch(error => {
                                console.error('加载模板项目失败:', error);
                                showCustomModal(`加载模板项目失败: ${error.message}`, 'error');
                            });
                    }

                    // 加载本地项目文件
                    function loadLocalProject() {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = '.json';
                        input.style.display = 'none';
                        document.body.appendChild(input);

                        input.addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (!file) return;

                            const reader = new FileReader();
                            reader.onload = function(event) {
                                try {
                                    const projectData = JSON.parse(event.target.result);
                                    if (!projectData.elements || !Array.isArray(projectData.elements)) {
                                        throw new Error('项目文件格式无效');
                                    }

                                    applyProjectData(projectData);
                                    showCustomModal('本地项目加载成功', 'success');
                                } catch (error) {
                                    showCustomModal(`加载项目失败: ${error.message}`, 'error');
                                }
                            };
                            reader.readAsText(file);

                            setTimeout(() => {
                                document.body.removeChild(input);
                            }, 0);
                        });

                        input.click();
                    }

                    // 应用项目数据
                    function applyProjectData(projectData) {
                        // 清空当前数据
                        clearAllData();

                        // 加载元素数据
                        if (projectData.elements && Array.isArray(projectData.elements)) {
                            elementsData = projectData.elements;
                        }

                        // 加载连接数据
                        if (projectData.connections && Array.isArray(projectData.connections)) {
                            connectionsData = projectData.connections;
                        }

                        // 重新绘制架构
                        redrawArchitecture();
                    }

                    // 输出结果功能（占位）
                    function outputResults() {
                        showCustomModal('输出结果功能开发中...', 'info');
                    }

                    // 自动检查功能（占位）
                    function autoCheck() {
                        showCustomModal('自动检查功能开发中...', 'info');
                    }

                });
            </script>
        </div>

    </div>
    
    <div id="footer-container"></div>
    
    <script src="../js/load-components.js"></script>
    <script src="../js/function-link-manager.js"></script>
    <script src="../js/Visit_Monitor.js"></script>
</body>
