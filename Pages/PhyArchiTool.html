<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理架构大厅-达客智驾领航员</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <!-- <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet"> -->
    <link href="../css/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="../css/fonts/local-fonts.css" rel="stylesheet">
    <script src="../js/ipcontroller.js"></script>  
    <script src="../js/load-duck-assistant.js"></script>
    <script src="../js/HwElementType.js"></script>
    <style>
        /* 内容区域样式调整 */
        .main-content {
            padding-top: 80px; /* 为固定定位的导航栏留出更多空间 */
            height: 100vh;
            box-sizing: border-box;
        }
        
        .content-container {
            height: calc(100vh - 80px); /* 减去导航栏高度 */
        }
        
        /* 强制左右div使用正确的宽度 */
        #architeah {
            width: 30% !important;
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-all;
        }
        
        #archidemo {
            width: 70% !important;
            min-width: 0;
        }
    </style>
</head>
<body class="bg-dark bg-grid text-gray-100 font-inter min-h-screen flex flex-col bg-grid w-full h-full p-0 m-0">
    <!-- 导航栏容器 --> 
    <div id="navbar-container"></div>
    
    <!-- 主内容区域 -->
    <div class="main-content w-full">
        <!-- 内容容器 -->
        <div class="content-container rounded-lg overflow-hidden border border-primary/30 cyber-border" id="archi-content">
            <h3 class="text-xl font-bold text-white neon-glow px-4 py-2">物理架构小课堂</h3>
            <div class="flex h-[calc(100%-48px)] flex-nowrap w-full">
                <div id="architeah" class="h-full bg-dark-light border border-primary/30 p-3 overflow-y-auto">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="text-base font-bold text-white">元素属性</h4>
                        <button id="apply-properties" class="bg-primary text-white px-4 py-2 rounded hover:bg-primary/80 transition-colors">应用属性修改</button>
                    </div>
                    <div id="no-selection" class="text-center text-gray-400 py-8">
                        <p>请选择一个元素进行编辑</p>
                    </div>
                    <div id="element-properties" class="hidden">
                        <div class="mb-4 flex items-center">
                            <label class="text-sm font-medium text-gray-300 w-16">元素ID:</label>
                            <span id="element-id" class="flex-1 bg-dark-light rounded p-2 text-sm text-gray-100"></span>
                        </div>
                        <div class="mb-4 flex items-center">
                            <label class="text-sm font-medium text-gray-300 w-16">元素类型:</label>
                            <span id="element-type" class="flex-1 bg-dark-light border rounded p-2 text-sm text-gray-100"></span>
                        </div>
                        <div class="mb-4 flex items-center">
                            <label for="element-name" class="text-sm font-medium text-gray-300 w-16">元素名称:</label>
                            <input id="element-name" type="text" class="flex-1 bg-dark border border-primary/30 rounded p-2 text-sm text-gray-100" placeholder="请输入元素名称">
                        </div>
                        <div class="mb-6 flex items-center">
                            <label for="element-color" class="text-sm font-medium text-gray-300 w-16">元素颜色:</label>
                            <input id="element-color" type="color" class="w-16 h-8 bg-dark border border-primary/30 rounded p-0">
                        </div>

                    </div>
                    
                    <!-- 连接线属性面板，预定义并保持与元素属性面板相同的样式 -->
                    <div id="connection-properties" class="hidden">
                        <div class="mb-4 flex items-center">
                            <label class="text-sm font-medium text-gray-300 w-16">连接线ID:</label>
                            <span id="connection-id" class="flex-1 bg-dark-light rounded p-2 text-sm text-gray-100"></span>
                        </div>
                        <div class="mb-4 flex items-center">
                            <label class="text-sm font-medium text-gray-300 w-16">源元素ID:</label>
                            <span id="connection-source" class="flex-1 bg-dark-light rounded p-2 text-sm text-gray-100"></span>
                        </div>
                        <div class="mb-4 flex items-center">
                            <label class="text-sm font-medium text-gray-300 w-16">目标元素ID:</label>
                            <span id="connection-target" class="flex-1 bg-dark-light rounded p-2 text-sm text-gray-100"></span>
                        </div>
                        <div class="mb-4 flex items-center">
                            <label for="connection-direction" class="text-sm font-medium text-gray-300 w-16">方向:</label>
                            <select id="connection-direction" class="flex-1 bg-dark border border-primary/30 rounded p-2 text-sm text-gray-100">
                                <option value="单向">单向</option>
                                <option value="双向">双向</option>
                            </select>
                        </div>
                        <div class="mb-4 flex items-center">
                            <label for="connection-color" class="text-sm font-medium text-gray-300 w-16">颜色:</label>
                            <input id="connection-color" type="color" class="w-16 h-8 bg-dark border border-primary/30 rounded p-0" value="#6366f1">
                        </div>
                        <div class="mb-6 flex items-center">
                            <label for="connection-type" class="text-sm font-medium text-gray-300 w-16">类型:</label>
                            <input id="connection-type" type="text" class="flex-1 bg-dark border border-primary/30 rounded p-2 text-sm text-gray-100" value="GPIO">
                        </div>
                        <!-- <button id="apply-connection-properties" class="w-full bg-primary hover:bg-primary/80 text-white py-2 px-4 rounded-md transition-colors">
                            应用属性
                        </button> -->
                    </div>
                </div>

                <div id="archidemo" class="h-full bg-transparent border border-primary/30 relative overflow-hidden">
                    <!-- 虚拟画布容器 -->
                    <div id="canvas-container" class="absolute top-0 left-0 w-[10000px] h-[10000px] bg-white">
                        <!-- 网格背景将通过CSS实现 -->
                    </div>
                    
                    <!-- 添加按钮 -->
                <div id="add-button-container" class="absolute top-4 left-4 z-10">
                    <div class="relative">
                        <button id="add-button" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/80 transition-colors flex items-center gap-2">
                            <i class="fa fa-plus"></i>
                            <span>添加</span>
                        </button>
                        <div id="shape-menu" class="absolute top-full left-0 mt-1 bg-white text-gray-800 rounded-md shadow-lg hidden z-20">
                            <!-- 元素类型选项将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
                </div>
            </div>
            <style>
                /* 网格背景 */
                #canvas-container {
                    background-image: linear-gradient(#e0e0e0 1px, transparent 1px),
                                    linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
                    background-size: 20px 20px;
                    transform-origin: 0 0;
                }
                
                /* 画布视图 */
                #archidemo {
                    position: relative;
                    width: 100%;
                    height: 100%;
                }
                
                /* 元素样式 */
                .canvas-element {                        
                    position: absolute;                        
                    cursor: move;                        
                    user-select: none;                        
                    display: flex;                        
                    align-items: center;                        
                    justify-content: center;                        
                    color: white;                        
                    font-size: 10px;                        
                    font-weight: bold;                    
                }                    
                
                /* 元素ID标签 */
                .element-id {
                    position: absolute;
                    top: 0px;
                    left: 50%;
                    transform: translateX(-50%);
                    white-space: nowrap;
                    pointer-events: none;
                }
                
                /* 顶点控制点样式 */
                .vertex-control {
                    position: absolute;
                    width: 10px;
                    height: 10px;
                    background-color: white;
                    border: 1px solid #000;
                    border-radius: 50%;
                    transform: translate(-50%, -50%);
                    cursor: pointer;
                    z-index: 10;
                }
                
                .vertex-control:hover {
                    background-color: #ffaa00;
                }
            </style>
                
            <script>
                // 页面加载是顺序执行
                document.addEventListener('DOMContentLoaded', function() {
                    // 获取DOM元素
                    const archidemo = document.getElementById('archidemo');
                    const canvasContainer = document.getElementById('canvas-container');
                    const addButton = document.getElementById('add-button');
                    const shapeMenu = document.getElementById('shape-menu');

                    // 动态生成元素类型选项
                    function generateElementTypesMenu() {
                        // 清空菜单
                        shapeMenu.innerHTML = '';
                        // 遍历elementTypes对象生成选项
                        for (const typeName in elementTypes) {
                            if (elementTypes.hasOwnProperty(typeName)) {
                                const typeInfo = elementTypes[typeName];
                                
                                // 检查是否有子选项
                                if (typeInfo.subTypes) {
                                    // 创建带有子菜单的父项目
                                    const parentItem = document.createElement('div');
                                    parentItem.id = `add-${typeName}`;
                                    parentItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer flex justify-between items-center';
                                    
                                    const textSpan = document.createElement('span');
                                    textSpan.textContent = typeName;
                                    parentItem.appendChild(textSpan);
                                    
                                    const arrowSpan = document.createElement('span');
                                    arrowSpan.className = 'fa fa-chevron-right text-xs';
                                    parentItem.appendChild(arrowSpan);
                                    // 创建子菜单容器（二级菜单）
                                    const subMenu = document.createElement('div');
                                    subMenu.className = 'absolute left-full top-0 w-48 bg-white text-gray-800 rounded-md shadow-lg hidden z-30';
                                    // 检查子选项是对象（三层菜单）还是数组（二层菜单）
                                    if (typeof typeInfo.subTypes === 'object') {
                                        // 三层菜单结构：处理对象格式的子选项
                                        for (const secondLevelName in typeInfo.subTypes) {
                                            if (typeInfo.subTypes.hasOwnProperty(secondLevelName)) {
                                                const thirdLevelItems = typeInfo.subTypes[secondLevelName];
                                                
                                                // 创建二级菜单项
                                                const secondLevelItem = document.createElement('div');
                                                secondLevelItem.id = `add-${typeName}-${secondLevelName}`;
                                                secondLevelItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer flex justify-between items-center relative';
                                                secondLevelItem.textContent = secondLevelName;
                                                
                                                // 添加向右箭头
                                                const secondArrow = document.createElement('span');
                                                secondArrow.className = 'fa fa-chevron-right text-xs';
                                                secondLevelItem.appendChild(secondArrow);
                                                
                                                // 创建三级菜单容器
                                                const thirdLevelMenu = document.createElement('div');
                                                thirdLevelMenu.className = 'absolute left-full top-0 w-48 bg-white text-gray-800 rounded-md shadow-lg hidden z-40';
                                                // 为每个三级选项创建条目
                                                thirdLevelItems.forEach((thirdLevelItem, index) => {
                                                    const thirdItem = document.createElement('div');
                                                    const thirdLevelValue = thirdLevelItem.Name || `型号${index + 1}`; // 获取P属性值或使用默认值
                                                    thirdItem.id = `add-${typeName}-${secondLevelName}-${thirdLevelValue}`;
                                                    thirdItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                                                    thirdItem.textContent = thirdLevelValue;
                                                    
                                                    // 为三级选项添加点击事件处理
                                                    thirdItem.addEventListener('click', function() {
                                                        // 创建子类型的临时信息对象，继承父类型的所有属性
                                                        const subTypeInfo = {...typeInfo};
                                                        const elementcontent = typeInfo.subTypes[secondLevelName];
                                                        elementcontent.forEach(element => {
                                                            if (element.Name === thirdLevelValue) {
                                                                subTypeInfo.properties = element;
                                                                // 打印SoC的properties属性
                                                                

                                                                

                                                                // subTypeinfo.delete(subTypes);
                                                            }
                                                        });
                                                        // 根据形状生成元素
                                                        const itemShape = typeInfo.shape;
                                                        // console.log("third level", subTypeInfo)
                                                        if (itemShape === 'circle') {
                                                            generateCircle(subTypeInfo,3);
                                                        } else if (itemShape === 'square') {
                                                            generateSquare(subTypeInfo,3);
                                                        } else if (itemShape === 'rectangle') {
                                                            generateRectangle(subTypeInfo,3);
                                                        }
                                                        
                                                        
                                                        // 关闭所有菜单
                                                        shapeMenu.classList.add('hidden');
                                                        // 确保所有子菜单都关闭
                                                        document.querySelectorAll('#shape-menu .hidden').forEach(menu => {
                                                            menu.classList.add('hidden');
                                                        });
                                                    });
                                                    
                                                    thirdLevelMenu.appendChild(thirdItem);
                                                });
                                                
                                                // 为二级菜单项添加点击事件以切换三级菜单显示
                                                secondLevelItem.addEventListener('click', function(e) {
                                                    e.stopPropagation();
                                                    // 关闭其他所有三级菜单
                                                    document.querySelectorAll('#shape-menu .z-40').forEach(menu => {
                                                        if (menu !== thirdLevelMenu) {
                                                            menu.classList.add('hidden');
                                                        }
                                                    });
                                                    // 切换当前三级菜单显示状态
                                                    thirdLevelMenu.classList.toggle('hidden');
                                                });
                                                
                                                // 将三级菜单添加到二级菜单项中
                                                secondLevelItem.appendChild(thirdLevelMenu);
                                                subMenu.appendChild(secondLevelItem);
                                            }
                                        }
                                    } else if (Array.isArray(typeInfo.subTypes)) {
                                        // 二层菜单结构：处理数组格式的子选项
                                        typeInfo.subTypes.forEach(subTypeName => {
                                            const subItem = document.createElement('div');
                                            subItem.id = `add-${typeName}-${subTypeName}`;
                                            subItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                                            subItem.textContent = subTypeName;
                                            
                                            // 为子选项添加点击事件处理
                                            subItem.addEventListener('click', function() {
                                                // 创建子类型的临时信息对象，继承父类型的所有属性
                                                const subTypeInfo = {...typeInfo};
                                                
                                                // 根据形状生成元素
                                                const itemShape = typeInfo.shape;
                                                if (itemShape === 'circle') {
                                                    generateCircle(subTypeInfo,2);
                                                } else if (itemShape === 'square') {
                                                    
                                                    generateSquare(subTypeInfo,2);
                                                } else if (itemShape === 'rectangle') {
                                                    generateRectangle(subTypeInfo,2);
                                                }
                                                                                                
                                                // 关闭所有菜单
                                                shapeMenu.classList.add('hidden');
                                            });
                                            
                                            subMenu.appendChild(subItem);
                                        });
                                    }
                                    
                                    // 为父项添加点击事件以切换子菜单显示
                                    parentItem.addEventListener('click', function(e) {
                                        e.stopPropagation();
                                        // 关闭其他所有二级菜单
                                        document.querySelectorAll('#shape-menu .z-30').forEach(menu => {
                                            if (menu !== subMenu) {
                                                menu.classList.add('hidden');
                                            }
                                        });
                                        // 关闭所有三级菜单
                                        document.querySelectorAll('#shape-menu .z-40').forEach(menu => {
                                            menu.classList.add('hidden');
                                        });
                                        // 切换当前子菜单显示状态
                                        subMenu.classList.toggle('hidden');
                                    });
                                    
                                    // 将子菜单添加到父项中
                                    parentItem.appendChild(subMenu);
                                    shapeMenu.appendChild(parentItem);
                                } else {
                                    // 没有子选项的普通项目
                                    const typeItem = document.createElement('div');
                                    typeItem.id = `add-${typeName}`;
                                    typeItem.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                                    typeItem.textContent = typeName;
                                    
                                    // 添加点击事件处理
                                    typeItem.addEventListener('click', function() {
                                        const iteminfo = elementTypes[typeName];
                                        const itemShape = elementTypes[typeName].shape;
                                        if (itemShape === 'circle') {
                                            generateCircle(iteminfo,1);
                                        } else if (itemShape === 'square') {
                                            generateSquare(iteminfo,1);
                                        } else if (itemShape === 'rectangle') {
                                            generateRectangle(iteminfo,1);
                                        }
                                        shapeMenu.classList.add('hidden');
                                    });
                                    
                                    shapeMenu.appendChild(typeItem);
                                }
                            }
                        }
                    }
                    
                    // 设置初始画布位置和缩放
                    let scale = 1;
                    let offsetX = 0;
                    let offsetY = 0;
                    let isDragging = false; // 画布拖拽标志
                    let isElementDragging = false; // 元素拖拽标志
                    let dragStartX = 0;
                    let dragStartY = 0;
                    let elements = []; // 存储DOM元素
                    let elementData = []; // 存储元素数据
                    let activeElement = null;
                    let activeElementData = null;
                    let elementDragStartX = 0;
                    let elementDragStartY = 0;
                    let elementIdCounter = 1; // ID计数器
                    let zIndexCounter = 100; // 全局z-index计数器，确保新元素总是在最上方
                    
                    // 更新画布变换
                    function updateCanvasTransform() {
                        canvasContainer.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
                    }
                    
                    // 初始化画布位置（居中显示一部分）
                    function initializeCanvas() {
                        const containerWidth = 500;
                        const containerHeight = 500;
                        offsetX = -4750 * scale + containerWidth / 2;
                        offsetY = -4750 * scale + containerHeight / 2;
                        updateCanvasTransform();
                    }
                    
                    // 添加长方形元素
                    function createRectangle(iteminfo,layer) {
                        const interface_gap = 50;
                        const interface_height = 20;
                        const margin = 50;
                        const rectangle = document.createElement('div');
                        rectangle.className = 'canvas-element rectangle';
                        const left = 5000 + 50; // 画布中央+横向偏移50,50
                        const top = 5000 + 50;
                        width = iteminfo.width; // 默认宽度
                        height = iteminfo.height; // 默认高度

                        // 创建元素数据
                        const id = elementIdCounter++;

                        if(layer === 1) {
                            name = 'element'+id; // 默认名称为"element"加ID
                            properties = {};
                        } else if (layer === 2) {
                            name = 'element'+id; // 默认名称为"element"加ID
                            properties = {};
                        }else if (layer === 3) {
                            name = iteminfo.properties.Name; // 默认名称为"element"加ID
                            properties = iteminfo.properties;
                            const interface_number=iteminfo.properties.interface.VIDEO[0].Number;
                            const interface_info = iteminfo.properties.interface.VIDEO[0].SubType;
                            height = interface_height*interface_number + interface_gap*(interface_number-1)+2*margin;
                        }

                        rectangle.style.left = left + 'px';
                        rectangle.style.top = top + 'px';
                        rectangle.style.width = width + 'px';
                        rectangle.style.height = height + 'px';
                        rectangle.style.zIndex = zIndexCounter++; // 确保新元素在最上方
                        console.log(iteminfo)
                        const data = {
                            id: id, // 顺序生成ID
                            type: 'rectangle',
                            ItemType: iteminfo.type,
                            name: name,
                            position: {
                                x: left,
                                y: top
                            },
                            properties: properties,
                            relativePosition: null, // 相对父元素的位置，null表示无相对位置
                            width: width,
                            height: height,
                            color: iteminfo.color, // 绿色
                            children: [], // 子元素ID数组
                            parent: '/' // 父元素ID，无父元素时为"/"
                        };
                        // 将数据与元素关联
                                                // 将数据与元素关联
                        rectangle.dataset.elementId = data.id;
                        // 创建名称标签
                        const idLabel = document.createElement('div');
                        idLabel.className = 'element-id';
                        idLabel.textContent = data.ItemType+":"+data.name;
                        rectangle.appendChild(idLabel);
                        canvasContainer.appendChild(rectangle);
                        elements.push(rectangle);
                        elementData.push(data);
                         
                        // 设置元素拖拽
                        setupElementDrag(rectangle, data);
                        // 设置顶点控制
                        setupVertexControls(rectangle, data);
                         
                        // 当layer为3时，生成interface子元素
                        if (layer === 3 && properties.interface && properties.interface.VIDEO && properties.interface.VIDEO[0]) {
                            const interface_info = properties.interface.VIDEO[0];
                            const interface_number = interface_info.Number;
                            const interface_name = interface_info.SubType;
                            
                            // 计算第一个interface的Y坐标（距离父元素顶部margin）
                            let current_y = margin;
                            
                            // 生成interface子元素
                            for (let i = 0; i < interface_number; i++) {
                                const interface_element = document.createElement('div');
                                interface_element.className = 'interface-element';
                                interface_element.style.position = 'absolute';
                                interface_element.style.left = '0px'; // 与父元素左侧对齐
                                interface_element.style.top = current_y + 'px';
                                interface_element.style.width = '50px';
                                interface_element.style.height = interface_height + 'px';
                                interface_element.style.backgroundColor = 'white';
                                interface_element.style.border = '1px solid #ccc';
                                interface_element.style.zIndex = zIndexCounter++;
                                
                                // 创建interface的标签
                                const interface_label = document.createElement('div');
                                interface_label.className = 'interface-label';
                                interface_label.textContent = interface_name;
                                interface_label.style.color = 'black';
                                interface_label.style.fontSize = '10px';
                                interface_label.style.textAlign = 'center';
                                interface_label.style.lineHeight = interface_height + 'px';
                                
                                interface_element.appendChild(interface_label);
                                rectangle.appendChild(interface_element);
                                
                                // 更新下一个interface的Y坐标
                                current_y += interface_height + interface_gap;
                            }
                        }
                        
                        // 新创建的元素自动选中
                        activeElement = rectangle;
                        activeElementData = data;
                          
                        return rectangle; // 返回创建的元素
                    }
                    
                    // 添加圆形元素
                    function createCircle(iteminfo,layer) {
                        const circle = document.createElement('div');
                        circle.className = 'canvas-element circle';
                        const left = 5000 + 50; // 画布中央+横向偏移50,50
                        const top = 5000 + 50;
                        const radius = iteminfo.radius; // 默认半径
                         
                        circle.style.left = left + 'px';
                        circle.style.top = top + 'px';
                        circle.style.width = (radius * 2) + 'px';
                        circle.style.height = (radius * 2) + 'px';
                        circle.style.zIndex = zIndexCounter++; // 确保新元素在最上方
                        // 创建元素数据
                        const id = elementIdCounter++;
                        if(layer === 1) {
                            name = 'element'+id; // 默认名称为"element"加ID
                            properties = {};
                        } else if (layer === 2) {
                            name = 'element'+id; // 默认名称为"element"加ID
                            properties = {};
                        }else if (layer === 3) {
                            name = iteminfo.properties.Name; // 默认名称为"element"加ID
                            properties = iteminfo.properties;
                        }
                        const data = {
                            id: id, // 顺序生成ID
                            type: 'circle',
                            ItemType: iteminfo.type, 
                            name: name, // 默认名称为"element"加ID
                            position: {
                                x: left,
                                y: top
                            },
                            properties: properties,
                            relativePosition: null, // 相对父元素的位置，null表示无相对位置
                            radius: radius,
                            color: iteminfo.color, // 蓝色

                    // 检查一个元素是否完全包含另一个元素
                    function isElementFullyContained(childElement, childData, parentElement, parentData) {
                        // 获取子元素的边界
                        const childLeft = parseFloat(childElement.style.left || 0);
                        const childTop = parseFloat(childElement.style.top || 0);
                        let childRight, childBottom;
                        
                        // 根据子元素类型计算右下角坐标
                        if (childData.type === 'circle') {
                            childRight = childLeft + childData.radius * 2;
                            childBottom = childTop + childData.radius * 2;
                        } else if (childData.type === 'rectangle') {
                            childRight = childLeft + childData.width;
                            childBottom = childTop + childData.height;
                        } else { // square
                            childRight = childLeft + childData.size;
                            childBottom = childTop + childData.size;
                        }
                        
                        // 获取父元素的边界
                        const parentLeft = parseFloat(parentElement.style.left || 0);
                        const parentTop = parseFloat(parentElement.style.top || 0);
                        let parentRight, parentBottom;
                        
                        // 根据父元素类型计算右下角坐标
                        if (parentData.type === 'circle') {
                            parentRight = parentLeft + parentData.radius * 2;
                            parentBottom = parentTop + parentData.radius * 2;
                        } else if (parentData.type === 'rectangle') {
                            parentRight = parentLeft + parentData.width;
                            parentBottom = parentTop + parentData.height;
                        } else { // square
                            parentRight = parentLeft + parentData.size;
                            parentBottom = parentTop + parentData.size;
                        }
                        
                        // 检查子元素是否完全在父元素内部
                        return childLeft >= parentLeft && 
                                childTop >= parentTop && 
                                childRight <= parentRight && 
                                childBottom <= parentBottom;
                    }
                    
                    // 清除所有元素的紫色高亮
                    function clearPurpleHighlights() {
                        elements.forEach(el => {
                            if (el.dataset.originalBorder) {
                                el.style.border = el.dataset.originalBorder;
                                delete el.dataset.originalBorder;
                            }
                        });
                    }
                    
                    // 更新子元素位置函数（递归更新所有层级）
                    function updateChildrenPositions(parentId) {
                        const parentData = elementData.find(data => data.id === parentId);
                        if (!parentData || !parentData.children || parentData.children.length === 0) {
                            return;
                        }
                        
                        // 计算父元素的中心点
                        const parentElement = elements.find(el => parseInt(el.dataset.elementId) === parentId);
                        if (!parentElement) return;
                        
                        const parentLeft = parseFloat(parentElement.style.left || 0);
                        const parentTop = parseFloat(parentElement.style.top || 0);
                        let parentCenterX, parentCenterY;
                        
                        if (parentData.type === 'circle') {
                            parentCenterX = parentLeft + parentData.radius;
                            parentCenterY = parentTop + parentData.radius;
                        } else if (parentData.type === 'rectangle') {
                            parentCenterX = parentLeft + parentData.width / 2;
                            parentCenterY = parentTop + parentData.height / 2;
                        } else { // square
                            parentCenterX = parentLeft + parentData.size / 2;
                            parentCenterY = parentTop + parentData.size / 2;
                        }
                        
                        // 递归更新所有子元素的位置
                        parentData.children.forEach(childId => {
                            const childData = elementData.find(data => data.id === childId);
                            const childElement = elements.find(el => parseInt(el.dataset.elementId) === childId);
                            
                            if (childData && childElement && childData.relativePosition) {
                                // 根据相对位置计算新的子元素中心位置
                                const newChildCenterX = parentCenterX + childData.relativePosition.x;
                                const newChildCenterY = parentCenterY + childData.relativePosition.y;
                                
                                // 计算子元素的左上角位置
                                let newChildLeft, newChildTop;
                                if (childData.type === 'circle') {
                                    newChildLeft = newChildCenterX - childData.radius;
                                    newChildTop = newChildCenterY - childData.radius;
                                } else if (childData.type === 'rectangle') {
                                    newChildLeft = newChildCenterX - childData.width / 2;
                                    newChildTop = newChildCenterY - childData.height / 2;
                                } else { // square
                                    newChildLeft = newChildCenterX - childData.size / 2;
                                    newChildTop = newChildCenterY - childData.size / 2;
                                }
                                
                                // 更新子元素位置
                                childElement.style.left = newChildLeft + 'px';
                                childElement.style.top = newChildTop + 'px';
                                
                                // 更新子元素数据
                                childData.position.x = newChildLeft;
                                childData.position.y = newChildTop;
                            }
                            
                            // 递归更新子元素的子元素（直到最底层）
                            updateChildrenPositions(childId);
                        });
                    }
                    
                    // 设置元素拖拽

                        e.stopPropagation(); // 阻止事件冒泡到画布
                        activeElement = element;

                        isElementDragging = true; // 设置元素拖拽标志
                            
                        // 获取元素当前位置（已考虑画布缩放和偏移）

                        const currentTop = parseFloat(element.style.top || 0);
                            
                        // 计算鼠标相对于画布容器的位置（考虑缩放）
                        const rect = archidemo.getBoundingClientRect();
                        const mouseX = (e.clientX - rect.left - offsetX) / scale;
                        const mouseY = (e.clientY - rect.top - offsetY) / scale;
                            
                        // 计算鼠标相对于元素左上角的偏移
                        elementDragStartX = currentLeft - mouseX;
                        elementDragStartY = currentTop - mouseY;
                            
                        // 添加选中样式
                        element.style.opacity = '0.7';
                        
                    });
                    }

                                // 设置控制点拖拽
                                setupVertexDrag(control, element, data);
                                element.appendChild(control);

                    }
                    
                    // 设置顶点拖拽
                    function setupVertexDrag(control, element, data) {
                        control.addEventListener('mousedown', function(e) {
                            e.stopPropagation(); // 阻止事件冒泡到元素和画布
                                
                            activeElement = element;
                            activeElementData = data;
                            const handle = control.dataset.handle;
                                
                            // 标记正在拖拽控制点
                            element.classList.add('dragging-control');
                                
                            // 记录初始尺寸和中心点
                            let centerX, centerY;
                                
                            if (data.type === 'circle') {
                                // 计算圆心坐标（考虑元素位置和半径）
                                centerX = parseFloat(element.style.left || 0) + data.radius;
                                centerY = parseFloat(element.style.top || 0) + data.radius;
                            } else if (data.type === 'rectangle') {
                                // 计算长方形中心点
                                centerX = parseFloat(element.style.left || 0) + data.width / 2;
                                centerY = parseFloat(element.style.top || 0) + data.height / 2;
                            } else {
                                // 计算方形中心点
                                centerX = parseFloat(element.style.left || 0) + data.size / 2;
                                centerY = parseFloat(element.style.top || 0) + data.size / 2;
                            }
                                
                            // 获取鼠标在画布上的位置（考虑缩放和偏移）
                            const rect = archidemo.getBoundingClientRect();
                            const startX = e.clientX;
                            const startY = e.clientY;
                                
                            function onMouseMove(e) {
                                e.preventDefault();
                                    
                                // 计算鼠标在画布上的位置（考虑缩放和偏移）
                                const currentMouseX = (e.clientX - rect.left - offsetX) / scale;
                                const currentMouseY = (e.clientY - rect.top - offsetY) / scale;
                                    
                                if (data.type === 'circle') {
                                    // 根据不同的控制点调整尺寸
                                    if (handle === 'radius-x') {
                                        // 右侧控制点 - 水平方向调整
                                        const newRadius = Math.max(5, Math.abs(currentMouseX - centerX));
                                        data.radius = newRadius;
                                    } else if (handle === 'radius-y') {
                                        // 顶侧控制点 - 垂直方向调整
                                        const newRadius = Math.max(5, Math.abs(centerY - currentMouseY));
                                        data.radius = newRadius;
                                    }
                                        
                                    // 保持中心点不变
                                    const newLeft = centerX - data.radius;
                                    const newTop = centerY - data.radius;
                                        
                                    // 更新元素样式
                            element.style.width = (data.radius * 2) + 'px';
                            element.style.height = (data.radius * 2) + 'px';
                            element.style.left = newLeft + 'px';
                            element.style.top = newTop + 'px';
                            
                            // 更新元素数据
                            data.position.x = newLeft;
                            data.position.y = newTop;
                            
                            // 如果当前修改的是父元素，更新所有子元素的位置
                            if (data.children.length > 0) {
                                updateChildrenPositions(data.id);
                            }
                                        
                                    // 更新元素数据位置
                                    data.position.x = newLeft;
                                    data.position.y = newTop;
                                }
                                else {
                                    // 对于方形和长方形
                                    let newWidth, newHeight;
                                        
                                    if (data.type === 'rectangle') {
                                        // 根据不同的控制点调整尺寸
                                        switch (handle) {
                                            case 'top-left':
                                                newWidth = Math.max(5, (centerX + data.width / 2)- currentMouseX);
                                                newHeight = Math.max(5, (centerY + data.height / 2) - currentMouseY);
                                                break;
                                            case 'top-right':
                                                newWidth = Math.max(5, currentMouseX - (centerX - data.width / 2));
                                                newHeight = Math.max(5, (centerY + data.height / 2) - currentMouseY);
                                                break;

                                            case 'bottom-left':
                                                newWidth = Math.max(5, (centerX + data.width / 2)- currentMouseX);
                                                newHeight = Math.max(5, currentMouseY - (centerY - data.height / 2));
                                
                                                break;
                                            case 'bottom-right':
                                                newWidth = Math.max(5, currentMouseX - (centerX - data.width / 2));
                                                newHeight = Math.max(5, currentMouseY - (centerY - data.height / 2));
                                        
                                                break;

                                        }
                                    //     console.log(centerX, centerY,"centercoord");
                                    //     console.log(currentMouseX, currentMouseY,"currentmousecoord");
                                    //     console.log(newWidth, newHeight,"newsize");
                                    } else {
                                        // 方形处理逻辑
                                        let newSize;
                                        
                                        switch (handle) {
                                            case 'top-left':
                                                newSize = Math.max(5, 2 * Math.sqrt(
                                                    Math.pow(centerX - currentMouseX, 2) + 
                                                    Math.pow(centerY - currentMouseY, 2)
                                                ) / Math.sqrt(2)); // 除以sqrt(2)以补偿对角线长度

                                                break;
                                            case 'top-right':
                                                newSize = Math.max(5, 2 * Math.sqrt(
                                                    Math.pow(currentMouseX - centerX, 2) + 
                                                    Math.pow(centerY - currentMouseY, 2)
                                                ) / Math.sqrt(2));
                                                break;
                                            case 'bottom-left':
                                                newSize = Math.max(5, 2 * Math.sqrt(
                                                    Math.pow(centerX - currentMouseX, 2) + 
                                                    Math.pow(currentMouseY - centerY, 2)
                                                ) / Math.sqrt(2));
                                                break;
                                            case 'bottom-right':
                                                newSize = Math.max(5, 2 * Math.sqrt(
                                                    Math.pow(currentMouseX - centerX, 2) + 
                                                    Math.pow(currentMouseY - centerY, 2)
                                                ) / Math.sqrt(2));
                                                break;
                                        }
                                        
                                        // 保持中心点不变，计算新的位置
                                        const newLeft = centerX - newSize / 2;
                                        const newTop = centerY - newSize / 2;
                                        
                                        // 更新元素数据
                            data.size = newSize;
                            data.position.x = newLeft;
                            data.position.y = newTop;
                                
                            // 更新元素样式
                            element.style.width = newSize + 'px';
                            element.style.height = newSize + 'px';
                            element.style.left = newLeft + 'px';
                            element.style.top = newTop + 'px';
                            
                            // 如果当前修改的是父元素，更新所有子元素的位置
                            if (data.children.length > 0) {
                                updateChildrenPositions(data.id);
                            }
                                    }
                                    
                                    if (data.type === 'rectangle') {
                                        // 计算新的位置，保持中心点不变
                                        const newLeft = centerX - newWidth / 2;
                                        const newTop = centerY - newHeight / 2;
                                        
                                        // 更新元素数据
                            data.width = newWidth;
                            data.height = newHeight;
                            data.position.x = newLeft;
                            data.position.y = newTop;
                                
                            // 更新元素样式
                            element.style.width = newWidth + 'px';
                            element.style.height = newHeight + 'px';
                            element.style.left = newLeft + 'px';
                            element.style.top = newTop + 'px';
                            
                            // 如果当前修改的是父元素，更新所有子元素的位置
                            if (data.children.length > 0) {
                                updateChildrenPositions(data.id);
                            }
                                    }
                                }
                                    
                                // console.log('元素修改后的数据:', data);
                            }
                                
                            function onMouseUp() {
                                document.removeEventListener('mousemove', onMouseMove);
                                document.removeEventListener('mouseup', onMouseUp);
                                    
                                // 移除拖拽标记
                                element.classList.remove('dragging-control');
                                    
                                // 如果鼠标不在元素上，隐藏控制点
                                if (!element.matches(':hover')) {
                                    const controls = element.querySelectorAll('.vertex-control');
                                    controls.forEach(control => {
                                        control.style.display = 'none';
                                    });
                                }
                                    
                                // 显示所有元素数据
                            }
                                
                            document.addEventListener('mousemove', onMouseMove);
                            document.addEventListener('mouseup', onMouseUp);
                        });
                    }

                    // 更新属性面板函数
                    function updatePropertyPanel() {
                        
                        const noSelection = document.getElementById('no-selection');
                        const propertiesPanel = document.getElementById('element-properties');
                        const connectionPanel = document.getElementById('connection-properties');
                         
                        if (activeElement && activeElementData) {
                            // 显示属性面板，隐藏无选择提示

                        const mouseX = e.clientX - rect.left;
                        const mouseY = e.clientY - rect.top;
                        
                        // 缩放前的鼠标位置在画布中的坐标
                        const beforeZoomCanvasX = (mouseX - offsetX) / scale;
                        const beforeZoomCanvasY = (mouseY - offsetY) / scale;
                        
                        // 应用缩放
                        if (e.deltaY < 0) {
                            scale = Math.min(scale * 1.1, 5); // 放大，最大5倍
                        } else {
                            scale = Math.max(scale / 1.1, 0.1); // 缩小，最小0.1倍
                        }
                        
                        // 调整偏移量，使缩放中心点保持不变
                        offsetX = mouseX - beforeZoomCanvasX * scale;
                        offsetY = mouseY - beforeZoomCanvasY * scale;
                        
                        updateCanvasTransform();

                    // 删除选中元素的函数
                    function deleteSelectedElement() {
                        if (!activeElement) return;
                        if (activeElement.classList.contains('connection-line')){
                            // 处理连接线的删除
                            const connectionId = parseInt(activeElement.dataset.connectionId);
                            const connectionDataIndex = connectionData.findIndex(data => data.id === connectionId);
                            if (connectionDataIndex !== -1) {
                                connectionData.splice(connectionDataIndex, 1);
                                activeElement.remove();
                                // 从elements数组中也移除
                                const connectionLineIndex = elements.findIndex(el => el.classList.contains('connection-line') && parseInt(el.dataset.connectionId) === connectionId);
                                if (connectionLineIndex !== -1) {
                                    elements.splice(connectionLineIndex, 1);
                                }
                            }
                            return;
                        }
                        const elementId = parseInt(activeElement.dataset.elementId);
                        const elementDataIndex = elementData.findIndex(data => data.id === elementId);
                        console.log(elementId,elementDataIndex)
                        if (elementDataIndex !== -1) {
                            const elementToDelete = elementData[elementDataIndex];

                            // 处理子元素：如果被删除的元素是父元素，将其子元素的parent重置为'/'
                            if (elementToDelete.children && elementToDelete.children.length > 0) {
                                elementToDelete.children.forEach(childId => {
                                    const childData = elementData.find(data => data.id === childId);
                                    if (childData) {
                                        childData.parent = '/';
                                        childData.relativePosition = null;
                                        
                                        // 找到对应的DOM元素并重置z-index
                                        const childElement = elements.find(el => parseInt(el.dataset.elementId) === childId);
                                        if (childElement) {
                                            childElement.style.zIndex = '15';
                                        }
                                    }
                                });
                            }
                            
                            // 从父元素的children数组中移除
                            if (elementToDelete.parent !== '/') {
                                const parentData = elementData.find(data => data.id === elementToDelete.parent);
                                if (parentData && parentData.children) {
                                    parentData.children = parentData.children.filter(id => id !== elementId);
                                }
                            }
                            
                            // 移除DOM元素
                            activeElement.remove();
                            
                            // 从数组中移除
                            elements = elements.filter(el => el !== activeElement);
                            elementData.splice(elementDataIndex, 1);
                            
                            // 重置activeElement
                            activeElement = null;
                            activeElementData = null;
                        }
                    }

                        // 递归展开对象的函数
                        function expandObject(obj, prefix, container) {
                            if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) {
                                return;
                            }
                            
                            for (const [key, value] of Object.entries(obj)) {
                                const fullKey = prefix ? `${prefix}.${key}` : key;
                                
                                if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                                    // 如果是空对象，直接显示
                                    if (Object.keys(value).length === 0) {
                                        const propertyItem = document.createElement('div');
                                        propertyItem.className = 'flex justify-between';
                                        
                                        const propertyKey = document.createElement('span');
                                        propertyKey.className = 'font-medium';
                                        propertyKey.textContent = fullKey + ':';
                                        
                                        const propertyValue = document.createElement('span');
                                        propertyValue.textContent = '{}';
                                        
                                        propertyItem.appendChild(propertyKey);
                                        propertyItem.appendChild(propertyValue);
                                        container.appendChild(propertyItem);
                                    } else {
                                        // 递归展开嵌套对象
                                        expandObject(value, fullKey, container);
                                    }
                                } else {
                                    // 显示叶子节点
                                    const propertyItem = document.createElement('div');
                                    propertyItem.className = 'flex justify-between';
                                    
                                    const propertyKey = document.createElement('span');
                                    propertyKey.className = 'font-medium';
                                    propertyKey.textContent = fullKey + ':';
                                    
                                    const propertyValue = document.createElement('span');
                                    if (Array.isArray(value)) {
                                        propertyValue.textContent = JSON.stringify(value);
                                    } else if (value === null) {
                                        propertyValue.textContent = 'null';
                                    } else {
                                        propertyValue.textContent = value;
                                    }
                                    
                                    propertyItem.appendChild(propertyKey);
                                    propertyItem.appendChild(propertyValue);
                                    container.appendChild(propertyItem);
                                }
                            }
                        }
                        }

                        // 计算矩形边缘上距离另一个矩形最近的点
                        function getNearestPointOnRect(rect1, rect2, canvasRect) {
                            // 计算两个矩形的中心点
                            const center1X = rect1.left + rect1.width / 2;
                            const center1Y = rect1.top + rect1.height / 2;
                            const center2X = rect2.left + rect2.width / 2;
                            const center2Y = rect2.top + rect2.height / 2;
                            
                            // 计算从rect1中心指向rect2中心的向量
                            const dx = center2X - center1X;
                            const dy = center2Y - center1Y;
                            
                            // 计算这个向量与rect1边缘的交点
                            // 首先计算向量在矩形边界上的比例因子
                            let tX = Math.abs(rect1.width / 2 / dx) || Infinity;
                            let tY = Math.abs(rect1.height / 2 / dy) || Infinity;
                            
                            // 选择较小的t值，确保交点在矩形的最近边缘上
                            let t = Math.min(tX, tY);
                            
                            // 计算交点坐标
                            let intersectionX = center1X + t * dx;
                            let intersectionY = center1Y + t * dy;
                            
                            // 转换为相对于canvasContainer的坐标
                            return {
                                x: intersectionX - canvasRect.left,
                                y: intersectionY - canvasRect.top
                            };
                        }
                        
                        // 更新连接线位置和样式的函数
                        function updateConnectionLine(line, source, target) {
                            // 获取元素数据
                            const sourceId = parseInt(source.dataset.elementId);
                            const targetId = parseInt(target.dataset.elementId);
                            const sourceData = elementData.find(data => data.id === sourceId);
                            const targetData = elementData.find(data => data.id === targetId);
                            
                            // 获取元素的样式位置（直接使用元素的style属性，不使用getBoundingClientRect）
                            const sourceLeft = parseFloat(source.style.left || 0);
                            const sourceTop = parseFloat(source.style.top || 0);
                            const targetLeft = parseFloat(target.style.left || 0);
                            const targetTop = parseFloat(target.style.top || 0);
                            
                            // 计算元素中心点（考虑元素类型）
                            let sourceCenterX, sourceCenterY, targetCenterX, targetCenterY;
                            
                            if (sourceData.type === 'circle') {
                                sourceCenterX = sourceLeft + sourceData.radius;
                                sourceCenterY = sourceTop + sourceData.radius;
                            } else if (sourceData.type === 'rectangle') {
                                sourceCenterX = sourceLeft + sourceData.width / 2;
                                sourceCenterY = sourceTop + sourceData.height / 2;
                            } else if (sourceData.type === 'square') {
                                sourceCenterX = sourceLeft + sourceData.size / 2;
                                sourceCenterY = sourceTop + sourceData.size / 2;
                            } else {
                                // 默认处理
                                sourceCenterX = sourceLeft + 50; // 默认宽度的一半
                                sourceCenterY = sourceTop + 30; // 默认高度的一半
                            }
                            
                            if (targetData.type === 'circle') {
                                targetCenterX = targetLeft + targetData.radius;
                                targetCenterY = targetTop + targetData.radius;
                            } else if (targetData.type === 'rectangle') {
                                targetCenterX = targetLeft + targetData.width / 2;
                                targetCenterY = targetTop + targetData.height / 2;
                            } else if (targetData.type === 'square') {
                                targetCenterX = targetLeft + targetData.size / 2;
                                targetCenterY = targetTop + targetData.size / 2;
                            } else {
                                // 默认处理
                                targetCenterX = targetLeft + 50; // 默认宽度的一半
                                targetCenterY = targetTop + 30; // 默认高度的一半
                            }
                            
                            // 计算从源元素到目标元素的向量
                            const dx = targetCenterX - sourceCenterX;
                            const dy = targetCenterY - sourceCenterY;
                            
                            // 计算源元素边缘上的点
                            let sourcePoint, targetPoint;
                            
                            if (sourceData.type === 'circle') {
                                // 对于圆形，直接计算边缘点
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                if (distance > 0) {
                                    sourcePoint = {
                                        x: sourceCenterX + (dx / distance) * sourceData.radius,
                                        y: sourceCenterY + (dy / distance) * sourceData.radius
                                    };
                                } else {
                                    sourcePoint = {x: sourceCenterX, y: sourceCenterY};
                                }
                            } else {
                                // 对于矩形/方形，计算边缘上最近的点
                                // 计算向量在矩形边界上的比例因子
                                let tX = Math.abs(dx) > 0 ? ((sourceData.width || sourceData.size || 100) / 2) / Math.abs(dx) : Infinity;
                                let tY = Math.abs(dy) > 0 ? ((sourceData.height || sourceData.size || 60) / 2) / Math.abs(dy) : Infinity;
                                // 选择较小的t值，确保交点在矩形的最近边缘上
                                let t = Math.min(tX, tY);
                                sourcePoint = {
                                    x: sourceCenterX + t * dx,
                                    y: sourceCenterY + t * dy
                                };
                            }
                            
                            // 计算目标元素边缘上的点
                            const targetDx = sourceCenterX - targetCenterX;
                            const targetDy = sourceCenterY - targetCenterY;
                            
                            if (targetData.type === 'circle') {
                                // 对于圆形，直接计算边缘点
                                const distance = Math.sqrt(targetDx * targetDx + targetDy * targetDy);
                                if (distance > 0) {
                                    targetPoint = {
                                        x: targetCenterX + (targetDx / distance) * targetData.radius,
                                        y: targetCenterY + (targetDy / distance) * targetData.radius
                                    };
                                } else {
                                    targetPoint = {x: targetCenterX, y: targetCenterY};
                                }
                            } else {
                                // 对于矩形/方形，计算边缘上最近的点
                                // 计算向量在矩形边界上的比例因子
                                let tX = Math.abs(targetDx) > 0 ? ((targetData.width || targetData.size || 100) / 2) / Math.abs(targetDx) : Infinity;
                                let tY = Math.abs(targetDy) > 0 ? ((targetData.height || targetData.size || 60) / 2) / Math.abs(targetDy) : Infinity;
                                // 选择较小的t值，确保交点在矩形的最近边缘上
                                let t = Math.min(tX, tY);
                                targetPoint = {
                                    x: targetCenterX + t * targetDx,
                                    y: targetCenterY + t * targetDy
                                };
                            }
                            
                            // 计算两点之间的距离和角度
                            const lineDx = targetPoint.x - sourcePoint.x;
                            const lineDy = targetPoint.y - sourcePoint.y;
                            const distance = Math.sqrt(lineDx * lineDx + lineDy * lineDy);
                            const angle = Math.atan2(lineDy, lineDx) * 180 / Math.PI;
                               
                            // 获取连接数据以应用自定义颜色
                            const connectionData = line.connectionData || 
                                (window.connectionData ? window.connectionData.find(conn => conn.id === parseInt(line.dataset.connectionId)) : null);
                            const lineColor = connectionData ? connectionData.color : '#6366f1';
                               
                            // 设置连接线的样式，增强可见性
                            line.style.width = distance + 'px';
                            line.style.height = '3px'; // 略微加粗
                            line.style.left = sourcePoint.x + 'px';
                            line.style.top = sourcePoint.y + 'px';
                            line.style.transformOrigin = '0 50%';
                            line.style.transform = `rotate(${angle}deg)`;
                            line.style.backgroundColor = lineColor; // 使用连接数据中的颜色
                            line.style.opacity = '1'; // 确保完全不透明
                            line.style.borderRadius = '1.5px'; // 添加圆角使线条更平滑
                            
                            // 更新连接数据中的位置信息
                            if (connectionData) {
                                connectionData.sourcePosition = {
                                    x: sourceLeft,
                                    y: sourceTop
                                };
                                connectionData.targetPosition = {
                                    x: targetLeft,
                                    y: targetTop
                                };
                            }
                        }
                        
                        // 更新所有受元素移动影响的连接线
                        function updateAffectedConnectionLines(elementId) {
                            if (!window.connectionData) return;
                            
                            // 查找与当前元素相关的所有连接线
                            const affectedConnections = window.connectionData.filter(conn => 
                                conn.sourceId === elementId || conn.targetId === elementId
                            );
                            
                            affectedConnections.forEach(conn => {
                                const lineElement = document.querySelector(`[data-connection-id="${conn.id}"]`);
                                if (lineElement) {
                                    const sourceElement = document.querySelector(`[data-element-id="${conn.sourceId}"]`);
                                    const targetElement = document.querySelector(`[data-element-id="${conn.targetId}"]`);
                                    if (sourceElement && targetElement) {
                                        updateConnectionLine(lineElement, sourceElement, targetElement);
                                    }
                                }
                            });
                        }
                        
                        // 添加ESC键监听以退出连接模式
                        document.addEventListener('keydown', function(event) {
                            if (event.key === 'Escape' && isConnectionMode) {
                                exitConnectionMode();
                            }
                        });
                        
                        // 添加窗口大小改变和元素移动时更新连接线的逻辑
                        function updateAllConnectionLines() {
                            if (!window.connectionData) return;
                            
                            const lines = document.querySelectorAll('.connection-line');
                            lines.forEach((line, index) => {
                                if (window.connectionData[index]) {
                                    const { sourceId, targetId } = window.connectionData[index];
                                    const sourceElement = document.querySelector(`[data-element-id="${sourceId}"]`);
                                    const targetElement = document.querySelector(`[data-element-id="${targetId}"]`);
                                    
                                    if (sourceElement && targetElement) {
                                        updateConnectionLine(line, sourceElement, targetElement);
                                    }
                                }
                            });
                        }
                        
                        // 监听窗口大小变化以更新连接线
                        window.addEventListener('resize', updateAllConnectionLines);
                        
                        // 在元素移动结束后更新连接线
                        // 将此函数添加到元素拖拽结束事件中
                        document.addEventListener('mouseup', function() {
                            if (isElementDragging) {
                                updateAllConnectionLines();
                            }
                        });
                        
                        // 修改元素的mousedown事件处理，在连接模式下阻止默认行为
                        
                        
                        // 初始化                    
                        setTimeout(() => {
                            generateElementTypesMenu(); // 生成元素类型菜单
                            initializeCtrlClickMenu(); // 初始化Ctrl+单击菜单
                            initializeCanvas();
                            updatePropertyPanel(); // 更新属性面板显示
                        }, 5000);

                    });
            </script>
        </div>

    </div>

    <div id="footer-container"></div>
