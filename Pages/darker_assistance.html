    <style>
        /* 确保html和body元素没有设置会影响定位的样式 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        
        /* 初始状态下鸭子居中 - 覆盖内联样式 */
        body.start-mode #duckAssistant {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            bottom: auto !important;
            right: auto !important;
        }
        
        /* 初始状态下chatBubble偏左并缩小到原尺寸 - 覆盖内联样式 */
        body.start-mode #chatBubble {
            width: 200px !important;
            padding: 10px !important;
            margin: 0 0 10px 30% !important;
            align-self: flex-start !important;
            position: relative !important;
            /* 将聊天气泡向上提升100px */
            transform: translateY(-200px) !important;
        }
        
        /* 初始状态下鸭子图片偏左 - 覆盖内联样式 */
        body.start-mode #duckStatic,
        body.start-mode #duckIcon {
            margin: 0 0 0 50% !important;
            align-self: flex-start !important;
            position: relative !important;
            /* 只放大鸭子形象，保持对话气泡大小不变 */
            transform: scale(6) translateX(50px) ;
            /* border-radius: 0%; */
        }
        
        /* 初始状态下显示白色框容器并使用与鸭子相同的放大倍数 */
        body.start-mode #whiteBoxContainer {
            display: flex !important;
            margin: 0 0 0 50% !important;
            align-self: flex-start !important;
            position: relative !important;
            /* 使用transform组合实现垂直对齐，translateY先于scale执行，调整值来实现对齐 */
            transform: translateY(80px) translateX(-110px) scale(6);
            
        }
        
        /* 初始状态下显示标题 */
        body.start-mode #initialTitle {
            display: block !important;
            transform: scale(1);
        }
        
        /* 初始状态下标题也需要放大 */
        /* body.start-mode #initialTitle {
            transform: translateX(-50%) scale(1.5) !important;
        } */
        
        /* 初始状态下隐藏所有非必要元素 */
        body.start-mode #chatBubble,
        body.start-mode #optionList,
        body.start-mode #chatInputBox,
        body.start-mode #subscribeModal,
        body.start-mode #reportModal {
            display: none !important;
        }
    </style>

const startTexts = [

const duckimagepath = '../PIC/Duck/';
// 自动播放动画（每5秒触发一次挥手，避免频繁动画）
function startAutoAnimation() {
  setInterval(() => {
    playWaveAnimation();
  }, 500);
}

// 初始化气泡内容
const bubbleContent = document.getElementById('bubbleContent');

// 添加消息监听器，处理来自父窗口的消息
window.addEventListener('message', function(event) {
    // 切换到正常模式
    if (event.data && event.data.type === 'switchToNormalMode') {
        // 切换到正常模式（旧逻辑，用于兼容）
        isInStartMode = false;
        document.body.classList.remove('start-mode');
        bubbleContent.textContent = starttext;
        duckIcon.style.transform = 'scale(1)';
        duckStatic.style.transform = 'scale(1)';
        duckVideo.style.transform = 'scale(1)';
        // 切换到正常模式后，调用updateIframeSize更新iframe大小
        updateIframeSize();
    }
    // 直接切换到正常模式
        else if (event.data && event.data.type === 'startNormalModeTransition') {
            // 立即切换到正常模式
            isInStartMode = false;
            document.body.classList.remove('start-mode');
            bubbleContent.textContent = starttext;
            duckIcon.style.transform = 'scale(1)';
            duckStatic.style.transform = 'scale(1)';
            duckVideo.style.transform = 'scale(1)';
            // 切换到正常模式后，调用updateIframeSize更新iframe大小
            updateIframeSize();
        }

// 处理选项点击事件
function handleOptionClick(action) {
  // 初始状态下不执行任何操作
  if (isInStartMode) {
    return;
  }
  
  // 根据选择的选项执行相应操作
  switch(action) {
    case 'report':
      duckVideo.src = duckimagepath + 'duck_like.mp4'; // 使用合适的鸭子视频
      // 显示问题提报模态框
      showReportModal();
      break;
    case 'about':
      // 理解达客功能
      window.parent.location.href = "../index.html#about";
      break;
    case 'start':
      // 理解达客功能
      window.parent.location.href = "../Pages/ADAS_JOURNEY.html";
      break;
    case 'question':
      duckVideo.src = duckimagepath + 'duck_keyboard.mp4';
      // 我有问题功能
        if (!isChatting) {
          // 清除自动介绍动画的定时器，避免chatbubble自动出现
          if (introInterval) {
            clearInterval(introInterval);
            introInterval = null;
          }
          bubbleContent.textContent = "请问有什么可以帮你了解的？";
          // 显示chatInputBox，隐藏其他所有元素
          chatInputBox.style.display = "block";
          // 隐藏optionList、chatBubble、subscribeModal和reportModal
          optionList.style.display = 'none';
          chatBubble.style.display = 'none';
          subscribeModal.style.display = 'none';
          document.getElementById('reportModal').style.display = 'none';
          // 添加初始欢迎消息
          chatContent.innerHTML = `<div style="margin:10px 0;text-align:left;background:linear-gradient(135deg, #333, #555);padding:8px 12px;border-radius:10px 10px 10px 0;display:inline-flex;align-items:center;"><span style="font-size:12px;color:white;">您好，我是达客AI助手，请问有什么能帮到您？</span></div>`;
          userInput.focus();
          isChatting = true;
        } else {
          // 隐藏chatInputBox，恢复正常显示
          chatInputBox.style.display = "none";
          // 如果是非静音状态且没有显示其他模态框，显示chatBubble
          if (!isMuted && 
              subscribeModal.style.display !== 'block' && 
              document.getElementById('reportModal').style.display !== 'block') {
            chatBubble.style.display = "block";
            // 重新启动自动介绍动画
            startIntroAnimation();
          }
          isChatting = false;
        }
        updateIframeSize();
      break;
    case 'subscribe':
      duckVideo.src = duckimagepath + 'duck_like.mp4';
      // 显示subscribeModal，隐藏其他所有元素
      subscribeModal.style.display = 'block';
      // 隐藏optionList、chatBubble、chatInputBox和reportModal
      optionList.style.display = 'none';
      chatBubble.style.display = 'none';
      chatInputBox.style.display = 'none';
      document.getElementById('reportModal').style.display = 'none';
  
      // 重置输入框
      document.getElementById('subscribeUsername').value = '';
      document.getElementById('subscribeEmail').value = '';
      updateIframeSize();
      break;
    case 'mute':
      isMuted = !isMuted;
      
      // 立即隐藏选项列表，避免高度计算异常
      optionList.style.display = 'none';
      optionList.style.transform = 'scaleY(0)';
      
      // 根据isMuted状态切换选项文字和图标
      if (isMuted) {
        // 静音状态：隐藏chatbubble
        muteIcon.className = 'fa fa-volume-up';
        muteText.textContent = '为我介绍';
        chatBubble.style.display = 'none'; // 立即隐藏chatbubble
      } else {
        // 非静音状态：显示chatbubble，但要考虑拖拽状态和其他模态框
        muteIcon.className = 'fa fa-volume-off';
        muteText.textContent = '别说话了';
        // 确保chatBubble的样式正确，特别是margin
        chatBubble.style.marginBottom = '10px';
        // 只有当不在拖拽状态、不需要等待鼠标离开且没有显示任何模态框时才显示chatbubble
        if (!isDragging && !waitForMouseLeave && 
            chatInputBox.style.display !== 'block' && 
            subscribeModal.style.display !== 'block' && 
            document.getElementById('reportModal').style.display !== 'block') {
          chatBubble.style.display = 'block'; // 立即显示chatbubble
        }
      }
      
      // 延迟调用updateIframeSize，确保所有样式更新完成
      setTimeout(() => {
        updateIframeSize();
      }, 50);
      break;
  }
}


// 发送消息功能
sendBtn.onclick = async () => {
  const question = userInput.value.trim();
  if (!question) return;
  chatContent.innerHTML += `<div style="margin:10px 0;text-align:right;"><span style="background:linear-gradient(135deg, #007bff, #0056b3);color:white;padding:5px 10px;border-radius:10px 10px 0 10px;font-size:12px;display:inline-block;">${question}</span></div>`;
  userInput.value = '';
  userInfo = getUserInfo();
  
  if (darker_config.AI_Switch !== 'off') {
    command = ip + darker_config.AI_Switch;
    chatContent.innerHTML += `<div style="margin:10px 0;text-align:left;background:linear-gradient(135deg, #333, #555);padding:8px 12px;border-radius:10px 10px 10px 0;display:inline-flex;align-items:center;"><span style="font-size:12px;color:white;">AI思考中...</span></div>`;
    chatContent.scrollTop = chatContent.scrollHeight;
    fetch(command, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
          question: question,
          user_info: userInfo
      })
    }).then(response => {

      return response.json();
    })
    .then(data => {
      if(data.success){
        ai_answer=data.output.answer;
        // 判断ai_answer是否以Error开头
        if (ai_answer.startsWith('Error')) {
          ai_answer = '遇到一些问题，正在急速修复😭';
        }
        const lastMessage = chatContent.lastElementChild;
        if (lastMessage) {
          lastMessage.style.background = 'linear-gradient(135deg, #333, #555)';
          lastMessage.style.padding = '8px 12px';
          lastMessage.style.borderRadius = '10px 10px 10px 0';
          lastMessage.style.display = 'inline-flex';
          lastMessage.style.alignItems = 'center';
          lastMessage.innerHTML = `<span style="font-size:12px;color:white;">${ai_answer}</span>`;
        }
        chatContent.scrollTop = chatContent.scrollHeight;
      }
    }).catch(error => {
      console.error('Fetch错误:', error);
      console.error('错误类型:', error.name);
      console.error('错误消息:', error.message);
    });
  } else {
    chatContent.innerHTML += `<div style="margin:10px 0;text-align:left;background:linear-gradient(135deg, #333, #555);padding:8px 12px;border-radius:10px 10px 10px 0;display:inline-flex;align-items:center;"><span style="font-size:12px;color:white;">AI小助手即将上线，敬请期待</span></div>`;
    chatContent.scrollTop = chatContent.scrollHeight;
  }
  updateIframeSize();
};

  const username = document.getElementById('subscribeUsername').value.trim();

  if (!username || !email) {
    alert('请填写用户名和邮箱地址');
    return;
  }
  
  // 简单的邮箱验证
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    alert('请输入有效的邮箱地址');
    return;
  }

  // command = ip + '/confirm_subscribe';
  // fetch(command,{
  //   method: 'POST',

  //           "name": username,
  //           "submit_time": new Date().toISOString(),
  //           "to_email": email,
  //       })
  // })
  command = ip + '/add_user';
  fetch(command, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body:JSON.stringify({
        datatype:"operation",
        'user': {
            "id": "USER",
            "name": username,
            "submit_time": new Date().toISOString(),
            "submitter_email": email,
            },
        })
  }).then(response=>response.json()).then(data=>{
    if (data.success) {
      // console.log("Now is recieved");
      manipresult = data.output;
      if (manipresult.status) {
        alert('订阅成功！感谢您的关注，' + username + '！');
      }else{
        if(manipresult.error == 1){
          alert('订阅失败：该邮箱已订阅过，无需重新订阅~。')
        }else if(manipresult.error ==2){
          alert('订阅失败: 该邮箱已经被用户名 '+manipresult.name + "使用了")
        }else if(manipresult.error == 3){
          alert('订阅失败:该用户名'+manipresult.name+'已经存在')
        }
      } 
    } else {
      alert('订阅失败：' + data.message);
    }
  })
  .catch(error => {
    console.error('订阅错误:', error);
    alert('订阅过程中发生错误，请稍后重试。');
  });
  updateIframeSize();

// 拖拽功能重新设计
let isDragging = false;
let startMouseX, startMouseY;
let startDuckX, startDuckY;
let currentDuckX, currentDuckY;
let iframe;
// 标记是否需要等待鼠标离开才能启用交互
let waitForMouseLeave = false;

// 为鸭子形象添加拖拽事件监听器
function initDrag() {
  const duckElements = [document.getElementById('duckIcon'), document.getElementById('duckStatic')];
  
  duckElements.forEach(duck => {
    // 鼠标按下事件
    duck.addEventListener('mousedown', (e) => {
      // 初始状态下不执行拖拽
      if (isInStartMode) {
        return;
      }
      
      // 防止默认行为和事件冒泡
      e.preventDefault();
      e.stopPropagation();
      
      // 禁止选择文本
      document.body.style.userSelect = 'none';
      
      isDragging = true;
      
      // 获取当前iframe元素
      iframe = window.parent.document.getElementById('duckIframe');
      
      // 获取鼠标相对于视口的位置
      startMouseX = e.clientX;
      startMouseY = e.clientY;
      
      // 获取鸭子元素相对于视口的位置
      const duckRect = duck.getBoundingClientRect();
      startDuckX = duckRect.left;
      startDuckY = duckRect.top;
      currentDuckX = startDuckX;
      currentDuckY = startDuckY;
      
      // 改变鼠标样式
      document.body.style.cursor = 'grabbing';
      
      // 临时禁用原有交互逻辑，包括updateIframeSize
      disableAllInteractions();
    });
    
    // 触摸开始事件（移动端支持）
    duck.addEventListener('touchstart', (e) => {
      // 初始状态下不执行拖拽
      if (isInStartMode) {
        return;
      }
      
      // 防止默认行为和事件冒泡
      e.preventDefault();
      e.stopPropagation();
      
      isDragging = true;
      
      // 获取当前iframe元素
      iframe = window.parent.document.getElementById('duckIframe');
      
      // 获取触摸点相对于视口的位置
      const touch = e.touches[0];
      startMouseX = touch.clientX;
      startMouseY = touch.clientY;
      
      // 获取鸭子元素相对于视口的位置
      const duckRect = duck.getBoundingClientRect();
      startDuckX = duckRect.left;
      startDuckY = duckRect.top;
      currentDuckX = startDuckX;
      currentDuckY = startDuckY;
      
      // 临时禁用原有交互逻辑，包括updateIframeSize
      disableAllInteractions();
    });
  });
  
  // 窗口鼠标移动事件
  window.addEventListener('mousemove', (e) => {
    if (!isDragging || !iframe) return;
    
    // 防止默认行为和事件冒泡
    e.preventDefault();
    e.stopPropagation();
    
    // 计算鼠标相对于初始位置的偏移量
    const deltaX = e.clientX - startMouseX;
    const deltaY = e.clientY - startMouseY;
    
    // 计算新的鸭子位置
    currentDuckX = startDuckX + deltaX;
    currentDuckY = startDuckY + deltaY;
    
    // 计算iframe需要移动的距离
    // 注意：我们需要将鸭子位置的变化转换为iframe位置的变化
    // 因为鸭子位于iframe的右下角，所以iframe的移动距离等于鸭子的移动距离
    const iframeRect = iframe.getBoundingClientRect();
    const newIframeX = iframeRect.left + deltaX;
    const newIframeY = iframeRect.top + deltaY;
    
    // 发送新位置给父窗口
    window.parent.postMessage({
      type: 'moveDuckIframe',
      x: newIframeX,
      y: newIframeY
    }, '*');
  });
  
  // 窗口触摸移动事件（移动端支持）
  window.addEventListener('touchmove', (e) => {
    if (!isDragging || !iframe) return;
    
    // 防止默认行为和事件冒泡
    e.preventDefault();
    e.stopPropagation();
    
    // 获取触摸点相对于视口的位置
    const touch = e.touches[0];
    
    // 计算触摸点相对于初始位置的偏移量
    const deltaX = touch.clientX - startMouseX;
    const deltaY = touch.clientY - startMouseY;
    
    // 计算新的鸭子位置
    currentDuckX = startDuckX + deltaX;
    currentDuckY = startDuckY + deltaY;
    
    // 计算iframe需要移动的距离
    const iframeRect = iframe.getBoundingClientRect();
    const newIframeX = iframeRect.left + deltaX;
    const newIframeY = iframeRect.top + deltaY;
    
    // 发送新位置给父窗口
    window.parent.postMessage({
      type: 'moveDuckIframe',
      x: newIframeX,
      y: newIframeY
    }, '*');
  });
  
  // 结束拖拽的处理函数
  function endDrag() {
    if (!isDragging) return;
    
    isDragging = false;
    
    // 恢复文本选择
    document.body.style.userSelect = 'auto';
    
    // 恢复鼠标样式
    document.body.style.cursor = 'default';
    
    // 恢复原有交互逻辑
    restoreAllInteractions();
    
    // 清除iframe引用
    iframe = null;
  }
  
  // 鼠标释放事件
  window.addEventListener('mouseup', (e) => {
    // 防止默认行为和事件冒泡
    e.preventDefault();
    e.stopPropagation();
    endDrag();
  });
  
  // 触摸结束事件（移动端支持）
  window.addEventListener('touchend', (e) => {
    // 防止默认行为和事件冒泡
    e.preventDefault();
    e.stopPropagation();
    endDrag();
  });
  
  // 鼠标离开窗口事件
  window.addEventListener('mouseleave', endDrag);
}

// 保存元素原始显示状态，用于拖拽结束后恢复
let originalElementStyles = [];

// 临时禁用所有交互逻辑，包括updateIframeSize
function disableAllInteractions() {
  // 禁用所有事件监听器
  document.body.style.pointerEvents = 'none';
  
  // 保存所有元素的原始显示状态
  originalElementStyles = [];
  
  // 隐藏所有元素，只保留鸭子形象
  const allElements = document.querySelectorAll('body > *');
  allElements.forEach(element => {
    // 保存原始样式
    originalElementStyles.push({
      element: element,
      originalDisplay: element.style.display
    });
    
    // 只保留duckAssistant容器，隐藏其他所有直接子元素
    if (element.id !== 'duckAssistant') {
      element.style.display = 'none';
    }
  });
  
  // 只显示当前应该显示的鸭子形象，隐藏另一个
  const duckIcon = document.getElementById('duckIcon');
  const duckStatic = document.getElementById('duckStatic');
  
  // 保存鸭子形象的原始样式
  originalElementStyles.push({
    element: duckIcon,
    originalDisplay: duckIcon.style.display
  });
  originalElementStyles.push({
    element: duckStatic,
    originalDisplay: duckStatic.style.display
  });
  
  // 检查哪个鸭子形象当前是显示状态
  const isIconVisible = duckIcon.style.display !== 'none';
  const isStaticVisible = duckStatic.style.display !== 'none';
  
  // 确保只有一个鸭子形象显示
  if (isIconVisible) {
    // 如果duckIcon是显示的，隐藏duckStatic
    duckStatic.style.display = 'none';
  } else {
    // 否则，隐藏duckIcon，显示duckStatic
    duckIcon.style.display = 'none';
    duckStatic.style.display = 'block';
  }
  
  // 隐藏duckAssistant容器内的所有其他元素
  const assistant = document.getElementById('duckAssistant');
  const assistantChildren = assistant.querySelectorAll('*');
  assistantChildren.forEach(child => {
    // 保存原始样式
    // 对于optionList，总是保存它的显示状态为none，无论实际状态如何
    let displayToSave = child.style.display;
    if (child.id === 'optionList') {
      displayToSave = 'none';
    }
    originalElementStyles.push({
      element: child,
      originalDisplay: displayToSave
    });
    
    // 只保留鸭子形象，隐藏其他所有子元素
    if (child.id !== 'duckIcon' && child.id !== 'duckStatic') {
      child.style.display = 'none';
    }
  });
  
  // 暂停自动动画
  if (introInterval) {
    clearInterval(introInterval);
    introInterval = null;
  }
  
  // 确保没有残留的定时器
  if (hoverTimer) {
    clearTimeout(hoverTimer);
    hoverTimer = null;
  }
  
  // 覆盖updateIframeSize函数，防止在拖拽过程中改变iframe大小
  window.updateIframeSize = function() {
    // 拖拽过程中不更新iframe大小
    return;
  };
}

// 恢复所有交互逻辑
function restoreAllInteractions() {
  // 设置需要等待鼠标离开才能启用交互
  waitForMouseLeave = true;
  
  // 只恢复鸭子形象的指针事件，其他元素仍保持禁用
  const duckElements = [document.getElementById('duckIcon'), document.getElementById('duckStatic')];
  duckElements.forEach(duck => {
    // 恢复鸭子形象的指针事件
    duck.style.pointerEvents = 'auto';
    // 恢复鸭子形象的鼠标离开事件监听器，用于检测鼠标离开
    duck.addEventListener('mouseleave', onDuckMouseLeave);
    // 注意：这里只添加了mouseleave事件监听器，没有添加mouseenter事件监听器
    // 防止拖拽结束后，鼠标仍然悬停在鸭子形象上时，触发showOptions()函数
  });
  
  // 恢复updateIframeSize函数
  window.updateIframeSize = function() {
    // 在初始模式下禁用尺寸调整
    if (isInStartMode) {
      return;
    }
    
    const assistant = document.getElementById('duckAssistant');
    // 使用requestAnimationFrame确保在浏览器下一次重绘前执行
    requestAnimationFrame(() => {
      // 增加额外的缓冲值，确保鸭子形象放大时能够完全显示在iframe内
      // 考虑到鸭子放大效果（scale(1.05)）和边缘间隙，增加20px的缓冲值
      window.parent.postMessage({
        type: 'updateDuckSize',
        width: assistant.offsetWidth + 20,
        height: assistant.offsetHeight + 20
      }, '*');
    });
  };
  
  // 不需要这里调用updateIframeSize，因为在onDuckMouseLeave函数中会调用
  // 移除不必要的setTimeout调用，避免导致chatbubble位置异常
}

// 鸭子形象鼠标离开事件处理函数
function onDuckMouseLeave(e) {
  // 只有当需要等待鼠标离开时才执行
  if (waitForMouseLeave) {
    
    // 移除鸭子形象的鼠标离开事件监听器
    const duckElements = [document.getElementById('duckIcon'), document.getElementById('duckStatic')];
    duckElements.forEach(duck => {
      duck.removeEventListener('mouseleave', onDuckMouseLeave);
    });
    
    // 恢复所有元素的原始显示状态，但确保optionList保持隐藏
    originalElementStyles.forEach(styleInfo => {
      // 恢复原始显示状态，但如果是optionList，保持隐藏
      if (styleInfo.element.id === 'optionList') {
        styleInfo.element.style.display = 'none';
      } else {
        styleInfo.element.style.display = styleInfo.originalDisplay;
      }
    });
    
    // 确保optionList保持隐藏，不会被设置为display:block
    document.getElementById('optionList').style.display = 'none';
    document.getElementById('optionList').style.transform = 'scaleY(0)';
    
    // 恢复所有元素的指针事件
    document.body.style.pointerEvents = 'auto';
    
    // 重置标记
    waitForMouseLeave = false;
    
    // 根据当前主导模式决定显示什么
    // 如果是聊天模式，显示问答框，隐藏气泡
    // 如果是正常模式，根据isMuted决定是否显示气泡
    const chatBubble = document.getElementById('chatBubble');
    const chatInputBox = document.getElementById('chatInputBox');
    const bubbleContent = document.getElementById('bubbleContent');
    
    if (isChatting) {
      // 聊天模式：显示问答框，隐藏气泡
      chatInputBox.style.display = 'block';
      chatBubble.style.display = 'none';
    } else if (!isMuted) {
      // 正常模式且非静音：显示气泡
      chatBubble.style.display = 'block';
      // 立即设置聊天气泡的文字内容，避免显示空气泡
      const textsToUse = isInStartMode ? startTexts : introTexts;
      bubbleContent.textContent = textsToUse[Math.floor(Math.random() * textsToUse.length)];
    } else {
      // 正常模式且静音：隐藏气泡
      chatBubble.style.display = 'none';
    }
    
    // 直接更新iframe大小，确保所有元素都能正确显示
    // updateIframeSize函数内部已经使用了requestAnimationFrame，不需要再嵌套
    window.updateIframeSize();
    
    // 只有在非聊天模式下才重新启动自动动画
    if (!isChatting) {
      startIntroAnimation();
    }
  }
}

// 宽高自适应
function updateIframeSize() {
  // 在初始模式下禁用尺寸调整
  if (isInStartMode) {
    return;
  }
  
  const assistant = document.getElementById('duckAssistant');
  // 使用requestAnimationFrame确保在浏览器下一次重绘前执行
  requestAnimationFrame(() => {
    // 增加额外的缓冲值，确保鸭子形象放大时能够完全显示在iframe内
    // 考虑到鸭子放大效果（scale(1.05)）和边缘间隙，增加20px的缓冲值
    window.parent.postMessage({
      type: 'updateDuckSize',
      width: assistant.offsetWidth + 20,
      height: assistant.offsetHeight + 20
    }, '*');
  });
}

// 处理问题提报类型变更，动态更新主题选项
function handleReportTypeChange() {
  const subjectSelect = document.getElementById('reportSubject');
  const contactType = document.getElementById('reportType').value;
  
  // 获取当前页面地址
  const currentPagePath = window.parent.location.pathname;
  const currentPageFilename = currentPagePath.split('/').pop();
  
  // 去掉.html后缀
  const pageNameWithoutExt = currentPageFilename.replace('.html', '');
  
  // 查找匹配的option
  let matchedOption = null;
  if (products_config && products_config.productfeatures) {
    matchedOption = products_config.productfeatures.find(option => {
      return option.Function === pageNameWithoutExt;
    });
  }
  
  // 获取返回值，命名为default
  const defaultOption = matchedOption ? matchedOption.CN_Name : '通用信息';
  
  // 打印结果
  console.log('默认选项:', defaultOption);
  
  // 清空现有选项
  subjectSelect.innerHTML = '';
  
  if (contactType === 'issue') {
    // 问题提报类型，添加所有页面选项
    if (products_config && products_config.productfeatures) {
      // 先创建选项数组
      const options = [...products_config.productfeatures];
      
      // 查找默认选项的索引
      const defaultIndex = options.findIndex(option => option.CN_Name === defaultOption);
      
      // 如果找到了默认选项，将其移到数组开头
      if (defaultIndex > -1) {
        const [defaultItem] = options.splice(defaultIndex, 1);
        options.unshift(defaultItem);
      }
      
      // 添加所有选项
      options.forEach(option => {
          const opt = document.createElement('option');
          opt.value = option.CN_Name;
          opt.textContent = option.CN_Name;
          subjectSelect.appendChild(opt);
      });
    }
  } else {
    // 意见建议类型，只显示通用选项
    const opt = document.createElement('option');
    opt.value = 'general';
    opt.textContent = '通用选项';
    subjectSelect.appendChild(opt);
  }
}

// 处理问题提报提交
function handleReportSubmit(event) {
  event.preventDefault();
  
  // 获取表单数据
  const name = document.getElementById('reportName').value.trim();
  const email = document.getElementById('reportEmail').value.trim();
  const contactType = document.getElementById('reportType').value;
  const subject = document.getElementById('reportSubject').value;
  const message = document.getElementById('reportMessage').value.trim();
  
  // 调用addnewissue函数提交数据
  addnewissue(name, message, subject, email, contactType);
}

// 与index.html中相同的addnewissue函数，用于提交问题提报
function addnewissue(name, message, subject, email, contactType) {
  // console.log('addnewissue函数被调用，准备调用API');
  
  // 调用真实API
  const command = ip + '/add_issue';
  fetch(command, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      datatype:'operation',
      'issue': {
        "id": "ISSUE-",
        "type": contactType,
        "title": subject,
        "description": message,
        "submit_time": new Date().toISOString(),
        "submit_email": email,
        "submit_name": name,
      },
    })
  })
  .then(response => response.json())
  .then(data => {
    // 根据API返回结果显示相应提示
    if (data && data.success) {
      // 使用postMessage通知父页面显示成功提示
      window.parent.postMessage({
        type: 'showSuccessMessage'
      }, '*');
    } else {
      // 使用postMessage通知父页面显示失败提示
      window.parent.postMessage({
        type: 'showErrorMessage',
        message: data && data.message ? data.message : '提交失败，请稍后重试'
      }, '*');
    }
    
    // 隐藏报告模态框
    hideReportModal();
  })
  .catch(error => {
    // 使用postMessage通知父页面显示失败提示
    window.parent.postMessage({
      type: 'showErrorMessage',
      message: '提交过程中发生网络错误，请稍后重试'
    }, '*');
    
    // 隐藏报告模态框
    hideReportModal();
  });
}

// 显示问题提报模态框
function showReportModal() {
  // 显示reportModal，隐藏其他所有元素
  const reportModal = document.getElementById('reportModal');
  reportModal.style.display = 'block';
  
  // 隐藏optionList、chatBubble、chatInputBox和subscribeModal
  const optionList = document.getElementById('optionList');
  const chatBubble = document.getElementById('chatBubble');
  const chatInputBox = document.getElementById('chatInputBox');
  const subscribeModal = document.getElementById('subscribeModal');
  
  optionList.style.display = 'none';
  chatBubble.style.display = 'none';
  chatInputBox.style.display = 'none';
  subscribeModal.style.display = 'none';
  
  // 清除自动介绍动画的定时器，避免chatbubble自动出现
  if (introInterval) {
    clearInterval(introInterval);
    introInterval = null;
  }
  
  // 初始化主题选项
  handleReportTypeChange();
  
  updateIframeSize();
}

// 隐藏问题提报模态框
function hideReportModal() {
  const reportModal = document.getElementById('reportModal');
  reportModal.style.display = 'none';
  
  // 重置表单，避免下次打开时残留之前的输入
  const reportForm = document.getElementById('reportForm');
  reportForm.reset();
  
  // 只有当isMuted为false、不在拖拽状态、不需要等待鼠标离开且没有显示其他模态框时才显示chatbubble
  if (!isMuted && !isDragging && !waitForMouseLeave && 
      document.getElementById('chatInputBox').style.display !== 'block' && 
      document.getElementById('subscribeModal').style.display !== 'block') {
    document.getElementById('chatBubble').style.display = 'block';
    // 重新启动自动介绍动画
    startIntroAnimation();
  }
  
  updateIframeSize();
}

// 初始化问题提报相关事件监听
function initReportEvents() {
  const reportType = document.getElementById('reportType');
  const reportForm = document.getElementById('reportForm');
  const reportCancelBtn = document.getElementById('reportCancelBtn');
  
  // 联系类型变更事件
  reportType.addEventListener('change', handleReportTypeChange);
  
  // 表单提交事件
  reportForm.addEventListener('submit', handleReportSubmit);
  
  // 取消按钮事件
  reportCancelBtn.addEventListener('click', hideReportModal);
  
  // 防止点击模态框内容时关闭模态框
  document.getElementById('reportModal').addEventListener('click', function(e) {
    e.stopPropagation();
  });
}

// 初始化订阅事件
initSubscribeEvents();
// 初始化问题提报事件
initReportEvents();
// 初始化拖拽功能
initDrag();
</script>
