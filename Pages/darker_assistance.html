}

    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    item.style.backgroundColor = '#fffc3d';
  });
  
  item.addEventListener('mouseleave', () => {
    item.style.backgroundColor = 'transparent';

    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;
    }
    const action = item.getAttribute('data-action');
    handleOptionClick(action);
    hideOptions();
  });
});

document.addEventListener('click', (event) => {

  if (!duckIcon.contains(event.target) && !duckStatic.contains(event.target) && !optionList.contains(event.target)) {
    // 立即隐藏选项栏，清除可能存在的延时计时器
    if (hoverTimer) {
      clearTimeout(hoverTimer);
      hoverTimer = null;

    hideOptions();
  }
});

// 处理选项点击事件
function handleOptionClick(action) {
  // 根据选择的选项执行相应操作
  switch(action) {
    case 'report':
      // 问题提报功能
      window.parent.location.href = "../index.html#contact";
      break;
    case 'about':
      // 理解达客功能
      window.parent.location.href = "../index.html#about";
      break;
    case 'start':
      // 理解达客功能
      window.parent.location.href = "../Pages/ADAS_JOURNEY.html";
      break;
    case 'question':
      duckVideo.src = "../PIC/duck_keyboard.mp4";
      // 我有问题功能
        if (!isChatting) {
          clearInterval(introInterval);
          bubbleContent.textContent = "请问有什么可以帮你了解的？";
          chatInputBox.style.display = "block";
          userInput.focus();
        } else {
          chatInputBox.style.display = "none";
          startIntroAnimation();
        }
        isChatting = !isChatting; // 切换聊天状态
        updateIframeSize();
      break;
    case 'subscribe':
      duckVideo.src = "../PIC/duck_like.mp4";
      subscribeModal.style.display = 'block';
  
      // 重置输入框
      document.getElementById('subscribeUsername').value = '';
      document.getElementById('subscribeEmail').value = '';
      updateIframeSize();
      break;
    case 'mute':
      isMuted = !isMuted;
      
      // 立即隐藏选项列表，避免高度计算异常
      optionList.style.display = 'none';
      optionList.style.transform = 'scaleY(0)';
      
      // 根据isMuted状态切换选项文字和图标
      if (isMuted) {
        // 静音状态：隐藏chatbubble
        muteIcon.className = 'fa fa-volume-up';
        muteText.textContent = '为我介绍';
        chatBubble.style.display = 'none'; // 立即隐藏chatbubble
      } else {
        // 非静音状态：显示chatbubble
        muteIcon.className = 'fa fa-volume-off';
        muteText.textContent = '别说话了';
        // 确保chatBubble的样式正确，特别是margin
        chatBubble.style.marginBottom = '10px';
        chatBubble.style.display = 'block'; // 立即显示chatbubble
      }
      
      // 延迟调用updateIframeSize，确保所有样式更新完成
      setTimeout(() => {
        updateIframeSize();
      }, 50);
      break;
  }
}

function startIntroAnimation() {

  let currentIntroIndex = 0;
  introInterval = setInterval(() => {
    bubbleContent.textContent = introTexts[currentIntroIndex];

      chatBubble.style.display = 'block';
    }
    currentIntroIndex = (currentIntroIndex + 1) % introTexts.length;
    updateIframeSize();
  }, 4000);
}

// 处理订阅提交
function handleSubscribe() {
  const username = document.getElementById('subscribeUsername').value.trim();
  const email = document.getElementById('subscribeEmail').value.trim();
  
  if (!username || !email) {
    alert('请填写用户名和邮箱地址');
    return;
  }
  
  // 简单的邮箱验证
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    alert('请输入有效的邮箱地址');
    return;
  }

  // command = ip + '/confirm_subscribe';
  // fetch(command,{
  //   method: 'POST',
  //   headers: { 'Content-Type': 'application/json' },
  //   body:JSON.stringify({
  //           "type": "subscription_confirm",
  //           "name": username,
  //           "submit_time": new Date().toISOString(),
  //           "to_email": email,
  //       })
  // })
  command = ip + '/add_user';
  fetch(command, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body:JSON.stringify({
        'user': {
            "id": "USER",
            "name": username,
            "submit_time": new Date().toISOString(),
            "submitter_email": email,
            },
        })
  }).then(response=>response.json()).then(data=>{
    if (data.success) {
      manipresult = data.output;
      if (manipresult.status) {
        alert('订阅成功！感谢您的关注，' + username + '！');
      }else{
        if(manipresult.error == 1){
          alert('订阅失败：该邮箱已订阅过，无需重新订阅~。')
        }else if(manipresult.error ==2){
          alert('订阅失败: 该邮箱已经被用户名 '+manipresult.name + "使用了")
        }else if(manipresult.error == 3){
          alert('订阅失败:该用户名'+manipresult.name+'已经存在')
        }
      } 
    } else {
      alert('订阅失败：' + data.message);
    }
  })
  .catch(error => {
    console.error('订阅错误:', error);
    alert('订阅过程中发生错误，请稍后重试。');
  });
  updateIframeSize();
  
  // 隐藏悬浮框
  hideSubscribeModal();
}

// 初始化订阅相关事件监听
function initSubscribeEvents() {
  const subscribeSubmitBtn = document.getElementById('subscribeSubmitBtn');
  const subscribeCancelBtn = document.getElementById('subscribeCancelBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  
  subscribeSubmitBtn.addEventListener('click', handleSubscribe);
  subscribeCancelBtn.addEventListener('click', hideSubscribeModal);
  
  // 防止点击悬浮框内容时关闭悬浮框
  document.getElementById('subscribeModal').addEventListener('click', function(e) {
    e.stopPropagation();
  });
}

// 宽高自适应
function updateIframeSize() {
  const assistant = document.getElementById('duckAssistant');
  // 使用requestAnimationFrame确保在浏览器下一次重绘前执行
  requestAnimationFrame(() => {
    window.parent.postMessage({
      type: 'updateDuckSize',
      width: assistant.offsetWidth,
      height: assistant.offsetHeight
    }, '*');
  });
}
